a"},{"n":"zucchero","q":"250 gr","k":"zucchero"},{"n":"rum","q":"150 ml","k":"rum"},{"n":"limone","q":"1","k":"limone"}],"proc":["Impasta farina, lievito e uova una per volta, lavorando a lungo fino a incordare.","Unisci il burro morbido in tre riprese e infine un pizzico di sale.","Lascia lievitare fino al raddoppio, poi riempi gli stampi per un terzo.","Fai lievitare fino al bordo e cuoci a 180 gradi per 25 minuti.","Prepara la bagna con acqua, zucchero, scorza di limone e rum, e lasciala intiepidire.","Immergi i babà freddi nella bagna tiepida finché sono gonfi e lucidi."],"nota":"Babà freddo e bagna tiepida: al contrario si sfaldano. E la bagna non va mai bollente.","luogo":"Campania","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":217,"n":"Pastiera napoletana","cat":"Dolci","tempo":180,"diff":"difficile","tags":["vegetariano"],"ing":[{"n":"farina","q":"350 gr","k":"farina"},{"n":"burro","q":"150 gr","k":"burro"},{"n":"zucchero","q":"400 gr","k":"zucchero"},{"n":"uova","q":"7","k":"uova"},{"n":"ricotta","q":"500 gr","k":"ricotta"},{"n":"grano cotto","q":"400 gr","k":"grano cotto"},{"n":"latte","q":"200 ml","k":"latte"},{"n":"scorza d’arancia candita","q":"100 gr","k":"scorza d’arancia candita"},{"n":"acqua di fiori d’arancio","q":"2 cucchiai","k":"acqua di fiori d’arancio"},{"n":"cannella","q":"1 pizzico","k":"cannella"}],"proc":["Prepara la frolla con farina, burro freddo, zucchero e uova, e falla riposare un’ora in frigorifero.","Cuoci il grano con latte, una noce di burro e scorza di limone finché è cremoso. Lascia raffreddare.","Setaccia la ricotta e lavorala con lo zucchero, poi unisci le uova, i canditi, la cannella e i fiori d’arancio.","Mescola con il grano e versa nella teglia foderata di frolla.","Decora con le strisce a losanga e inforna a 170 gradi per un’ora e venti.","Fai riposare almeno due giorni prima di servirla."],"nota":"Va fatta il Giovedì Santo e mangiata la domenica: i tre giorni di riposo fanno metà del lavoro.","luogo":"Campania","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":10,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":218,"n":"Zeppole di San Giuseppe","cat":"Dolci","tempo":90,"diff":"media","tags":["vegetariano"],"ing":[{"n":"farina","q":"250 gr","k":"farina"},{"n":"uova","q":"4","k":"uova"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"latte","q":"500 ml","k":"latte"},{"n":"zucchero","q":"150 gr","k":"zucchero"},{"n":"amarene","q":"200 gr","k":"amarene"},{"n":"limone","q":"1","k":"limone"}],"proc":["Prepara la pasta choux portando a bollore acqua e burro, versando la farina in un colpo e asciugando l’impasto.","Fuori dal fuoco unisci le uova una alla volta, aspettando che ciascuna sia assorbita.","Forma ciambelle su carta forno con la sac à poche.","Friggi in olio a 170 gradi oppure inforna a 200 gradi per 25 minuti.","Farcisci con crema pasticcera e completa con un’amarena sciroppata."],"nota":"Fritte sono la versione originale, al forno sono più leggere. La crema va messa a zeppola fredda.","luogo":"Campania","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":219,"n":"Ciceri e tria","cat":"Primi","tempo":70,"diff":"media","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"semola","q":"300 gr","k":"semola"},{"n":"ceci","q":"400 gr","k":"ceci"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"alloro","q":"1 foglia","k":"alloro"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"}],"proc":["Impasta semola e acqua tiepida, riposa mezz’ora e stendi a due millimetri.","Taglia tagliatelle corte e larghe un centimetro: quelle sono le tria.","Tieni da parte un terzo della pasta e friggila in olio caldo finché è dorata e croccante.","Cuoci i ceci con alloro e sedano, poi condiscili con aglio soffritto.","Lessa la pasta rimasta direttamente nei ceci e servi con sopra quella fritta."],"nota":"Metà pasta lessa e metà fritta nello stesso piatto: è la firma salentina.","luogo":"Puglia","estero":false,"all":["glutine","sedano"],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":220,"n":"Fave e cicoria","cat":"Primi","tempo":90,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"fave secche","q":"400 gr","k":"fave secche"},{"n":"cicoria","q":"800 gr","k":"cicoria"},{"n":"patate","q":"1","k":"patate"},{"n":"aglio","q":"1 spicchio","k":"aglio"}],"proc":["Ammolla le fave decorticate per una notte.","Cuocile con una patata a pezzi e acqua a coprire, senza sale, per un’ora.","Mescola spesso verso la fine: devono disfarsi in una crema.","Monta con olio a filo, come un purè, e sala solo ora.","Lessa la cicoria a parte e servila accanto, condita con olio crudo."],"nota":"La patata non si sente ma rende il purè vellutato: è il trucco di tutte le nonne pugliesi.","luogo":"Puglia","estero":false,"all":[],"unico":true,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":221,"n":"Tiella barese","cat":"Primi","tempo":80,"diff":"facile","tags":[],"ing":[{"n":"riso","q":"300 gr","k":"riso"},{"n":"patate","q":"600 gr","k":"patate"},{"n":"cozze","q":"1 kg","k":"cozze"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"pomodorini","q":"200 gr","k":"pomodorini"},{"n":"pecorino romano","q":"80 gr","k":"pecorino romano"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Apri le cozze a crudo con un coltello, tenendo il mezzo guscio con il mollusco e filtrando il liquido.","Ungi la teglia e fai uno strato di cipolla affettata, poi patate a fette sottili.","Disponi le cozze nel guscio, cospargi di riso crudo, pecorino, prezzemolo e aglio.","Copri con altre patate e pomodorini, e finisci con pecorino e pangrattato.","Versa il liquido delle cozze e acqua fino quasi a coprire.","Inforna a 200 gradi per 50 minuti senza mai mescolare."],"nota":"Il riso va crudo e l’acqua deve arrivare a filo dell’ultimo strato: cuoce tutto insieme, in forno.","luogo":"Puglia","estero":false,"all":["latte","molluschi"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":["colino a maglie fitte"],"att_opz":[]},{"id":222,"n":"Braciole pugliesi al sugo","cat":"Secondi","tempo":180,"diff":"media","tags":["senza forno"],"ing":[{"n":"manzo","q":"800 gr","k":"manzo"},{"n":"pecorino romano","q":"100 gr","k":"pecorino romano"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"pancetta","q":"100 gr","k":"pancetta"},{"n":"passata di pomodoro","q":"1 l","k":"passata di pomodoro"},{"n":"vino rosso","q":"1 bicchiere","k":"vino rosso"}],"proc":["Batti le fettine sottili e disponi su ciascuna pecorino, prezzemolo, aglio e un pezzetto di pancetta.","Arrotola stretto e ferma con lo spago o uno stecchino.","Rosola gli involtini in olio finché sono dorati su tutti i lati.","Sfuma col vino rosso, poi unisci la passata.","Cuoci a fuoco bassissimo per due ore e mezza: il sugo condisce la pasta, le braciole sono il secondo."],"nota":"Come il ragù napoletano, è un sugo che dà due portate: non si serve tutto insieme.","luogo":"Puglia","estero":false,"all":["latte","solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":["pentola a pressione"]},{"id":223,"n":"Pasticciotto leccese","cat":"Dolci","tempo":90,"diff":"media","tags":[],"ing":[{"n":"farina","q":"500 gr","k":"farina"},{"n":"strutto","q":"200 gr","k":"strutto"},{"n":"zucchero","q":"200 gr","k":"zucchero"},{"n":"uova","q":"4","k":"uova"},{"n":"latte","q":"500 ml","k":"latte"},{"n":"limone","q":"1","k":"limone"},{"n":"farina 00 per dolci","q":"50 gr","k":"farina 00 per dolci"}],"proc":["Prepara la frolla con farina, strutto, zucchero e due uova, lavorando poco. Riposo un’ora.","Fai la crema pasticcera con tuorli, zucchero, farina e latte profumato al limone.","Fodera gli stampini ovali con la frolla, riempi di crema fredda e copri con un disco di pasta.","Sigilla bene i bordi e spennella d’uovo.","Inforna a 180 gradi per 25 minuti, finché sono dorati."],"nota":"Lo strutto al posto del burro è quello che rende la frolla friabile come deve essere.","luogo":"Puglia","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":["stampini"],"att_opz":[]},{"id":224,"n":"Lagane e ceci","cat":"Primi","tempo":70,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"semola","q":"300 gr","k":"semola"},{"n":"ceci","q":"400 gr","k":"ceci"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"},{"n":"rosmarino","q":"1 rametto","k":"rosmarino"},{"n":"passata di pomodoro","q":"100 gr","k":"passata di pomodoro"}],"proc":["Impasta semola e acqua, riposa mezz’ora e stendi a due millimetri.","Taglia strisce larghe due centimetri e lunghe dieci: sono le lagane.","Soffriggi aglio, peperoncino e rosmarino in abbondante olio.","Unisci i ceci con la loro acqua e la passata, e cuoci venti minuti.","Butta le lagane direttamente nella zuppa e cuoci mescolando."],"nota":"È uno dei piatti più antichi d’Italia: le lagane compaiono già in Orazio.","luogo":"Basilicata","estero":false,"all":["glutine"],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":225,"n":"Baccalà alla lucana","cat":"Secondi","tempo":60,"diff":"facile","tags":["senza forno"],"ing":[{"n":"baccalà dissalato","q":"800 gr","k":"baccalà dissalato"},{"n":"peperoni cruschi","q":"50 gr","k":"peperoni cruschi"},{"n":"patate","q":"500 gr","k":"patate"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"farina","q":"100 gr","k":"farina"}],"proc":["Friggi i peperoni cruschi in olio caldo per pochi secondi e scolali subito.","Nello stesso olio rosola le patate a tocchi con l’aglio.","Infarina il baccalà a pezzi e friggilo finché è dorato.","Unisci tutto in padella e fai insaporire cinque minuti.","Sbriciola sopra i cruschi solo al momento di servire."],"nota":"I cruschi vanno sbriciolati all’ultimo: nel piatto caldo perdono la croccantezza in un minuto.","luogo":"Basilicata","estero":false,"all":["glutine","pesce"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":226,"n":"Melanzane ripiene alla calabrese","cat":"Secondi","tempo":80,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"melanzane","q":"4","k":"melanzane"},{"n":"pane raffermo","q":"150 gr","k":"pane"},{"n":"uova","q":"2","k":"uova"},{"n":"pecorino romano","q":"100 gr","k":"pecorino romano"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"basilico","q":"1 ciuffo","k":"basilico"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"}],"proc":["Taglia le melanzane a metà e scava la polpa lasciando mezzo centimetro di bordo.","Sala le barchette e lasciale spurgare mezz’ora.","Salta la polpa a cubetti con l’aglio, poi mescola con pane ammollato, uova, pecorino e basilico.","Riempi le barchette e disponile in teglia sul sugo di pomodoro.","Inforna a 180 gradi per 45 minuti, irrorando col sugo."],"nota":"La polpa scavata è metà del ripieno: non si butta mai.","luogo":"Calabria","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":227,"n":"Pesce spada alla ghiotta","cat":"Secondi","tempo":50,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"pesce spada","q":"800 gr","k":"pesce spada"},{"n":"pomodorini","q":"400 gr","k":"pomodorini"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"olive","q":"100 gr","k":"olive"},{"n":"capperi","q":"40 gr","k":"capperi"},{"n":"pinoli","q":"30 gr","k":"pinoli"},{"n":"uvetta","q":"30 gr","k":"uvetta"}],"proc":["Stufa cipolla e sedano a tocchetti in olio per quindici minuti.","Unisci pomodorini, olive, capperi, pinoli e uvetta e cuoci dieci minuti.","Adagia le fette di pesce spada sulla salsa, senza mescolare.","Copri e cuoci otto minuti, girando il pesce una sola volta.","Lascia riposare cinque minuti fuori dal fuoco prima di servire."],"nota":"Il pesce spada cotto oltre i dieci minuti diventa stopposo: si conta il tempo.","luogo":"Calabria","estero":false,"all":["frutta a guscio","sedano","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":228,"n":"Sagne chine","cat":"Primi","tempo":150,"diff":"difficile","tags":[],"ing":[{"n":"lasagne","q":"400 gr","k":"pasta"},{"n":"carne macinata","q":"400 gr","k":"carne macinata"},{"n":"salsiccia","q":"200 gr","k":"salsiccia"},{"n":"uova","q":"4","k":"uova"},{"n":"scamorza","q":"250 gr","k":"scamorza"},{"n":"piselli","q":"250 gr","k":"piselli"},{"n":"carciofi","q":"3","k":"carciofi"},{"n":"passata di pomodoro","q":"500 gr","k":"passata di pomodoro"},{"n":"pecorino romano","q":"100 gr","k":"pecorino romano"},{"n":"cipolla","q":"1","k":"cipolla"}],"proc":["Prepara un ragù con cipolla, carne e salsiccia, cuocendo un’ora con la passata.","Rassoda due uova e tagliale a fette; salta i carciofi a spicchi e sbollenta i piselli.","Prepara piccole polpettine con la carne rimasta e friggile.","Alterna in teglia lasagne, ragù, uova, scamorza, piselli, carciofi e polpettine.","Chiudi con ragù e pecorino e inforna a 180 gradi per 45 minuti."],"nota":"È la lasagna delle feste calabresi: ci va tutto, ed è il punto.","luogo":"Calabria","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":10,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":229,"n":"Arancini","cat":"Antipasti","tempo":120,"diff":"media","tags":[],"ing":[{"n":"riso","q":"500 gr","k":"riso"},{"n":"zafferano","q":"1 bustina","k":"zafferano"},{"n":"carne macinata","q":"300 gr","k":"carne macinata"},{"n":"piselli","q":"200 gr","k":"piselli"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"mozzarella","q":"200 gr","k":"mozzarella"},{"n":"uova","q":"3","k":"uova"},{"n":"pangrattato","q":"250 gr","k":"pangrattato"},{"n":"farina","q":"100 gr","k":"farina"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"}],"proc":["Cuoci il riso in acqua salata con lo zafferano, asciutto, e stendilo a raffreddare.","Prepara il ragù con cipolla, carne, piselli e passata, cuocendo quaranta minuti. Deve essere asciutto.","Manteca il riso freddo con parmigiano e un uovo.","Forma una conca nel palmo, metti il ragù e la mozzarella, e chiudi a cono o a sfera.","Passa nella pastella di farina e acqua, poi nel pangrattato.","Friggi a 175 gradi finché sono dorati."],"nota":"Il riso deve essere freddo e il ragù asciutto: sono le due condizioni per cui non si aprono.","luogo":"Sicilia","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":11,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":230,"n":"Pasta alla Trapanese","cat":"Primi","tempo":25,"diff":"facile","tags":["vegetariano","senza cottura","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"pomodori","q":"500 gr","k":"pomodori"},{"n":"mandorle","q":"100 gr","k":"mandorle"},{"n":"basilico","q":"1 ciuffo","k":"basilico"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"pecorino romano","q":"60 gr","k":"pecorino romano"}],"proc":["Sbollenta e spella i pomodori, privandoli dei semi.","Pesta nel mortaio aglio, mandorle e basilico con un pizzico di sale.","Unisci i pomodori e continua a pestare fino a una crema grossolana.","Versa l’olio a filo, sempre pestando.","Condisci la pasta a crudo con la salsa e il pecorino."],"nota":"È il pesto siciliano, arrivato dai genovesi che facevano scalo a Trapani: mandorle al posto dei pinoli.","luogo":"Sicilia","estero":false,"all":["frutta a guscio","glutine","latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["mortaio"],"att_opz":[]},{"id":231,"n":"Sarde a beccafico","cat":"Secondi","tempo":70,"diff":"media","tags":[],"ing":[{"n":"sarde","q":"800 gr","k":"sarde"},{"n":"pane raffermo","q":"150 gr","k":"pane"},{"n":"uvetta","q":"60 gr","k":"uvetta"},{"n":"pinoli","q":"50 gr","k":"pinoli"},{"n":"arancia","q":"2","k":"arancia"},{"n":"alloro","q":"12 foglie","k":"alloro"},{"n":"zucchero","q":"1 cucchiaio","k":"zucchero"}],"proc":["Pulisci le sarde aprendole a libro e togliendo la lisca, lasciando la coda.","Tosta il pane sbriciolato in padella con l’olio finché è dorato.","Mescolalo con uvetta ammollata, pinoli, succo d’arancia e zucchero.","Farcisci ogni sarda e arrotolala dalla testa verso la coda, che resta all’insù.","Disponi in teglia alternando una foglia d’alloro fra una e l’altra.","Irrora con succo d’arancia e olio e inforna a 180 gradi per 20 minuti."],"nota":"La coda dritta all’insù imita il beccafico, l’uccellino: da lì il nome.","luogo":"Sicilia","estero":false,"all":["frutta a guscio","glutine","pesce","solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":232,"n":"Involtini di pesce spada","cat":"Secondi","tempo":50,"diff":"media","tags":["vegetariano"],"ing":[{"n":"pesce spada","q":"800 gr","k":"pesce spada"},{"n":"pane raffermo","q":"150 gr","k":"pane"},{"n":"mozzarella","q":"150 gr","k":"mozzarella"},{"n":"olive","q":"80 gr","k":"olive"},{"n":"capperi","q":"30 gr","k":"capperi"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"limone","q":"2","k":"limone"},{"n":"alloro","q":"10 foglie","k":"alloro"},{"n":"cipolla","q":"2","k":"cipolla"}],"proc":["Fai tagliare il pesce spada a fette sottilissime e battile leggermente.","Tosta il pane sbriciolato e mescolalo con mozzarella a dadini, olive, capperi e prezzemolo.","Farcisci le fette e arrotolale.","Infila sugli spiedini alternando alloro e cipolla a spicchi.","Cuoci sulla griglia o in forno a 200 gradi per 15 minuti, irrorando con olio e limone."],"nota":"Le fette devono essere sottilissime: spesse non si arrotolano e restano crude dentro.","luogo":"Sicilia","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":9,"minimo":false,"leggero":true,"att":["griglia o piastra","spiedini"],"att_opz":[]},{"id":233,"n":"Falsomagro","cat":"Secondi","tempo":150,"diff":"difficile","tags":[],"ing":[{"n":"manzo","q":"800 gr","k":"manzo"},{"n":"carne macinata","q":"300 gr","k":"carne macinata"},{"n":"uova","q":"4","k":"uova"},{"n":"salame a cubetti","q":"100 gr","k":"salame a cubetti"},{"n":"pecorino romano","q":"100 gr","k":"pecorino romano"},{"n":"pangrattato","q":"80 gr","k":"pangrattato"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"passata di pomodoro","q":"600 gr","k":"passata di pomodoro"},{"n":"vino rosso","q":"1 bicchiere","k":"vino rosso"},{"n":"piselli","q":"150 gr","k":"piselli"}],"proc":["Fai aprire a libro la fetta di manzo, in un rettangolo sottile.","Prepara il ripieno con carne macinata, pangrattato, un uovo, pecorino e salame.","Distribuiscilo sulla carne e disponi al centro le uova sode intere, in fila.","Arrotola stretto e lega con lo spago.","Rosola, sfuma col vino, unisci passata e piselli e cuoci due ore a fuoco dolce.","Affetta solo da tiepido, per vedere le uova al centro."],"nota":"Il nome siciliano è farsumagru: magro finto, perché fuori sembra una semplice fetta di carne.","luogo":"Sicilia","estero":false,"all":["glutine","latte","solfiti","uova"],"unico":false,"nvoci":10,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":234,"n":"Pasta con i broccoli arriminati","cat":"Primi","tempo":50,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"broccoli","q":"800 gr","k":"broccoli"},{"n":"uvetta","q":"50 gr","k":"uvetta"},{"n":"pinoli","q":"50 gr","k":"pinoli"},{"n":"zafferano","q":"1 bustina","k":"zafferano"},{"n":"acciughe sott’olio","q":"4 filetti","k":"acciughe sott’olio"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"pecorino romano","q":"60 gr","k":"pecorino romano"}],"proc":["Sbollenta i broccoli a cimette e tieni l’acqua per cuocere la pasta.","Stufa la cipolla, unisci le acciughe e scioglile.","Aggiungi i broccoli, l’uvetta ammollata, i pinoli e lo zafferano sciolto in poca acqua.","Rimesta a lungo schiacciando i broccoli: arriminare vuol dire proprio mescolare a lungo.","Cuoci la pasta nell’acqua dei broccoli e saltala nel condimento."],"nota":"Arriminare è il verbo chiave: i broccoli devono disfarsi e diventare crema.","luogo":"Sicilia","estero":false,"all":["frutta a guscio","glutine","latte","pesce","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":235,"n":"Panelle","cat":"Antipasti","tempo":60,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"farina di ceci","q":"400 gr","k":"farina di ceci"},{"n":"acqua","q":"1,2 l","k":"acqua"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"pane","q":"8 panini","k":"pane"}],"proc":["Stempera la farina di ceci nell’acqua fredda con una frusta, senza grumi.","Cuoci a fuoco medio mescolando di continuo per venti minuti, finché si stacca dalle pareti.","Unisci prezzemolo tritato, sale e pepe.","Stendi subito su un piano bagnato in uno strato di tre millimetri e lascia raffreddare.","Taglia rettangoli e friggi in olio bollente finché si gonfiano."],"nota":"Si servono dentro il panino, con una spruzzata di limone. A Palermo si mangia pane con pane e va bene così.","luogo":"Sicilia","estero":false,"all":["glutine"],"unico":true,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":236,"n":"Cannoli siciliani","cat":"Dolci","tempo":120,"diff":"difficile","tags":[],"ing":[{"n":"farina","q":"250 gr","k":"farina"},{"n":"strutto","q":"30 gr","k":"strutto"},{"n":"vino rosso","q":"80 ml","k":"vino rosso"},{"n":"cacao","q":"1 cucchiaino","k":"cacao"},{"n":"ricotta","q":"800 gr","k":"ricotta"},{"n":"zucchero","q":"250 gr","k":"zucchero"},{"n":"cioccolato fondente","q":"100 gr","k":"cioccolato fondente"},{"n":"scorza d’arancia candita","q":"80 gr","k":"scorza d’arancia candita"}],"proc":["Impasta farina, strutto, zucchero, cacao e vino fino a una pasta soda. Riposo due ore.","Setaccia la ricotta e lavorala con lo zucchero, poi lasciala scolare in frigorifero una notte.","Stendi la pasta sottilissima, ricava ovali e avvolgili sulle canne, sigillando con albume.","Friggi in olio a 180 gradi finché sono dorati e bollosi, poi sfila le canne.","Riempi con la ricotta solo al momento di servire, e completa con gocce di cioccolato."],"nota":"Il cannolo si riempie all’ultimo secondo: farcito in anticipo si ammolla ed è un’altra cosa.","luogo":"Sicilia","estero":false,"all":["glutine","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":237,"n":"Cassata siciliana","cat":"Dolci","tempo":180,"diff":"difficile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"pan di spagna","q":"400 gr","k":"pan di spagna"},{"n":"ricotta","q":"800 gr","k":"ricotta"},{"n":"zucchero","q":"300 gr","k":"zucchero"},{"n":"cioccolato fondente","q":"100 gr","k":"cioccolato fondente"},{"n":"mandorle","q":"200 gr","k":"mandorle"},{"n":"scorza d’arancia candita","q":"150 gr","k":"scorza d’arancia candita"},{"n":"zucchero a velo","q":"200 gr","k":"zucchero a velo"}],"proc":["Setaccia la ricotta con lo zucchero e lasciala scolare una notte, poi unisci le gocce di cioccolato.","Prepara la pasta reale impastando mandorle tritate, zucchero e poca acqua, colorandola di verde.","Fodera lo stampo alternando strisce di pasta reale e di pan di spagna.","Riempi con la crema di ricotta e chiudi con altro pan di spagna.","Riposa in frigorifero sei ore, poi sforma e copri con la glassa di zucchero.","Decora con i canditi interi."],"nota":"La ricotta deve essere di pecora e scolata davvero: è l’unico modo perché la cassata stia in piedi.","luogo":"Sicilia","estero":false,"all":["frutta a guscio"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":238,"n":"Culurgiones","cat":"Primi","tempo":120,"diff":"difficile","tags":["vegetariano","senza forno"],"ing":[{"n":"semola","q":"400 gr","k":"semola"},{"n":"patate","q":"800 gr","k":"patate"},{"n":"pecorino romano","q":"200 gr","k":"pecorino romano"},{"n":"menta","q":"1 ciuffo","k":"menta"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"basilico","q":"1 ciuffo","k":"basilico"}],"proc":["Lessa le patate, schiacciale e impastale con pecorino, menta e aglio soffritto in olio.","Prepara la pasta con semola e acqua tiepida e lasciala riposare.","Ricava dischi, metti il ripieno e chiudi pizzicando i bordi alternati, a formare la spiga.","Cuoci cinque minuti in acqua salata.","Condisci con un semplice sugo di pomodoro e basilico."],"nota":"La chiusura a spiga si chiama impuntura e richiede pratica: i primi verranno male, è normale.","luogo":"Sardegna","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":239,"n":"Fregola con le arselle","cat":"Primi","tempo":50,"diff":"facile","tags":["senza forno"],"ing":[{"n":"fregola","q":"320 gr","k":"fregola"},{"n":"vongole","q":"1 kg","k":"vongole"},{"n":"pomodorini","q":"250 gr","k":"pomodorini"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"}],"proc":["Spurga le vongole in acqua salata per due ore.","Aprile in padella coperta e filtra il liquido, sgusciandone due terzi.","Soffriggi aglio e peperoncino, unisci i pomodorini e sfuma col vino.","Versa il liquido filtrato e acqua, porta a bollore e butta la fregola.","Cuoci quindici minuti come un risotto, aggiungendo liquido poco per volta.","Unisci le vongole e il prezzemolo fuori dal fuoco."],"nota":"La fregola è già tostata: rilascia poco amido, quindi la cremosità viene tutta dal liquido delle arselle.","luogo":"Sardegna","estero":false,"all":["molluschi","solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":["colino a maglie fitte"],"att_opz":[]},{"id":240,"n":"Pane frattau","cat":"Primi","tempo":30,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pane carasau","q":"300 gr","k":"pane carasau"},{"n":"passata di pomodoro","q":"500 gr","k":"passata di pomodoro"},{"n":"uova","q":"4","k":"uova"},{"n":"pecorino romano","q":"120 gr","k":"pecorino romano"},{"n":"basilico","q":"1 ciuffo","k":"basilico"},{"n":"aglio","q":"1 spicchio","k":"aglio"}],"proc":["Prepara un sugo semplice con aglio, passata e basilico, e tienilo caldo e fluido.","Porta a sobbollire dell’acqua salata per bagnare il pane.","Immergi un foglio di carasau per due secondi e disponilo nel piatto.","Alterna pane, sugo e pecorino per tre o quattro strati.","Completa con un uovo in camicia sopra e altro pecorino."],"nota":"Due secondi nell’acqua, non di più: il carasau deve ammorbidirsi senza disfarsi.","luogo":"Sardegna","estero":false,"all":["latte","uova"],"unico":true,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":241,"n":"Zuppa gallurese","cat":"Primi","tempo":90,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"pane raffermo","q":"500 gr","k":"pane"},{"n":"formaggio fresco","q":"400 gr","k":"formaggio fresco"},{"n":"pecorino romano","q":"150 gr","k":"pecorino romano"},{"n":"brodo vegetale","q":"1,5 l","k":"brodo vegetale"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"menta","q":"1 ciuffo","k":"menta"}],"proc":["Affetta il pane raffermo e disponilo in strati in una pirofila.","Alterna con formaggio fresco a fette, pecorino grattugiato ed erbe tritate.","Prosegui fino a esaurire, pressando leggermente.","Versa il brodo bollente fino a coprire e lascia assorbire dieci minuti.","Inforna a 180 gradi per 40 minuti, finché la superficie è gratinata."],"nota":"Nonostante il nome non è una zuppa: si taglia a fette come una torta salata.","luogo":"Sardegna","estero":false,"all":["glutine","latte"],"unico":true,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":242,"n":"Stocco alla ghiotta","cat":"Secondi","tempo":120,"diff":"media","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"stoccafisso","q":"1 kg","k":"stoccafisso"},{"n":"patate","q":"600 gr","k":"patate"},{"n":"pomodorini","q":"400 gr","k":"pomodorini"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"olive","q":"120 gr","k":"olive"},{"n":"capperi","q":"50 gr","k":"capperi"},{"n":"pinoli","q":"40 gr","k":"pinoli"},{"n":"uvetta","q":"40 gr","k":"uvetta"},{"n":"basilico","q":"1 ciuffo","k":"basilico"}],"proc":["Usa stoccafisso già ammollato: se parti da quello secco servono tre o quattro giorni con l’acqua cambiata due volte al giorno.","Stufa cipolla e sedano a tocchetti in abbondante olio per venti minuti, senza colorire.","Unisci pomodorini, olive, capperi dissalati, pinoli e uvetta e cuoci dieci minuti.","Adagia i pezzi di stoccafisso sulla salsa e copri con le patate a tocchi grandi.","Aggiungi acqua a filo, copri e cuoci a fuoco bassissimo per un’ora, scuotendo la pentola invece di mescolare.","Completa con basilico e lascia riposare mezz’ora prima di servire."],"nota":"Stoccafisso è merluzzo essiccato, baccalà è merluzzo sotto sale: non sono la stessa cosa e non si sostituiscono senza cambiare il piatto.","luogo":"Calabria","estero":false,"all":["frutta a guscio","sedano","solfiti"],"unico":false,"nvoci":10,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":243,"n":"Spaghetti allo scoglio","cat":"Primi","tempo":50,"diff":"media","tags":["senza forno"],"ing":[{"n":"pasta","q":"400 gr","k":"pasta"},{"n":"cozze","q":"700 gr","k":"cozze"},{"n":"vongole","q":"700 gr","k":"vongole"},{"n":"gamberi","q":"300 gr","k":"gamberi"},{"n":"calamari","q":"300 gr","k":"calamari"},{"n":"pomodorini","q":"300 gr","k":"pomodorini"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"}],"proc":["Spurga le vongole due ore in acqua salata e pulisci le cozze.","Apri i molluschi in padella coperta a fuoco vivo e filtra il liquido.","Soffriggi aglio e peperoncino, unisci i calamari ad anelli e cuoci dieci minuti.","Aggiungi i pomodorini, sfuma col vino, poi versa il liquido filtrato.","Cuoci la pasta molto al dente e terminala in padella con il sughetto.","Unisci gamberi e molluschi solo negli ultimi due minuti, col prezzemolo."],"nota":"I frutti di mare hanno tempi diversissimi: se li butti insieme, o i calamari sono gommosi o le cozze sono sparite.","luogo":"Campania","estero":false,"all":["crostacei","glutine","molluschi","solfiti"],"unico":false,"nvoci":10,"minimo":false,"leggero":false,"att":["colino a maglie fitte"],"att_opz":[]},{"id":244,"n":"Risotto ai frutti di mare","cat":"Primi","tempo":50,"diff":"media","tags":["senza forno"],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"cozze","q":"600 gr","k":"cozze"},{"n":"vongole","q":"600 gr","k":"vongole"},{"n":"gamberi","q":"250 gr","k":"gamberi"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"pomodorini","q":"150 gr","k":"pomodorini"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Apri cozze e vongole e filtra il liquido: sarà il tuo brodo, allungato con acqua.","Sguscia la maggior parte dei molluschi e tieni da parte.","Stufa la cipolla tritata in olio, tosta il riso due minuti.","Sfuma col vino, poi procedi col brodo caldo un mestolo per volta.","A metà cottura unisci i pomodorini, e negli ultimi tre minuti i frutti di mare.","Manteca con olio a crudo e prezzemolo: niente burro né formaggio."],"nota":"Sul risotto di mare non si manteca mai con burro e parmigiano: si usa olio a crudo.","luogo":"Veneto","estero":false,"all":["crostacei","molluschi","solfiti"],"unico":false,"nvoci":9,"minimo":false,"leggero":true,"att":["colino a maglie fitte"],"att_opz":[]},{"id":245,"n":"Seppie con piselli","cat":"Secondi","tempo":60,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"seppie","q":"800 gr","k":"seppie"},{"n":"piselli","q":"500 gr","k":"piselli"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"passata di pomodoro","q":"200 gr","k":"passata di pomodoro"},{"n":"vino bianco","q":"1/2 bicchiere","k":"vino bianco"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Pulisci le seppie e tagliale a strisce larghe un centimetro.","Soffriggi cipolla e aglio, unisci le seppie e falle rosolare cinque minuti.","Sfuma col vino e lascia evaporare, poi aggiungi la passata.","Copri e cuoci quaranta minuti a fuoco dolce: le seppie devono diventare tenere.","Unisci i piselli negli ultimi quindici minuti e completa col prezzemolo."],"nota":"Le seppie passano dal tenero al gommoso e poi tornano tenere: se a venti minuti sono dure, continua.","luogo":"Lazio","estero":false,"all":["solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":246,"n":"Calamari ripieni","cat":"Secondi","tempo":70,"diff":"media","tags":["vegetariano"],"ing":[{"n":"calamari","q":"8","k":"calamari"},{"n":"pane raffermo","q":"150 gr","k":"pane"},{"n":"uova","q":"1","k":"uova"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"pomodorini","q":"300 gr","k":"pomodorini"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"}],"proc":["Pulisci i calamari tenendo da parte i tentacoli, che triterai per il ripieno.","Mescola pane ammollato e strizzato, tentacoli tritati, uovo, parmigiano, aglio e prezzemolo.","Riempi le sacche per due terzi e chiudi con uno stecchino: in cottura si restringono.","Rosolali in padella, sfuma col vino e unisci i pomodorini.","Copri e cuoci trenta minuti a fuoco dolce."],"nota":"Riempirli troppo è l’errore classico: scoppiano e il ripieno finisce nel sugo.","luogo":"Campania","estero":false,"all":["glutine","latte","solfiti","uova"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":247,"n":"Zuppa di cozze","cat":"Primi","tempo":35,"diff":"facile","tags":["senza forno"],"ing":[{"n":"cozze","q":"2 kg","k":"cozze"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"aglio","q":"4 spicchi","k":"aglio"},{"n":"peperoncino secco","q":"2","k":"peperoncino secco"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"pane raffermo","q":"8 fette","k":"pane"}],"proc":["Pulisci le cozze e mettile da parte.","Soffriggi aglio e peperoncino in abbondante olio, unisci la passata e cuoci quindici minuti.","Versa le cozze, copri e cuoci a fuoco vivo cinque minuti scuotendo la pentola.","Scarta quelle chiuse e completa con prezzemolo.","Servi su pane abbrustolito, con il sugo abbondante."],"nota":"Il pane va messo nel piatto, non nella pentola: dentro si spappola.","luogo":"Campania","estero":false,"all":["glutine","molluschi"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":248,"n":"Insalata di mare","cat":"Antipasti","tempo":60,"diff":"facile","tags":["senza forno"],"ing":[{"n":"polpo","q":"500 gr","k":"polpo"},{"n":"calamari","q":"400 gr","k":"calamari"},{"n":"gamberi","q":"300 gr","k":"gamberi"},{"n":"cozze","q":"500 gr","k":"cozze"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"limone","q":"3","k":"limone"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"aglio","q":"1 spicchio","k":"aglio"}],"proc":["Lessa il polpo per quaranta minuti e lascialo raffreddare nella sua acqua.","Cuoci i calamari otto minuti e i gamberi due, in acqua bollente salata.","Apri le cozze e sgusciale.","Taglia tutto a pezzi regolari e unisci il sedano a fettine sottili.","Condisci con olio, limone abbondante, aglio tritato finissimo e prezzemolo.","Riposa in frigorifero almeno due ore prima di servire."],"nota":"Ogni pesce ha il suo tempo e va cotto separatamente: è l’unico modo perché nessuno sia gommoso.","luogo":"Liguria","estero":false,"all":["crostacei","molluschi","sedano"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":249,"n":"Fritto misto di paranza","cat":"Secondi","tempo":40,"diff":"facile","tags":[],"ing":[{"n":"gamberi","q":"400 gr","k":"gamberi"},{"n":"calamari","q":"400 gr","k":"calamari"},{"n":"alici fresche","q":"400 gr","k":"alici fresche"},{"n":"semola","q":"300 gr","k":"semola"},{"n":"limone","q":"2","k":"limone"}],"proc":["Pulisci il pesce e asciugalo benissimo: l’acqua è il nemico della frittura.","Infarina nella semola rimacinata, che dà più croccantezza della farina.","Scuoti bene l’eccesso in un setaccio.","Friggi in olio a 180 gradi, poco pesce per volta, due o tre minuti.","Scola su carta, sala solo ora e servi subito con il limone."],"nota":"Semola e non farina: è la differenza fra un fritto croccante e uno molliccio.","luogo":"Campania","estero":false,"all":["crostacei","glutine","pesce"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":["setaccio o schiacciapatate"],"att_opz":[]},{"id":250,"n":"Orata al forno con patate","cat":"Secondi","tempo":60,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"orata","q":"1,2 kg","k":"orata"},{"n":"patate","q":"800 gr","k":"patate"},{"n":"pomodorini","q":"200 gr","k":"pomodorini"},{"n":"olive","q":"80 gr","k":"olive"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"}],"proc":["Affetta le patate a tre millimetri, condiscile con olio, sale e rosmarino e stendile in teglia.","Inforna a 200 gradi per venti minuti, finché cominciano a dorare.","Adagia sopra l’orata pulita, con aglio e rosmarino nella pancia.","Distribuisci pomodorini e olive, bagna col vino.","Prosegui venticinque minuti: il pesce è pronto quando la pinna dorsale si sfila senza resistenza."],"nota":"La prova della pinna è più affidabile del tempo: dipende dallo spessore, non dal peso.","luogo":"Puglia","estero":false,"all":["solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":251,"n":"Branzino al sale","cat":"Secondi","tempo":50,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"branzino","q":"1,2 kg","k":"branzino"},{"n":"sale","q":"2 kg","k":"sale"},{"n":"uova","q":"2","k":"uova"},{"n":"limone","q":"1","k":"limone"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"}],"proc":["Mescola il sale grosso con gli albumi e poca acqua, fino a una consistenza di sabbia bagnata.","Stendi un letto di sale in teglia e adagia il pesce non squamato, con limone e rosmarino nella pancia.","Coprilo completamente con il resto del sale, pressando bene.","Informa a 200 gradi per trenta minuti.","Rompi la crosta con il dorso di un coltello e sfiletta subito, togliendo la pelle con il sale attaccato."],"nota":"Il pesce non va squamato: le squame sono la barriera che impedisce al sale di entrare nella carne.","luogo":"Toscana","estero":false,"all":["uova"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":252,"n":"Gamberi al vino bianco","cat":"Secondi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"gamberi","q":"800 gr","k":"gamberi"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"vino bianco","q":"200 ml","k":"vino bianco"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"},{"n":"pane raffermo","q":"4 fette","k":"pane"}],"proc":["Pulisci i gamberi lasciando il carapace, che dà sapore.","Scalda olio, aglio a lamelle e peperoncino.","Unisci i gamberi a fuoco vivo e saltali due minuti.","Sfuma col vino e lascia restringere tre minuti.","Completa col prezzemolo e servi con pane per raccogliere il fondo."],"nota":"Con il carapace il sapore raddoppia: si sgusciano a tavola, con le mani.","luogo":"Sicilia","estero":false,"all":["crostacei","glutine","solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":253,"n":"Baccalà fritto","cat":"Secondi","tempo":40,"diff":"facile","tags":[],"ing":[{"n":"baccalà dissalato","q":"800 gr","k":"baccalà dissalato"},{"n":"farina","q":"150 gr","k":"farina"},{"n":"acqua","q":"200 ml","k":"acqua"},{"n":"limone","q":"2","k":"limone"}],"proc":["Taglia il baccalà a pezzi regolari e asciugalo bene.","Prepara una pastella con farina e acqua fredda, densa quanto una crema.","Lasciala riposare mezz’ora in frigorifero.","Immergi i pezzi e friggi in olio a 175 gradi finché sono dorati.","Scola su carta e servi con limone."],"nota":"La pastella fredda a contatto con l’olio caldo è quella che crea il guscio croccante.","luogo":"Lazio","estero":false,"all":["glutine","pesce"],"unico":false,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":254,"n":"Pollo alla cacciatora","cat":"Secondi","tempo":70,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pollo a pezzi","q":"1,4 kg","k":"pollo"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"carota","q":"1","k":"carota"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"},{"n":"olive","q":"100 gr","k":"olive"}],"proc":["Rosola i pezzi di pollo in olio con rosmarino, pelle verso il basso, senza muoverli.","Toglili e fai il soffritto con cipolla, carota e sedano tritati.","Rimetti il pollo, sfuma col vino e lascia evaporare.","Unisci la passata e le olive, copri e cuoci quaranta minuti.","Scopri negli ultimi dieci per far restringere il fondo."],"nota":"La pelle va rosolata a lungo e da ferma: se la giri subito resta molle per tutta la cottura.","luogo":"Toscana","estero":false,"all":["sedano","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":255,"n":"Coniglio alla cacciatora","cat":"Secondi","tempo":80,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"coniglio","q":"1,3 kg","k":"coniglio"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"vino bianco","q":"200 ml","k":"vino bianco"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"olive","q":"80 gr","k":"olive"},{"n":"alloro","q":"2 foglie","k":"alloro"}],"proc":["Lascia il coniglio a bagno in acqua e aceto un’ora per togliere il sapore selvatico.","Asciugalo e rosolalo in olio con aglio e rosmarino.","Sfuma col vino, unisci la passata, l’alloro e le olive.","Copri e cuoci cinquanta minuti a fuoco dolce, bagnando se serve.","Lascia riposare dieci minuti prima di servire."],"nota":"L’ammollo in acqua e aceto è il passaggio che rende il coniglio gradito anche a chi dice di non amarlo.","luogo":"Marche","estero":false,"all":["solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":256,"n":"Polpettone al forno","cat":"Secondi","tempo":80,"diff":"facile","tags":[],"ing":[{"n":"carne macinata","q":"800 gr","k":"carne macinata"},{"n":"pane raffermo","q":"150 gr","k":"pane"},{"n":"latte","q":"150 ml","k":"latte"},{"n":"uova","q":"2","k":"uova"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"prosciutto cotto","q":"100 gr","k":"prosciutto cotto"},{"n":"mozzarella","q":"150 gr","k":"mozzarella"},{"n":"patate","q":"600 gr","k":"patate"}],"proc":["Ammolla il pane nel latte e strizzalo.","Impasta con carne, uova, parmigiano, sale e pepe, lavorando poco.","Stendi su carta forno, farcisci con prosciutto e mozzarella e arrotola aiutandoti con la carta.","Adagia in teglia con le patate a tocchi condite.","Inforna a 180 gradi per un’ora, girando le patate a metà.","Affetta solo dopo dieci minuti di riposo."],"nota":"Se lo tagli appena sfornato si sbriciola: il riposo serve a far riassorbire i succhi.","luogo":"Lombardia","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":257,"n":"Roast beef all’inglese","cat":"Secondi","tempo":60,"diff":"media","tags":[],"ing":[{"n":"manzo","q":"1 kg","k":"manzo"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"senape","q":"2 cucchiai","k":"senape"},{"n":"vino rosso","q":"1 bicchiere","k":"vino rosso"}],"proc":["Tira fuori la carne dal frigorifero due ore prima: deve essere a temperatura ambiente.","Massaggiala con senape, aglio, rosmarino, sale e pepe, e legala.","Rosola in padella rovente su tutti i lati, tre minuti per faccia.","Inforna a 200 gradi per venti minuti: al cuore deve arrivare a 52 gradi per una cottura al sangue.","Avvolgi in alluminio e riposa quindici minuti prima di affettare sottilissimo."],"nota":"Senza termometro si va a occhio e si sbaglia: venti minuti valgono per un chilo di forma regolare.","luogo":"Piemonte","estero":false,"all":["senape","solfiti"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":258,"n":"Tagliata di manzo","cat":"Secondi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"manzo","q":"800 gr","k":"manzo"},{"n":"rucola","q":"150 gr","k":"rucola"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"rosmarino","q":"1 rametto","k":"rosmarino"},{"n":"aglio","q":"1 spicchio","k":"aglio"}],"proc":["Porta la carne a temperatura ambiente e asciugala bene.","Scalda la griglia o la piastra finché fuma.","Cuoci quattro minuti per lato senza mai muoverla né bucarla.","Falla riposare cinque minuti avvolta in alluminio.","Affetta controfibra, sala ora e servi su un letto di rucola con scaglie di parmigiano."],"nota":"Il sale prima della cottura tira fuori i succhi: si sala sempre dopo il taglio.","luogo":"Toscana","estero":false,"all":["latte"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":["griglia o piastra"],"att_opz":[]},{"id":259,"n":"Filetto al pepe verde","cat":"Secondi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"manzo","q":"600 gr","k":"manzo"},{"n":"pepe verde","q":"3 cucchiai","k":"pepe verde"},{"n":"panna","q":"200 ml","k":"panna"},{"n":"burro","q":"40 gr","k":"burro"},{"n":"brandy","q":"50 ml","k":"brandy"},{"n":"brodo vegetale","q":"100 ml","k":"brodo vegetale"}],"proc":["Rosola i medaglioni nel burro, tre minuti per lato, e tienili in caldo.","Nel fondo unisci il pepe verde schiacciato grossolanamente.","Sfuma col brandy e fiamma, o lascia semplicemente evaporare.","Versa brodo e panna e lascia restringere finché vela il cucchiaio.","Rimetti la carne un minuto e servi nappando con la salsa."],"nota":"Il pepe verde va schiacciato ma non macinato: devono restare i grani interi.","luogo":"Piemonte","estero":false,"all":["latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":260,"n":"Straccetti con rucola","cat":"Secondi","tempo":20,"diff":"facile","tags":["senza forno"],"ing":[{"n":"manzo","q":"600 gr","k":"manzo"},{"n":"rucola","q":"150 gr","k":"rucola"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"vino bianco","q":"1/2 bicchiere","k":"vino bianco"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"},{"n":"limone","q":"1","k":"limone"}],"proc":["Taglia la carne a striscioline sottilissime, controfibra.","Scalda la padella finché è rovente con olio e aglio.","Butta la carne e saltala due minuti, non di più.","Sfuma col vino, sala e spegni.","Unisci la rucola fuori dal fuoco, che deve solo appassire, e completa con parmigiano e limone."],"nota":"Due minuti sono il massimo: gli straccetti si asciugano in un attimo.","luogo":"Lazio","estero":false,"all":["latte","solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":261,"n":"Involtini di carne al sugo","cat":"Secondi","tempo":90,"diff":"facile","tags":["senza forno"],"ing":[{"n":"manzo","q":"800 gr","k":"manzo"},{"n":"pane raffermo","q":"100 gr","k":"pane"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"prosciutto cotto","q":"100 gr","k":"prosciutto cotto"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"passata di pomodoro","q":"700 gr","k":"passata di pomodoro"},{"n":"cipolla","q":"1","k":"cipolla"}],"proc":["Batti le fettine e farciscile con prosciutto, pane sbriciolato, parmigiano, aglio e prezzemolo.","Arrotola e ferma con uno stecchino.","Rosolali in olio su tutti i lati, poi tienili da parte.","Fai appassire la cipolla, unisci la passata e rimetti gli involtini.","Cuoci coperto un’ora a fuoco dolce."],"nota":"Il sugo che ne esce è perfetto per condire la pasta: è un piatto che ne fa due.","luogo":"Sicilia","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":262,"n":"Arista di maiale al forno","cat":"Secondi","tempo":100,"diff":"facile","tags":[],"ing":[{"n":"lonza di maiale","q":"1,2 kg","k":"lonza di maiale"},{"n":"rosmarino","q":"3 rametti","k":"rosmarino"},{"n":"aglio","q":"4 spicchi","k":"aglio"},{"n":"finocchietto selvatico","q":"1 ciuffo","k":"finocchietto selvatico"},{"n":"vino bianco","q":"200 ml","k":"vino bianco"},{"n":"patate","q":"800 gr","k":"patate"}],"proc":["Pratica dei tagli nella carne e riempili con aglio, rosmarino e finocchietto tritati.","Lega, sala e pepa generosamente.","Rosola in padella su tutti i lati, poi trasferisci in teglia con le patate.","Bagna col vino e inforna a 180 gradi per un’ora e dieci.","Riposa quindici minuti prima di affettare."],"nota":"Il nome viene dal greco aristos, il migliore: pare lo dicessero i vescovi bizantini a Firenze.","luogo":"Toscana","estero":false,"all":["solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":263,"n":"Salsicce e fagioli","cat":"Secondi","tempo":60,"diff":"facile","tags":["senza forno"],"ing":[{"n":"salsiccia","q":"800 gr","k":"salsiccia"},{"n":"fagioli","q":"500 gr","k":"fagioli"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"salvia","q":"6 foglie","k":"salvia"},{"n":"cipolla","q":"1","k":"cipolla"}],"proc":["Punzecchia le salsicce e rosolale in padella senza grassi finché sono dorate.","Toglile e nel loro grasso fai appassire cipolla e aglio con la salvia.","Unisci la passata e cuoci dieci minuti.","Rimetti le salsicce e aggiungi i fagioli già lessati.","Cuoci venti minuti a fuoco dolce, finché il sugo si addensa."],"nota":"Punzecchiare le salsicce le fa perdere grasso: se le vuoi succose, non farlo e rosolale più piano.","luogo":"Toscana","estero":false,"all":[],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":264,"n":"Petto di pollo alla pizzaiola","cat":"Secondi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"petto di pollo","q":"700 gr","k":"pollo"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"origano","q":"1 cucchiaio","k":"origano"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"mozzarella","q":"200 gr","k":"mozzarella"},{"n":"capperi","q":"30 gr","k":"capperi"}],"proc":["Taglia il petto a fette spesse un centimetro e rosolale due minuti per lato.","Toglile e nella stessa padella soffriggi l’aglio con la passata e l’origano.","Cuoci il sugo dieci minuti, poi rimetti il pollo.","Adagia sopra la mozzarella a fette e i capperi.","Copri e lascia sciogliere cinque minuti a fuoco basso."],"nota":"Il pollo va rosolato e tolto subito: se cuoce nel sugo dall’inizio diventa asciutto.","luogo":"Campania","estero":false,"all":["latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":265,"n":"Spiedini di carne mista","cat":"Secondi","tempo":40,"diff":"facile","tags":["senza forno"],"ing":[{"n":"maiale","q":"400 gr","k":"maiale"},{"n":"salsiccia","q":"300 gr","k":"salsiccia"},{"n":"peperoni","q":"2","k":"peperoni"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"alloro","q":"12 foglie","k":"alloro"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"}],"proc":["Taglia carne e verdure a cubi della stessa misura, circa tre centimetri.","Alterna sugli spiedini carne, salsiccia, peperone, cipolla e foglie d’alloro.","Condisci con olio, rosmarino tritato, sale e pepe.","Cuoci su griglia rovente dodici minuti, girando ogni tre.","Lascia riposare due minuti prima di servire."],"nota":"Cubi della stessa misura o alcuni bruciano mentre altri restano crudi: è tutto lì.","luogo":"Abruzzo","estero":false,"all":[],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":["griglia o piastra","spiedini"],"att_opz":[]},{"id":266,"n":"Bollito misto","cat":"Secondi","tempo":180,"diff":"facile","tags":["senza forno"],"ing":[{"n":"manzo","q":"1 kg","k":"manzo"},{"n":"pollo a pezzi","q":"800 gr","k":"pollo"},{"n":"carota","q":"3","k":"carota"},{"n":"sedano","q":"3 coste","k":"sedano"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"prezzemolo","q":"2 ciuffi","k":"prezzemolo"},{"n":"pane raffermo","q":"100 gr","k":"pane"},{"n":"aceto","q":"3 cucchiai","k":"aceto"},{"n":"acciughe sott’olio","q":"4 filetti","k":"acciughe sott’olio"},{"n":"capperi","q":"40 gr","k":"capperi"}],"proc":["Metti il manzo in acqua già bollente con le verdure: così la carne resta saporita.","Cuoci due ore a fuoco dolce, schiumando ogni tanto.","Aggiungi il pollo nell’ultima ora.","Per il bagnetto verde frulla prezzemolo, pane ammollato nell’aceto, acciughe, capperi e olio.","Servi le carni calde, affettate spesse, con la salsa a parte."],"nota":"Carne in acqua bollente se vuoi mangiare la carne, in acqua fredda se vuoi il brodo. Non si può avere entrambi.","luogo":"Piemonte","estero":false,"all":["glutine","pesce","sedano","solfiti"],"unico":true,"nvoci":10,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":["pentola a pressione"]},{"id":267,"n":"Lesso rifatto con le cipolle","cat":"Secondi","tempo":40,"diff":"facile","tags":["senza forno"],"ing":[{"n":"manzo","q":"600 gr","k":"manzo"},{"n":"cipolla","q":"600 gr","k":"cipolla"},{"n":"passata di pomodoro","q":"200 gr","k":"passata di pomodoro"},{"n":"vino rosso","q":"1 bicchiere","k":"vino rosso"},{"n":"alloro","q":"2 foglie","k":"alloro"}],"proc":["Affetta le cipolle sottili e falle stufare in olio per venti minuti.","Unisci il lesso avanzato tagliato a fette spesse.","Sfuma col vino rosso e lascia evaporare.","Aggiungi la passata e l’alloro e cuoci quindici minuti.","Servi con la polenta o con pane abbrustolito."],"nota":"Nato per non buttare il lesso del giorno prima, ed è più buono dell’originale.","luogo":"Piemonte","estero":false,"all":["solfiti"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":268,"n":"Pasta al forno","cat":"Primi","tempo":90,"diff":"facile","tags":[],"ing":[{"n":"pasta","q":"500 gr","k":"pasta"},{"n":"carne macinata","q":"400 gr","k":"carne macinata"},{"n":"passata di pomodoro","q":"700 gr","k":"passata di pomodoro"},{"n":"mozzarella","q":"300 gr","k":"mozzarella"},{"n":"parmigiano","q":"150 gr","k":"parmigiano"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"uova","q":"2","k":"uova"},{"n":"pangrattato","q":"50 gr","k":"pangrattato"}],"proc":["Prepara un ragù con cipolla, carne e passata, cuocendo quaranta minuti.","Rassoda due uova e tagliale a fette.","Lessa la pasta molto al dente, scolandola quattro minuti prima del tempo.","Condiscila col ragù e alterna in teglia con mozzarella scolata, uova e parmigiano.","Cospargi di pangrattato e inforna a 200 gradi per trenta minuti.","Riposa dieci minuti prima di tagliare."],"nota":"La pasta va scolata molto prima: in forno continua a cuocere assorbendo il sugo.","luogo":"Campania","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":269,"n":"Anelletti al forno","cat":"Primi","tempo":100,"diff":"media","tags":[],"ing":[{"n":"pasta","q":"500 gr","k":"pasta"},{"n":"carne macinata","q":"400 gr","k":"carne macinata"},{"n":" ro":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":9,"minimo":false,"leggero":false,"att":["cannello"],"att_opz":[]},{"id":273,"n":"Crespelle al forno","cat":"Primi","tempo":80,"diff":"media","tags":["vegetariano"],"ing":[{"n":"farina","q":"150 gr","k":"farina"},{"n":"uova","q":"3","k":"uova"},{"n":"latte","q":"900 ml","k":"latte"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"ricotta","q":"400 gr","k":"ricotta"},{"n":"spinaci","q":"600 gr","k":"spinaci"},{"n":"parmigiano","q":"120 gr","k":"parmigiano"},{"n":"farina 00 per dolci","q":"50 gr","k":"farina 00 per dolci"}],"proc":["Prepara la pastella con farina, uova e 400 ml di latte, e falla riposare mezz’ora.","Cuoci crespelle sottili in padella antiaderente unta.","Farcisci con ricotta e spinaci sbollentati e strizzati.","Arrotola o piega a fazzoletto e disponi in teglia.","Copri con besciamella fatta col latte rimasto e gratina a 180 gradi per venticinque minuti."],"nota":"La prima crespella non viene mai: serve a regolare la temperatura della padella.","luogo":"Toscana","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":274,"n":"Pasta e broccoli","cat":"Primi","tempo":40,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"broccoli","q":"800 gr","k":"broccoli"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"},{"n":"acciughe sott’olio","q":"3 filetti","k":"acciughe sott’olio"},{"n":"pecorino romano","q":"60 gr","k":"pecorino romano"}],"proc":["Sbollenta i broccoli a cimette per otto minuti e tieni l’acqua.","Soffriggi aglio e peperoncino, unisci le acciughe e scioglile.","Aggiungi i broccoli e schiacciali con la forchetta.","Cuoci la pasta nella loro acqua e scolala al dente.","Salta in padella con un mestolo d’acqua e completa col pecorino."],"nota":"Cuocere la pasta nell’acqua dei broccoli è quello che lega il piatto: non buttarla mai. colando energicamente."],"nota":"Le zucchine fritte in anticipo e lasciate riposare col basilico sono il vero segreto del piatto.","luogo":"Campania","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":277,"n":"Pasta e piselli","cat":"Primi","tempo":35,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"piselli","q":"600 gr","k":"piselli"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"pancetta","q":"80 gr","k":"pancetta"},{"n":"passata di pomodoro","q":"100 gr","k":"passata di pomodoro"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"}],"proc":["Stufa cipolla e pancetta a dadini in olio.","Unisci i piselli e la passata, copri d’acqua calda e cuoci quindici minuti.","Butta la pasta direttamente dentro, aggiungendo acqua poco per volta.","Mescola spesso: deve restare cremosa.","Spegni, unisci il parmigiano e lascia riposare cinque minuti."],"nota":"Come tutte le paste risottate va mescolata spesso: è l’amido a fare la cremosità.","luogo":"Campania","estero":false,"all":["glutine","latte"],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":278,"n":"Pasta e lenticchie","cat":"Primi","tempo":50,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"pasta","q":"250 gr","k":"pasta"},{"n":"lenticchie","q":"350 gr","k":"lenticchie"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"carota","q":"1","k":"carota"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"passata di pomodoro","q":"150 gr","k":"passata di pomodoro"},{"n":"rosmarino","q":"1 rametto","k":"rosmarino"}],"proc":["Fai il soffritto con cipolla, carota e sedano tritati.","Unisci le lenticchie sciacquate, la passata e acqua a coprire.","Cuoci trentacinque minuti, salando solo a metà.","Butta la pasta nella zuppa e cuoci mescolando.","Servi con olio a crudo e rosmarino tritato."],"nota":"Le lenticchie salate all’inizio restano dure: il sale indurisce la buccia.","
