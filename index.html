opz":[]},{"id":281,"n":"Zuppa di farro","cat":"Primi","tempo":70,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"farro","q":"300 gr","k":"farro"},{"n":"fagioli","q":"250 gr","k":"fagioli"},{"n":"carota","q":"2","k":"carota"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"passata di pomodoro","q":"200 gr","k":"passata di pomodoro"},{"n":"rosmarino","q":"1 rametto","k":"rosmarino"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Fai il soffritto con cipolla, carota e sedano.","Unisci i fagioli, la passata e acqua abbondante, e cuoci venti minuti.","Frulla metà dei fagioli e rimettili nella pentola.","Aggiungi il farro sciacquato e cuoci quaranta minuti.","Servi con olio a crudo, aglio e rosmarino tritati."],"nota":"Il farro perlato non va ammollato; quello decorticato sì, almeno otto ore.","luogo":"Toscana","estero":false,"all":["sedano"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":282,"n":"Orzotto ai funghi","cat":"Primi","tempo":60,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"orzo perlato","q":"320 gr","k":"orzo perlato"},{"n":"funghi champignon","q":"400 gr","k":"funghi champignon"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"brodo vegetale","q":"1,2 l","k":"brodo vegetale"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Salta i funghi affettati a fuoco vivo e tienili da parte, salandoli alla fine.","Stufa la cipolla nel burro e tosta l’orzo due minuti.","Sfuma col vino e procedi col brodo caldo un mestolo per volta.","L’orzo vuole più tempo del riso: calcola trentacinque minuti.","Unisci i funghi a metà cottura e manteca alla fine con burro e parmigiano."],"nota":"L’orzo non rilascia l’amido del riso: la cremosità va costruita con la mantecatura finale.","luogo":"Trentino-Alto Adige","estero":false,"all":["latte","solfiti"],"unico":true,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":283,"n":"Polenta taragna","cat":"Primi","tempo":70,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"farina di mais","q":"200 gr","k":"farina di mais"},{"n":"grano saraceno","q":"100 gr","k":"grano saraceno"},{"n":"formaggio fontina","q":"250 gr","k":"formaggio fontina"},{"n":"burro","q":"120 gr","k":"burro"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"}],"proc":["Porta a bollore un litro e mezzo d’acqua salata.","Versa a pioggia le due farine mescolate, mescolando con la frusta.","Cuoci cinquanta minuti a fuoco basso, mescolando spesso.","Negli ultimi dieci minuti unisci il formaggio a dadini e metà del burro.","Completa con il burro rimasto fatto imbiondire."],"nota":"Il tarai è il bastone con cui si mescolava: da lì il nome, non dal grano saraceno.","luogo":"Lombardia","estero":false,"all":["latte"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":284,"n":"Risotto zucca e salsiccia","cat":"Primi","tempo":45,"diff":"facile","tags":["senza forno"],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"zucca","q":"600 gr","k":"zucca"},{"n":"salsiccia","q":"250 gr","k":"salsiccia"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"brodo vegetale","q":"1,2 l","k":"brodo vegetale"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"rosmarino","q":"1 rametto","k":"rosmarino"}],"proc":["Rosola la salsiccia sbriciolata e tienila da parte.","Stufa la cipolla nel suo grasso e unisci la zucca a cubetti.","Cuoci dieci minuti, schiacciandone metà per farla diventare crema.","Tosta il riso, sfuma col vino e procedi col brodo.","Rimetti la salsiccia a metà cottura e manteca con burro e parmigiano."],"nota":"Schiacciare metà zucca e lasciare l’altra a cubetti dà due consistenze nello stesso piatto.","luogo":"Lombardia","estero":false,"all":["latte","solfiti"],"unico":false,"nvoci":9,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":285,"n":"Tagliolini al limone","cat":"Primi","tempo":25,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"limone","q":"3","k":"limone"},{"n":"panna","q":"200 ml","k":"panna"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"basilico","q":"1 ciuffo","k":"basilico"}],"proc":["Grattugia la scorza di due limoni, evitando il bianco.","Scalda il burro con la scorza per un minuto, senza friggerla.","Unisci la panna e il succo di mezzo limone e lascia addensare appena.","Cuoci i tagliolini due minuti e saltali nella salsa con acqua di cottura.","Manteca col parmigiano e completa con basilico e altra scorza a crudo."],"nota":"Metà scorza in cottura e metà a crudo: la prima dà il fondo, la seconda il profumo.","luogo":"Campania","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":286,"n":"Pasta con la zucca e provola","cat":"Primi","tempo":45,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"zucca","q":"700 gr","k":"zucca"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"provola","q":"200 gr","k":"provola"},{"n":"rosmarino","q":"1 rametto","k":"rosmarino"},{"n":"brodo vegetale","q":"500 ml","k":"brodo vegetale"}],"proc":["Stufa la cipolla, unisci la zucca a cubetti e il rosmarino.","Copri col brodo e cuoci venti minuti, finché si disfa.","Frulla metà del composto per avere una crema con dei pezzi.","Butta la pasta direttamente dentro, aggiungendo brodo poco per volta.","Fuori dal fuoco unisci la provola a dadini, che deve solo filare."],"nota":"La provola si mette a fuoco spento: cotta rilascia grasso e diventa gommosa.","luogo":"Campania","estero":false,"all":["glutine"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":287,"n":"Parmigiana di zucchine","cat":"Secondi","tempo":80,"diff":"media","tags":["vegetariano"],"ing":[{"n":"zucchine","q":"1,2 kg","k":"zucchine"},{"n":"passata di pomodoro","q":"600 gr","k":"passata di pomodoro"},{"n":"mozzarella","q":"350 gr","k":"mozzarella"},{"n":"parmigiano","q":"120 gr","k":"parmigiano"},{"n":"basilico","q":"1 ciuffo","k":"basilico"},{"n":"farina","q":"100 gr","k":"farina"}],"proc":["Affetta le zucchine per lungo a mezzo centimetro, infarinale e friggile.","Scolale su carta e salale.","Prepara un sugo semplice con olio, passata e basilico.","Alterna in teglia sugo, zucchine, mozzarella scolata e parmigiano per tre strati.","Inforna a 180 gradi per trentacinque minuti e riposa venti minuti."],"nota":"Più delicata di quella di melanzane, e per questo va salata con più attenzione.","luogo":"Campania","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":288,"n":"Cotolette di melanzane","cat":"Secondi","tempo":50,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"melanzane","q":"1 kg","k":"melanzane"},{"n":"uova","q":"3","k":"uova"},{"n":"pangrattato","q":"250 gr","k":"pangrattato"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"aglio","q":"1 spicchio","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Affetta le melanzane a un centimetro, salale e falle spurgare mezz’ora.","Asciugale bene con carta.","Mescola pangrattato, parmigiano, aglio e prezzemolo tritati.","Passa le fette nell’uovo sbattuto e nella panatura, premendo forte.","Friggi in olio a 175 gradi, oppure inforna a 200 gradi per venticinque minuti."],"nota":"Premere bene la panatura è ciò che le impedisce di staccarsi in cottura.","luogo":"Sicilia","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":289,"n":"Peperoni in agrodolce","cat":"Contorni","tempo":45,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"peperoni","q":"1 kg","k":"peperoni"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"aceto","q":"4 cucchiai","k":"aceto"},{"n":"zucchero","q":"2 cucchiai","k":"zucchero"},{"n":"uvetta","q":"40 gr","k":"uvetta"},{"n":"pinoli","q":"30 gr","k":"pinoli"},{"n":"basilico","q":"1 ciuffo","k":"basilico"}],"proc":["Stufa le cipolle affettate in olio per quindici minuti.","Unisci i peperoni a falde e cuoci venti minuti a fuoco medio.","Aggiungi uvetta ammollata e pinoli.","Sciogli lo zucchero nell’aceto e versa, alzando la fiamma per far evaporare.","Spegni, unisci il basilico e servi a temperatura ambiente."],"nota":"L’agrodolce va fatto evaporare a fuoco vivo: altrimenti resta acido e pungente.","luogo":"Sicilia","estero":false,"all":["frutta a guscio","solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":290,"n":"Zucchine alla scapece","cat":"Contorni","tempo":40,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"zucchine","q":"1 kg","k":"zucchine"},{"n":"aceto","q":"100 ml","k":"aceto"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"menta","q":"1 ciuffo","k":"menta"}],"proc":["Affetta le zucchine a rondelle di mezzo centimetro.","Friggile in olio caldo poche per volta e scolale su carta.","Disponile a strati in un contenitore con aglio a lamelle e menta.","Scalda l’aceto e versalo bollente sugli strati.","Lascia riposare almeno quattro ore, meglio una notte."],"nota":"L’aceto va versato bollente: è quello che le marina davvero invece di bagnarle soltanto.","luogo":"Campania","estero":false,"all":["solfiti"],"unico":false,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":291,"n":"Cavolfiore gratinato","cat":"Contorni","tempo":60,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"cavolfiore","q":"1,2 kg","k":"cavolfiore"},{"n":"latte","q":"600 ml","k":"latte"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"farina","q":"60 gr","k":"farina"},{"n":"parmigiano","q":"120 gr","k":"parmigiano"},{"n":"noce moscata","q":"1 pizzico","k":"noce moscata"},{"n":"pangrattato","q":"50 gr","k":"pangrattato"}],"proc":["Dividi il cavolfiore a cimette e lessale otto minuti, tenendole sode.","Prepara la besciamella con burro, farina e latte caldo, profumando con noce moscata.","Disponi le cimette in pirofila e coprile con la besciamella.","Cospargi di parmigiano e pangrattato.","Gratina a 200 gradi per venticinque minuti."],"nota":"Il cavolfiore lessato troppo si disfa sotto la besciamella: otto minuti e stop.","luogo":"Emilia-Romagna","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":292,"n":"Sformato di verdure","cat":"Secondi","tempo":70,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"spinaci","q":"800 gr","k":"spinaci"},{"n":"patate","q":"400 gr","k":"patate"},{"n":"uova","q":"4","k":"uova"},{"n":"parmigiano","q":"120 gr","k":"parmigiano"},{"n":"latte","q":"150 ml","k":"latte"},{"n":"pangrattato","q":"60 gr","k":"pangrattato"},{"n":"noce moscata","q":"1 pizzico","k":"noce moscata"}],"proc":["Lessa le patate e schiacciale; sbollenta gli spinaci, strizzali e tritali.","Mescola con uova, parmigiano, latte, sale, pepe e noce moscata.","Versa in uno stampo imburrato e cosparso di pangrattato.","Inforna a 180 gradi per quaranta minuti.","Lascia intiepidire dieci minuti prima di sformare."],"nota":"È il modo più efficace per far mangiare le verdure a chi non le vuole.","luogo":"Piemonte","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":293,"n":"Flan di zucca","cat":"Antipasti","tempo":60,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"zucca","q":"800 gr","k":"zucca"},{"n":"uova","q":"3","k":"uova"},{"n":"panna","q":"150 ml","k":"panna"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"noce moscata","q":"1 pizzico","k":"noce moscata"},{"n":"burro","q":"30 gr","k":"burro"}],"proc":["Cuoci la zucca a cubi in forno a 200 gradi per trenta minuti: asciuga meglio che lessata.","Frullala con panna, uova e parmigiano.","Aggiusta di sale, pepe e noce moscata.","Versa in stampini imburrati e cuoci a bagnomaria a 170 gradi per trentacinque minuti.","Sforma da tiepido."],"nota":"La zucca al forno invece che lessa è ciò che evita il flan acquoso.","luogo":"Lombardia","estero":false,"all":["latte","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":["frullatore o minipimer","stampini"],"att_opz":[]},{"id":294,"n":"Patate alla contadina","cat":"Contorni","tempo":50,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"patate","q":"1 kg","k":"patate"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"peperoni","q":"1","k":"peperoni"},{"n":"pomodorini","q":"200 gr","k":"pomodorini"},{"n":"origano","q":"1 cucchiaino","k":"origano"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Taglia le patate a tocchi e falle rosolare in padella larga con olio e aglio.","Dopo dieci minuti unisci cipolla e peperone a listarelle.","Aggiungi i pomodorini e mezzo bicchiere d’acqua.","Copri e cuoci venticinque minuti, scuotendo la padella ogni tanto.","Scopri negli ultimi cinque minuti e completa con origano."],"nota":"Si scuote la padella invece di mescolare: le patate si sfaldano al primo cucchiaio.","luogo":"Puglia","estero":false,"all":[],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":295,"n":"Cipolle in agrodolce","cat":"Contorni","tempo":45,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"cipolla","q":"800 gr","k":"cipolla"},{"n":"aceto","q":"80 ml","k":"aceto"},{"n":"zucchero","q":"3 cucchiai","k":"zucchero"},{"n":"alloro","q":"2 foglie","k":"alloro"},{"n":"vino rosso","q":"100 ml","k":"vino rosso"}],"proc":["Sbuccia le cipolline lasciandole intere.","Rosolale in olio a fuoco dolce per dieci minuti.","Unisci zucchero, aceto, vino e alloro.","Copri e cuoci trenta minuti a fuoco bassissimo.","Scopri e lascia caramellare finché il fondo è sciropposo."],"nota":"Si mangiano a temperatura ambiente e migliorano dopo un giorno.","luogo":"Veneto","estero":false,"all":["solfiti"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":296,"n":"Insalata di rinforzo","cat":"Contorni","tempo":40,"diff":"facile","tags":["senza forno"],"ing":[{"n":"cavolfiore","q":"1 kg","k":"cavolfiore"},{"n":"olive","q":"150 gr","k":"olive"},{"n":"capperi","q":"50 gr","k":"capperi"},{"n":"acciughe sott’olio","q":"6 filetti","k":"acciughe sott’olio"},{"n":"peperoni","q":"200 gr","k":"peperoni"},{"n":"aceto","q":"4 cucchiai","k":"aceto"}],"proc":["Lessa il cavolfiore a cimette per dieci minuti, tenendolo sodo, e scolalo bene.","Lascialo raffreddare completamente steso su un vassoio.","Unisci olive, capperi dissalati, acciughe a pezzi e peperoni sott’aceto.","Condisci con olio, aceto, sale e pepe.","Riposa almeno tre ore prima di servire."],"nota":"Si chiama così perché a Natale si rinforzava ogni giorno con quello che avanzava.","luogo":"Campania","estero":false,"all":["pesce","solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":297,"n":"Broccoli strascinati","cat":"Contorni","tempo":30,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"broccoli","q":"1 kg","k":"broccoli"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"},{"n":"vino bianco","q":"1/2 bicchiere","k":"vino bianco"}],"proc":["Sbollenta i broccoli a cimette per cinque minuti e scolali.","Scalda abbondante olio con aglio e peperoncino.","Unisci i broccoli e strascinali sul fondo della padella con il cucchiaio di legno.","Sfuma col vino e prosegui dieci minuti a fuoco vivo.","Devono attaccarsi appena al fondo: è lì che prendono sapore."],"nota":"Strascinare vuol dire proprio questo: schiacciarli e trascinarli sul fondo, non saltarli.","luogo":"Lazio","estero":false,"all":["solfiti"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":298,"n":"Fagiolini in umido","cat":"Contorni","tempo":40,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"fagiolini","q":"800 gr","k":"fagiolini"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"aglio","q":"1 spicchio","k":"aglio"},{"n":"basilico","q":"1 ciuffo","k":"basilico"}],"proc":["Spunta i fagiolini e sbollentali cinque minuti.","Stufa cipolla e aglio in olio, unisci la passata e cuoci dieci minuti.","Aggiungi i fagiolini e mezzo bicchiere d’acqua.","Copri e cuoci venti minuti a fuoco dolce.","Completa con basilico e olio a crudo."],"nota":"Vanno cotti a lungo, fino a essere morbidi: qui il dente non serve.","luogo":"Toscana","estero":false,"all":[],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":299,"n":"Frittata di pasta","cat":"Secondi","tempo":40,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pasta","q":"400 gr","k":"pasta"},{"n":"uova","q":"6","k":"uova"},{"n":"parmigiano","q":"120 gr","k":"parmigiano"},{"n":"mozzarella","q":"150 gr","k":"mozzarella"},{"n":"salame a cubetti","q":"100 gr","k":"salame a cubetti"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Usa pasta avanzata condita, oppure lessala e falla raffreddare.","Sbatti le uova con parmigiano, prezzemolo, sale e pepe.","Unisci la pasta, la mozzarella a dadini e il salame.","Versa in padella antiaderente con poco olio e compatta bene.","Cuoci a fuoco basso dieci minuti per lato, girando con un coperchio."],"nota":"Nata per riciclare la pasta del giorno prima, ed è il motivo per cui si fa apposta.","luogo":"Campania","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":300,"n":"Uova in trippa","cat":"Secondi","tempo":35,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"uova","q":"6","k":"uova"},{"n":"passata di pomodoro","q":"500 gr","k":"passata di pomodoro"},{"n":"pecorino romano","q":"100 gr","k":"pecorino romano"},{"n":"mentuccia","q":"1 ciuffo","k":"mentuccia"},{"n":"cipolla","q":"1","k":"cipolla"}],"proc":["Prepara frittatine sottili con le uova sbattute, una alla volta.","Arrotolale e tagliale a striscioline, come fossero trippa.","Fai un sugo semplice con cipolla e passata, cuocendo venti minuti.","Unisci le striscioline e lascia insaporire dieci minuti.","Completa con pecorino e mentuccia."],"nota":"Il nome viene dalla forma: è la trippa dei poveri, che la trippa non se la potevano permettere.","luogo":"Lazio","estero":false,"all":["latte","uova"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":301,"n":"Fonduta valdostana","cat":"Secondi","tempo":40,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"formaggio fontina","q":"600 gr","k":"formaggio fontina"},{"n":"latte","q":"300 ml","k":"latte"},{"n":"uova","q":"4","k":"uova"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"pane raffermo","q":"8 fette","k":"pane"}],"proc":["Taglia la fontina a dadini e lasciala nel latte per almeno quattro ore.","Scalda a bagnomaria con il burro, mescolando finché si scioglie.","Unisci i tuorli uno alla volta, sempre a bagnomaria e senza mai far bollire.","Continua a mescolare finché diventa una crema liscia e vellutata.","Servi con pane tostato o polenta."],"nota":"Se bolle impazzisce e si separa: il bagnomaria non è una raffinatezza, è obbligatorio.","luogo":"Valle d’Aosta","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":302,"n":"Tortino di formaggio e patate","cat":"Secondi","tempo":60,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"patate","q":"1 kg","k":"patate"},{"n":"scamorza","q":"250 gr","k":"scamorza"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"uova","q":"2","k":"uova"},{"n":"latte","q":"100 ml","k":"latte"},{"n":"pangrattato","q":"50 gr","k":"pangrattato"},{"n":"burro","q":"40 gr","k":"burro"}],"proc":["Lessa le patate, sbucciale da calde e schiacciale.","Condisci con uova, latte, parmigiano, sale e pepe.","Stendi metà in teglia imburrata e cosparsa di pangrattato.","Farcisci con la scamorza a fette e copri con il resto.","Cospargi di pangrattato e burro e inforna a 200 gradi per trentacinque minuti."],"nota":"Le patate vanno schiacciate da calde: da fredde restano grumose.","luogo":"Molise","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":303,"n":"Uova alla monachina","cat":"Antipasti","tempo":50,"diff":"media","tags":["vegetariano"],"ing":[{"n":"uova","q":"6","k":"uova"},{"n":"latte","q":"300 ml","k":"latte"},{"n":"burro","q":"40 gr","k":"burro"},{"n":"farina","q":"40 gr","k":"farina"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"},{"n":"pangrattato","q":"150 gr","k":"pangrattato"},{"n":"noce moscata","q":"1 pizzico","k":"noce moscata"}],"proc":["Rassoda le uova per nove minuti, sgusciale e tagliale a metà.","Estrai i tuorli e schiacciali.","Prepara una besciamella densa e uniscila ai tuorli con parmigiano e noce moscata.","Riempi gli albumi, richiudi accoppiandoli e passa nell’uovo e nel pangrattato.","Friggi in olio a 175 gradi finché sono dorate."],"nota":"Le due metà si accoppiano per ricomporre l’uovo: è la parte che richiede pazienza.","luogo":"Campania","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":304,"n":"Seupa à la Valpellinentze","cat":"Primi","tempo":80,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"pane raffermo","q":"400 gr","k":"pane"},{"n":"verza","q":"800 gr","k":"verza"},{"n":"formaggio fontina","q":"300 gr","k":"formaggio fontina"},{"n":"brodo vegetale","q":"1 l","k":"brodo vegetale"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"cannella","q":"1 pizzico","k":"cannella"}],"proc":["Sbollenta la verza a strisce per dieci minuti e scolala.","Tosta il pane a fette nel burro.","In una pirofila alterna pane, verza e fontina a fette, per tre strati.","Versa il brodo bollente fino quasi a coprire e spolvera di cannella.","Inforda a 180 gradi per quaranta minuti, finché la superficie è gratinata."],"nota":"È la zuppa più famosa della valle, e il pizzico di cannella è quello che la rende inconfondibile.","luogo":"Valle d’Aosta","estero":false,"all":["glutine","latte"],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":305,"n":"Costolette alla valdostana","cat":"Secondi","tempo":40,"diff":"facile","tags":[],"ing":[{"n":"costolette di vitello","q":"4","k":"vitello"},{"n":"formaggio fontina","q":"200 gr","k":"formaggio fontina"},{"n":"prosciutto cotto","q":"4 fette","k":"prosciutto cotto"},{"n":"uova","q":"2","k":"uova"},{"n":"pangrattato","q":"200 gr","k":"pangrattato"},{"n":"burro","q":"80 gr","k":"burro"}],"proc":["Incidi le costolette lateralmente formando una tasca.","Farcisci con una fetta di prosciutto e una di fontina.","Chiudi premendo bene i bordi e passa nell’uovo e nel pangrattato.","Friggi nel burro a fuoco medio, cinque minuti per lato.","Servi subito, mentre il formaggio fila."],"nota":"La tasca va chiusa premendo forte: se si apre la fontina esce e brucia nel burro.","luogo":"Valle d’Aosta","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":306,"n":"Toc’ in braide","cat":"Primi","tempo":60,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"farina di mais","q":"250 gr","k":"farina di mais"},{"n":"formaggio montasio","q":"300 gr","k":"formaggio montasio"},{"n":"panna","q":"200 ml","k":"panna"},{"n":"burro","q":"100 gr","k":"burro"},{"n":"farina","q":"40 gr","k":"farina"}],"proc":["Prepara una polenta morbida cuocendo la farina di mais per quaranta minuti.","A parte scalda panna e formaggio a bagnomaria finché si scioglie.","Fai un burro fuso con la farina, che diventerà la salsa scura da versare sopra.","Versa la polenta nel piatto, fai un incavo e riempilo con la crema di formaggio.","Completa con il burro nocciola e la farina tostata."],"nota":"Braide è il prato: la polenta è il campo, il formaggio la pozza d’acqua. Il nome descrive il piatto.","luogo":"Friuli-Venezia Giulia","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":307,"n":"Muset e brovada","cat":"Secondi","tempo":150,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"cotechino","q":"800 gr","k":"cotechino"},{"n":"brovada","q":"1 kg","k":"brovada"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"alloro","q":"2 foglie","k":"alloro"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"}],"proc":["Bucherella il cotechino e lessalo in acqua per due ore a fuoco bassissimo.","Stufa la cipolla in olio, unisci la brovada scolata e sfuma col vino.","Cuoci quaranta minuti aggiungendo poca acqua.","Affetta il cotechino e servilo sulla brovada.","Lascia insaporire dieci minuti a fuoco spento."],"nota":"La brovada è rapa fermentata nella vinaccia: acida e inconfondibile, non ha equivalenti.","luogo":"Friuli-Venezia Giulia","estero":false,"all":["solfiti"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":308,"n":"Stoccafisso all’anconetana","cat":"Secondi","tempo":180,"diff":"media","tags":[],"ing":[{"n":"stoccafisso","q":"1 kg","k":"stoccafisso"},{"n":"patate","q":"800 gr","k":"patate"},{"n":"pomodorini","q":"400 gr","k":"pomodorini"},{"n":"carota","q":"2","k":"carota"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"vino bianco","q":"300 ml","k":"vino bianco"},{"n":"acciughe sott’olio","q":"4 filetti","k":"acciughe sott’olio"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"}],"proc":["Usa stoccafisso già ammollato, tagliato a pezzi grandi.","Fodera il fondo di una casseruola con verdure tritate e patate a fette.","Disponi lo stoccafisso e alterna altri strati di verdure e patate.","Bagna con vino, olio abbondante e acqua a filo, senza coprire del tutto.","Cuoci coperto a fuoco bassissimo per due ore e mezza, senza mai mescolare.","Scuoti la casseruola ogni tanto con movimento rotatorio."],"nota":"È il piatto presidio Slow Food di Ancona: si cuoce piano e non si tocca mai col cucchiaio.","luogo":"Marche","estero":false,"all":["pesce","sedano","solfiti"],"unico":false,"nvoci":9,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":309,"n":"Crescia sfogliata","cat":"Antipasti","tempo":60,"diff":"media","tags":[],"ing":[{"n":"farina","q":"500 gr","k":"farina"},{"n":"uova","q":"2","k":"uova"},{"n":"strutto","q":"120 gr","k":"strutto"},{"n":"acqua","q":"150 ml","k":"acqua"},{"n":"pepe nero","q":"1 cucchiaino","k":"pepe nero"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"}],"proc":["Impasta farina, uova, acqua, sale e pepe abbondante, e lascia riposare mezz’ora.","Stendi sfoglie sottilissime e spalmale di strutto.","Arrotola ogni sfoglia su sé stessa e poi a chiocciola, e riposa altri trenta minuti.","Stendi ogni chiocciola in un disco.","Cuoci su piastra rovente quattro minuti per lato."],"nota":"Lo strutto fra le sfoglie e il doppio riposo sono quello che crea gli strati.","luogo":"Marche","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":4,"minimo":true,"leggero":false,"att":["griglia o piastra"],"att_opz":[]},{"id":310,"n":"Imbrecciata umbra","cat":"Primi","tempo":90,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"lenticchie","q":"150 gr","k":"lenticchie"},{"n":"ceci","q":"150 gr","k":"ceci"},{"n":"fagioli","q":"150 gr","k":"fagioli"},{"n":"farro","q":"100 gr","k":"farro"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"carota","q":"1","k":"carota"},{"n":"passata di pomodoro","q":"150 gr","k":"passata di pomodoro"},{"n":"maggiorana","q":"1 ciuffo","k":"maggiorana"}],"proc":["Ammolla ceci e fagioli per una notte.","Fai il soffritto con cipolla, sedano e carota.","Unisci i legumi ammollati e la passata, copri d’acqua e cuoci un’ora.","Aggiungi le lenticchie e il farro e prosegui trentacinque minuti.","Servi con olio a crudo e maggiorana."],"nota":"Imbrecciata perché i legumi misti ricordano la breccia, il pietrisco delle strade.","luogo":"Umbria","estero":false,"all":["sedano"],"unico":true,"nvoci":9,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":311,"n":"Timballo teramano","cat":"Primi","tempo":150,"diff":"difficile","tags":[],"ing":[{"n":"farina","q":"200 gr","k":"farina"},{"n":"uova","q":"6","k":"uova"},{"n":"latte","q":"200 ml","k":"latte"},{"n":"carne macinata","q":"400 gr","k":"carne macinata"},{"n":"passata di pomodoro","q":"600 gr","k":"passata di pomodoro"},{"n":"scamorza","q":"250 gr","k":"scamorza"},{"n":"parmigiano","q":"120 gr","k":"parmigiano"},{"n":"spinaci","q":"300 gr","k":"spinaci"},{"n":"cipolla","q":"1","k":"cipolla"}],"proc":["Prepara crespelle sottili con farina, uova e latte.","Fai un ragù con cipolla, carne e passata, cuocendo un’ora.","Prepara polpettine minuscole con parte della carne e friggile.","Sbollenta gli spinaci e strizzali.","Alterna in teglia crespelle, ragù, polpettine, spinaci, scamorza e parmigiano.","Inforna a 180 gradi per quaranta minuti."],"nota":"Le crespelle al posto della pasta sono la firma teramana: si chiamano scrippelle.","luogo":"Abruzzo","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":9,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":312,"n":"Brodetto alla vastese","cat":"Primi","tempo":70,"diff":"media","tags":["senza forno"],"ing":[{"n":"filetto di pesce bianco","q":"600 gr","k":"filetto di pesce bianco"},{"n":"seppie","q":"300 gr","k":"seppie"},{"n":"gamberi","q":"300 gr","k":"gamberi"},{"n":"cozze","q":"500 gr","k":"cozze"},{"n":"pomodorini","q":"400 gr","k":"pomodorini"},{"n":"peperoncino fresco","q":"2","k":"peperoncino fresco"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"pane raffermo","q":"8 fette","k":"pane"}],"proc":["Usa una pentola di coccio, come vuole la tradizione.","Soffriggi aglio e peperoncino, unisci i pomodorini schiacciati e cuoci quindici minuti.","Adagia il pesce a strati partendo dal più duro: seppie, poi pesce, poi crostacei e molluschi.","Non mescolare mai: scuoti appena la pentola.","Cuoci venti minuti coperto e servi con pane abbrustolito."],"nota":"A Vasto non si usa cipolla e il pomodoro è fresco: è quello che lo distingue dagli altri brodetti.","luogo":"Abruzzo","estero":false,"all":["crostacei","glutine","molluschi","pesce"],"unico":false,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":313,"n":"Cavatelli con la ventricina","cat":"Primi","tempo":40,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"ventricina","q":"150 gr","k":"ventricina"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"pecorino romano","q":"80 gr","k":"pecorino romano"},{"n":"basilico","q":"1 ciuffo","k":"basilico"}],"proc":["Fai appassire la cipolla tritata in olio.","Unisci la ventricina a dadini e falla sciogliere in parte.","Aggiungi la passata e cuoci venti minuti: il sugo diventerà arancione e piccante.","Cuoci i cavatelli e saltali nel sugo.","Completa con pecorino e basilico."],"nota":"La ventricina di Montenero è grassa e piccante: bastano centocinquanta grammi per quattro persone.","luogo":"Molise","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":314,"n":"Calcioni molisani","cat":"Dolci","tempo":90,"diff":"media","tags":["vegetariano"],"ing":[{"n":"farina","q":"400 gr","k":"farina"},{"n":"uova","q":"3","k":"uova"},{"n":"olio extravergine","q":"60 ml","k":"olio extravergine"},{"n":"ricotta","q":"400 gr","k":"ricotta"},{"n":"zucchero","q":"120 gr","k":"zucchero"},{"n":"cannella","q":"1 cucchiaino","k":"cannella"},{"n":"scorza di limone","q":"2","k":"scorza di limone"}],"proc":["Impasta farina, uova, olio e un pizzico di sale, e fai riposare mezz’ora.","Lavora la ricotta con zucchero, cannella e scorza di limone.","Stendi la pasta sottile e ricava dischi.","Farcisci, chiudi a mezzaluna e sigilla con la forchetta.","Friggi in olio a 170 gradi, oppure inforna a 180 per venti minuti."],"nota":"Esistono anche salati, con formaggio e uova: la stessa pasta cambia destinazione.","luogo":"Molise","estero":false,"all":["glutine","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":315,"n":"Panna cotta","cat":"Dolci","tempo":30,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"panna","q":"500 ml","k":"panna"},{"n":"latte","q":"100 ml","k":"latte"},{"n":"zucchero","q":"100 gr","k":"zucchero"},{"n":"gelatina","q":"8 gr","k":"gelatina"},{"n":"vaniglia","q":"1 bacca","k":"vaniglia"}],"proc":["Ammolla la gelatina in acqua fredda per dieci minuti.","Scalda panna, latte, zucchero e vaniglia senza far bollire.","Spegni e unisci la gelatina strizzata, mescolando finché si scioglie.","Versa negli stampini e raffredda almeno quattro ore.","Sforma immergendo un istante lo stampo in acqua calda."],"nota":"Se bolle la panna prende sapore di cotto: si porta appena a filo di bollore.","luogo":"Piemonte","estero":false,"all":["latte"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":["stampini"],"att_opz":[]},{"id":316,"n":"Torta caprese","cat":"Dolci","tempo":70,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"mandorle","q":"300 gr","k":"mandorle"},{"n":"cioccolato fondente","q":"250 gr","k":"cioccolato fondente"},{"n":"burro","q":"250 gr","k":"burro"},{"n":"zucchero","q":"220 gr","k":"zucchero"},{"n":"uova","q":"5","k":"uova"},{"n":"zucchero a velo","q":"50 gr","k":"zucchero a velo"}],"proc":["Trita finemente le mandorle: nella caprese non c’è farina, sono loro a fare la struttura.","Sciogli il cioccolato a bagnomaria e lascialo intiepidire.","Monta burro e zucchero, unisci i tuorli uno alla volta.","Incorpora cioccolato e mandorle, poi gli albumi montati a neve.","Inforna a 170 gradi per quaranta minuti: deve restare umida al centro.","Spolvera di zucchero a velo da fredda."],"nota":"Nata per errore, dimenticando la farina. È senza glutine per caso, non per scelta.","luogo":"Campania","estero":false,"all":["frutta a guscio","latte","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":317,"n":"Torta della nonna","cat":"Dolci","tempo":90,"diff":"media","tags":["vegetariano"],"ing":[{"n":"farina","q":"350 gr","k":"farina"},{"n":"burro","q":"180 gr","k":"burro"},{"n":"zucchero","q":"150 gr","k":"zucchero"},{"n":"uova","q":"5","k":"uova"},{"n":"latte","q":"600 ml","k":"latte"},{"n":"pinoli","q":"80 gr","k":"pinoli"},{"n":"limone","q":"1","k":"limone"},{"n":"zucchero a velo","q":"40 gr","k":"zucchero a velo"}],"proc":["Prepara la frolla con farina, burro freddo, zucchero, un uovo e un tuorlo. Riposo un’ora.","Fai la crema pasticcera con tuorli, zucchero, farina e latte profumato al limone.","Fodera lo stampo con due terzi della frolla e versa la crema fredda.","Copri con il disco rimanente e sigilla i bordi.","Cospargi di pinoli e inforna a 180 gradi per quarantacinque minuti.","Spolvera di zucchero a velo da fredda."],"nota":"La crema deve essere fredda: calda ammolla la frolla e il fondo resta crudo.","luogo":"Toscana","estero":false,"all":["frutta a guscio","glutine","latte","uova"],"unico":false,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":318,"n":"Cantucci","cat":"Dolci","tempo":60,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"farina","q":"400 gr","k":"farina"},{"n":"zucchero","q":"250 gr","k":"zucchero"},{"n":"uova","q":"3","k":"uova"},{"n":"mandorle","q":" a","estero":false,"all":["glutine","pesce"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":337,"n":"Pasta cacio e uova","cat":"Primi","tempo":20,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"uova","q":"4","k":"uova"},{"n":"pecorino romano","q":"120 gr","k":"pecorino romano"}],"proc":["Sbatti le uova intere con il pecorino e molto pepe, fino a una crema densa.","Cuoci la pasta e scolala tenendo l’acqua.","Versala nella ciotola con l’uovo, fuori dal fuoco, mescolando velocemente.","Allunga con acqua di cottura fino alla consistenza giusta."],"nota":"È la carbonara prima della carbonara: senza guanciale, come si faceva in montagna.","luogo":"Lazio","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":338,"n":"Pasta con la ricotta","cat":"Primi","tempo":15,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"ricotta","q":"300 gr","k":"ricotta"},{"n":"pecorino romano","q":"60 gr","k":"pecorino romano"}],"proc":["Setaccia la ricotta in una ciotola capiente.","Stemperala con due mestoli di acqua di cottura calda, fino a una crema liscia.","Scola la pasta e versala nella ciotola.","Manteca con il pecorino e pepe abbondante."],"nota":"La ricotta si stempera prima con l’acqua: buttata tal quale sulla pasta resta a grumi.","luogo":"Lazio","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":339,"n":"Pasta olio e limone","cat":"Primi","tempo":15,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"limone","q":"3","k":"limone"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Grattugia la scorza di due limoni e spremi il succo di tutti e tre.","Emulsiona in una ciotola olio, succo, scorza, sale e pepe.","Scola la pasta oro e costa un terzo.","luogo":"Liguria","estero":false,"all":["frutta a guscio","glutine"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":345,"n":"Pasta al tonno bianco","cat":"Primi","tempo":20,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"tonno sott’olio","q":"200 gr","k":"tonno sott’olio"},{"n":"limone","q":"1","k":"limone"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Sgocciola il tonno tenendo un po’ del suo olio.","Scola la pasta e versala in una ciotola con il tonno sbriciolato.","Condisci con olio, succo e scorza di limone, sale e pepe.","Completa con prezzemolo tritato."],"nota":"Senza pomodoro il tonno si sente davvero: è il piatto da dispensa per eccellenza.","luogo":"Liguria","estero":false,"all":["glutine","pesce"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":346,"n":"Pasta aglio, olio e pangrattato","cat":"Primi","tempo":20,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"pangrattato","q":"80 gr","k":"pangrattato"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"}],"proc":["Tosta il pangrattato in padella a secco finché è dorato, poi tienilo da parte.","Scalda l’olio con aglio a lamelle e peperoncino a fuoco bassissimo.","Salta la pasta con un mestolo d’acqua di cottura.","Manteca e completa col pangrattato tostato."],"nota":"Variante della mollica quando il pane raffermo non c’è: stesso principio, meno rustico.","luogo":"Campania","estero":false,"all":["glutine"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":347,"n":"Pasta e uovo sbattuto","cat":"Primi","tempo":15,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"uova","q":"4","k":"uova"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"}],"proc" a","q":"1","k":"cipolla"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"brodo vegetale","q":"1,2 l","k":"brodo vegetale"}],"proc":["Stufa la cipolla tritata finissima in metà del burro.","Tosta il riso due minuti, finché i chicchi sono caldi al tatto.","Procedi col brodo bollente un mestolo per volta, per sedici minuti.","Spegni, aspetta un minuto e manteca con burro freddo e parmigiano, mescolando energicamente."],"nota":"Senza niente addosso, il risotto bianco è il modo migliore per giudicare la propria mantecatura.","luogo":"Lombardia","estero":false,"all":["latte"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":351,"n":"Riso al limone","cat":"Primi","tempo":25,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"limone","q":"2","k":"limone"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"}],"proc":["Cuoci il riso in acqua salata.","Scolalo e condiscilo con burro, scorza grattugiata e succo di un limone.","Manteca col parmigiano.","Completa con altra scorza a crudo."],"nota":"Il succo va messo poco per volta e assaggiando: il limite fra fresco e acido è sottile.","luogo":"Campania","estero":false,"all":["latte"],"unico":false,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":352,"n":"Riso e prezzemolo","cat":"Primi","tempo":20,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"prezzemolo","q":"2 ciuffi","k":"prezzemolo"},{"n":"aglio","q":"1 spicchio","k":"aglio"}],"proc":["Trita finissimo il prezzemolo con l’aglio.","Scalda l’olio e insaporisci il trito per trenta secondi, senza friggerlo.","Scola il riso e condiscilo con l’olio aromatizzato.","Aggiungi pepe abbondante."],"nota":"Trenta secondi e basta: il prezzemolo fritto diventa amaro.","luogo":"Veneto","estero":false,"all":[],"unico":false,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":353,"n":"Riso con uovo in camicia","cat":"Primi","tempo":25,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"uova","q":"4","k":"uova"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"aceto","q":"2 cucchiai","k":"aceto"}],"proc":["Cuoci il riso in acqua salata e condiscilo con olio e parmigiano.","Porta a sobbollire dell’acqua con l’aceto, senza far bollire forte.","Crea un vortice con un cucchiaio e sguscia dentro l’uovo.","Cuoci tre minuti e raccogli con la schiumarola.","Adagia l’uovo sul riso e apri il tuorlo al momento."],"nota":"L’aceto fa rapprendere l’albume in fretta: senza, si sfilaccia nell’acqua.","luogo":"Piemonte","estero":false,"all":["latte","solfiti","uova"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":354,"n":"Uova strapazzate","cat":"Secondi","tempo":10,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"uova","q":"6","k":"uova"},{"n":"burro","q":"40 gr","k":"burro"},{"n":"parmigiano","q":"50 gr","k":"parmigiano"}],"proc":["Sbatti appena le uova, lasciando visibili le venature del tuorlo.","Sciogli il burro in padella a fuoco bassissimo.","Versa le uova e mescola lentamente con una spatola, togliendo dal fuoco ogni tanto.","Spegni quando sono ancora umide: finiscono di cuocere nel piatto.","Sala e completa col parmigiano."],"nota":"Il fuoco bassissimo e il togliere dal fuoco sono tutto: le uova strapazzate si rovinano in trenta secondi.","luogo":"Francia","estero":true,"all":["latte","uova"],"unico":false,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":355,"n":"Uovo in cereghin","cat":"Secondi","tempo":10,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"uova","q":"4","k":"uova"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"parmigiano","q":"40 gr","k":"parmigiano"}],"proc":["Sciogli abbondante burro in padella a fuoco medio, finché comincia a spumeggiare.","S i e componi il piatto alternandoli alle arance.","Condisci con olio, sale, pepe nero e olive."],"nota":"L’acqua fredda rende il finocchio croccante e ne smorza l’anice: dieci minuti bastano.","luogo":"Sicilia","estero":false,"all":[],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":369,"n":"Fagioli con olio e cipolla","cat":"Contorni","tempo":20,"diff":"facile","tags":["vegetariano","vegano","senza cottura","senza forno"],"ing":[{"n":"fagioli","q":"500 gr","k":"fagioli"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Scola e sciacqua i fagioli già lessati.","Affetta la cipolla sottilissima e lasciala in acqua fredda dieci minuti.","Condisci i fagioli con olio abbondante, sale e pepe.","Unisci la cipolla scolata e il prezzemolo."],"nota":"L’ammollo della cipolla toglie l’aggressività senza toglierle il gusto.","luogo":"Toscana","estero":false,"all":[],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":370,"n":"Ceci con rosmarino","cat":"Contorni","tempo":20,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"ceci","q":"500 gr","k":"ceci"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Scalda l’olio con aglio in camicia e rosmarino a fuoco bassissimo per cinque minuti.","Togli aglio e rosmarino.","Unisci i ceci scolati e falli insaporire dieci minuti.","Schiacciane qualcuno per legare e servi con pepe."],"nota":"L’olio aromatizzato prima e poi i ceci: l’ordine cambia il risultato.","luogo":"Toscana","estero":false,"all":[],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":371,"n":"Cavolfiore lesso con limone","cat":"Contorni","tempo":25,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"cavolfiore","q":"1 kg","k":"cavolfiore"},{"n":"limone","q":"2","k":"limone"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":[" lse,"all":[],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":380,"n":"Pere al vino rosso","cat":"Dolci","tempo":50,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"pere","q":"6","k":"pere"},{"n":"vino rosso","q":"750 ml","k":"vino rosso"},{"n":"zucchero","q":"200 gr","k":"zucchero"},{"n":"cannella","q":"1 stecca","k":"cannella"}],"proc":["Sbuccia le pere lasciando il picciolo.","Mettile in piedi in una casseruola stretta con vino, zucchero e cannella.","Cuoci coperto quaranta minuti a fuoco dolce, girandole ogni tanto.","Togli le pere e fai ridurre il vino fino a uno sciroppo.","Servi le pere nappate con lo sciroppo."],"nota":"La casseruola deve essere stretta: se le pere non stanno in piedi coperte dal vino, si colorano a macchie.","luogo":"Piemonte","estero":false,"all":["solfiti"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":381,"n":"Crema di mascarpone","cat":"Dolci","tempo":15,"diff":"facile","tags":["vegetariano","senza cottura","senza forno"],"ing":[{"n":"mascarpone","q":"500 gr","k":"mascarpone"},{"n":"uova","q":"3","k":"uova"},{"n":"zucchero","q":"100 gr","k":"zucchero"}],"proc":["Monta i tuorli con lo zucchero fino a farli chiari e spumosi.","Unisci il mascarpone poco per volta, mescolando dal basso.","Monta gli albumi a neve ferma e incorporali delicatamente.","Raffredda almeno due ore prima di servire."],"nota":"È il tiramisù senza savoiardi e senza caffè: da solo, con qualche biscotto secco.","luogo":"Lombardia","estero":false,"all":["latte","uova"],"unico":false,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":382,"n":"Zabaione","cat":"Dolci","tempo":20,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"uova","q":"6","k":"uova"},{"n":"zucchero","q":"120 gr","k":"zucchero"},{"n":"marsala","q":"120 ml","k":"marsala"}],"proc":["Monta i tuorli con lo zucchero fino a farli chiari.","Unisci il marsala a filo.","Cuoci a bagnomaria mescolando con la frusta senza fermarti mai.","In dieci minuti il composto triplica e diventa spumoso: è pronto quando vela la frusta.","Servi caldo o freddo, con biscotti secchi."],"nota":"La regola antica è un tuorlo, un cucchiaio di zucchero e un guscio di marsala a testa.","luogo":"Piemonte","estero":false,"all":["uova"],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":383,"n":"Cioccolata calda densa","cat":"Dolci","tempo":15,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"latte","q":"500 ml","k":"latte"},{"n":"cioccolato fondente","q":"150 gr","k":"cioccolato fondente"},{"n":"amido di mais","q":"20 gr","k":"amido di mais"},{"n":"zucchero","q":"40 gr","k":"zucchero"}],"proc":["Stempera amido e zucchero in poco latte freddo.","Scalda il resto del latte e unisci il cioccolato tritato, mescolando.","Versa il composto di amido e cuoci mescolando finché si addensa.","Servi bollente, in tazze piccole."],"nota":"L’amido è quello che la rende densa da cucchiaino invece che da bere.","luogo":"Piemonte","estero":false,"all":["latte"],"unico":false,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":384,"n":"Macedonia","cat":"Dolci","tempo":20,"diff":"facile","tags":["vegetariano","vegano","senza cottura","senza forno"],"ing":[{"n":"mele","q":"2","k":"mele"},{"n":"arancia","q":"3","k":"arancia"},{"n":"limone","q":"1","k":"limone"},{"n":"zucchero","q":"3 cucchiai","k":"zucchero"}],"proc":["Spremi il succo delle arance e del limone in una ciotola.","Unisci lo zucchero e mescola finché si scioglie.","Taglia la frutta a cubetti regolari e uniscila subito al succo.","Riposa in frigorifero almeno due ore."],"nota":"Il succo di limone subito sulla frutta tagliata è quello che le impedisce di annerire.","luogo":"Italia","estero":false,"all":[],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":385,"n":"Torta sette vasetti","cat":"Dolci","tempo":60,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"yogurt","q":"125 gr","k":"yogurt"},{"n":"farina","q":"300 gr","k":"farina"},{"n":"zucchero","q":"250 gr","k":"zucchero"},{"n":"olio di semi","q":"125 ml","k":"olio di semi"},{"n":"uova","q":"3","k":"uova"},{"n":"lievito per dolci","q":"1 bustina","k":"lievito per dolci"}],"proc":["Usa il vasetto dello yogurt come misurino: due di farina, due di zucchero, uno di olio.","Sbatti le uova con lo zucchero, poi unisci yogurt e olio.","Incorpora farina e lievito setacciati.","Versa nello stampo e inforna a 180 gradi per quaranta minuti."],"nota":"Si fa senza bilancia, ed è il motivo per cui la sanno fare tutti.","luogo":"Italia","estero":false,"all":["glutine","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":386,"n":"Biscotti al burro","cat":"Dolci","tempo":45,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"farina","q":"300 gr","k":"farina"},{"n":"burro","q":"200 gr","k":"burro"},{"n":"zucchero","q":"100 gr","k":"zucchero"}],"proc":["Lavora il burro morbido con lo zucchero fino a una crema.","Unisci la farina e impasta velocemente, senza scaldare.","Forma un cilindro, avvolgilo nella pellicola e raffredda un’ora.","Affetta a mezzo centimetro e inforna a 170 gradi per quindici minuti."],"nota":"Tre ingredienti in proporzione tre, due, uno: farina, burro, zucchero. Non serve altro.","luogo":"Francia","estero":true,"all":["glutine","latte"],"unico":false,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":387,"n":"Crema al caffè","cat":"Dolci","tempo":20,"diff":"facile","tags":["vegetariano","senza cottura","senza forno"],"ing":[{"n":"panna","q":"400 ml","k":"panna"},{"n":"caffè","q":"150 ml","k":"caffè"},{"n":"zucchero","q":"100 gr","k":"zucchero"}],"proc":["Prepara il caffè e fallo raffreddare completamente.","Monta la panna ben fredda con lo zucchero.","Unisci il caffè freddo poco per volta, mescolando dal basso.","Raffredda in congelatore mezz’ora e servi in bicchierini."],"nota":"Il caffè deve essere freddo: tiepido smonta la panna in un istante.","luogo":"Campania","estero":false,"all":["latte"],"unico":false,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":388,"n":"Pane, burro e zucchero","cat":"Dolci","tempo":5,"diff":"facile","tags":["vegetariano","senza cottura","senza forno"],"ing":[{"n":"pane","q":"4 fette","k":"pane"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"zucchero","q":"4 cucchiai","k":"zucchero"}],"proc":["Taglia il pane a fette non troppo sottili.","Spalma il burro a temperatura ambiente, generosamente.","Cospargi di zucchero semolato, che deve restare in granelli.","Mangia subito."],"nota":"La merenda di tre generazioni. Il burro dev’essere morbido e lo zucchero non deve sciogliersi.","luogo":"Italia","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":389,"n":"Caesar salad","cat":"Antipasti","tempo":30,"diff":"facile","tags":[],"ing":[{"n":"lattuga romana","q":"2","k":"lattuga romana"},{"n":"pane raffermo","q":"200 gr","k":"pane"},{"n":"parmigiano","q":"120 gr","k":"parmigiano"},{"n":"acciughe sott’olio","q":"5 filetti","k":"acciughe sott’olio"},{"n":"uova","q":"2","k":"uova"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"limone","q":"1","k":"limone"},{"n":"senape","q":"1 cucchiaino","k":"senape"}],"proc":["Taglia il pane a cubi e tostalo in padella con olio e aglio, finché è dorato: sono i crostini.","Per la salsa frulla un tuorlo, le acciughe, l’aglio, la senape e il succo di limone.","Versa l’olio a filo continuando a frullare, fino a una crema densa.","Unisci metà del parmigiano grattugiato e regola con acqua se serve.","Condisci la lattuga tagliata a pezzi grossi, aggiungi i crostini e completa con scaglie di parmigiano."],"nota":"Nata a Tijuana nel 1924 con quello che restava in cucina a fine serata: pane vecchio, un uovo e qualche acciuga.","luogo":"Messico","estero":true,"all":["glutine","latte","pesce","senape","uova"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":390,"n":"Insalata di pollo","cat":"Secondi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"petto di pollo","q":"500 gr","k":"pollo"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"mele","q":"1","k":"mele"},{"n":"noci","q":"60 gr","k":"noci"},{"n":"yogurt","q":"150 gr","k":"yogurt"},{"n":"limone","q":"1","k":"limone"}],"proc":["Lessa il petto di pollo venti minuti in acqua con sedano e alloro, e lascialo raffreddare nel brodo.","Sfilaccialo a mano, non a coltello: assorbe meglio il condimento.","Taglia sedano e mela a cubetti, bagnando la mela col limone.","Condisci con yogurt, olio, sale e pepe.","Completa con noci tostate e tritate."],"nota":"Raffreddare il pollo nel suo brodo è quello che gli impedisce di diventare asciutto.","luogo":"Stati Uniti","estero":false,"all":["frutta a guscio","sedano"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":391,"n":"Insalata di ceci e tonno","cat":"Antipasti","tempo":15,"diff":"facile","tags":["senza cottura","senza forno"],"ing":[{"n":"ceci","q":"500 gr","k":"ceci"},{"n":"tonno sott’olio","q":"200 gr","k":"tonno sott’olio"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"limone","q":"1","k":"limone"}],"proc":["Scola e sciacqua i ceci sotto l’acqua corrente.","Affetta la cipolla sottilissima e lasciala dieci minuti in acqua fredda.","Unisci il tonno sgocciolato e sbriciolato.","Condisci con olio, limone, sale, pepe e prezzemolo.","Riposa mezz’ora prima di servire."],"nota":"Sciacquare i ceci in scatola toglie il liquido di governo, che è salato e sa di lattina.","luogo":"Italia","estero":false,"all":["pesce"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":392,"n":"Insalata di farro","cat":"Primi","tempo":40,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"farro","q":"300 gr","k":"farro"}, "k":"zucchine"},{"n":"prosciutto cotto","q":"100 gr","k":"prosciutto cotto"},{"n":"scamorza","q":"100 gr","k":"scamorza"}],"proc":["Raccogli le verdure cotte e i formaggi che hai in frigorifero.","Scolali bene: l’umidità è il nemico della torta salata.","Sbatti uova, panna e parmigiano.","Stendi la brisée, bucherella il fondo e distribuisci il ripieno.","Versa il composto e inforna a 180 gradi per trentacinque minuti."],"nota":"Regola generale: tre uova e centocinquanta millilitri di panna reggono circa quattrocento grammi di ripieno.","luogo":"Francia","estero":true,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":452,"n":"Pasta al forno di avanzi","cat":"Primi","tempo":50,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"pasta","q":"400 gr","k":"pasta"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"mozzarella","q":"200 gr","k":"mozzarella"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"pangrattato","q":"50 gr","k":"pangrattato"},{"n":"besciamella","q":"300 gr","k":"besciamella"}],"proc":["Usa pasta già condita avanzata, oppure lessala molto al dente.","Se è poca, allungala con un po’ di sugo e besciamella.","Disponi in teglia unta alternando con mozzarella e parmigiano.","Cospargi di pangrattato.","Inforna a 200 gradi per venticinque minuti."],"nota":"La pasta avanzata al forno viene meglio di quella fatta apposta: ha già assorbito il condimento.","luogo":"Italia","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":453,"n":"Pizza in teglia di recupero","cat":"Secondi","tempo":25,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"base pronta per pizza","q":"1 rotolo","k":"base pronta per pizza"},{"n":"passata di pomodoro","q":"200 gr","k":"passata di pomodoro"},{"n":"mozzarella","q":"200 gr","k":"mozzarella"},{"n":"origano","q":"1 cucchiaino","k":"origano"}],"proc":["Accendi il forno al massimo, 250 gradi se ci arriva, e lascialo salire almeno dieci minuti: la pizza si gioca tutta lì.","Stendi la base nella teglia con la sua carta, senza tirarla: se la forzi si ritira in cottura.","Condisci la passata con sale, un filo d’olio e l’origano, poi spalmala lasciando due dita di bordo libero.","Inforna nel ripiano più basso per 10 minuti: prima si asciuga il fondo, poi si aggiunge il formaggio.","Taglia la mozzarella a fette, strizzala nella carta da cucina, distribuiscila e rimetti in forno 5 minuti finché non fila."],"nota":"Il segreto è la mozzarella asciutta e messa in un secondo tempo: se entra bagnata all’inizio, la pizza esce molle.","luogo":"","estero":false,"all":["glutine","latte"],"unico":true,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":454,"n":"Pinsa con le verdure che avanzano","cat":"Secondi","tempo":25,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"base pronta per pinsa","q":"1","k":"base pronta per pinsa"},{"n":"zucchine","q":"2","k":"zucchine"},{"n":"peperoni","q":"1","k":"peperoni"},{"n":"mozzarella","q":"150 gr","k":"mozzarella"},{"n":"basilico","q":"qualche foglia","k":"basilico"}],"proc":["Taglia a striscioline le verdure avanzate, anche già cotte: qui ci sta tutto quello che è rimasto in frigo.","Se sono crude, saltale in padella cinque minuti a fuoco vivo con poco olio e sale, perché sulla pinsa non hanno il tempo di cuocere.","Scalda il forno a 240 gradi e fai una prima cottura della base da sola, 6 o 7 minuti, finché non è rigida al tatto.","Distribuisci mozzarella e verdure e riporta in forno altri 5 minuti.","Fuori dal forno, basilico spezzato a mano e un giro d’olio a crudo."],"nota":"La pinsa vuole due cotture: prima la base da sola, poi con il condimento. È quello che la tiene croccante sotto.","luogo":"","estero":false,"all":["glutine","latte"],"unico":true,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":455,"n":"Pizza bianca con patate e rosmarino","cat":"Antipasti","tempo":30,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"base pronta per pizza","q":"1 rotolo","k":"base pronta per pizza"},{"n":"patate","q":"2 medie","k":"patate"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"}],"proc":["Affetta le patate sottilissime, meglio con la mandolina, e tienile dieci minuti in acqua fredda per togliere l’amido.","Asciugale bene e condiscile in una ciotola con olio, sale e gli aghi di rosmarino tritati.","Stendi la base in teglia e disponi le fette a squame, sovrapposte appena, senza lasciare buchi.","Inforna a 230 gradi per 20 minuti, finché i bordi delle patate non si scuriscono.","Ancora calda, un altro filo d’olio e sale grosso schiacciato fra le dita."],"nota":"Senza il passaggio in acqua fredda le patate restano gommose invece di farsi croccanti ai bordi.","luogo":"","estero":false,"all":["glutine"],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":456,"n":"Calzone di recupero al forno","cat":"Secondi","tempo":30,"diff":"facile","tags":[],"ing":[{"n":"base pronta per pizza","q":"1 rotolo","k":"base pronta per pizza"},{"n":"prosciutto cotto","q":"100 gr","k":"prosciutto cotto"},{"n":"mozzarella","q":"150 gr","k":"mozzarella"},{"n":"passata di pomodoro","q":"100 gr","k":"passata di pomodoro"}],"proc":["Scola bene la mozzarella e tagliala a dadini piccoli: dentro al calzone l’acqua non ha dove andare.","Stendi la base e condisci solo metà del disco, lasciando un bordo di due dita tutto intorno.","Metti la passata, il prosciutto a pezzi e la mozzarella, senza esagerare: un calzone troppo pieno si apre in forno.","Chiudi a mezzaluna, sigilla il bordo premendo con i rebbi della forchetta e fai due tagli sopra per lo sfiato.","Inforna a 230 gradi per 18 minuti, finché non è gonfio e dorato."],"nota":"I due tagli sopra non sono un vezzo: sono lo sfogo del vapore, senza i quali il calzone si spacca da un lato.","luogo":"","estero":false,"all":["glutine","latte"],"unico":true,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":457,"n":"Pinsa con mortadella e ricotta","cat":"Antipasti","tempo":20,"diff":"facile","tags":[],"ing":[{"n":"base pronta per pinsa","q":"1","k":"base pronta per pinsa"},{"n":"mortadella","q":"100 gr","k":"mortadella"},{"n":"ricotta","q":"150 gr","k":"ricotta"}],"proc":["Lavora la ricotta con una forchetta insieme a un pizzico di sale e un cucchiaio d’olio, finché non diventa una crema liscia.","Cuoci la base da sola a 240 gradi per 8 minuti, senza niente sopra.","Falla intiepidire un paio di minuti: sulla base bollente la ricotta si scalda e diventa granulosa.","Spalma la crema, adagia la mortadella a nastri arricciati e servi subito."],"nota":"Questa non torna mai in forno: la mortadella cotta perde il profumo e diventa una cosa diversa.","luogo":"","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":3,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":458,"n":"Pizza del frigo vuoto","cat":"Secondi","tempo":25,"diff":"facile","tags":[],"ing":[{"n":"base pronta per pizza","q":"1 rotolo","k":"base pronta per pizza"},{"n":"passata di pomodoro","q":"150 gr","k":"passata di pomodoro"},{"n":"acciughe sott’olio","q":"6 filetti","k":"acciughe sott’olio"},{"n":"olive","q":"1 manciata","k":"olive"},{"n":"capperi","q":"1 cucchiaio","k":"capperi"},{"n":"origano","q":"1 cucchiaino","k":"origano"}],"proc":["Sciacqua i capperi sotto l’acqua corrente e asciugali, altrimenti portano dentro tutto il loro sale.","Condisci la passata con origano, olio e pochissimo sale: fra acciughe, olive e capperi la sapidità arriva da sola.","Stendi la base in teglia, spalma il pomodoro e distribuisci olive e capperi.","Inforna a 250 gradi per 12 minuti nel ripiano basso.","Le acciughe si mettono negli ultimi due minuti, o addirittura a forno spento: cotte a lungo diventano amare."],"nota":"È la pizza che si fa quando in casa non c’è più niente di fresco: sono tutte cose che stanno in dispensa per mesi.","luogo":"","estero":false,"all":["  semi rendono amaro.","tonno in scatola":"Sgocciola senza strizzare. Tieni un cucchiaio del suo olio per il condimento.","sardine in scatola":"Togli la lisca centrale se c’è, si sfila con le dita.","vongole in scatola":"Il loro liquido è prezioso: filtralo e usalo al posto del sale.","carciofini sott’olio":"Scolali e falli asciugare un minuto in padella, per togliere l’unto.","funghi sott’olio":"Asciugali su carta: sono già conditi, servono poco olio e niente sale.","peperoni sott’aceto":"Asciugali bene, o l’aceto squilibra tutto il piatto.","olive in barattolo":"Se sono molto salate, sciacquale e tienile dieci minuti in acqua fredda.","polpa di pomodoro":"Più densa della passata: se la ricetta chiede pomodori freschi, allunga con poca acqua."},"note_surgelati":{"piselli surgelati":"Buttali in cottura senza scongelarli: restano verdi e sodi.","spinaci surgelati":"Scongelali e strizzali con forza, o rilasciano acqua nel piatto.","fagiolini surgelati":"Direttamente in acqua bollente, un minuto in meno del fresco.","broccoli surgelati":"Direttamente in padella o in acqua: già sbollentati in origine.","carciofi surgelati":"Non scongelare: passali subito in padella a fuoco vivo.","zucca surgelata":"Cuocila da congelata, ma aspettati più acqua: alza la fiamma.","mais surgelato":"Direttamente in cottura.","funghi surgelati":"Mai scongelare: in padella rovente, o diventano spugne.","gamberi surgelati":"Scongela lentamente in frigorifero, mai sotto l’acqua calda.","cozze surgelate":"Di solito sono già cotte e sgusciate: aggiungile alla fine.","vongole surgelate":"Già spurgate: saltano il passaggio dell’ammollo.","polpo surgelato":"Il congelamento lo intenerisce: è un vantaggio, non un ripiego.","salmone surgelato":"Scongela in frigorifero e asciugalo bene prima di cuocerlo.","filetto di pesce surgelato":"Scongela in frigorifero e tampona: l’acqua impedisce la doratura.","pane congelato":"Tostalo da congelato: per la pappa al pomodoro va benissimo.","gnocchi surgelati":"In acqua bollente senza scongelare, raccoglili appena a galla.","pasta sfoglia surgelata":"Scongela in frigorifero, non a temperatura ambiente.","pasta brisée surgelata":"Scongela in frigorifero e stendila ancora fredda."},"sostituzioni":{"panna":"Latte intero con una noce di burro, oppure ricotta stemperata con poco latte.","mascarpone":"Ricotta setacciata montata con un cucchiaio di zucchero.","pecorino romano":"Parmigiano, sapendo che il piatto verrà più dolce e meno sapido.","parmigiano":"Pecorino o grana, riducendo un po’ il sale della ricetta.","guanciale":"Pancetta affumicata, o in mancanza pancetta dolce.","pancetta":"Guanciale, speck o prosciutto crudo a dadini.","pomodorini":"Pomodori maturi a cubetti, oppure passata allungata con poca acqua.","passata di pomodoro":"Pelati frullati o concentrato diluito in acqua calda.","vino bianco":"Un cucchiaio d’aceto in mezzo bicchiere d’acqua.","vino rosso":"Brodo con un cucchiaino d’aceto.","brodo vegetale":"Acqua calda con mezzo dado, o semplicemente acqua di cottura delle verdure.","pinoli":"Mandorle pelate o noci, tostate un momento in padella.","pane raffermo":"Pangrattato, riducendo la quantità di un terzo.","pangrattato":"Pane raffermo grattugiato, o cracker tritati.","burro":"Olio extravergine, usandone un quinto in meno.","limone":"Aceto bianco, in quantità dimezzata.","peperoncino secco":"Pepe nero abbondante, o una punta di paprica piccante.","prezzemolo":"Basilico se il piatto è di pomodoro, erba cipollina se è di uova.","basilico":"Prezzemolo, oppure basilico secco a un terzo della dose.","mozzarella":"Scamorza, provola o fontina, che filano allo stesso modo.","ricotta salata":"Pecorino stagionato grattugiato.","olive":"Capperi dissalati, in quantità molto minore.","capperi":"Olive tritate, oppure un cucchiaio di salamoia.","lenticchie":"Ceci o fagioli, allungando la cottura.","ceci":"Fagioli cannellini, con qualche minuto in meno.","gnocchi di patate":"Pasta corta, con la stessa quantità di sugo.","savoiardi iata.","fave":"Piselli freschi, sapendo che sono più dolci.","fave secche":"Ceci secchi ammollati, con un purè meno vellutato.","coniglio":"Pollo, riducendo i tempi di una ventina di minuti.","pesce spada":"Tonno fresco o salmone a tranci.","seppie":"Calamari, con cottura più breve.","fregola":"Riso o cous cous a grana grossa.","pane carasau":"Pane raffermo sottile tostato, o sfoglie di lasagna sbollentate.","farina di ceci":"Non ha sostituti: senza, farinata e panelle non esistono.","grano cotto":"Riso lessato molto morbido, o orzo perlato.","alchermes":"Rum diluito con acqua e un cucchiaino di zucchero.","rum":"Brandy, o succo d’arancia se non vuoi alcol.","amaretti":"Biscotti secchi con una goccia di estratto di mandorla.","amarene":"Ciliegie sciroppate o marmellata di ciliegie.","olio di semi":"Olio extravergine leggero, o burro fuso nei dolci.","zucchero a velo":"Zucchero semolato frullato finissimo.","acqua di fiori d’arancio":"Scorza d’arancia grattugiata, che dà meno profumo ma più freschezza.","crauti":"Verza affettata sottile e stufata con aceto.","lardo":"Pancetta o strutto.","sgombro":"Tonno in scatola, con un gusto più delicato.","stoccafisso":"Baccalà dissalato, sapendo che la consistenza è più tenera e il gusto meno intenso.","calamari":"Seppie o totani, con cottura leggermente più lunga.","orata":"Branzino, dentice o qualunque pesce bianco intero.","branzino":"Orata, o un altro pesce bianco di pari peso.","cavolfiore":"Broccoli, con qualche minuto in meno di cottura.","rucola":"Valeriana o spinacino, meno pepati.","caciocavallo":"Provolone stagionato o pecorino semi-stagionato.","provola":"Scamorza o mozzarella ben scolata.","provolone":"Caciocavallo o pecorino semi-stagionato.","farro":"Orzo perlato, con dieci minuti in più.","orzo perlato":"Farro perlato o riso integrale.","amido di mais":"Fecola di patate, in pari peso.","fecola":"Amido di mais, in pari peso.","gelatina":"Agar agar, un terzo del peso, portato a bollore.","brandy":"Rum, o vino bian <script>

const BASE       = new Set(D.base);                  // acqua, olio, pepe, sale

const REGIONI    = Object.keys(D.regioni);

const CARNE = new Set(CAT_DISP["Carne e salumi"] || []);
const PESCE = new Set(CAT_DISP["Pesce"] || []);
const LATT  = new Set(CAT_DISP["Latticini e uova"] || []);
const DEPERIBILI = ["Verdure e ortaggi","Carne e salumi","Pesce","Latticini e uova","Surgelati e congelati"];

/* un surgelato o una conserva valgono l'ingrediente fresco corrispondente */
const EQUIV = {};
[D.surgelati, D.conserve].forEach(m=>{
  for(const [dispensa, fresco] of Object.entries(m||{})){
    (EQUIV[fresco] = EQUIV[fresco] || []).push(dispensa);
  }
});

/* lo stile si ricalcola dagli ingredienti: i tag dell'archivio hanno qualche svista */
const RANGO = {onnivoro:0, vegetariano:1, vegano:2};
function preparaRicetta(r){
  r.tags = r.tags || [];
  const k = r.ing.map(i=>i.k);
  const carne = k.some(x=>CARNE.has(x) || PESCE.has(x));
  const anim  = carne || k.some(x=>LATT.has(x)) || k.includes("miele");
  r.vgn = r.tags.includes("vegano") && !anim;
  r.vgt = (r.vgn || r.tags.includes("vegetariano")) && !carne;
  r.stile = r.vgn ? "vegano" : r.vgt ? "vegetariano" : "onnivoro";
  r._txt = null; r._n = null;
  return r;
}
D.ricette.forEach(preparaRicetta);

/* quali allergeni porta ogni ingrediente: lo deduco dall'archivio stesso */
const ALL_DI = (()=>{
  const tot = {}, con = {};
  D.ricette.forEach(r=>r.ing.forEach(i=>{
    tot[i.k] = (tot[i.k]||0) + 1;
    con[i.k] = con[i.k] || {};
    r.all.forEach(a=>{ con[i.k][a] = (con[i.k][a]||0) + 1; });
  }));
  const out = {};
  for(const k in tot) out[k] = Object.keys(con[k]).filter(a=>con[k][a] / tot[k] > 0.85);
  return out;
})();

});

function carica(){
  try{ const g = localStorage.getItem("checucino.v3");

  return tavolata().reduce((m,c)=> RANGO[c.stile] > RANGO[m] ? c.stile : m, "onnivoro");
}
function possiedo(k){
  if(S.baseSempre && BASE.has(k)) return true;
  if(S.dispensa.includes(k)) return true;
  return (EQUIV[k]||[]).some(x=>S.dispensa.includes(x));

  return (D.sost_k[k]||[]).find(alt=>possiedo(alt)) || null;

    if(possiedo(i.k)) return;
    const alt = sostituto(i.k);
    alt ? sostituibili.push([i.k, alt]) : mancanti.push(i.n);
  });
  const n = r.ing.length;
  const ho = n - mancanti.length - sostituibili.length;
  return {mancanti, sostituibili,
          pieno: Math.round(ho/n*100),
          sost: Math.round(sostituibili.length/n*100),
          pct: Math.round((ho + sostituibili.length*0.6)/n*100)};
}
function diStagione(r){
  const st = r.ing.map(i=>D.stagioni[i.k]).filter(Boolean);
  return st.length >= 2 && st.every(m=>m.includes(MESE));
}
function chiEsclude(r){
  return tavolata().filter(c=> RANGO[r.stile] < RANGO[c.stile] || c.allergeni.some(a=>r.all.includes(a)));
}
/* ricerca: senza accenti, su nome, ingredienti, regione e tag */
const normTesto = x => String(x||"").toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function testoRicetta(r){
  if(!r._txt) r._txt = normTesto(r.n + " " + r.ing.map(i=>i.n + " " + i.k).join(" ")
                                 + " " + (r.luogo||"") + " " + (r.tags||[]).join(" "));
  return r._txt;
}
function nomeRicetta(r){
  if(!r._n) r._n = normTesto(r.n);
  return r._n;
}

function filtra(){
  const evita = (S.profilo.evita||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);
  const alg = allergeniTavolo();
  const lim = +sess.tempo;

  const parole = sess.modo === "idea" ? normTesto(sess.cerca).split(" ").filter(Boolean) : [];

  let out = archivio().filter(r=>{
    if(S.nascoste.includes(r.id)) return false;
    if(soloPref && !S.preferite.includes(r.id)) return false;
    if(alg.some(a=>r.all.includes(a))) return false;
    if(evita.some(v=>r.ing.some(i=>i.k.includes(v)))) return false;
    if(sess.accordo === "unico" && RANGO[r.stile] < RANGO[sess.stile]) return false;

    /* se hai scritto il nome del piatto, tempo e portata non te lo nascondono */
    let perNome = false;
    if(parole.length){
      const t = testoRicetta(r);
      if(!parole.every(w=>t.includes(w))) return false;
      perNome = parole.every(w=>nomeRicetta(r).includes(w));
    }
    if(!perNome){
      if(sess.portate.length && !sess.portate.includes(r.cat)) return false;
      if(sess.unico && !r.unico) return false;
      if(r.tempo > lim) return false;
    }
    if(sess.modo === "recupero" && sess.recupero.length){
      if(!sess.recupero.some(k=>r.ing.some(i=>i.k===k || (EQUIV[i.k]||[]).includes(k)))) return false;
    }
    return true;
  }).map(r=>{
    const v = valuta(r);
    v.r = r;
    v.zona = S.profilo.regione && r.luogo === S.profilo.regione;
    v.stag = diStagione(r);
    v.pref = S.preferite.includes(r.id);
    const q = S.cucinate[r.id];
    v.fatta = q ? (Date.now() - q) < GIORNI_RIPOSO*86400000 : false;
    if(sess.modo === "recupero") v.usa = sess.recupero.filter(k=>r.ing.some(i=>i.k===k || (EQUIV[i.k]||[]).includes(k)));
    return v;
  });

  /* quelle cucinate da poco scendono in fondo: e' cosi che l'archivio non si riduce a otto piatti */
  out.sort((a,b)=> (a.fatta?1:0)-(b.fatta?1:0) || b.pct - a.pct || (b.zona?1:0)-(a.zona?1:0)
                   || (b.stag?1:0)-(a.stag?1:0) || a.r.tempo - b.r.tempo);
  return out;
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pulito = s => esc(String(s).replace(/<[^>]*>/g,""));

function vai(n){ passo = n; window.scrollTo({top:0}); disegna(); }
function disegna(){
  rail.innerHTML = TAPPE.map((t,i)=>`<div data-p="${i}" class="${i<passo?"fatto":""}${i===passo?"ora":""}"><i></i>${t}</div>`).join("");

  [tappaProfilo, tappaOspiti, tappaDispensa, tappaVoglia, tappaRicette][passo]();

function pulsanti(indietro, avanti, fnAvanti, fnIndietro){
  barra.innerHTML = "";

  if(avanti){ const a=document.createElement("button"); a.className="btn"; a.textContent=avanti; a.onclick=fnAvanti; barra.append(a); }
}

          : "Segna quello che hai in casa. Resta memorizzato: la prossima volta correggi solo quello che cambia."}</p></div>
  <div class="card">

      <button class="chip ${S.baseSempre?"on":""}" id="swBase">${S.baseSempre?"sempre in casa":"da segnare"}</button></div>
    <div class="mini" style="margin-top:14px">Non lo trovi?</div>
    <div class="riga-add" style="margin-top:6px">

      <button class="btn small" id="ingAdd">Aggiungi</button>
    </div>
    <label class="campo" style="margin-top:8px"><span>Reparto</span>
      <select id="ingCat">${Object.keys(CAT_DISP).map(c=>`<option>${c}</option>`).join("")}</select></label>
    <p class="mini" id="ingEsito" aria-live="polite"></p>
    <p class="mini">Tieni premuto un ingrediente per spostarlo di reparto o toglierlo dall'elenco.</p>
    ${S.ingTolti.length?`<button class="btn ghost small" id="ingRip" style="margin-top:6px">Rimetti i ${S.ingTolti.length} ingredienti tolti</button>`:""}
    ${top.length?`<div class="mini" style="margin-top:14px">Scorciatoia</div>
      <button class="btn ghost small" id="topFill" style="margin-top:6px">Segna i 25 ingredienti più usati dall'archivio</button>`:""}
  </div>
  ${Object.entries(CAT_DISP).map(([tit,lista])=>{
    const vis = lista.filter(i=>!q || i.includes(q));
    if(!vis.length) return "";
    const presi = lista.filter(i=>S.dispensa.includes(i)).length;
    return `<details class="gruppo" ${q||presi?"open":""}>
      <summary>${tit} <em>${presi?presi+" segnati":lista.length+" voci"}</em></summary>
      <div class="corpo"><div class="chips">
        ${vis.map(i=>`<button class="chip ${S.dispensa.includes(i)?"on":""}" data-i="${esc(i)}">${i}</button>`).join("")}
      </div></div></details>`;
  }).join("")}`;

  const c = document.getElementById("cerca");
  c.oninput = e=>{ cercaDisp = e.target.value; const pos=e.target.selectionStart;
    tappaDispensa(); const n2=document.getElementById("cerca"); n2.focus(); n2.setSelectionRange(pos,pos); };
  document.getElementById("swBase").onclick=()=>{ S.baseSempre=!S.baseSempre; salva(); tappaDispensa(); };
  const ingN = document.getElementById("ingNuovo"), ingC = document.getElementById("ingCat");
  ingN.oninput = ()=>{ const g = indovinaCat(ingN.value); if(g) ingC.value = g; };
  const rip = document.getElementById("ingRip");
  if(rip) rip.onclick = ()=>{ rimettiTolti(); tappaDispensa(); };
  document.getElementById("ingAdd").onclick = ()=>{
    const nome = ingN.value.trim();
    if(!nome) return;
    const k = aggiungiIngrediente(nome, ingC.value);
    if(k && !S.dispensa.includes(k)) S.dispensa.push(k);
    S.dispensaData = new Date().toLocaleDateString("it-IT");
    salva();
    cercaDisp = "";
    tappaDispensa();
    const es = document.getElementById("ingEsito");
    if(es) es.textContent = "Aggiunto «" + k + "» e già segnato in dispensa.";
  };
  const tf = document.getElementById("topFill");
  if(tf) tf.onclick=()=>{ top.forEach(k=>{ if(!S.dispensa.includes(k)) S.dispensa.push(k); });
    S.dispensaData = new Date().toLocaleDateString("it-IT"); salva(); tappaDispensa(); };
  /* tocco breve: segno o tolgo dalla dispensa. Tocco lungo: sposta o togli dall'elenco */
  app.querySelectorAll("[data-i]").forEach(b=>{
    let attesa = null, lungo = false;
    const ferma = ()=>{ clearTimeout(attesa); attesa = null; };
    const parti = ()=>{
      lungo = false;
      ferma();
      attesa = setTimeout(()=>{
        lungo = true;
        try{ navigator.vibrate && navigator.vibrate(30); }catch(err){}
        apriIngOpz(b.dataset.i);
      }, 500);
    };
    b.addEventListener("touchstart", parti, {passive:true});
    ["touchend","touchmove","touchcancel","mouseup","mouseleave"].forEach(ev=>b.addEventListener(ev, ferma));
    b.addEventListener("mousedown", parti);
    b.addEventListener("contextmenu", ev=>{ ev.preventDefault(); ferma(); apriIngOpz(b.dataset.i); });
    b.onclick = ()=>{
      if(lungo){ lungo = false; return; }

      b.classList.toggle("on");
