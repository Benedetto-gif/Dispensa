<style>
:root{
  --tono:15;                                   /* 0 = luce piena, 100 = notte */
  color-scheme:light;
  --carta:          hsl(80 19% calc(94% - var(--tono) * 0.87%));
  --superficie:     hsl(100 12% calc(100% - var(--tono) * 0.88%));
  --superficie2:    hsl(90 17% calc(90% - var(--tono) * 0.74%));
  --inchiostro:     hsl(120 19% calc(13% + var(--tono) * 0.79%));
  --inchiostro-soft:hsl(120 7% calc(36% + var(--tono) * 0.29%));
  --linea:          hsl(95 16% calc(81% - var(--tono) * 0.59%));
  --verde:          hsl(134 27% calc(33% + var(--tono) * 0.33%));
  --verde-chiaro:   hsl(128 20% calc(91% - var(--tono) * 0.75%));
  --senape:         hsl(33 63% calc(44% + var(--tono) * 0.17%));
  --mattone:        hsl(9 60% calc(40% + var(--tono) * 0.26%));
  --ombra:0 1px 0 hsl(150 17% 13% / calc(0.06 - var(--tono) * 0.0006));
  --r:14px;
}
:root[data-scuro]{ color-scheme:dark; }
*{box-sizing:border-box}

/* cursore chiaro/scuro */
.tono{display:flex;align-items:center;gap:5px;flex:none;
  padding:3px 7px;border-radius:999px;background:var(--superficie);border:1px solid var(--linea)}
.tono svg{width:15px;height:15px;flex:none;color:var(--inchiostro-soft)}
.tono input[type=range]{-webkit-appearance:none;appearance:none;width:64px;height:6px;margin:0;
  border-radius:999px;border:1px solid var(--linea);
  background:linear-gradient(90deg,hsl(80 19% 94%),hsl(80 19% 7%))}
.tono input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--senape);border:2px solid var(--superficie);cursor:pointer}
.tono input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;
  background:var(--senape);border:2px solid var(--superficie);cursor:pointer}
.tono input[type=range]:focus-visible{outline:2px solid var(--verde);outline-offset:3px}

/* pannelli a tutto schermo: cucina, spesa, fine ricetta */
.velo{position:fixed;inset:0;z-index:60;background:var(--carta);overflow-y:auto;
  padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.velo-in{max-width:620px;margin:0 auto}
.velo-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.velo-top h2{flex:1;font-size:1.3rem}
.chiudi{flex:none;background:var(--superficie);border:1px solid var(--linea);border-radius:10px;
  padding:7px 12px;cursor:pointer;font-size:.88rem;color:inherit}
.passo-n{font-size:.76rem;color:var(--inchiostro-soft);letter-spacing:.03em;margin-top:14px}
.passo-g{font-size:1.3rem;line-height:1.5;margin:8px 0 18px;max-width:34ch}
.timer{display:flex;align-items:center;gap:12px;margin:16px 0;padding:12px 14px;
  border:1px solid var(--linea);border-radius:12px;background:var(--superficie)}
.timer b{flex:1;font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700}
.timer.suona{border-color:var(--verde);background:var(--verde-chiaro);color:var(--verde)}
.dosi{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--inchiostro-soft);margin:0 0 10px}
.dosi button{width:30px;height:30px;border-radius:8px;border:1px solid var(--linea);
  background:var(--carta);color:inherit;font-size:1.1rem;line-height:1;cursor:pointer}
.dosi b{color:var(--inchiostro);font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center}
.azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.spesa-l{list-style:none;margin:10px 0 0;padding:0}
.spesa-l li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--linea)}
.spesa-l li:last-child{border-bottom:0}
.spesa-l span{flex:1}
.spesa-l li.presa span{text-decoration:line-through;color:var(--inchiostro-soft)}
.spesa-l input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--verde)}
.riga-add{display:flex;gap:8px;margin-top:12px}
.riga-add input{flex:1}
.tag.fatta{background:var(--superficie2);color:var(--inchiostro-soft);font-weight:700}
.tag.pref{background:color-mix(in srgb,var(--senape) 16%,transparent);color:var(--senape);font-weight:700}

/* radio */
.radio-btn{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:26;
  width:48px;height:48px;border-radius:50%;border:1px solid var(--linea);background:var(--superficie);
  color:var(--verde);font-size:1.5rem;line-height:1;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.18)}
.radio-btn.suona{background:var(--verde);color:var(--carta);border-color:var(--verde)}
.radio-pan{position:fixed;right:16px;bottom:calc(146px + env(safe-area-inset-bottom));z-index:27;
  width:min(250px,calc(100vw - 32px));background:var(--superficie);border:1px solid var(--linea);
  border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden}
.radio-pan .sez{padding:9px 14px 5px;font-size:.72rem;color:var(--inchiostro-soft);
  border-bottom:1px solid var(--linea)}
.radio-pan button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;
  padding:11px 14px;border-bottom:1px solid var(--linea);font-size:.93rem;cursor:pointer}
.radio-pan button:last-child{border-bottom:0}
.radio-pan button:hover{background:var(--superficie2)}
.radio-pan button.on{background:var(--verde-chiaro);color:var(--verde);font-weight:700}
.radio-pan button.spegni{color:var(--mattone)}
.radio-pan .stato{padding:10px 14px;font-size:.78rem;color:var(--inchiostro-soft);
  border-bottom:1px solid var(--linea)}

/* schermata d'apertura */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;gap:16px;
  background:linear-gradient(180deg,#2E5B43,#1C3A2B);transition:opacity .45s ease}
#splash.via{opacity:0;pointer-events:none}
#splash svg{width:min(44vw,180px);height:auto}
#splash .nome{font-family:Newsreader,Georgia,serif;font-size:clamp(1.7rem,7.5vw,2.4rem);
  font-weight:600;letter-spacing:-.01em;line-height:1.1;text-align:center;color:#F0DFB8;
  opacity:0;animation:sp-nome .5s ease .75s forwards}
#splash .pentola{opacity:0;animation:sp-pentola .5s ease .1s forwards}
#splash .vapore{stroke-dasharray:300;stroke-dashoffset:300;
  animation:sp-vapore .95s cubic-bezier(.4,0,.2,1) .35s forwards}
#splash .punto{opacity:0;transform-box:fill-box;transform-origin:center;animation:sp-punto .3s ease 1.15s forwards}
@keyframes sp-pentola{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-vapore{to{stroke-dashoffset:0}}
@keyframes sp-punto{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes sp-nome{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none !important;opacity:1 !important;stroke-dashoffset:0 !important}
}

uti il pane è già molle.","luogo":"Toscana","estero":false,"all":["glutine"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":["griglia o piastra"],"att_opz":[]},{"id":50,"n":"Polpette di melanzane","cat":"Secondi","tempo":50,"diff":"media","tags":["vegetariano"],"ing":[{"n":"melanzane","q":"800 gr","k":"melanzane"},{"n":"pane raffermo","q":"100 gr","k":"pane"},{"n":"uova","q":"2","k":"uova"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"aglio","q":"1 spicchio","k":"aglio"},{"n":"basilico","q":"1 ciuffo","k":"basilico"},{"n":"pangrattato","q":"100 gr","k":"pangrattato"}],"proc":["Lessa o cuoci al forno le melanzane finché sono morbidissime, poi strizzale bene.","Tritale e uniscile al pane ammollato e strizzato, uova, parmigiano, aglio e basilico.","Regola la consistenza col pangrattato: l’impasto deve stare in mano.","Forma le polpette e friggile in olio caldo, oppure infornale a 200 gradi per 25 minuti.","Servi calde o tiepide, da sole o al sugo."],"nota":"Strizzare le melanzane è il passaggio che quasi tutti saltano, ed è il motivo per cui le polpette si sfaldano.","luogo":"Sicilia","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":51,"n":"Tiramisù","cat":"Dolci","tempo":30,"diff":"facile","tags":["vegetariano","senza forno","senza cottura"],"ing":[{"n":"savoiardi","q":"300 gr","k":"savoiardi"},{"n":"mascarpone","q":"500 gr","k":"mascarpone"},{"n":"uova","q":"4","k":"uova"},{"n":"zucchero","q":"100 gr","k":"zucchero"},{"n":"caffè","q":"300 ml","k":"caffè"},{"n":"cacao","q":"2 cucchiai","k":"cacao"}],"proc":["Prepara il caffè e lascialo raffreddare completamente.","Monta i tuorli con lo zucchero finché sono chiari e spumosi.","Unisci il mascarpone poco per volta, mescolando dal basso.","Monta gli albumi a neve ferma e incorporali delicatamente.","Inzuppa i savoiardi nel caffè un secondo per lato e alterna con la crema in due strati.","Riposa in frigorifero almeno 4 colata per ammorbidirla.","Con il resto fai le strisce e inforna a 180 gradi per 35 minuti."],"nota":"La frolla si lavora poca e fredda: se il burro si scioglie diventa dura invece che friabile.","luogo":"","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":54,"n":"Mousse al cioccolato","cat":"Dolci","tempo":25,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"cioccolato fondente","q":"200 gr","k":"cioccolato fondente"},{"n":"uova","q":"4","k":"uova"},{"n":"zucchero","q":"50 gr","k":"zucchero"},{"n":"panna","q":"100 ml","k":"panna"}],"proc":["Sciogli il cioccolato a bagnomaria e lascialo intiepidire.","Monta i tuorli con lo zucchero e uniscili al cioccolato.","Monta la panna ben fredda e incorporala dal basso verso l’alto.","Monta gli albumi a neve ferma e uniscili in tre volte, senza smontare il composto.","Versa nelle coppette e riposa in frigorifero almeno 3 ore."],"nota":"Il cioccolato deve essere tiepido, non caldo: se scotta fa impazzire i tuorli.","luogo":"","estero":false,"all":["latte","uova"],"unico":false,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":55,"n":"Vitello tonnato","cat":"Secondi","tempo":90,"diff":"media","tags":["senza forno"],"ing":[{"n":"girello di vitello","q":"800 gr","k":"vitello"},{"n":"tonno sott’olio","q":"200 gr","k":"tonno sott’olio"},{"n":"uova","q":"3","k":"uova"},{"n":"capperi","q":"40 gr","k":"capperi"},{"n":"acciughe sott’olio","q":"3 filetti","k":"acciughe sott’olio"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"carota","q":"1","k":"carota"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"}],"proc":["Lessa il girello per un’ora in acqua con sedano, carota, cipolla e vino bianco. Fallo raffreddare nel brodo.","Rassoda le uova per 9 minuti e tieni solo i tuorli.","Frulla tonno, tuorli, acciughe, metà dei capperi e qualche cucchiaio di brodo di cottura.","Monta la salsa con olio a filo finché è liscia e densa.","Affetta la carne finissima a freddo, nappa con la salsa e completa con i capperi rimasti."],"nota":"La carne va affettata fredda di frigorifero, altrimenti si sbriciola.","luogo":"Piemonte","estero":false,"all":["pesce","sedano","solfiti","uova"],"unico":false,"nvoci":9,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":56,"n":"Bagna càuda","cat":"Antipasti","tempo":50,"diff":"facile","tags":["senza forno"],"ing":[{"n":"aglio","q":"12 spicchi","k":"aglio"},{"n":"acciughe sott’olio","q":"200 gr","k":"acciughe sott’olio"},{"n":"latte","q":"250 ml","k":"latte"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"peperoni","q":"2","k":"peperoni"},{"n":"cardi","q":"300 gr","k":"cardi"}],"proc":["Sbuccia gli spicchi d’aglio, privali del germoglio e falli stufare nel latte per 30 minuti a fuoco bassissimo.","Schiacciali con la forchetta fino a una crema.","Unisci le acciughe e scioglile mescolando, sempre a fuoco dolce: non deve mai friggere.","Aggiungi l’olio a filo e il burro, e cuoci altri 15 minuti finché è densa e omogenea.","Servi calda con le verdure crude e cotte tagliate a bastoncini."],"nota":"L’aglio nel latte perde l’aggressività: è il passaggio che rende la bagna digeribile.","luogo":"Piemonte","estero":false,"all":["latte","pesce"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":57,"n":"Risotto ai funghi","cat":"Primi","tempo":40,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"funghi champignon","q":"400 gr","k":"funghi champignon"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"parmigiano","q":"70 gr","k":"parmigiano"},{"n":"brodo vegetale","q":"1,2 l","k":"brodo vegetale"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Salta i funghi affettati in padella con olio e aglio a fuoco vivo, sala alla fine e tieni da parte.","Fai appassire la cipolla tritata in metà del burro, poi tosta il riso due minuti.","Sfuma col vino, poi procedi col brodo bollente un mestolo per volta.","A metà cottura unisci due terzi dei funghi.","Manteca fuori dal fuoco con burro freddo e parmigiano, e completa con i funghi rimasti e il prezzemolo."],"nota":"Se usi funghi secchi, l’acqua di ammollo filtrata vale più del brodo.","luogo":"Lombardia","estero":false,"all":["latte","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":false,"att":["colino a maglie fitte"],"att_opz":[]},{"id":58,"n":"Polenta e gorgonzola","cat":"Primi","tempo":60,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"farina di mais","q":"300 gr","k":"farina di mais"},{"n":"gorgonzola","q":"250 gr","k":"gorgonzola"},{"n":"burro","q":"40 gr","k":"burro"},{"n":"parmigiano","q":"50 gr","k":"parmigiano"}],"proc":["Porta a bollore un litro e mezzo d’acqua salata.","Versa la farina a pioggia mescolando con la frusta per evitare i grumi.","Cuoci 45 minuti a fuoco basso mescolando spesso con un cucchiaio di legno.","Negli ultimi cinque minuti unisci burro e parmigiano.","Versa nei piatti e adagia sopra il gorgonzola a pezzi, che si scioglierà da solo."],"nota":"La polenta è pronta quando si stacca dalle pareti del paiolo, non prima.","luogo":"Lombardia","estero":false,"all":["latte"],"unico":false,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":59,"n":"Risi e bisi","cat":"Primi","tempo":45,"diff":"facile","tags":[],"ing":[{"n":"riso","q":"300 gr","k":"riso"},{"n":"piselli","q":"500 gr","k":"piselli"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"pancetta","q":"80 gr","k":"pancetta"},{"n":"brodo vegetale","q":"1,5 l","k":"brodo vegetale"},{"n":"parmigiano","q":"70 gr","k":"parmigiano"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Soffriggi cipolla tritata e pancetta a dadini in olio e burro.","Unisci i piselli e lasciali insaporire cinque minuti.","Aggiungi il brodo caldo e porta a bollore, poi versa il riso.","Cuoci mescolando per 16 minuti: deve restare più liquido di un risotto.","Manteca con parmigiano e prezzemolo."],"nota":"Non è un risotto e non è una minestra: si mangia col cucchiaio ma sta in piedi.","luogo":"Veneto","estero":false,"all":["latte"],"unico":true,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":60,"n":"Bigoli in salsa","cat":"Primi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"bigoli","q":"320 gr","k":"pasta"},{"n":"cipolla","q":"3","k":"cipolla"},{"n":"acciughe sott’olio","q":"8 filetti","k":"acciughe sott’olio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Affetta le cipolle sottilissime e falle stufare in olio a fuoco bassissimo per 25 minuti, con due cucchiai d’acqua.","Devono disfarsi senza mai colorire.","Unisci le acciughe e sciogliile schiacciandole con il cucchiaio.","Cuoci i bigoli e saltali nella salsa con un po’ d’acqua di cottura.","Pepa generosamente e completa con il prezzemolo."],"nota":"Niente formaggio, niente aglio: è un piatto di magro e la sua forza è la semplicità.","luogo":"Veneto","estero":false,"all":["glutine","pesce"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":61,"n":"Canederli in brodo","cat":"Primi","tempo":50,"diff":"media","tags":[],"ing":[{"n":"pane raffermo","q":"300 gr","k":"pane"},{"n":"latte","q":"250 ml","k":"latte"},{"n":"uova","q":"3","k":"uova"},{"n":"speck","q":"150 gr","k":"speck"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"farina","q":"50 gr","k":"farina"},{"n":"brodo vegetale","q":"1,5 l","k":"brodo vegetale"},{"n":"erba cipollina","q":"1 ciuffo","k":"erba cipollina"}],"proc":["Taglia il pane a cubetti e bagnalo col latte tiepido, lasciando riposare 20 minuti.","Rosola la cipolla tritata con lo speck a dadini.","Unisci tutto al pane con uova, farina, sale e pepe, e impasta a mano.","Forma palle grosse come un mandarino, bagnandoti le mani.","Cuocile nel brodo bollente per 15 minuti, a fuoco dolce perché non si rompano.","Servi nel brodo con erba cipollina."],"nota":"Se l’impasto è troppo molle aggiungi farina un cucchiaio per volta: uno di troppo li indurisce.","luogo":"Trentino-Alto Adige","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":62,"n":"Frico con patate","cat":"Secondi","tempo":40,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"formaggio montasio","q":"400 gr","k":"formaggio montasio"},{"n":"patate","q":"500 gr","k":"patate"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"burro","q":"30 gr","k":"burro"}],"proc":["Lessa le patate, sbucciale e schiacciale grossolanamente.","Fai appassire la cipolla affettata nel burro.","Unisci le patate e il formaggio grattugiato grosso, mescolando.","Compatta in padella e cuoci a fuoco medio 10 minuti finché si forma la crosta.","Gira con l’aiuto di un piatto e cuoci altri 8 minuti."],"nota":"Il montasio deve essere metà fresco e metà stagionato: il primo fila, il secondo dà sapore.","luogo":"Friuli-Venezia Giulia","estero":false,"all":["latte"],"unico":true,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":63,"n":"Trofie al pesto e patate","cat":"Primi","tempo":25,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"trofie","q":"320 gr","k":"pasta"},{"n":"basilico","q":"50 gr","k":"basilico"},{"n":"pinoli","q":"30 gr","k":"pinoli"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"},{"n":"aglio","q":"1 spicchio","k":"aglio"},{"n":"patate","q":"2","k":"patate"},{"n":"fagiolini","q":"150 gr","k":"fagiolini"}],"proc":["Prepara il pesto pestando basilico, aglio, pinoli e sale, poi unisci formaggio e olio.","Cuoci nella stessa acqua le patate a cubi, poi dopo cinque minuti i fagiolini, infine le trofie.","Scola tutto insieme tenendo un mestolo d’acqua.","Condisci in una zuppiera con il pesto allungato con l’acqua di cottura."],"nota":"Patate e fagiolini non sono un’aggiunta: nella versione genovese fanno parte del piatto.","luogo":"Liguria","estero":false,"all":["frutta a guscio","glutine","latte"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":["mortaio"],"att_opz":[]},{"id":64,"n":"Tagliatelle al ragù","cat":"Primi","tempo":180,"diff":"media","tags":[],"ing":[{"n":"tagliatelle","q":"400 gr","k":"pasta"},{"n":"carne macinata","q":"500 gr","k":"carne macinata"},{"n":"pancetta","q":"100 gr","k":"pancetta"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"carota","q":"1","k":"carota"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"vino rosso","q":"1 bicchiere","k":"vino rosso"},{"n":"latte","q":"200 ml","k":"latte"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"}],"proc":["Trita finissimi cipolla, carota e sedano e falli appassire in olio e burro per 15 minuti.","Unisci la pancetta tritata, poi la carne, e rosola a fuoco vivo finché è ben colorita.","Sfuma col vino rosso e lascia evaporare completamente.","Aggiungi la passata, sala e cuoci due ore a fuoco bassissimo, aggiungendo acqua calda se serve.","Nell’ultima mezz’ora versa il latte: ammorbidisce la carne e arrotonda l’acidità.","Condisci le tagliatelle e servi con parmigiano."],"nota":"Il ragù non si fa in mezz’ora. Due ore sono il minimo, tre sono meglio.","luogo":"Emilia-Romagna","estero":false,"all":["glutine","latte","sedano","solfiti"],"unico":false,"nvoci":10,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":65,"n":"Pappa al pomodoro","cat":"Primi","tempo":40,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"pane raffermo","q":"400 gr","k":"pane"},{"n":"passata di pomodoro","q":"700 gr","k":"passata di pomodoro"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"basilico","q":"1 ciuffo","k":"basilico"},{"n":"brodo vegetale","q":"500 ml","k":"brodo vegetale"}],"proc":["Soffriggi l’aglio in abbondante olio, poi unisci la passata e cuoci 15 minuti.","Aggiungi il pane a fette spezzettato e il brodo caldo.","Mescola con il cucchiaio di legno finché il pane si disfa completamente, circa 15 minuti.","Spegni, unisci il basilico e lascia riposare mezz’ora.","Servi tiepida con abbondante olio a crudo."],"nota":"Si mangia tiepida o fredda, mai bollente. E il giorno dopo è migliore.","luogo":"Toscana","estero":false,"all":["glutine"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":66,"n":"Strangozzi al tartufo","cat":"Primi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"strangozzi","q":"320 gr","k":"pasta"},{"n":"tartufo nero","q":"40 gr","k":"tartufo nero"},{"n":"aglio","q":"1 spicchio","k":"aglio"},{"n":"acciughe sott’olio","q":"2 filetti","k":"acciughe sott’olio"}],"proc":["Scalda l’olio con l’aglio schiacciato e sciogli le acciughe a fuoco bassissimo.","Togli l’aglio e spegni.","Grattugia o trita il tartufo e uniscilo all’olio tiepido, mai caldo.","Cuoci la pasta, scolala e mantecala nella salsa con un po’ d’acqua di cottura."],"nota":"Il tartufo nero non si cuoce: sopra i 50 gradi perde tutto.","luogo":"Umbria","estero":false,"all":["glutine","pesce"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":67,"n":"Vincisgrassi","cat":"Primi","tempo":150,"diff":"difficile","tags":[],"ing":[{"n":"lasagne","q":"400 gr","k":"pasta"},{"n":"carne macinata","q":"400 gr","k":"carne macinata"},{"n":"fegatini di pollo","q":"150 gr","k":"fegatini di pollo"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"carota","q":"1","k":"carota"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"latte","q":"1 l","k":"latte"},{"n":"farina","q":"80 gr","k":"farina"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"parmigiano","q":"150 gr","k":"parmigiano"}],"proc":["Prepara un ragù lungo con soffritto, carne, fegatini tritati, passata e due ore di cottura.","Fai la besciamella scaldando burro e farina e unendo il latte caldo a filo, mescolando.","Sbollenta le sfoglie se non sono fresche.","Alterna in teglia besciamella, sfoglia, ragù e parmigiano per cinque o sei strati.","Inforna a 180 gradi per 45 minuti e riposa 15 minuti prima di tagliare."],"nota":"I fegatini sono la differenza fra i vincisgrassi e una lasagna qualunque.","luogo":"Marche","estero":false,"all":["glutine","latte","sedano"],"unico":false,"nvoci":11,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":68,"n":"Amatriciana","cat":"Primi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"bucatini","q":"320 gr","k":"pasta"},{"n":"guanciale","q":"150 gr","k":"guanciale"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"pecorino romano","q":"80 gr","k":"pecorino romano"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"},{"n":"vino bianco","q":"1/2 bicchiere","k":"vino bianco"}],"proc":["Rosola il guanciale a listarelle in padella fredda, senza grassi, finché è croccante. Tienilo da parte.","Sfuma il fondo col vino bianco e lascia evaporare.","Unisci la passata e il peperoncino, sala poco e cuoci 15 minuti.","Scola la pasta al dente e saltala nel sugo.","Fuori dal fuoco rimetti il guanciale e manteca col pecorino."],"nota":"Niente cipolla e niente aglio. Il guanciale va rimesso alla fine o perde la croccantezza.","luogo":"Lazio","estero":false,"all":["glutine","latte","solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":69,"n":"Arrosticini","cat":"Secondi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"carne di pecora","q":"800 gr","k":"carne di pecora"},{"n":"pane raffermo","q":"4 fette","k":"pane"}],"proc":["Taglia la carne a cubetti di un centimetro, alternando parti magre e grasse.","Infila i cubetti sugli spiedini, circa otto per spiedino.","Cuoci sulla brace viva o su piastra rovente, tre minuti per lato.","Sala solo alla fine e servi subito con pane abbrustolito."],"nota":"Il grasso alternato al magro non è un difetto: è quello che li tiene morbidi.","luogo":"Abruzzo","estero":false,"all":["glutine"],"unico":false,"nvoci":2,"minimo":true,"leggero":true,"att":["griglia o piastra","spiedini"],"att_opz":[]},{"id":70,"n":"Cavatelli e cozze","cat":"Primi","tempo":35,"diff":"media","tags":["senza forno"],"ing":[{"n":"cavatelli","q":"320 gr","k":"pasta"},{"n":"cozze","q":"1 kg","k":"cozze"},{"n":"pomodorini","q":"300 gr","k":"pomodorini"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"}],"proc":["Apri le cozze in pentola coperta e filtra il liquido.","Sgusciane due terzi e tieni le altre intere.","Soffriggi aglio e peperoncino, unisci i pomodorini e schiacciali.","Versa il liquido filtrato e cuoci cinque minuti.","Cuoci i cavatelli, scolali al dente e finisci la cottura nella salsa con le cozze."],"nota":"Non salare mai: il liquido delle cozze porta già tutto il sale che serve.","luogo":"Puglia","estero":false,"all":["glutine","molluschi"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":["colino a maglie fitte"],"att_opz":[]},{"id":71,"n":"Orecchiette con le cime di rapa","cat":"Primi","tempo":35,"diff":"facile","tags":["senza forno"],"ing":[{"n":"orecchiette","q":"400 gr","k":"pasta"},{"n":"cime di rapa","q":"1 kg","k":"cicoria"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"acciughe sott’olio","q":"4 filetti","k":"acciughe sott’olio"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"},{"n":"pane raffermo","q":"50 gr","k":"pane"}],"proc":["Monda le cime di rapa tenendo cimette e foglie tenere.","Cuocile nella stessa acqua della pasta, buttandole cinque minuti prima delle orecchiette.","Nel frattempo scalda olio, aglio e peperoncino e sciogli le acciughe.","Tosta il pane sbriciolato in una padella a parte finché è dorato.","Scola pasta e verdura insieme, salta nel condimento e completa con la mollica croccante."],"nota":"La mollica tostata è il formaggio dei poveri: non saltarla, è quella che dà la spinta.","luogo":"Puglia","estero":false,"all":["glutine","pesce"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":72,"n":"Peperoni cruschi e patate","cat":"Contorni","tempo":30,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"peperoni cruschi","q":"60 gr","k":"peperoni cruschi"},{"n":"patate","q":"800 gr","k":"patate"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Lessa le patate, sbucciale e tagliale a tocchi grandi.","Scalda abbondante olio in padella e friggi i peperoni cruschi per pochi secondi: bastano tre o quattro.","Scolali subito su carta, diventeranno croccantissimi raffreddandosi.","Nello stesso olio ripassa le patate con l’aglio finché prendono colore.","Sbriciola sopra i peperoni e servi caldo."],"nota":"I cruschi bruciano in un attimo e diventano amari: si contano i secondi, non i minuti.","luogo":"Basilicata","estero":false,"all":[],"unico":true,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":73,"n":"Pasta con la 'nduja","cat":"Primi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pasta corta","q":"320 gr","k":"pasta"},{"n":"nduja","q":"100 gr","k":"nduja"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"ricotta salata","q":"60 gr","k":"ricotta salata"}],"proc":["Fai appassire la cipolla tritata in olio a fuoco dolce.","Unisci la nduja e scioglila completamente mescolando.","Aggiungi la passata e cuoci 15 minuti: il sugo diventerà arancione e lucido.","Salta la pasta nel sugo con un po’ d’acqua di cottura.","Completa con ricotta salata grattugiata, che smorza il piccante."],"nota":"La nduja è già salata e piccantissima: assaggia prima di aggiungere sale.","luogo":"Calabria","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":74,"n":"Pasta con le sarde","cat":"Primi","tempo":50,"diff":"media","tags":[],"ing":[{"n":"bucatini","q":"320 gr","k":"pasta"},{"n":"sarde","q":"500 gr","k":"sarde"},{"n":"finocchietto selvatico","q":"300 gr","k":"finocchietto selvatico"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"uvetta","q":"50 gr","k":"uvetta"},{"n":"pinoli","q":"50 gr","k":"pinoli"},{"n":"zafferano","q":"1 bustina","k":"zafferano"},{"n":"pane raffermo","q":"60 gr","k":"pane"}],"proc":["Lessa il finocchietto 10 minuti, scolalo tenendo l’acqua, e tritalo.","Fai appassire la cipolla, unisci le sarde pulite e falle disfare.","Aggiungi finocchietto, uvetta ammollata, pinoli e zafferano sciolto in poca acqua di cottura.","Cuoci i bucatini nell’acqua del finocchietto.","Condisci e completa con la mollica tostata in padella."],"nota":"L’acqua di cottura del finocchietto è metà del sapore: non buttarla mai.","luogo":"Sicilia","estero":false,"all":["frutta a guscio","glutine","pesce","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":75,"n":"Caponata di carciofi","cat":"Contorni","tempo":45,"diff":"media","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"carciofi","q":"6","k":"carciofi"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"olive verdi","q":"80 gr","k":"olive"},{"n":"capperi","q":"30 gr","k":"capperi"},{"n":"aceto","q":"2 cucchiai","k":"aceto"},{"n":"zucchero","q":"1 cucchiaio","k":"zucchero"},{"n":"limone","q":"1","k":"limone"}],"proc":["Pulisci i carciofi e tienili in acqua acidulata col limone.","Tagliali a spicchi e friggili in olio caldo, poi scolali.","Stufa cipolla e sedano, unisci olive e capperi.","Rimetti i carciofi, sfuma con aceto e zucchero e lascia evaporare a fuoco vivo.","Fai raffreddare completamente prima di servire."],"nota":"Come la caponata di melanzane, va mangiata il giorno dopo.","luogo":"Sicilia","estero":false,"all":["sedano","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":76,"n":"Malloreddus alla campidanese","cat":"Primi","tempo":50,"diff":"facile","tags":[],"ing":[{"n":"malloreddus","q":"400 gr","k":"pasta"},{"n":"salsiccia","q":"400 gr","k":"salsiccia"},{"n":"passata di pomodoro","q":"500 gr","k":"passata di pomodoro"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"zafferano","q":"1 bustina","k":"zafferano"},{"n":"pecorino romano","q":"80 gr","k":"pecorino romano"}],"proc":["Sbriciola la salsiccia privata del budello e rosolala in padella senza olio.","Unisci la cipolla tritata e falla appassire nel grasso.","Versa la passata e lo zafferano sciolto in poca acqua, sala e cuoci 30 minuti.","Cuoci i malloreddus e saltali nel sugo.","Servi con abbondante pecorino."],"nota":"Lo zafferano non è un vezzo: è nella tradizione sarda quanto in quella milanese.","luogo":"Sardegna","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":77,"n":"Seadas","cat":"Dolci","tempo":60,"diff":"media","tags":[],"ing":[{"n":"semola","q":"300 gr","k":"semola"},{"n":"formaggio pecorino fresco","q":"400 gr","k":"formaggio pecorino fresco"},{"n":"limone","q":"1","k":"limone"},{"n":"strutto","q":"50 gr","k":"strutto"},{"n":"miele","q":"200 gr","k":"miele"}],"proc":["Impasta semola, strutto e acqua tiepida fino a una pasta liscia, e fai riposare 30 minuti.","Sciogli il formaggio a bagnomaria con la scorza di limone e lascialo rassodare su un piatto.","Stendi la pasta sottile, ritaglia dischi e racchiudi un disco di formaggio fra due sfoglie.","Sigilla bene i bordi con la rotella.","Friggi in olio caldo finché sono dorate e servi subito col miele caldo colato sopra."],"nota":"Il formaggio deve essere appena acidulo: se è troppo fresco non fila e non sa di niente.","luogo":"Sardegna","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":78,"n":"Zuppa valdostana","cat":"Primi","tempo":60,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"pane raffermo","q":"300 gr","k":"pane"},{"n":"formaggio fontina","q":"300 gr","k":"formaggio fontina"},{"n":"cavolo verza","q":"500 gr","k":"verza"},{"n":"brodo vegetale","q":"1 l","k":"brodo vegetale"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"cannella","q":"1 pizzico","k":"cannella"}],"proc":["Sbollenta la verza a strisce per 10 minuti.","Abbrustolisci le fette di pane nel burro.","In una pirofila alterna pane, verza e fontina a fette per tre strati.","Versa il brodo caldo fino quasi a coprire e spolvera di cannella.","Inforna a 180 gradi per 30 minuti finché la superficie è gratinata."],"nota":"Un pizzico di cannella è tradizione, e cambia completamente il piatto.","luogo":"Valle d’Aosta","estero":false,"all":["glutine","latte"],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":79,"n":"Cavatelli con fagioli e cozze","cat":"Primi","tempo":45,"diff":"media","tags":["senza forno"],"ing":[{"n":"cavatelli","q":"320 gr","k":"pasta"},{"n":"fagioli","q":"300 gr","k":"fagioli"},{"n":"cozze","q":"800 gr","k":"cozze"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"pomodorini","q":"150 gr","k":"pomodorini"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Apri le cozze e filtra il liquido, sgusciandone la maggior parte.","Scalda olio e aglio, unisci i pomodorini e i fagioli già cotti.","Aggiungi il liquido delle cozze e cuoci 10 minuti, schiacciando qualche fagiolo.","Cuoci i cavatelli e uniscili alla zuppa con le cozze.","Completa con prezzemolo e olio a crudo."],"nota":"Mare e terra insieme: è un piatto molisano e pugliese, di cucina di casa.","luogo":"Molise","estero":false,"all":["glutine","molluschi"],"unico":true,"nvoci":6,"minimo":false,"leggero":true,"att":["colino a maglie fitte"],"att_opz":[]},{"id":80,"n":"Ratatouille","cat":"Contorni","tempo":60,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"melanzane","q":"2","k":"melanzane"},{"n":"zucchine","q":"3","k":"zucchine"},{"n":"peperoni","q":"2","k":"peperoni"},{"n":"pomodori","q":"4","k":"pomodori"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"timo","q":"2 rametti","k":"timo"}],"proc":["Taglia tutte le verdure a cubi della stessa misura.","Cuoci ogni verdura separatamente in padella con olio, salandola alla fine.","In una casseruola stufa cipolla e aglio, poi unisci i pomodori e cuoci 15 minuti.","Riunisci tutte le verdure, aggiungi il timo e cuoci coperto 20 minuti a fuoco dolce.","Servi tiepida o fredda, con olio a crudo."],"nota":"Cuocere le verdure separatamente è noioso ma è la differenza fra una ratatouille e un minestrone.","luogo":"Francia","estero":true,"all":[],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":81,"n":"Quiche lorraine","cat":"Secondi","tempo":70,"diff":"media","tags":[],"ing":[{"n":"pasta brisée","q":"1 rotolo","k":"pasta brisée"},{"n":"pancetta","q":"200 gr","k":"pancetta"},{"n":"uova","q":"4","k":"uova"},{"n":"panna","q":"250 ml","k":"panna"},{"n":"latte","q":"100 ml","k":"latte"},{"n":"formaggio gruviera","q":"100 gr","k":"formaggio gruviera"},{"n":"noce moscata","q":"1 pizzico","k":"noce moscata"}],"proc":["Stendi la brisée nello stampo, bucherella il fondo e mettila in frigorifero 20 minuti.","Rosola la pancetta a dadini finché è dorata e scolala.","Sbatti uova, panna, latte, sale, pepe e noce moscata.","Distribuisci pancetta e formaggio sul fondo e versa il composto.","Inforna a 180 gradi per 40 minuti, finché è gonfia e dorata. Servi tiepida."],"nota":"Il freddo prima della cottura è quello che impedisce alla pasta di ritirarsi.","luogo":"Francia","estero":true,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":82,"n":"Tortilla de patatas","cat":"Secondi","tempo":45,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"patate","q":"800 gr","k":"patate"},{"n":"uova","q":"6","k":"uova"},{"n":"cipolla","q":"2","k":"cipolla"}],"proc":["Affetta le patate a 3 millimetri e la cipolla sottile.","Cuocile in abbondante olio a fuoco dolce per 25 minuti: devono stufare, non friggere.","Scolale bene e uniscile alle uova sbattute con sale, lasciando riposare 10 minuti.","Versa in padella con poco olio e cuoci 5 minuti a fuoco medio.","Gira con un piatto e cuoci altri 4 minuti: il centro deve restare morbido."],"nota":"In Spagna si litiga da un secolo sulla cipolla. Con, secondo me.","luogo":"Spagna","estero":true,"all":["uova"],"unico":true,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":83,"n":"Gazpacho","cat":"Primi","tempo":20,"diff":"facile","tags":["vegetariano","vegano","senza cottura","senza forno"],"ing":[{"n":"pomodori","q":"1 kg","k":"pomodori"},{"n":"cetriolo","q":"1","k":"cetriolo"},{"n":"peperoni","q":"1","k":"peperoni"},{"n":"aglio","q":"1 spicchio","k":"aglio"},{"n":"pane raffermo","q":"80 gr","k":"pane"},{"n":"aceto","q":"2 cucchiai","k":"aceto"}],"proc":["Ammolla il pane in acqua e strizzalo.","Frulla pomodori, cetriolo, peperone, aglio e pane fino a una crema.","Aggiungi olio a filo continuando a frullare: deve emulsionare e schiarire.","Regola con aceto, sale e un po’ d’acqua fredda.","Passa al setaccio se lo vuoi liscio e tieni in frigorifero almeno due ore."],"nota":"Va servito molto freddo ma non ghiacciato: sotto i 6 gradi non si sente più niente.","luogo":"Spagna","estero":true,"all":["glutine","solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["frullatore o minipimer","setaccio o schiacciapatate"],"att_opz":[]},{"id":84,"n":"Insalata greca","cat":"Antipasti","tempo":15,"diff":"facile","tags":["vegetariano","senza cottura","senza forno"],"ing":[{"n":"pomodori","q":"4","k":"pomodori"},{"n":"cetriolo","q":"1","k":"cetriolo"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"olive nere","q":"100 gr","k":"olive"},{"n":"formaggio feta","q":"250 gr","k":"formaggio feta"},{"n":"origano","q":"1 cucchiaino","k":"origano"}],"proc":["Taglia i pomodori a spicchi grossi e il cetriolo a mezzelune spesse.","Affetta la cipolla sottilissima e lasciala 10 minuti in acqua fredda per addolcirla.","Unisci le olive e mescola con olio, sale e origano.","Adagia sopra la feta intera a fette spesse, senza mescolarla.","Completa con altro origano e olio."],"nota":"La feta non si sbriciola e non si mescola: va appoggiata sopra, in un pezzo solo.","luogo":"Grecia","estero":true,"all":["latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":85,"n":"Hummus","cat":"Antipasti","tempo":20,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"ceci","q":"500 gr","k":"ceci"},{"n":"tahina","q":"80 gr","k":"tahina"},{"n":"limone","q":"2","k":"limone"},{"n":"aglio","q":"1 spicchio","k":"aglio"},{"n":"cumino","q":"1 cucchiaino","k":"cumino"},{"n":"paprica","q":"1 pizzico","k":"paprica"}],"proc":["Scalda i ceci in poca acqua: da tiepidi si frullano molto meglio.","Frullali con tahina, succo di limone, aglio, cumino e sale.","Aggiungi acqua fredda a cucchiaiate continuando a frullare finché diventa chiaro e soffice.","Servi allargandolo nel piatto con il dorso del cucchiaio.","Completa con olio, paprica e qualche cece intero."],"nota":"L’acqua fredda mentre frulli è il trucco che lo rende cremoso invece che pastoso.","luogo":"Medio Oriente","estero":true,"all":["sesamo"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":86,"n":"Cous cous di verdure","cat":"Primi","tempo":45,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"cous cous","q":"320 gr","k":"cous cous"},{"n":"zucchine","q":"2","k":"zucchine"},{"n":"carota","q":"2","k":"carota"},{"n":"peperoni","q":"1","k":"peperoni"},{"n":"ceci","q":"250 gr","k":"ceci"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"cumino","q":"1 cucchiaino","k":"cumino"},{"n":"paprica","q":"1 cucchiaino","k":"paprica"}],"proc":["Stufa la cipolla, poi unisci le verdure a cubi partendo dalle più dure.","Aggiungi le spezie, i ceci e acqua a filo, e cuoci 20 minuti.","Porta a bollore 350 ml d’acqua salata con un filo d’olio.","Versala sul cous cous, copri e lascia gonfiare 5 minuti, poi sgrana con la forchetta.","Servi il cous cous con le verdure e il loro brodo a parte."],"nota":"Il brodo si versa a parte, così ognuno decide quanto bagnare.","luogo":"Marocco","estero":true,"all":["glutine"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":87,"n":"Riso alla cantonese","cat":"Primi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"uova","q":"3","k":"uova"},{"n":"piselli","q":"200 gr","k":"piselli"},{"n":"prosciutto cotto","q":"150 gr","k":"prosciutto cotto"},{"n":"cipollotto","q":"2","k":"cipollotto"},{"n":"salsa di soia","q":"2 cucchiai","k":"salsa di soia"}],"proc":["Cuoci il riso, scolalo e raffreddalo: il riso del giorno prima è ancora meglio.","Fai una frittatina sottile con le uova sbattute e tagliala a striscioline.","Salta i piselli e il prosciutto a dadini in padella rovente con poco olio.","Unisci il riso e saltalo a fuoco altissimo per tre minuti, muovendolo di continuo.","Aggiungi uovo, cipollotto e salsa di soia, mescola e servi subito."],"nota":"Il riso freddo è obbligatorio: quello caldo si impasta e diventa colla.","luogo":"Cina","estero":true,"all":["glutine","soia","uova"],"unico":true,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":88,"n":"Pad thai","cat":"Primi","tempo":35,"diff":"media","tags":["senza forno"],"ing":[{"n":"noodles di riso","q":"250 gr","k":"noodles di riso"},{"n":"gamberi","q":"300 gr","k":"gamberi"},{"n":"uova","q":"2","k":"uova"},{"n":"germogli di soia","q":"150 gr","k":"germogli di soia"},{"n":"arachidi","q":"60 gr","k":"arachidi"},{"n":"lime","q":"2","k":"lime"},{"n":"salsa di pesce","q":"3 cucchiai","k":"salsa di pesce"},{"n":"zucchero","q":"2 cucchiai","k":"zucchero"},{"n":"cipollotto","q":"2","k":"cipollotto"}],"proc":["Ammolla i noodles in acqua tiepida per 20 minuti, finché sono flessibili ma sodi.","Prepara la salsa sciogliendo zucchero, salsa di pesce e succo di lime.","Salta i gamberi in padella rovente, poi spostali di lato e strapazza le uova.","Unisci i noodles scolati e la salsa, saltando a fuoco altissimo due minuti.","Aggiungi germogli e cipollotto, e servi con arachidi tritate e lime."],"nota":"Tutto va preparato prima: la cottura dura tre minuti e non c’è tempo per tagliare niente.","luogo":"Thailandia","estero":true,"all":["arachidi","crostacei","pesce","soia","uova"],"unico":true,"nvoci":9,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":89,"n":"Pollo al curry","cat":"Secondi","tempo":45,"diff":"facile","tags":["senza forno"],"ing":[{"n":"petto di pollo","q":"700 gr","k":"pollo"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"zenzero","q":"20 gr","k":"zenzero"},{"n":"latte di cocco","q":"400 ml","k":"latte di cocco"},{"n":"curry","q":"2 cucchiai","k":"curry"},{"n":"passata di pomodoro","q":"200 gr","k":"passata di pomodoro"}],"proc":["Rosola il pollo a bocconcini in padella e tienilo da parte.","Stufa cipolla, aglio e zenzero tritati per 10 minuti.","Unisci il curry e tostalo un minuto: è il passaggio che lo rende profumato invece che polveroso.","Aggiungi passata e latte di cocco, e cuoci 15 minuti.","Rimetti il pollo e prosegui 10 minuti finché la salsa vela il cucchiaio."],"nota":"Le spezie in polvere vanno sempre tostate nel grasso prima di bagnarle.","luogo":"India","estero":true,"all":[],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":90,"n":"Chili con carne","cat":"Secondi","tempo":90,"diff":"facile","tags":[],"ing":[{"n":"carne macinata","q":"600 gr","k":"carne macinata"},{"n":"fagioli","q":"400 gr","k":"fagioli"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"peperoni","q":"1","k":"peperoni"},{"n":"passata di pomodoro","q":"500 gr","k":"passata di pomodoro"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"cumino","q":"1 cucchiaio","k":"cumino"},{"n":"peperoncino secco","q":"2","k":"peperoncino secco"},{"n":"cacao","q":"1 cucchiaino","k":"cacao"}],"proc":["Rosola la carne a fuoco vivo finché è ben scura, poi tienila da parte.","Stufa cipolla, aglio e peperone, unisci cumino e peperoncino e tostali un minuto.","Rimetti la carne, aggiungi passata e un bicchiere d’acqua.","Cuoci un’ora a fuoco basso, poi unisci i fagioli e prosegui 20 minuti.","Il cucchiaino di cacao alla fine dà profondità senza farsi riconoscere."],"nota":"Il cacao amaro è il segreto che quasi tutte le ricette texane hanno e non dichiarano.","luogo":"Messico","estero":true,"all":[],"unico":true,"nvoci":9,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":91,"n":"Guacamole","cat":"Antipasti","tempo":15,"diff":"facile","tags":["vegetariano","vegano","senza cottura","senza forno"],"ing":[{"n":"avocado","q":"3","k":"avocado"},{"n":"lime","q":"2","k":"lime"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"pomodori","q":"1","k":"pomodori"},{"n":"coriandolo fresco","q":"1 ciuffo","k":"coriandolo fresco"},{"n":"peperoncino fresco","q":"1","k":"peperoncino fresco"}],"proc":["Schiaccia la polpa degli avocado con la forchetta, lasciandola grossolana.","Unisci subito il succo di lime: impedisce l’ossidazione.","Aggiungi cipolla tritata finissima, pomodoro a cubetti senza semi e peperoncino.","Regola di sale e completa con il coriandolo.","Servi entro un’ora, coprendo a contatto con la pellicola."],"nota":"Mai frullarlo: il guacamole deve avere pezzi, altrimenti è una crema da supermercato.","luogo":"Messico","estero":true,"all":[],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":92,"n":"Goulash","cat":"Secondi","tempo":120,"diff":"facile","tags":[],"ing":[{"n":"carne di manzo a cubi","q":"800 gr","k":"manzo"},{"n":"cipolla","q":"600 gr","k":"cipolla"},{"n":"paprica","q":"3 cucchiai","k":"paprica"},{"n":"passata di pomodoro","q":"200 gr","k":"passata di pomodoro"},{"n":"patate","q":"400 gr","k":"patate"},{"n":"cumino","q":"1 cucchiaino","k":"cumino"}],"proc":["Affetta le cipolle e stufale in olio o strutto per 20 minuti: devono essere quasi il doppio della carne.","Togli dal fuoco, unisci la paprica e mescola: se brucia diventa amara.","Rimetti sul fuoco con la carne, la passata e acqua a coprire.","Cuoci coperto a fuoco bassissimo per un’ora e mezza.","Aggiungi le patate a tocchi e prosegui 30 minuti."],"nota":"La paprica va sempre unita a fuoco spento: è la regola che separa il goulash dal disastro.","luogo":"Ungheria","estero":true,"all":[],"unico":true,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":93,"n":"Fish and chips","cat":"Secondi","tempo":45,"diff":"media","tags":[],"ing":[{"n":"filetto di pesce bianco","q":"700 gr","k":"filetto di pesce bianco"},{"n":"patate","q":"1 kg","k":"patate"},{"n":"farina","q":"200 gr","k":"farina"},{"n":"birra","q":"300 ml","k":"birra"},{"n":"aceto","q":"2 cucchiai","k":"aceto"}],"proc":["Taglia le patate a bastoncini spessi e sbollentale 5 minuti, poi asciugale.","Prepara la pastella con farina, birra fredda e un pizzico di sale, lasciandola grumosa.","Friggi le patate una prima volta a 160 gradi, scolale e alza l’olio a 190.","Passa il pesce nella pastella e friggilo 5 minuti finché è dorato.","Rifriggi le patate a 190 gradi per due minuti e servi con sale e aceto."],"nota":"La doppia frittura delle patate e la birra ghiacciata nella pastella sono i due punti che contano.","luogo":"Regno Unito","estero":true,"all":["glutine","pesce","solfiti"],"unico":true,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":94,"n":"Zuppa di miso","cat":"Primi","tempo":20,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"miso","q":"4 cucchiai","k":"miso"},{"n":"tofu","q":"200 gr","k":"tofu"},{"n":"alga wakame","q":"10 gr","k":"alga wakame"},{"n":"cipollotto","q":"2","k":"cipollotto"}],"proc":["Ammolla l’alga wakame in acqua fredda per 10 minuti.","Porta un litro d’acqua quasi a bollore, senza farla bollire.","Stempera il miso in una tazza con poca acqua calda, poi uniscilo alla pentola.","Aggiungi tofu a cubetti e alga, e scalda un minuto senza bollire mai.","Servi con cipollotto affettato."],"nota":"Il miso non deve mai bollire: perde profumo e i fermenti vivi.","luogo":"Giappone","estero":true,"all":["glutine","soia"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":95,"n":"Soupe à l’oignon","cat":"Primi","tempo":75,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"cipolla","q":"1 kg","k":"cipolla"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"farina","q":"2 cucchiai","k":"farina"},{"n":"brodo vegetale","q":"1,2 l","k":"brodo vegetale"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"pane raffermo","q":"8 fette","k":"pane"},{"n":"formaggio gruviera","q":"200 gr","k":"formaggio gruviera"}],"proc":["Affetta le cipolle sottilissime e falle stufare nel burro a fuoco bassissimo per 40 minuti.","Devono diventare bionde e dolci: è l’unico passaggio che conta, e non si può accelerare.","Spolvera con la farina, mescola due minuti, poi sfuma col vino.","Versa il brodo caldo e cuoci altri 20 minuti.","Riempi le ciotole, adagia il pane tostato e coprilo di gruviera.","Gratina sotto il grill finché il formaggio è dorato e fila."],"nota":"Quaranta minuti di cipolle sono il minimo. A venti sanno ancora di cipolla cruda.","luogo":"Francia","estero":true,"all":["glutine","latte","solfiti"],"unico":true,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":96,"n":"Boeuf bourguignon","cat":"Secondi","tempo":180,"diff":"media","tags":[],"ing":[{"n":"carne di manzo a cubi","q":"1 kg","k":"manzo"},{"n":"vino rosso","q":"750 ml","k":"vino rosso"},{"n":"pancetta","q":"150 gr","k":"pancetta"},{"n":"carota","q":"3","k":"carota"},{"n":"cipolla","q":"300 gr","k":"cipolla"},{"n":"funghi champignon","q":"300 gr","k":"funghi champignon"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"farina","q":"2 cucchiai","k":"farina"},{"n":"timo","q":"2 rametti","k":"timo"},{"n":"alloro","q":"2 foglie","k":"alloro"}],"proc":["Marina la carne nel vino con carote, aglio e aromi per almeno quattro ore, meglio tutta la notte.","Scola la carne e asciugala bene, poi rosolala a fuoco altissimo poca per volta.","Rosola la pancetta a dadini, unisci le cipolle e spolvera con la farina.","Rimetti la carne, versa il vino della marinata filtrato e le verdure.","Cuoci coperto a fuoco bassissimo per due ore e mezza.","Nell’ultima mezz’ora unisci i funghi saltati a parte."],"nota":"Asciugare la carne dopo la marinata è obbligatorio: bagnata non rosola, lessa.","luogo":"Francia","estero":true,"all":["glutine","solfiti"],"unico":false,"nvoci":10,"minimo":false,"leggero":false,"att":["colino a maglie fitte"],"att_opz":["pentola a pressione"]},{"id":97,"n":"Coq au vin","cat":"Secondi","tempo":120,"diff":"media","tags":[],"ing":[{"n":"pollo a pezzi","q":"1,4 kg","k":"pollo"},{"n":"vino rosso","q":"750 ml","k":"vino rosso"},{"n":"pancetta","q":"150 gr","k":"pancetta"},{"n":"funghi champignon","q":"300 gr","k":"funghi champignon"},{"n":"cipolla","q":"300 gr","k":"cipolla"},{"n":"carota","q":"2","k":"carota"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"farina","q":"2 cucchiai","k":"farina"},{"n":"timo","q":"2 rametti","k":"timo"}],"proc":["Rosola i pezzi di pollo nel burro finché la pelle è ben dorata, poi tienili da parte.","Nello stesso grasso rosola pancetta e cipolle, unisci la farina e mescola due minuti.","Rimetti il pollo, versa il vino e aggiungi aglio, carote e timo.","Cuoci coperto a fuoco dolce per un’ora e un quarto.","Salta i funghi a parte e uniscili negli ultimi dieci minuti.","Se il fondo è troppo liquido, togli il pollo e fai restringere a fuoco vivo."],"nota":"Il vino deve essere bevibile: un vino cattivo in cottura resta cattivo, solo concentrato.","luogo":"Francia","estero":true,"all":["glutine","solfiti"],"unico":false,"nvoci":9,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":98,"n":"Gratin dauphinois","cat":"Contorni","tempo":90,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"patate","q":"1,2 kg","k":"patate"},{"n":"panna","q":"400 ml","k":"panna"},{"n":"latte","q":"300 ml","k":"latte"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"noce moscata","q":"1 pizzico","k":"noce moscata"},{"n":"burro","q":"30 gr","k":"burro"}],"proc":["Affetta le patate a due millimetri con la mandolina e non lavarle: l’amido serve a legare.","Scalda latte e panna con aglio schiacciato, sale, pepe e noce moscata.","Unisci le patate e cuoci dieci minuti a fuoco dolce mescolando piano.","Versa in una pirofila imburrata livellando bene.","Inforna a 160 gradi per un’ora, finché la superficie è dorata e la lama entra senza resistenza."],"nota":"Niente formaggio: nel dauphinois vero c’è solo patata, panna e pazienza.","luogo":"Francia","estero":true,"all":["latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":["mandolina"],"att_opz":[]},{"id":99,"n":"Salade niçoise","cat":"Antipasti","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"tonno sott’olio","q":"200 gr","k":"tonno sott’olio"},{"n":"uova","q":"4","k":"uova"},{"n":"fagiolini","q":"250 gr","k":"fagiolini"},{"n":"patate","q":"400 gr","k":"patate"},{"n":"pomodori","q":"3","k":"pomodori"},{"n":"olive nere","q":"80 gr","k":"olive"},{"n":"acciughe sott’olio","q":"6 filetti","k":"acciughe sott’olio"},{"n":"cipolla","q":"1","k":"cipolla"}],"proc":["Lessa le patate con la buccia e i fagiolini separatamente, tenendoli sodi.","Rassoda le uova per 9 minuti e tagliale a spicchi.","Disponi sul piatto patate a fette, fagiolini, pomodori a spicchi e cipolla affettata sottile.","Aggiungi tonno sgocciolato, olive, acciughe e uova.","Condisci con olio, sale, pepe e un cucchiaio d’aceto, senza mescolare."],"nota":"Non si mescola: si compone. Mescolata diventa un’insalata di riso senza riso.","luogo":"Francia","estero":true,"all":["pesce","uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":100,"n":"Moules marinière","cat":"Secondi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"cozze","q":"2 kg","k":"cozze"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"vino bianco","q":"300 ml","k":"vino bianco"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"panna","q":"100 ml","k":"panna"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Pulisci le cozze raschiando i gusci e togliendo il bisso.","Fai appassire la cipolla tritata finissima nel burro senza colorire.","Versa il vino e lascia sobbollire due minuti.","Unisci le cozze, copri e cuoci a fuoco vivo 5 minuti scuotendo la pentola.","Togli le cozze, unisci la panna al fondo e lascia restringere un minuto.","Versa la salsa sulle cozze e completa con prezzemolo."],"nota":"La panna è facoltativa e in Normandia si litiga anche su quella. Senza è più asciutto e più marino.","luogo":"Francia","estero":true,"all":["latte","molluschi","solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":101,"n":"Crêpes prosciutto e formaggio","cat":"Secondi","tempo":40,"diff":"facile","tags":["senza forno"],"ing":[{"n":"farina","q":"200 gr","k":"farina"},{"n":"uova","q":"3","k":"uova"},{"n":"latte","q":"500 ml","k":"latte"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"prosciutto cotto","q":"200 gr","k":"prosciutto cotto"},{"n":"formaggio gruviera","q":"200 gr","k":"formaggio gruviera"}],"proc":["Sbatti uova, farina, latte e un pizzico di sale fino a una pastella liscia, e falla riposare 30 minuti.","Unisci il burro fuso tiepido.","Scalda una padella antiaderente e versa un mestolino di pastella, ruotando per stenderla sottile.","Cuoci un minuto per lato: la prima crêpe si butta sempre, è la legge.","Farcisci con prosciutto e formaggio, piega a triangolo e scalda in padella finché fila."],"nota":"Il riposo della pastella rilassa il glutine: senza, le crêpes si strappano.","luogo":"Francia","estero":true,"all":["glutine","latte","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":102,"n":"Tarte tatin","cat":"Dolci","tempo":80,"diff":"media","tags":["vegetariano"],"ing":[{"n":"mele","q":"1,2 kg","k":"mele"},{"n":"zucchero","q":"150 gr","k":"zucchero"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"pasta brisée","q":"1 rotolo","k":"pasta brisée"},{"n":"limone","q":"1","k":"limone"}],"proc":["Sbuccia le mele, tagliale a metà e privale del torsolo, bagnandole col limone.","In una padella che possa andare in forno sciogli zucchero e burro fino a un caramello biondo.","Disponi le mele fitte con la parte bombata verso il basso e cuoci 20 minuti a fuoco medio.","Copri con la pasta rimboccando i bordi all’interno e bucherellala.","Inforna a 190 gradi per 30 minuti.","Aspetta cinque minuti e capovolgi su un piatto, in un gesto solo e deciso."],"nota":"Cinque minuti di attesa, non di più: dopo il caramello si rapprende e la torta non esce.","luogo":"Francia","estero":true,"all":["glutine","latte","uova"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":103,"n":"Crème brûlée","cat":"Dolci","tempo":60,"diff":"media","tags":["vegetariano"],"ing":[{"n":"panna","q":"500 ml","k":"panna"},{"n":"uova","q":"5","k":"uova"},{"n":"zucchero","q":"120 gr","k":"zucchero"},{"n":"vaniglia","q":"1 bacca","k":"vaniglia"}],"proc":["Scalda la panna con la bacca di vaniglia incisa, senza farla bollire, e lascia in infusione 15 minuti.","Sbatti cinque tuorli con 80 gr di zucchero, senza montarli: non deve fare schiuma.","Unisci la panna filtrata a filo, mescolando piano.","Versa nelle cocottine e cuoci a bagnomaria a 150 gradi per 40 minuti: il centro deve tremare appena.","Raffredda in frigorifero almeno quattro ore.","Cospargi di zucchero e caramella col cannello o sotto il grill rovente."],"nota":"Se monti i tuorli si formano bolle e la superficie non resta liscia.","luogo":"Francia","estero":true,"all":["latte","uova"],"unico":false,"nvoci":4,"minimo":true,"leggero":false,"att":["cannello","colino a maglie fitte","stampini"],"att_opz":[]},{"id":104,"n":"Ratatouille al forno","cat":"Contorni","tempo":70,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"melanzane","q":"2","k":"melanzane"},{"n":"zucchine","q":"3","k":"zucchine"},{"n":"pomodori","q":"5","k":"pomodori"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"timo","q":"2 rametti","k":"timo"}],"proc":["Prepara una salsa stufando cipolla e aglio e unendo due pomodori a cubetti, per 15 minuti.","Stendila sul fondo di una pirofila.","Affetta melanzane, zucchine e pomodori a tre millimetri e disponili in piedi, alternati e sovrapposti.","Condisci con olio, sale, pepe e timo.","Copri con carta forno e inforna a 180 gradi per 45 minuti, scoprendo negli ultimi dieci."],"nota":"È la versione che si vede nei film: più bella e più semplice di quella tradizionale in padella.","luogo":"Francia","estero":true,"all":[],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":105,"n":"Pollo alle mandorle","cat":"Secondi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"petto di pollo","q":"600 gr","k":"pollo"},{"n":"mandorle","q":"120 gr","k":"mandorle"},{"n":"peperoni","q":"1","k":"peperoni"},{"n":"cipollotto","q":"3","k":"cipollotto"},{"n":"salsa di soia","q":"3 cucchiai","k":"salsa di soia"},{"n":"zenzero","q":"20 gr","k":"zenzero"},{"n":"farina","q":"2 cucchiai","k":"farina"}],"proc":["Taglia il pollo a striscioline e mescolalo con un cucchiaio di salsa di soia e la farina.","Tosta le mandorle in padella a secco finché sono dorate e tienile da parte.","Scalda un filo d’olio a fuoco altissimo e salta il pollo tre minuti, poi toglilo.","Salta peperone, cipollotto e zenzero tritato per due minuti: devono restare croccanti.","Rimetti il pollo, unisci la soia rimanente e mezzo bicchiere d’acqua, e fai addensare.","Aggiungi le mandorle solo all’ultimo, fuori dal fuoco."],"nota":"Le mandorle vanno unite alla fine: nel sugo si ammollano e perdono senso.","luogo":"Cina","estero":true,"all":["frutta a guscio","glutine","soia"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":106,"n":"Maiale in agrodolce","cat":"Secondi","tempo":40,"diff":"media","tags":[],"ing":[{"n":"maiale","q":"600 gr","k":"maiale"},{"n":"ananas","q":"300 gr","k":"ananas"},{"n":"peperoni","q":"2","k":"peperoni"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"aceto","q":"4 cucchiai","k":"aceto"},{"n":"zucchero","q":"4 cucchiai","k":"zucchero"},{"n":"passata di pomodoro","q":"3 cucchiai","k":"passata di pomodoro"},{"n":"farina","q":"100 gr","k":"farina"},{"n":"uova","q":"1","k":"uova"}],"proc":["Taglia il maiale a bocconcini, passalo nell’uovo sbattuto e poi nella farina.","Friggi in olio caldo finché è dorato e scola su carta.","Prepara la salsa sciogliendo zucchero, aceto, passata e mezzo bicchiere d’acqua.","Salta peperoni e cipolla a fuoco vivo due minuti, poi unisci l’ananas a cubi.","Versa la salsa, fai addensare e unisci il maiale solo all’ultimo momento."],"nota":"Il maiale si unisce alla fine, o la panatura si ammorbidisce e sparisce.","luogo":"Cina","estero":true,"all":["glutine","solfiti","uova"],"unico":false,"nvoci":9,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":107,"n":"Noodles saltati con verdure","cat":"Primi","tempo":25,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"noodles di grano","q":"300 gr","k":"noodles di grano"},{"n":"cavolo cappuccio","q":"300 gr","k":"cavolo cappuccio"},{"n":"carota","q":"2","k":"carota"},{"n":"cipollotto","q":"3","k":"cipollotto"},{"n":"germogli di soia","q":"150 gr","k":"germogli di soia"},{"n":"salsa di soia","q":"4 cucchiai","k":"salsa di soia"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"zenzero","q":"20 gr","k":"zenzero"}],"proc":["Lessa i noodles un minuto meno del tempo indicato, scolali e passali sotto l’acqua fredda.","Condiscili con un filo d’olio perché non si attacchino.","Scalda il wok o una padella larga a fuoco altissimo con poco olio.","Salta aglio e zenzero dieci secondi, poi le verdure dure, poi quelle tenere.","Unisci i noodles e la salsa di soia e salta due minuti muovendo di continuo."],"nota":"Il segreto è il fuoco altissimo e la padella non affollata: se stipi, le verdure bollono.","luogo":"Cina","estero":true,"all":["glutine","soia"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":["wok"],"att_opz":[]},{"id":108,"n":"Manzo con broccoli","cat":"Secondi","tempo":30,"diff":"media","tags":["senza forno"],"ing":[{"n":"manzo","q":"500 gr","k":"manzo"},{"n":"broccoli","q":"500 gr","k":"broccoli"},{"n":"salsa di ostriche","q":"3 cucchiai","k":"salsa di ostriche"},{"n":"salsa di soia","q":"2 cucchiai","k":"salsa di soia"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"zenzero","q":"20 gr","k":"zenzero"},{"n":"farina","q":"1 cucchiaio","k":"farina"}],"proc":["Affetta il manzo controfibra, sottilissimo, e mescolalo con soia e farina per 15 minuti.","Sbollenta i broccoli a cimette per tre minuti e passali sotto l’acqua fredda.","Salta la carne in padella rovente per due minuti, poi toglila.","Salta aglio e zenzero, unisci i broccoli e la salsa di ostriche con poca acqua.","Rimetti la carne e fai addensare un minuto."],"nota":"Tagliare controfibra e marinare con l’amido è quello che rende la carne tenera nei ristoranti cinesi.","luogo":"Cina","estero":true,"all":["glutine","molluschi","soia"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":109,"n":"Ravioli al vapore","cat":"Primi","tempo":90,"diff":"difficile","tags":[],"ing":[{"n":"farina","q":"300 gr","k":"farina"},{"n":"maiale","q":"300 gr","k":"maiale"},{"n":"cavolo cappuccio","q":"200 gr","k":"cavolo cappuccio"},{"n":"cipollotto","q":"3","k":"cipollotto"},{"n":"zenzero","q":"20 gr","k":"zenzero"},{"n":"salsa di soia","q":"2 cucchiai","k":"salsa di soia"}],"proc":["Impasta la farina con 150 ml d’acqua bollente, lavora cinque minuti e fai riposare 30 minuti coperto.","Trita finemente il cavolo, salalo e strizzalo bene.","Mescolalo con il maiale macinato, cipollotto, zenzero e salsa di soia.","Stendi la pasta sottilissima e ricava dischi da 8 centimetri.","Farcisci, chiudi a mezzaluna pieghettando il bordo.","Cuoci al vapore 12 minuti su carta forno bucherellata."],"nota":"L’acqua bollente nell’impasto è quello che rende la pasta elastica e traslucida.","luogo":"Cina","estero":true,"all":["glutine","soia"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["vaporiera"],"att_opz":["pentola a pressione"]},{"id":110,"n":"Tonkatsu","cat":"Secondi","tempo":35,"diff":"facile","tags":[],"ing":[{"n":"maiale","q":"4 fette","k":"maiale"},{"n":"uova","q":"2","k":"uova"},{"n":"pangrattato","q":"200 gr","k":"pangrattato"},{"n":"farina","q":"100 gr","k":"farina"},{"n":"cavolo cappuccio","q":"300 gr","k":"cavolo cappuccio"},{"n":"salsa di soia","q":"2 cucchiai","k":"salsa di soia"}],"proc":["Batti leggermente le fette di maiale e incidi il bordo grasso in più punti perché non si arriccino.","Passa nella farina, nell’uovo e nel pangrattato, premendo bene.","Friggi in olio a 170 gradi per 6-7 minuti, girando una sola volta.","Scola su griglia, mai su carta: sotto resterebbe molle.","Affetta il cavolo sottilissimo e servilo crudo accanto, con la salsa."],"nota":"Il cavolo crudo affettato fine non è una guarnizione: serve a sgrassare fra un boccone e l’altro.","luogo":"Giappone","estero":true,"all":["glutine","soia","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":["griglia o piastra"],"att_opz":[]},{"id":111,"n":"Salmone teriyaki","cat":"Secondi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"salmone","q":"600 gr","k":"salmone"},{"n":"salsa di soia","q":"4 cucchiai","k":"salsa di soia"},{"n":"zucchero","q":"2 cucchiai","k":"zucchero"},{"n":"zenzero","q":"20 gr","k":"zenzero"},{"n":"cipollotto","q":"2","k":"cipollotto"},{"n":"riso","q":"300 gr","k":"riso"}],"proc":["Prepara la salsa sciogliendo zucchero e soia con due cucchiai d’acqua e lo zenzero grattugiato.","Cuoci il riso e tienilo in caldo.","Scalda una padella con poco olio e cuoci il salmone dalla parte della pelle per cinque minuti.","Gira, versa la salsa e lascia restringere tre minuti bagnando il pesce col cucchiaio.","Servi sul riso con il cipollotto affettato."],"nota":"La salsa si riduce in fretta: se si asciuga troppo diventa amara.","luogo":"Giappone","estero":true,"all":["glutine","pesce","soia"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":112,"n":"Onigiri","cat":"Antipasti","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"riso","q":"400 gr","k":"riso"},{"n":"alga nori","q":"4 fogli","k":"alga nori"},{"n":"tonno sott’olio","q":"150 gr","k":"tonno sott’olio"},{"n":"salsa di soia","q":"1 cucchiaio","k":"salsa di soia"}],"proc":["Cuoci il riso a chicchi corti e lascialo intiepidire coperto da un panno umido.","Mescola il tonno sgocciolato con la salsa di soia.","Bagnati le mani con acqua salata e prendi una manciata di riso.","Fai un incavo, metti il ripieno e richiudi dando la forma di un triangolo.","Avvolgi una striscia di alga alla base e servi a temperatura ambiente."],"nota":"Le mani bagnate e salate sono tutto: a secco il riso si attacca e non prende forma.","luogo":"Giappone","estero":true,"all":["glutine","pesce","soia"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":113,"n":"Yakitori","cat":"Secondi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"petto di pollo","q":"700 gr","k":"pollo"},{"n":"cipollotto","q":"4","k":"cipollotto"},{"n":"salsa di soia","q":"5 cucchiai","k":"salsa di soia"},{"n":"zucchero","q":"3 cucchiai","k":"zucchero"},{"n":"zenzero","q":"20 gr","k":"zenzero"}],"proc":["Taglia il pollo a bocconcini e infilalo sugli spiedini alternandolo al cipollotto a tocchetti.","Prepara la salsa scaldando soia, zucchero, zenzero e un bicchiere d’acqua, e falla ridurre della metà.","Cuoci gli spiedini su piastra rovente o griglia, cinque minuti girandoli spesso.","Negli ultimi due minuti spennella la salsa più volte, lasciandola caramellare.","Servi subito con la salsa rimasta."],"nota":"La salsa si spennella solo alla fine: messa prima brucia per via dello zucchero.","luogo":"Giappone","estero":true,"all":["glutine","soia"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":["griglia o piastra","spiedini"],"att_opz":[]},{"id":114,"n":"Zuppa di ramen semplificata","cat":"Primi","tempo":45,"diff":"media","tags":[],"ing":[{"n":"noodles di grano","q":"300 gr","k":"noodles di grano"},{"n":"brodo vegetale","q":"1,5 l","k":"brodo vegetale"},{"n":"petto di pollo","q":"400 gr","k":"pollo"},{"n":"uova","q":"4","k":"uova"},{"n":"cipollotto","q":"3","k":"cipollotto"},{"n":"salsa di soia","q":"4 cucchiai","k":"salsa di soia"},{"n":"zenzero","q":"30 gr","k":"zenzero"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"alga nori","q":"2 fogli","k":"alga nori"}],"proc":["Scalda il brodo con zenzero a fette, aglio schiacciato e salsa di soia, e lascia sobbollire 20 minuti.","Cuoci le uova esattamente 6 minuti e mezzo, poi raffreddale in acqua e ghiaccio.","Scotta il petto di pollo nel brodo per 12 minuti, poi affettalo.","Cuoci i noodles a parte e scolali.","Componi la ciotola: noodles, brodo filtrato bollente, pollo, mezzo uovo, cipollotto e alga."],"nota":"L’uovo a sei minuti e mezzo ha l’albume sodo e il tuorlo cremoso: è il cuore del piatto.","luogo":"Giappone","estero":true,"all":["glutine","soia","uova"],"unico":true,"nvoci":9,"minimo":false,"leggero":true,"att":["colino a maglie fitte"],"att_opz":[]},{"id":115,"n":"Falafel","cat":"Secondi","tempo":45,"diff":"media","tags":["vegetariano","vegano"],"ing":[{"n":"ceci","q":"400 gr","k":"ceci"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"coriandolo fresco","q":"1 ciuffo","k":"coriandolo fresco"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"cumino","q":"2 cucchiaini","k":"cumino"},{"n":"farina","q":"3 cucchiai","k":"farina"}],"proc":["Usa ceci secchi ammollati 24 ore, mai lessati: è la regola che decide tutto.","Frulla ceci crudi scolati con cipolla, aglio, erbe, cumino, sale e pepe fino a un composto granuloso.","Unisci la farina e lascia riposare in frigorifero 30 minuti.","Forma palline schiacciate con le mani bagnate.","Friggi in olio a 170 gradi per 4 minuti, finché sono scure fuori e verdi dentro."],"nota":"Con i ceci in scatola i falafel si sfaldano nell’olio. Non c’è trucco che tenga.","luogo":"Medio Oriente","estero":true,"all":["glutine"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":["frullatore o minipimer"],"att_opz":[]},{"id":116,"n":"Tabulè","cat":"Antipasti","tempo":30,"diff":"facile","tags":["vegetariano","vegano","senza cottura","senza forno"],"ing":[{"n":"bulgur","q":"150 gr","k":"bulgur"},{"n":"prezzemolo","q":"3 ciuffi","k":"prezzemolo"},{"n":"menta","q":"1 ciuffo","k":"menta"},{"n":"pomodori","q":"4","k":"pomodori"},{"n":"cipollotto","q":"3","k":"cipollotto"},{"n":"limone","q":"2","k":"limone"}],"proc":["Copri il bulgur con acqua fredda e lascialo gonfiare 30 minuti, poi strizzalo.","Trita il prezzemolo a coltello, molto fine: nel tabulè vero è l’ingrediente principale, non il bulgur.","Taglia i pomodori a cubetti piccolissimi, privandoli dei semi.","Mescola tutto con cipollotto e menta tritati.","Condisci con abbondante succo di limone, olio e sale, e lascia riposare mezz’ora."],"nota":"Il rapporto giusto è tre parti di prezzemolo e una di bulgur, non il contrario.","luogo":"Medio Oriente","estero":true,"all":["glutine"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":117,"n":"Baba ganoush","cat":"Antipasti","tempo":50,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"melanzane","q":"1 kg","k":"melanzane"},{"n":"tahina","q":"80 gr","k":"tahina"},{"n":"limone","q":"2","k":"limone"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"cumino","q":"1 cucchiaino","k":"cumino"}],"proc":["Cuoci le melanzane intere sulla fiamma viva o sotto il grill finché la pelle è nera e la polpa cede.","Falle intiepidire in un sacchetto chiuso, poi sbucciale e lasciale scolare 20 minuti.","Schiaccia la polpa con la forchetta, senza frullarla.","Unisci tahina, succo di limone, aglio schiacciato, cumino e sale.","Servi con olio abbondante e qualche foglia di prezzemolo."],"nota":"La bruciatura della pelle è il piatto: al forno chiuso viene una crema di melanzane qualunque.","luogo":"Medio Oriente","estero":true,"all":["sesamo"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":118,"n":"Shakshuka","cat":"Secondi","tempo":35,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"uova","q":"6","k":"uova"},{"n":"pomodori","q":"800 gr","k":"pomodori"},{"n":"peperoni","q":"2","k":"peperoni"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"cumino","q":"1 cucchiaino","k":"cumino"},{"n":"paprica","q":"1 cucchiaino","k":"paprica"},{"n":"coriandolo fresco","q":"1 ciuffo","k":"coriandolo fresco"}],"proc":["Stufa cipolla e peperoni a listarelle per 15 minuti.","Unisci aglio, cumino e paprica e tostali un minuto.","Aggiungi i pomodori a pezzi e cuoci 15 minuti finché la salsa è densa.","Fai sei incavi e sguscia dentro le uova.","Copri e cuoci 6 minuti: l’albume rappreso, il tuorlo liquido.","Completa con coriandolo e pane per raccogliere."],"nota":"Si porta in tavola nella padella e si mangia in comune: è metà del suo senso.","luogo":"Medio Oriente","estero":true,"all":["uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":119,"n":"Tajine di pollo con olive e limone","cat":"Secondi","tempo":90,"diff":"media","tags":[],"ing":[{"n":"pollo a pezzi","q":"1,2 kg","k":"pollo"},{"n":"cipolla","q":"3","k":"cipolla"},{"n":"olive verdi","q":"150 gr","k":"olive"},{"n":"limone","q":"2","k":"limone"},{"n":"zenzero","q":"20 gr","k":"zenzero"},{"n":"zafferano","q":"1 bustina","k":"zafferano"},{"n":"cumino","q":"1 cucchiaino","k":"cumino"},{"n":"coriandolo fresco","q":"1 ciuffo","k":"coriandolo fresco"}],"proc":["Massaggia il pollo con zenzero grattugiato, cumino, zafferano sciolto in poca acqua, sale e pepe.","Lascia insaporire almeno un’ora.","Rosola il pollo in olio, unisci le cipolle affettate e lasciale appassire.","Aggiungi un bicchiere d’acqua, copri e cuoci a fuoco bassissimo per un’ora.","Negli ultimi 15 minuti unisci olive e limone a fette.","Completa con coriandolo fresco e servi col pane."],"nota":"Il limone tradizionale è quello confit sotto sale: se non lo trovi, quello fresco a fette va bene.","luogo":"Marocco","estero":true,"all":[],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":120,"n":"Harira","cat":"Primi","tempo":75,"diff":"facile","tags":[],"ing":[{"n":"lenticchie","q":"200 gr","k":"lenticchie"},{"n":"ceci","q":"300 gr","k":"ceci"},{"n":"carne macinata","q":"200 gr","k":"carne macinata"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"coriandolo fresco","q":"2 ciuffi","k":"coriandolo fresco"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"cannella","q":"1 pizzico","k":"cannella"},{"n":"farina","q":"2 cucchiai","k":"farina"}],"proc":["Rosola la carne con cipolla e sedano tritati.","Unisci passata, cannella, sale e pepe, e cuoci dieci minuti.","Aggiungi lenticchie, ceci e due litri d’acqua, e cuoci 45 minuti.","Stempera la farina in una tazza d’acqua fredda e versala a filo mescolando: è quella che la lega.","Prosegui dieci minuti e completa con coriandolo e prezzemolo tritati in abbondanza."],"nota":"È la zuppa con cui si rompe il digiuno del Ramadan: deve essere densa e confortante, non brodosa.","luogo":"Marocco","estero":true,"all":["glutine","sedano"],"unico":true,"nvoci":10,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":121,"n":"Kofta di agnello","cat":"Secondi","tempo":30,"diff":"facile","tags":["senza forno"],"ing":[{"n":"agnello","q":"700 gr","k":"agnello"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"cumino","q":"2 cucchiaini","k":"cumino"},{"n":"paprica","q":"1 cucchiaino","k":"paprica"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Trita la cipolla finissima e strizzala in un panno per togliere l’acqua.","Impasta l’agnello macinato con cipolla, aglio, prezzemolo, spezie, sale e pepe.","Lavora l’impasto cinque minuti: qui serve che diventi appiccicoso, al contrario delle polpette.","Forma cilindri attorno agli spiedini, bagnandoti le mani.","Cuoci sulla griglia o in padella rovente, tre minuti per lato."],"nota":"L’acqua della cipolla è il motivo per cui le kofta si sfaldano sulla griglia.","luogo":"Medio Oriente","estero":true,"all":[],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["griglia o piastra","spiedini"],"att_opz":[]},{"id":122,"n":"Ceviche","cat":"Antipasti","tempo":40,"diff":"media","tags":["senza cottura","senza forno"],"ing":[{"n":"filetto di pesce bianco","q":"600 gr","k":"filetto di pesce bianco"},{"n":"lime","q":"8","k":"lime"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"peperoncino fresco","q":"1","k":"peperoncino fresco"},{"n":"coriandolo fresco","q":"1 ciuffo","k":"coriandolo fresco"},{"n":"patate","q":"2","k":"patate"}],"proc":["Taglia il pesce a cubi di due centimetri e tienilo in frigorifero.","Affetta la cipolla sottilissima e lasciala dieci minuti in acqua fredda.","Spremi i lime e mescolali con peperoncino tritato e sale: è la leche de tigre.","Versa sul pesce e lascia marinare dieci minuti, non di più.","Unisci cipolla e coriandolo e s
