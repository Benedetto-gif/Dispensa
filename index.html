function possiedo(k){
  if(S.dispensa.includes(k)) return true;
  if((EQUIV[k]||[]).some(x=>S.dispensa.includes(x))) return true;
  /* stesso ingrediente scritto al singolare o al plurale */
  const r = radiciDispensa();
  return r.has(radiceIng(k)) || (EQUIV[k]||[]).some(x=>r.has(radiceIng(x)));
}
function sostituto(k){
  return (D.sost_k[k]||[]).find(alt=>possiedo(alt)) || null;
}
function valuta(r){
  const mancanti = [], sostituibili = [];
  r.ing.forEach(i=>{
    if(possiedo(i.k)) return;
    const alt = sostituto(i.k);
    alt ? sostituibili.push([i.k, alt]) : mancanti.push(i.n);
  });
  const n = r.ing.length;
  const ho = n - mancanti.length - sostituibili.length;
  return {mancanti, sostituibili,
          pieno: Math.round(ho/n*100),
          sost: Math.round(sostituibili.length/n*100),
          pct: Math.round((ho + sostituibili.length*0.6)/n*100)};
}
/* ===== Clima del piatto: estivo (si mangia freddo, d'estate), invernale (caldo, sostanzioso, delle feste) o di tutto l'anno ===== */
const RE_ESTIVO_NOME = /\b(granit|gelat[oi]|sorbett|semifredd|ghiaccioli|gelo di|insalata di (riso|pasta|farro|orzo|mare|polpo)|pasta fredda|panzanella|gazpacho|salmorejo|caprese|vitello tonnato|cocomer|anguria|melone|frullat|smoothie|macedonia|te freddo|tè freddo|cous cous freddo|ceviche|tartare|carpaccio|pomodori ripieni freddi|insalata estiva|fredd[ao])\b/;
const RE_NON_ESTIVO = /\btorta caprese\b/;
const RE_ESTIVO_PROC = /(freezer|congelatore|gelatiera|ghiacciat)/;
const RE_INVERNALE_NOME = /\b(zupp|minestr|ribollita|acquacotta|vellutat|brodo|bollito|lesso|brasat|stracott|spezzatin|stufat|polenta|cassoeula|pasta e fagioli|pasta e ceci|pasta e lenticchie|lenticchie|fagioli all|cotechino|zampone|castagn|caldarroste|marron|cioccolata calda|vin brul|fonduta|bagna cauda|ossobuc|arrosto\b|arrosti\b|cinghiale|lepre|peposo|trippa|pizzoccheri|canederli|panettone|pandoro|struffoli|cartellate|torrone|mostacciol|cassata|buccellato|zelten|sbrisolona|crauti|verza|cavolo nero|bourguignon|goulash|gulasch|chili con carne|ramen|risotto alla zucca|zucca|porcini|tartufo)/;
function climaRicetta(r){
  if(r._clima != null) return r._clima;
  const nome = normTesto(r.n || ""), proc = normTesto((r.proc || []).join(" "));
  let c = "";
  if(RE_ESTIVO_NOME.test(nome) && !RE_NON_ESTIVO.test(nome)) c = "estivo";
  else if(RE_INVERNALE_NOME.test(nome)) c = "invernale";
  else if(RE_ESTIVO_PROC.test(proc) && r.cat === "Dolci") c = "estivo";
  else{
    /* dagli ortaggi e dalla frutta: se tutti quelli di stagione cadono d'estate, o tutti fra autunno e inverno */
    const st = r.ing.map(i=>D.stagioni[i.k]).filter(m=>m && m.length < 9);
    if(st.length >= 2){
      const estate = st.filter(m=>m.every(x=>x >= 5 && x <= 9)).length, inverno = st.filter(m=>m.every(x=>x >= 10 || x <= 3)).length;
      if(estate >= Math.ceil(st.length * .7)) c = "estivo";
      else if(inverno >= Math.ceil(st.length * .7)) c = "invernale";
    }
  }
  return r._clima = c;
}
/* fuori stagione: un piatto estivo da ottobre ad aprile, uno invernale da giugno a settembre */
function fuoriClima(r){
  const c = climaRicetta(r), m = meseStagione();
  return (c === "estivo" && (m >= 10 || m <= 4)) || (c === "invernale" && m >= 6 && m <= 9);
}
/* ===== Pranzo o cena: la sera si mangia piu' leggero ===== */
function pastoAttuale(){ return sess.pasto || (new Date().getHours() >= 16 ? "cena" : "pranzo"); }
function pesante(r){
  if(r._pesante != null) return r._pesante;
  if(r._kcal == null) r._kcal = calorieRicetta(r);
  const nome = normTesto(r.n || ""), proc = normTesto((r.proc || []).join(" "));
  const fritto = /\b(fritt|frittur|cotolett|impanat|arancin|crocchè|crocche|supplì|suppli|panzerott)/.test(nome) || /\bfriggete|\bfriggi|\bfriggere/.test(proc);
  const ricco = /\b(lasagn|parmigiana|carbonara|cassoeula|cotechino|zampone|timballo|pasta al forno|gattò|gatto|sartù|sartu|fonduta|bagna cauda|pizzoccheri|polenta concia|amatriciana|gricia|cacio e pepe|frittata di pasta|maiale|stinco)/.test(nome);
  return r._pesante = r.cat !== "Dolci" && (fritto || ricco || (r._kcal || 0) > 700);
}
function leggeroPerCena(r){ if(r._kcal == null) r._kcal = calorieRicetta(r); return !pesante(r) && (r.leggero || ((r._kcal || 0) > 0 && r._kcal <= 450)); }

function testoRicetta(r){

/* Ricerca tollerante: una parola cercata trova una parola del testo se ne e' l'inizio
   ("melanz" -> melanzane, ma "pita" non trova piu' "spanakopita"), oppure se le somiglia
   abbastanza da essere un errore di battitura: doppie e scempie si equivalgono
   ("caciucco" = "cacciucco") e da 5 lettere si perdona una lettera sbagliata. */
const scempia = x => x.replace(/([a-z])\1+/g, "$1");
function distanza(a, b){
  if(Math.abs(a.length - b.length) > 2) return 9;
  let prec = Array.from({length: b.length + 1}, (_, j)=>j);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prec[j] + 1, cur[j-1] + 1, prec[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prec = cur;
  }
  return prec[b.length];
}
let ricercaTollerante = false;   /* si accende solo se la ricerca esatta non trova niente */
function parolaTrova(w, testo){
  const parole = testo.split(" ");
  if(parole.some(p=>p.startsWith(w))) return true;
  if(!ricercaTollerante || w.length < 5) return false;
  const ws = scempia(w), tolleranza = ws.length >= 8 ? 2 : 1;
  return parole.some(p=>{
    const ps = scempia(p);
    return ps.startsWith(ws) || distanza(ws, ps) <= tolleranza
        || (ps.length > ws.length && distanza(ws, ps.slice(0, ws.length)) <= 1);
  });
}
const tutteTrovate = (parole, testo) => parole.every(w=>parolaTrova(w, testo));
/* ricette il cui nome combacia ma che i filtri del tavolo tengono fuori, con il motivo */
function paroleEvita(){
  const parole = (S.profilo.evita||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);
  return parole.map(v=>{ const k = IN_INGLESE ? chiaveDaInglese(v) : ""; return k || v; });
}
function esclusePerNome(){
  if(sess.modo !== "idea" || !sess.cerca.trim()) return [];
  const parole = normTesto(sess.cerca).split(" ").filter(Boolean);
  const evita = paroleEvita();
  const alg = allergeniTavolo();
  const out = [];
  archivio().forEach(r=>{
    if(!tutteTrovate(parole, nomeRicetta(r))) return;
    const m = [];
    if(S.nascoste.includes(r.id)) m.push("l'avevi nascosta con \u00abNon propormela pi\u00f9\u00bb");
    if(soloPref && !S.preferite.includes(r.id)) m.push("stai guardando solo le preferite");
    const a = alg.filter(x=>r.all.includes(x));
    if(a.length) m.push("contiene " + a.join(", ") + ", da escludere per qualcuno a tavola");
    const e = evita.filter(v=>r.ing.some(i=>i.k.includes(v)));
    if(e.length) m.push("contiene " + e.join(", ") + ", che non ti piace");
    if(sess.accordo === "unico" && RANGO[r.stile] < RANGO[sess.stile]) m.push("non \u00e8 " + sess.stile);
    { const vr = violaTavolo(r); if(vr) m.push(vr.v + " (" + nomeRelig(vr.rel) + ")"); }
    if(m.length) out.push({r, motivo: m.join("; ")});
  });
  return out;
}

/* per i Menu a tema: stile scelto (vegetariano/vegano), allergie a tavola, ingredienti da evitare, ricette nascoste */
function adattaAlTavolo(r){
  if((S.nascoste||[]).includes(r.id)) return false;
  if(RANGO[r.stile] < RANGO[sess.stile]) return false;
  const alg = allergeniTavolo(); if(alg.some(a=>r.all.includes(a))) return false;
  if(violaTavolo(r)) return false;
  const evita = paroleEvita(); if(evita.some(v=>r.ing.some(i=>i.k.includes(v)))) return false;
  return true;
}
function notaStileTema(){
  const p = [];
  if(sess.stile && sess.stile !== "onnivoro") p.push(L(sess.stile, sess.stile === "vegano" ? "vegan" : "vegetarian"));
  if(allergeniTavolo().length) p.push(L("allergie a tavola","table allergies"));
  regoleTavolo().forEach(rel=>p.push(nomeRelig(rel)));
  if(paroleEvita().length) p.push(L("ingredienti che non ti piacciono","ingredients you dislike"));
  return p.length ? `<p class="mini" style="margin-top:-2px">\u2705 ${L("Rispetto: ","Respecting: ")}${p.join(", ")}.</p>` : "";
}
/* come valuta(), ma con tutti i campi che scheda() si aspetta (usata fuori da filtra(), es. nel Menu a tema) */
function valutaCompleta(r){
  const v = valuta(r);
  v.r = r;
  v.zona = S.profilo.regione && r.luogo === S.profilo.regione;
  v.stag = diStagione(r);
  v.pref = S.preferite.includes(r.id);
  const q = S.cucinate[r.id];
  v.fatta = q ? (Date.now() - q) < GIORNI_RIPOSO*86400000 : false;
  return v;
}
function filtra(){
  ricercaTollerante = false;
  let out = filtraUnaVolta();
  if(!out.length && sess.modo === "idea" && sess.cerca.trim() && !esclusePerNome().length){
    ricercaTollerante = true;
    out = filtraUnaVolta();
    if(!out.length && !esclusePerNome().length) ricercaTollerante = false;
  }
  return out;
}
function filtraUnaVolta(){
  const evita = paroleEvita();
  const alg = allergeniTavolo();
  const lim = +sess.tempo;

  const parole = sess.modo === "idea" ? normTesto(sess.cerca).split(" ").filter(Boolean) : [];

  let out = archivio().filter(r=>{
    if(S.nascoste.includes(r.id)) return false;
    if(soloPref && !S.preferite.includes(r.id)) return false;
    if(alg.some(a=>r.all.includes(a))) return false;
    if(violaTavolo(r)) return false;
    if(evita.some(v=>r.ing.some(i=>i.k.includes(v)))) return false;
    if(sess.accordo === "unico" && RANGO[r.stile] < RANGO[sess.stile]) return false;

    /* se hai scritto il nome del piatto, tempo e portata non te lo nascondono */
    let perNome = false;
    if(parole.length){
      if(!tutteTrovate(parole, testoRicetta(r))) return false;
      perNome = tutteTrovate(parole, nomeRicetta(r));
    }
    if(!perNome){
      if(sess.portate.length && !sess.portate.includes(r.cat)) return false;
      if(sess.unico && !r.unico) return false;
      if(r.tempo > lim) return false;
    }
    if(sess.modo === "recupero" && sess.recupero.length){
      if(!sess.recupero.some(k=>r.ing.some(i=>i.k===k || (EQUIV[i.k]||[]).includes(k)))) return false;
    }
    return true;
  }).map(r=>{
    const v = valuta(r);
    v.r = r;
    v.zona = S.profilo.regione && r.luogo === S.profilo.regione;
    v.stag = diStagione(r);
    v.pref = S.preferite.includes(r.id);
    const q = S.cucinate[r.id];
    v.fatta = q ? (Date.now() - q) < GIORNI_RIPOSO*86400000 : false;
    if(sess.modo === "recupero") v.usa = sess.recupero.filter(k=>r.ing.some(i=>i.k===k || (EQUIV[i.k]||[]).includes(k)));
    const cercato = parole.length && tutteTrovate(parole, nomeRicetta(r));
    v.fuoriClima = !cercato && fuoriClima(r);
    v.pesanteCena = !cercato && pastoAttuale() === "cena" && pesante(r);
    v.leggeraCena = pastoAttuale() === "cena" && leggeroPerCena(r);
    return v;
  });

  /* quelle cucinate da poco scendono in fondo: e' cosi che l'archivio non si riduce a otto piatti */
  ordinaLista(out);
  return out;
}

/* saluto vocale femminile nella pagina Conosciamoci */
let ultimoSaluto = "";
function salutoVocale(nome){
  if(!nome || !("speechSynthesis" in window)) return;
  if(ultimoSaluto === nome) return;
  ultimoSaluto = nome;
  try{
    const dire = ()=>{
      const voci = speechSynthesis.getVoices();
      const lg = IN_INGLESE ? /^en/i : /^it/i;
      const voceF = voci.find(v=>lg.test(v.lang) && /female|donna|femmin|alice|elsa|paola|samantha|karen|serena|victoria|zira|susan|kate/i.test(v.name))
                 || voci.find(v=>lg.test(v.lang));
      const u = new SpeechSynthesisUtterance(L("Ciao ", "Hi ") + nome);
      u.lang = L("it-IT", "en-GB");
      if(voceF) u.voice = voceF;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.getVoices().length) dire();
    else speechSynthesis.onvoiceschanged = dire;
  }catch(e){}
}

function statoCercaDisp(){
  const q = cercaDisp.trim().toLowerCase();
  const elenco = Object.values(CAT_DISP).flat();          /* l'elenco di adesso, con le voci aggiunte o tolte */
  const trovato = !!q && (elenco.some(i=>i.toLowerCase()===q || nomeIng(i).toLowerCase()===q || radiceIng(i) === radiceIng(q))
    || (IN_INGLESE && elenco.includes(chiaveDaInglese(q))));
  /* voci che contengono le lettere scritte ma non sono quell'ingrediente (es. "salame a cubetti" per "salame") */
  const simili = !!q && !trovato && elenco.some(i=>i.toLowerCase().includes(q) || (IN_INGLESE && nomeIng(i).toLowerCase().includes(q)));
  return {q, trovato, simili};
}

          const nb = tit === "Cantina" ? nBottiglie(i) : 0;
          return `<button class="chip ${S.dispensa.includes(i)?"on":""}" data-i="${esc(i)}">${esc(etichettaDisp(i))}${stag}${nb ? ` <span class="cant-n">\u00d7${nb}</span>` : ""}${badgeScad(i)}</button>`; };
    const sotto = sottoReparti(tit, vis);
    return `<details class="pcella full cat-gruppo ${COLORE_REPARTO[tit]||"cat-grigio"}" ${q||repAperti.has(tit)?"open":""} data-rep="${esc(tit)}">

        ? sotto.map(([nome, l])=>`<div class="sotto-rep">${nome}</div><div class="chips">${ordinaPerEtichetta(l).map(chip).join("")}</div>`).join("")
        : `<div class="chips">${ordinaPerEtichetta(vis).map(chip).join("")}</div>`}
      </div></details>`;
  }).join("")}`;
}

/* dopo un'aggiunta o una ricerca: torno alla dispensa intera, con il reparto della voce aperto,
   la porto sotto gli occhi e la illumino un attimo */
function mostraInDispensa(k){
  cercaDisp = "";

  tappaDispensa();
  const b = Array.from(app.querySelectorAll("#repartiDisp [data-i]")).find(x=>x.dataset.i === k);

document.addEventListener("click", e=>{
  const t = e.target.closest(".all-apri");
  if(t){ e.preventDefault(); t.closest(".all-box").classList.toggle("all-chiusi"); return; }
  /* da chiuso, toccare un allergene attivo apre l'elenco invece di toglierlo per sbaglio */
  const c = e.target.closest(".all-chiusi > .chip");
  if(c){ e.preventDefault(); e.stopImmediatePropagation(); c.parentElement.classList.remove("all-chiusi"); }
}, true);
function aggiornaChiudiTutto(){
  const b = document.getElementById("chiudiTutto"); if(!b) return;
  const h = document.querySelector("header.top"); if(h) document.documentElement.style.setProperty("--alt-testata", h.offsetHeight + "px");
  b.parentElement.style.display = app.querySelector("details[data-rep][open]") ? "" : "none";
  b.onclick = ()=>{
    repAperti.clear();
    app.querySelectorAll("details[data-rep][open]").forEach(d=>{ d.open = false; });
    aggiornaChiudiTutto();
    const t = document.getElementById("repartiDisp");
    if(t){ const y = t.getBoundingClientRect().top + scrollY - (h ? h.offsetHeight : 0) - 70; if(scrollY > y) scrollTo({top:y, behavior:"smooth"}); }
  };
}
function collegaRepartiDisp(){
  app.querySelectorAll("details[data-rep]").forEach(d=>d.addEventListener("toggle", ()=>{
    aggiornaChiudiTutto();
    if(cercaDisp.trim()) return;
    d.open ? repAperti.add(d.dataset.rep) : repAperti.delete(d.dataset.rep);
  }));
  aggiornaChiudiTutto();
  /* tocco breve: segno o tolgo dalla dispensa. Tocco lungo: sposta o togli dall'elenco */
  app.querySelectorAll("[data-i]").forEach(b=>{
    let attesa = null, lungo = false;
    const ferma = ()=>{ clearTimeout(attesa); attesa = null; };
    const parti = ()=>{
      lungo = false;
      ferma();
      attesa = setTimeout(()=>{
        lungo = true;
        try{ navigator.vibrate && navigator.vibrate(30); }catch(err){}
        apriIngOpz(b.dataset.i);
      }, 500);
    };
    b.addEventListener("touchstart", parti, {passive:true});
    ["touchend","touchmove","touchcancel","mouseup","mouseleave"].forEach(ev=>b.addEventListener(ev, ferma));
    b.addEventListener("mousedown", parti);
    b.addEventListener("contextmenu", ev=>{ ev.preventDefault(); ferma(); apriIngOpz(b.dataset.i); });
    b.onclick = ()=>{
      if(lungo){ lungo = false; return; }
      if(b.closest(".cat-cantina")){ cantinaInModifica = -1; cantinaDettagli = false; apriCantina(b.dataset.i); return; }
      const v=b.dataset.i, i=S.dispensa.indexOf(v);
      if(i<0){ S.dispensa.push(v); if(BASE.has(v)) S.spesa = S.spesa.filter(x=>x.k!==v); }
      else{ S.dispensa.splice(i,1); if(BASE.has(v)) metti(v, v, ""); if(S.scad) delete S.scad[v]; const bs = b.querySelector(".scad-b"); if(bs) bs.remove(); }
      b.classList.toggle("on");
      S.dispensaData = new Date().toLocaleDateString("it-IT"); salva();
      if(i < 0 && cercaDisp.trim() && b.closest("#repartiDisp")) setTimeout(()=>mostraInDispensa(v), 350);
    };
  });

}

/* ===========================================================
   "Cosa ti va oggi?": ogni box si apre a tutto schermo e si richiude nel suo riquadro
   =========================================================== */
let boxAperto = null, boxAnima = false, ignoraPop = false;
const BOX_VOGLIA = {
  idea:     {c:"c-senape",   ic:()=>`<svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="12" r="7" stroke="currentColor" stroke-width="2"/><path d="M11 19h6M12 22h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`, t:()=>L("Ho in mente un piatto","I have a dish in mind")},
  recupero: {c:"c-mattone",  ic:()=>`<svg viewBox="0 0 28 28" fill="none"><rect x="7" y="10" width="14" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 10h18M11 10V7a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 14v5M12 16l2-2 2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`, t:()=>L("Devo consumare","I need to use up")},
  tema:     {c:"c-bordeaux", ic:()=>`<svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="10" stroke="currentColor" stroke-width="2"/><path d="M4 14h20M14 4c3 3 4 7 4 10s-1 7-4 10c-3-3-4-7-4-10s1-7 4-10z" stroke="currentColor" stroke-width="1.8"/></svg>`, t:()=>L("Menu a tema","Themed menu")},
  port:     {c:"c-crema",    ic:()=>`<span class="bp-emo">\u{1F37D}️</span>`, t:()=>L("Portata","Course")},
  tempo:    {c:"c-menta",    ic:()=>`<span class="bp-emo">⏱️</span>`, t:()=>L("Tempo","Time")},
  pasto:    {c:"c-senape",   ic:()=>`<span class="bp-emo">\u{1F570}️</span>`, t:()=>L("Pasto","Meal")},
  stile:    {c:"c-verde",    ic:()=>`<span class="bp-emo">\u{1F468}‍\u{1F373}</span>`, t:()=>L("Come la prepariamo","How we make it")}
};
function motoRidotto(){ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
function rettBox(k){
  const el = app.querySelector(`[data-m="${k}"], [data-box="${k}"]`);
  return el ? el.getBoundingClientRect() : null;
}
function clipDa(r){
  const W = innerWidth, H = innerHeight;
  return `inset(${Math.max(0,r.top)}px ${Math.max(0,W-r.right)}px ${Math.max(0,H-r.bottom)}px ${Math.max(0,r.left)}px round 14px)`;
}
function apriBox(k){
  boxAperto = k; boxAnima = true;
  /* il tasto Indietro del telefono richiude la pagina invece di uscire dall'app */
  try{ history.pushState({box:k}, ""); }catch(e){}
  tappaVoglia();
}
/* esce senza animazione (es. si passa all'elenco ricette) */
function lasciaBox(){
  if(!boxAperto) return;
  boxAperto = null; boxAnima = false;
  document.documentElement.classList.remove("box-su");
  { const pag = document.getElementById("boxPag"); if(pag) pag.remove(); }
  if(history.state && history.state.box){ ignoraPop = true; try{ history.back(); }catch(e){ ignoraPop = false; } }
}
function chiudiBox(daStoria){
  const k = boxAperto, pag = document.getElementById("boxPag");
  if(!k) return;
  if(!daStoria && history.state && history.state.box){ ignoraPop = true; try{ history.back(); }catch(e){ ignoraPop = false; } }
  const fine = ()=>{
    if(boxAperto !== k) return;
    boxAperto = null;
    /* un box di partenza chiuso senza scegliere nulla non resta selezionato */
    if(k === sess.modo && (k === "tema" || (k === "idea" && !sess.cerca.trim()) || (k === "recupero" && !sess.recupero.length))) sess.modo = null;
    tappaVoglia();
  };
  const r = rettBox(k);
  if(pag && r && !motoRidotto()){
    pag.style.pointerEvents = "none";
    const an = pag.animate([{clipPath: "inset(0px 0px 0px 0px round 0px)"}, {clipPath: clipDa(r)}],
                           {duration: 260, easing: "cubic-bezier(.4,0,.6,1)", fill: "forwards"});
    an.onfinish = fine;
  } else fine();
}
window.addEventListener("popstate", ()=>{
  if(ignoraPop){ ignoraPop = false; return; }
  if(boxAperto){ if(veloAperto) chiudiVelo(); else chiudiBox(true); }
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && boxAperto && !veloAperto) chiudiBox(); });
/* --- Portata e Tempo: tendine chiuse che mostrano solo la scelta fatta --- */
const TEMPO_MAX = 180;   /* il quadrante copre 3 ore, a scatti di 5 minuti */
function sintesiPortata(){
  const pz = sess.portate.map(p2=>(ICONA_PORTATA[p2]||"") + " " + p2.toLowerCase());
  if(sess.unico) pz.push("\u{1F958} " + L("unico","one-dish"));
  return pz.length ? pz.join(" · ") : L("tutte","all");
}
function sintesiTempo(v){
  const m = +v;
  if(!m || m >= 999) return "\u267E\uFE0F " + L("libero","no limit");
  const h = Math.floor(m/60), r = m%60;
  return L("entro ","within ") + (h ? h + " h" + (r ? " " + r + " min" : "") : r + " min");
}
function lancettaXY(m, raggio){
  const a = (m / TEMPO_MAX) * 2 * Math.PI - Math.PI/2;
  return [100 + raggio*Math.cos(a), 100 + raggio*Math.sin(a)];
}
function orologioTempo(){
  const m = +sess.tempo >= 999 ? 0 : +sess.tempo;
  let tacche = "";
  for(let t=0; t<TEMPO_MAX; t+=5){
    const lunga = t%30===0, [x1,y1] = lancettaXY(t, lunga?76:82), [x2,y2] = lancettaXY(t, 88);
    tacche += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="currentColor" stroke-width="${lunga?2.5:1}" opacity="${lunga?1:.55}"/>`;
    if(lunga){
      const [tx,ty] = lancettaXY(t, 62);
      const et = t===0 ? "3h" : t%60===0 ? (t/60)+"h" : (t<60 ? t+"'" : Math.floor(t/60)+"h30");
      tacche += `<text x="${tx.toFixed(1)}" y="${(ty+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${et}</text>`;
    }
  }
  const [hx,hy] = lancettaXY(m, 80);
  return `<div class="orologio">
    <svg viewBox="0 0 200 200" id="quadrante" role="slider" tabindex="0" aria-label="${L("Tempo a disposizione","Time available")}"
      aria-valuemin="0" aria-valuemax="${TEMPO_MAX}" aria-valuenow="${m}">
      <circle cx="100" cy="100" r="94" fill="rgba(255,255,255,.12)" stroke="currentColor" stroke-width="2"/>
      <path id="settore" d="${settore(m)}" fill="rgba(255,255,255,.28)"/>
      ${tacche}
      <line id="lancetta" x1="100" y1="100" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <circle id="pomello" cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="10" fill="#fff" stroke="currentColor" stroke-width="3"/>
      <circle cx="100" cy="100" r="6" fill="currentColor"/>
    </svg>
    <div class="oro-tasti">
      <button type="button" class="chip" id="tMeno" aria-label="${L("5 minuti in meno","5 minutes less")}">− 5'</button>
      <b id="tempoGrande">${sintesiTempo(sess.tempo)}</b>
      <button type="button" class="chip" id="tPiu" aria-label="${L("5 minuti in più","5 minutes more")}">+ 5'</button>
    </div>
    <div class="chips oro-rapidi">
      ${[["30","½ h"],["60","1 h"],["120","2 h"],["999","\u267E\uFE0F " + L("libero","no limit")]]
        .map(([v,t2])=>`<button type="button" class="chip ${sess.tempo===v?"on":""}" data-tr="${v}">${t2}</button>`).join("")}
    </div>
    <p class="mini" style="margin:6px 0 0">${L("Trascina la lancetta o usa i tasti.","Drag the hand or use the buttons.")}</p>
  </div>`;
}
function settore(m){
  if(!m) return "";
  if(m >= TEMPO_MAX) return "M100,6 A94,94 0 1,1 99.9,6 Z";
  const a = (m / TEMPO_MAX) * 2 * Math.PI - Math.PI/2;
  const x = 100 + 94*Math.cos(a), y = 100 + 94*Math.sin(a);
  return `M100,100 L100,6 A94,94 0 ${m > TEMPO_MAX/2 ? 1 : 0},1 ${x.toFixed(1)},${y.toFixed(1)} Z`;
}
function collegaOrologio(){
  const q = document.getElementById("quadrante");
  if(!q) return;
  const imposta = (m, ridisegna)=>{
    m = Math.max(5, Math.min(TEMPO_MAX, Math.round(m/5)*5));
    sess.tempo = String(m);
    const [hx,hy] = lancettaXY(m, 80);
    const l = document.getElementById("lancetta"), p = document.getElementById("pomello");
    l.setAttribute("x2", hx.toFixed(1)); l.setAttribute("y2", hy.toFixed(1));
    p.setAttribute("cx", hx.toFixed(1)); p.setAttribute("cy", hy.toFixed(1));
    document.getElementById("settore").setAttribute("d", settore(m));
    q.setAttribute("aria-valuenow", m);
    document.getElementById("tempoGrande").textContent = sintesiTempo(m);
    document.getElementById("tempoSintesi").textContent = sintesiTempo(m);
    document.querySelectorAll(".oro-rapidi .chip").forEach(c=>c.classList.toggle("on", c.dataset.tr === String(m)));
    if(ridisegna) tappaVoglia();
  };
  let ultimo = +sess.tempo >= 999 ? 0 : +sess.tempo, trascina = false;
  const daPuntatore = e=>{
    const r = q.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    let ang = Math.atan2(dy, dx) + Math.PI/2; if(ang < 0) ang += 2*Math.PI;
    let m = ang / (2*Math.PI) * TEMPO_MAX;
    /* niente salto da 3 ore a 0 (e viceversa) passando per la cima */
    if(ultimo > TEMPO_MAX*0.75 && m < TEMPO_MAX*0.25) m = TEMPO_MAX;
    else if(ultimo < TEMPO_MAX*0.25 && m > TEMPO_MAX*0.75) m = 5;
    ultimo = m;
    imposta(m, false);
  };
  q.addEventListener("pointerdown", e=>{ trascina = true; q.setPointerCapture(e.pointerId); daPuntatore(e); e.preventDefault(); });
  q.addEventListener("pointermove", e=>{ if(trascina) daPuntatore(e); });
  const fine = ()=>{ trascina = false; };
  q.addEventListener("pointerup", fine); q.addEventListener("pointercancel", fine);
  q.addEventListener("keydown", e=>{
    const m = +sess.tempo >= 999 ? 0 : +sess.tempo;
    if(e.key === "ArrowRight" || e.key === "ArrowUp"){ imposta(m + 5); e.preventDefault(); }
    if(e.key === "ArrowLeft" || e.key === "ArrowDown"){ imposta(m - 5); e.preventDefault(); }
  });
  const passo = d=>{ const m = +sess.tempo >= 999 ? 60 : +sess.tempo; ultimo = m + d; imposta(m + d); };
  document.getElementById("tMeno").onclick = ()=>passo(-5);
  document.getElementById("tPiu").onclick = ()=>passo(5);
  document.querySelectorAll(".oro-rapidi .chip").forEach(c=>c.onclick=()=>{ sess.tempo = c.dataset.tr; tappaVoglia(); });
}

/* ===========================================================
   Menu a tema: un paese, dall'antipasto al dolce
   =========================================================== */
function apriMenuTema(paese, nome){
  const corsi = ["Antipasti","Primi","Secondi","Dolci"];
  const blocchi = corsi.map(cat=>{
    const candidate = D.ricette.filter(r=>r.estero && r.luogo===paese && r.cat===cat && adattaAlTavolo(r));
    if(!candidate.length){
      const sing = SING[cat] || cat.toLowerCase();
      const nomeEn = trTesto(nome) || nome, singEn = trTesto(sing) || sing;
      const q = encodeURIComponent(IN_INGLESE ? nomeEn + " " + singEn + " recipe" : sing + " " + nome.toLowerCase());
      return `<div class="pcella full c-crema" style="cursor:default">
        <b>${cat}</b>
        <p class="mini" style="margin-top:4px" data-no-tr>${L(`Non ho ancora un ${sing} ${nome.toLowerCase()} in archivio.`, `I don't have a ${nomeEn} ${singEn} in the archive yet.`)}</p>
        <a class="cerca-web" target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}" data-no-tr>${L(`Cerca un ${sing} ${nome.toLowerCase()} sul web`, `Search the web for a ${nomeEn} ${singEn}`)}</a>
      </div>`;
    }
    const migliore = candidate.map(valutaCompleta).sort((a,b)=>b.pct-a.pct)[0];
    return `<div class="ric-grid" style="margin-bottom:10px">${scheda(migliore)}</div>`;
  }).join("");
  apriVelo("tema", `
    <div class="velo-top"><h2>Menu ${esc(nome)}</h2>
      <button class="chiudi" data-tema="chiudi" onclick="chiudiVelo()">Chiudi</button></div>
    <p class="mini">La proposta pi\u00f9 fattibile per ciascun corso, in base a quello che hai in dispensa.</p>
    ${notaStileTema()}
    ${blocchi}
  `);
}
/* menu a tema non legati a un paese */
let MS = null;   /* stato del menu speciale aperto: tema, scelte per corso, alternative */
function candidatiSpeciale(t, cat){
  const ok = r => r.cat === cat && adattaAlTavolo(r);
  if(t.ids){
    const scelte = (t.ids[cat]||[]).map(trovaRicetta).filter(Boolean).filter(adattaAlTavolo);
    if(scelte.length || sess.stile === "onnivoro") return scelte.map(valutaCompleta);
    /* per vegetariani/vegani, se nessun classico della festa va bene, propongo altri piatti adatti */
    return D.ricette.filter(r=>ok(r) && !r.estero).map(valutaCompleta).sort((a,b)=>b.pct-a.pct).slice(0,6);
  }
  let c = D.ricette.filter(ok);
  if(t.v === "mare") c = c.filter(r=>!eDiCarne(r) && (cat === "Dolci" ? (r.leggero || !r.ing.some(i=>LATT.has(i.k))) : eDiPesce(r)));
  else if(t.v === "terra") c = c.filter(r=>!eDiPesce(r) && (cat !== "Secondi" || sess.stile !== "onnivoro" || eDiCarne(r)));
  else if(t.v === "leggero"){
    c = c.filter(r=>{ if(r._kcal==null) r._kcal = calorieRicetta(r); return r._kcal > 0 && r._kcal <= KCAL_MAX[cat] && !/fritt|frittur|pastell|impanat|scapece|fried/i.test(r.n); });
    const l = c.filter(r=>r.leggero); if(l.length >= 3) c = l;
  }
  else if(t.v === "mondo") c = c.filter(r=>r.estero);
  if(t.v !== "mondo") c = c.filter(r=>!r.estero);
  return c.map(valutaCompleta).sort((a,b)=>b.pct-a.pct || ((a.r._kcal||0)-(b.r._kcal||0)));
}
function apriMenuSpeciale(v, scelte){
  const t = TEMI_SPECIALI.find(x=>x.v===v), corsi = ["Antipasti","Primi","Secondi","Dolci"];
  if(!scelte){
    scelte = {}; const usati = new Set();
    corsi.forEach(cat=>{
      let c = candidatiSpeciale(t, cat);
      if(t.ids) c = c.slice().sort((a,b)=>b.pct-a.pct);
      if(v === "mondo") c = c.filter(o=>!usati.has(o.r.luogo));
      if(c.length){ scelte[cat] = c[0].r.id; if(v === "mondo") usati.add(c[0].r.luogo); }
    });
  }
  MS = {v, scelte};
  if(v === "mare" && sess.stile !== "onnivoro"){
    apriVelo("tema", `<div class="velo-top"><h2>${t.e} <span data-no-tr>${L(t.t, t.ten)}</span></h2>
      <button class="chiudi" data-tema="chiudi" onclick="chiudiVelo()">${L("Chiudi","Close")}</button></div>
      <div class="sc-box" data-no-tr>\u{1F331} ${L(`Il menu di mare \u00e8 fatto di pesce e molluschi, quindi non \u00e8 compatibile con lo stile ${sess.stile} che hai scelto. Prova il menu di terra o ipocalorico: rispettano il tuo stile.`, `The seafood menu is built on fish and shellfish, so it doesn\u2019t fit the ${sess.stile === "vegano" ? "vegan" : "vegetarian"} style you chose. Try the land or low-calorie menu: they respect your style.`)}</div>`);
    return;
  }
  let tot = 0;
  const blocchi = corsi.map(cat=>{
    const tutte = candidatiSpeciale(t, cat);
    const sc = tutte.find(o=>o.r.id === scelte[cat]) || tutte[0];
    if(!sc){
      return `<div class="pcella full c-crema" style="cursor:default"><b>${cat}</b>
        <p class="mini" style="margin-top:4px">${L("Non ho ancora una proposta adatta in archivio.","I don\u2019t have a suitable recipe in the archive yet.")}</p>
        <a class="cerca-web" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(L(t.t+" "+(SING[cat]||cat), t.ten+" "+cat))}">${L("Cerca un\u2019idea sul web","Search the web for an idea")}</a></div>`;
    }
    if(sc.r._kcal==null) sc.r._kcal = calorieRicetta(sc.r);
    tot += sc.r._kcal || 0;
    const altre = tutte.filter(o=>o.r.id !== sc.r.id).slice(0, t.ids ? 6 : 4);
    return `<div class="ms-corso"><div class="ms-cat">${cat}</div>
      <div class="ric-grid">${scheda(sc)}</div>
      ${altre.length ? `<div class="chips ms-alt" data-no-tr><span class="mini">${L("Cambia con:","Swap for:")}</span>${altre.map(o=>`<button class="chip" data-ms-alt="${cat}|${o.r.id}">${esc(nomeR(o.r))}</button>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
  apriVelo("tema", `
    <div class="velo-top"><h2>${t.e} <span data-no-tr>${L(t.t, t.ten)}</span></h2>
      <button class="chiudi" data-tema="chiudi" onclick="chiudiVelo()">${L("Chiudi","Close")}</button></div>
    <p class="mini" data-no-tr>${v === "terra" && sess.stile !== "onnivoro" ? L("Niente pesce n\u00e9 carne: ortaggi, legumi, cereali e formaggi.","No fish or meat: vegetables, pulses, grains and cheese.") : L(t.d, t.den)} ${L("Per ogni corso ti propongo la ricetta pi\u00f9 fattibile con la tua dispensa.","For each course I suggest the recipe you can best make with your pantry.")}</p>
    ${notaStileTema()}
    ${blocchi}
    ${v === "leggero" && tot ? `<div class="sc-box" style="margin-top:12px" data-no-tr>\u{1F525} ${L(`Totale del pasto: circa ${tot} kcal a persona.`, `Meal total: about ${tot} kcal per person.`)}</div>` : ""}
  `);
}
document.addEventListener("click", e=>{
  const a = e.target.closest("[data-ms-alt]");

});

/* peso stimato (grammi) di un pezzo, quando la quantita' e' solo un numero (es. "2") */
const PEZZO_G = {
  "uova":60,"limone":90,"lime":50,"arancia":150,"arance":150,"mele":150,"pere":150,
  "pomodori":120,"pomodorini":18,"peperoncino secco":2,"peperoncino fresco":10,
  "cipolla":100,"cipollotto":30,"patate":150,"carota":60,"zucchine":150,
  "melanzane":250,"peperoni":150,"banane":120
};
function stimaGrammi(qTxt, chiave){
  const t = String(qTxt||"").toLowerCase().trim();
  if(!t || t.includes("q.b") || t.includes("qb")) return 0;
  const fr = t.match(/^(\d+)\s*\/\s*(\d+)/);
  const num = (t.match(/[\d.,]+/)||[])[0];
  const n = fr ? (+fr[1] / +fr[2]) : (num ? parseFloat(num.replace(",",".")) : null);
  if(/kg\b/.test(t)) return n*1000;
  if(/\bl\b|litro|litri/.test(t)) return n*1000;
  if(/ml\b/.test(t)) return n;
  if(/g\b|gr\b|grammi/.test(t)) return n;
  /* filetti: d'acciuga pochi grammi, di pesce o carne una porzione */
  if(/filett/.test(t)) return (n||1) * (/acciug|alic/.test(chiave||"") ? 4 : 150);
  for(const u in UNITA_G){ if(t.includes(u)) return (n||1) * UNITA_G[u]; }
  if(n!=null){
    /* numero senza unita' riconosciuta ("2", "1/2", "2 medie", "6 arance"): pezzi interi */
    const peso = PEZZO_G[chiave] != null ? PEZZO_G[chiave] : 50;
    return n * peso;
  }
  return 0;
}
/* calorie stimate a porzione: e' una stima approssimativa, non un dato nutrizionale certificato */
function calorieRicetta(r){
  let tot = 0;
  r.ing.forEach(i=>{
    const kcal100 = KCAL_100G[i.k];
    if(kcal100 == null) return;
    const g = stimaGrammi(i.q, i.k);
    tot += kcal100 * g / 100;
  });
  /* si divide per le porzioni della ricetta (4 di base; torte, porchette ecc. ne hanno di piu').
     nvoci e' il numero di ingredienti, non le porzioni */
  return Math.round(tot / porzioniDi(r) / 10) * 10;
}

/* Tabella nutrizionale per 100 g di piatto finito, non per porzione: ogni voce di MACRO_100G e'
   [proteine, grassi, carboidrati, fibre, sale, alcol, fattore di resa in cottura], tutti per 100 g
   dell'ingrediente crudo. Le quantita' di nutrienti restano quelle sommate dagli ingredienti (cuocere
   non crea ne' distrugge proteine o grassi); a cambiare e' il peso totale del piatto, che l'acqua persa
   o assorbita in cottura riduce o aumenta: il fattore di resa stima quel peso finale, ed e' quello che
   permette di riportare i nutrienti "per 100 g" del piatto pronto invece che degli ingredienti crudi. */
function valoriNutrizionali100g(r){
  let kcal=0, p=0, g=0, c=0, fibra=0, sale=0, alc=0, pesoCotto=0;
  r.ing.forEach(i=>{
    const kcal100 = KCAL_100G[i.k], m = MACRO_100G[i.k];
    if(kcal100 == null || m == null) return;
    const gr = stimaGrammi(i.q, i.k);
    if(!gr) return;
    const [mp,mg,mc,mf,ms,ma,resa] = m;
    kcal += kcal100 * gr/100;
    p += mp * gr/100; g += mg * gr/100; c += mc * gr/100;
    fibra += mf * gr/100; sale += ms * gr/100; alc += ma * gr/100;
    pesoCotto += gr * resa;
  });
  if(pesoCotto <= 0) return null;
  const f = 100 / pesoCotto;
  return {
    kcal: Math.round(kcal*f),
    p: Math.round(p*f*10)/10, g: Math.round(g*f*10)/10, c: Math.round(c*f*10)/10,
    fibra: Math.round(fibra*f*10)/10, sale: Math.round(sale*f*100)/100, alc: Math.round(alc*f*10)/10,
    peso: Math.round(pesoCotto)
  };
}
function apriNutrizione(r){
  const n = valoriNutrizionali100g(r);
  apriVelo("nutrizione", `
    <div class="velo-top"><h2>Valori nutrizionali</h2>
      <button class="chiudi" onclick="chiudiVelo()">Chiudi</button></div>
    <p class="mini" style="opacity:.8"><span data-no-tr>${esc(nomeR(r))}</span> \u2014 stima per 100 g di piatto pronto (peso finito stimato: ${n?n.peso:"?"} g in totale)</p>
    ${n ? `
    <table class="tab-nutri">
      <tr><td>Energia</td><td><b>${n.kcal}</b> kcal</td></tr>
      <tr><td>Proteine</td><td><b>${n.p}</b> g</td></tr>
      <tr><td>Grassi</td><td><b>${n.g}</b> g</td></tr>
      <tr><td>Carboidrati</td><td><b>${n.c}</b> g</td></tr>
      <tr><td>di cui fibre</td><td><b>${n.fibra}</b> g</td></tr>
      <tr><td>Sale</td><td><b>${n.sale}</b> g</td></tr>
      ${n.alc>0?`<tr><td>Alcol</td><td><b>${n.alc}</b> g</td></tr>`:""}
    </table>
    <p class="mini" style="margin-top:10px;opacity:.75">Valori stimati in base agli ingredienti e a un fattore di resa in cottura per ciascuno: non sono un dato nutrizionale certificato.</p>
    ` : `<p>Non ci sono abbastanza dati sugli ingredienti per calcolare questa tabella.</p>`}
  `);
}


/* ===== Da bere, dalla tua cantina: prima le bottiglie che hai, poi il consiglio generico ===== */
const VITIGNI_BIANCHI = ["Carricante","Catarratto","Chardonnay","Falanghina","Fiano","Friulano","Garganega","Gewürztraminer","Glera","Greco","Grillo","Inzolia","Malvasia","Moscato","Passerina","Pecorino","Pinot bianco","Pinot grigio","Ribolla gialla","Riesling","Sauvignon blanc","Trebbiano","Verdicchio","Vermentino","Zibibbo"];
/* che tipo di bevanda e' una voce o una bottiglia: rosso, bianco, rosato, spumante, dolce, birra (null = liquori e distillati) */
function classeVino(testo){
  const n = normTesto(testo);
  if(!n) return null;
  if(/birr|\bipa\b|lager|stout|weiss/.test(n)) return "birra";
  if(/spumant|prosecc|champagn|franciacort|\bbrut\b|cremant|\bcava\b|metodo classico|trento ?doc|\bglera\b/.test(n)) return "spumante";
  if(/passit|moscat|vin santo|marsala|zibibb|recioto|sauternes|\bporto\b|vendemmia tardiva|\bdolce\b/.test(n)) return "dolce";
  if(/rosat|\brose\b|cerasuolo/.test(n)) return "rosato";
  if(/ross/.test(n)) return "rosso";
  if(/bianc/.test(n)) return "bianco";
  const v = VITIGNI.find(x=>n.includes(normTesto(x)));
  if(v) return VITIGNI_BIANCHI.includes(v) ? "bianco" : "rosso";
  if(/\bvin[oi]\b/.test(n)) return "vino";
  return null;
}
const ICONA_CLASSE = {rosso:"\u{1F377}", bianco:"\u{1F942}", rosato:"\u{1F338}", spumante:"\u{1F37E}", dolce:"\u{1F36F}", birra:"\u{1F37A}", vino:"\u{1F377}"};
/* punteggio: 3 = vitigno indicato per il piatto, 2 = tipo giusto, 1 = va bene anche, 0 = non adatto */
function punteggioVino(classe, testo, c){
  const n = normTesto(testo);
  if(c.vitigni.some(v=>n.includes(normTesto(v))) && classe !== "birra") return 3;
  if(c.prime.includes(classe)) return 2;
  if(c.seconde.includes(classe)) return 1;
  /* "vino" senza colore: lo proponiamo solo come ripiego */
  if(classe === "vino" && c.prime.some(x=>["rosso","bianco","rosato"].includes(x))) return 1;
  return 0;
}
function dallaCantina(b){
  const c = b.cant; if(!c) return [];
  const trovati = [];
  S.dispensa.filter(eCantina).forEach(k=>{
    const lista = ((S.cantina || {})[k] || []);
    if(lista.length){
      lista.forEach(bt=>{
        const descr = [bt.etichetta, bt.vitigno].filter(Boolean).join(" ");
        const cl = classeVino(descr) || classeVino(k);
        const testo = k + " " + descr;
        const pt = punteggioVino(cl, testo, c);
        if(pt) trovati.push({k, b:bt, cl, pt});
      });
    } else {
      const cl = classeVino(k), pt = punteggioVino(cl, k, c);
      if(pt) trovati.push({k, b:null, cl, pt});
    }
  });
  return trovati.sort((x, y)=>y.pt - x.pt || (+(!!y.b) - +(!!x.b))).slice(0, 4);
}
function htmlDallaCantina(b){
  if(!b.cant) return "";
  const t = dallaCantina(b);
  if(!t.length){
    const haCantina = S.dispensa.some(eCantina);
    return `<p class="mini cant-bere-no">\u{1F5C4}️ ${haCantina
      ? L("Nella tua cantina non c’è una bottiglia adatta a questo piatto: ecco cosa cercare.","There’s no suitable bottle in your cellar for this dish: here’s what to look for.")
      : L("La tua cantina è vuota: ecco cosa cercare.","Your cellar is empty: here’s what to look for.")}</p>`;
  }
  const giudizio = pt=>pt===3 ? L("perfetto per questo piatto","perfect for this dish") : pt===2 ? L("adatto","suitable") : L("va bene anche questo","this works too");
  return `<div class="cant-bere">
    <b>\u{1F5C4}️ ${L("Dalla tua cantina","From your cellar")}</b>
    <ul>${t.map(x=>{
      const nome = x.b ? (x.b.etichetta || nomeIng(x.k)) : nomeIng(x.k);
      const det = x.b ? [x.b.azienda, x.b.vitigno, x.b.annata].filter(Boolean).join(" · ") : "";
      return `<li class="cb-${x.pt}"><button type="button" class="cant-bere-btn" data-dalcantina="${esc(x.k)}" onclick="event.preventDefault()">
        <span class="cb-ic" aria-hidden="true">${ICONA_CLASSE[x.cl] || "\u{1F377}"}</span>
        <span class="cb-tx"><span data-no-tr>${esc(nome)}</span>${det ? `<span class="mini" data-no-tr>${esc(det)}</span>` : ""}</span>
        <span class="cb-giu">${x.pt===3 ? "★ " : x.pt===2 ? "✓ " : ""}${giudizio(x.pt)}</span></button></li>`;
    }).join("")}</ul>
    ${t[0].pt < 2 ? `<p class="mini" style="margin-top:6px">${L("Non hai il tipo ideale: questi sono un ripiego. Se vuoi comprarne uno, ecco cosa cercare.","You don’t have the ideal type: these are a fallback. If you want to buy one, here’s what to look for.")}</p>` : ""}
  </div>`;
}
document.addEventListener("click", e=>{

function abbinamentoBevanda(r){
  const chiavi = r.ing.map(i=>i.k.toLowerCase());
  const nome = r.n.toLowerCase();
  const testoProc = (r.proc||[]).join(" ").toLowerCase().replace(/soffri\w*/g,"");
  const fritto = /frigg|fritt/.test(testoProc) || /fritt/.test(nome);
  const piccante = contiene(chiavi, ["peperoncino","nduja","harissa"]);
  const pesce = eDiPesce(r);
  const carneRossa = contiene(chiavi, ["manzo","vitello","agnello","maiale","cinghiale","salsiccia","guanciale","pancetta","brasato","stracotto","tartare","bistecca","filetto","macinat","polpette","salame","bresaola","ossobuco","cacciagione","anatra"]);
  const carneBianca = contiene(chiavi, ["pollo","tacchino","coniglio","faraona"]);
  const formaggioStag = contiene(chiavi, ["parmigiano","pecorino","grana","gorgonzola","taleggio","provolone","stravecchio","stagionat"]);
  const funghiTartufo = contiene(chiavi, ["fungh","tartufo","porcini"]);
  const pizza = nome.includes("pizza");
  const bibita = it=>({tipo:it.tipo, car:it.car, alt:it.alt, cant:it.cant||null});

  if(r.cat==="Dolci")
    return bibita({tipo:"Vino dolce o passito", car:"morbido, aromatico, con note di miele, frutta secca o frutta candita",
      alt:"In alternativa: una birra scura e dolce (stout), oppure un tè freddo poco zuccherato o una spuma nera per restare analcolici.",
      cant:{prime:["dolce"], seconde:["spumante"], vitigni:["Moscato","Zibibbo","Malvasia"]}});
  if(pizza)
    return bibita({tipo:"Birra chiara, tipo lager o pilsner", car:"fresca, ben frizzante, leggermente amara",
      alt:"In alternativa: un vino rosso giovane e frizzante (es. Lambrusco), o un'acqua molto fredda e frizzante.",
      cant:{prime:["birra"], seconde:["spumante"], vitigni:["Lambrusco"]}});
  if(pesce)
    return bibita({tipo:fritto?"Vino bianco frizzante o spumante Brut":"Vino bianco secco",
      car:fritto?"bollicine fini, acidità decisa, utili a sgrassare il fritto":
          piccante?"aromatico e sapido, per bilanciare la nota piccante (es. Vermentino, Falanghina)":
          "fresco, minerale, con note floreali e agrumate (es. Vermentino, Falanghina, Verdicchio)",
      alt:"In alternativa: una birra chiara leggera, o acqua frizzante con una fetta di limone.",
      cant:fritto ? {prime:["spumante"], seconde:["bianco","birra"], vitigni:["Glera"]}
                  : {prime:["bianco"], seconde:["spumante","rosato"], vitigni:["Vermentino","Falanghina","Verdicchio","Grillo","Carricante","Fiano","Greco","Inzolia","Catarratto","Pecorino","Friulano","Ribolla gialla","Sauvignon blanc","Trebbiano"]}});
  if(carneRossa)
    return bibita({tipo:"Vino rosso"+(r.leggero?" di medio corpo":" corposo"),
      car:r.leggero?"morbido, fruttato, tannini non troppo marcati (es. Chianti giovane, Montepulciano)":
                     "strutturato, tannico, adatto a un piatto sostanzioso (es. Nero d'Avola, Chianti Classico, Montepulciano d'Abruzzo)",
      alt:"In alternativa: una birra ambrata o doppio malto, dal corpo pieno.",
      cant:{prime:["rosso"], seconde:["birra"], vitigni:r.leggero ? ["Sangiovese","Montepulciano","Barbera","Dolcetto","Merlot","Frappato","Nerello Mascalese","Teroldego"]
                                                         : ["Nero d'Avola","Sangiovese","Montepulciano","Aglianico","Primitivo","Nebbiolo","Cannonau","Sagrantino","Cabernet Sauvignon","Syrah","Negroamaro","Nerello Mascalese","Nero di Troia"]}});
  if(carneBianca)
    return bibita({tipo:"Vino rosso leggero o bianco strutturato",
      car:"poco tannico, fruttato se rosso; morbido e con un breve affinamento se bianco (es. Vermentino strutturato, Chardonnay)",
      alt:"In alternativa: una birra chiara artigianale dal profilo morbido.",
      cant:{prime:["rosso","bianco"], seconde:["rosato","birra"], vitigni:["Frappato","Pinot nero","Nerello Mascalese","Dolcetto","Barbera","Chardonnay","Vermentino","Fiano","Grillo","Carricante"]}});
  if(formaggioStag)
    return bibita({tipo:"Vino rosso robusto o, per i più stagionati, un passito",
      car:"sapido e strutturato, capace di reggere il gusto deciso del formaggio",
      alt:"In alternativa: una birra ambrata o un vino bianco molto strutturato.",
      cant:{prime:["rosso","dolce"], seconde:["birra","bianco"], vitigni:["Nero d'Avola","Aglianico","Primitivo","Nebbiolo","Sagrantino","Montepulciano","Cannonau","Zibibbo","Moscato"]}});
  if(funghiTartufo)
    return bibita({tipo:"Vino rosso elegante", car:"terroso, delicato, non troppo tannico (es. Nebbiolo, Barbera)",
      alt:"In alternativa: un bianco strutturato e maturo.",
      cant:{prime:["rosso"], seconde:["bianco"], vitigni:["Nebbiolo","Barbera","Pinot nero","Nerello Mascalese","Sangiovese"]}});
  return bibita({tipo:"Vino bianco leggero o rosato", car:"fresco, snello, facile da abbinare a un piatto delicato di verdure o legumi",
    alt:"In alternativa: una birra chiara leggera, o acqua frizzante con erbe aromatiche.",
    cant:{prime:["bianco","rosato"], seconde:["spumante","birra"], vitigni:["Vermentino","Grillo","Falanghina","Catarratto","Inzolia","Pinot grigio","Trebbiano","Frappato","Carricante"]}});
}

/* ===========================================================
   Dosi: ogni ricetta ha le sue porzioni (4 di base), qui si riscala
   =========================================================== */
function dosiAttuali(){ return dosiPer || Math.max(1, tavolata().length); }
/* Le preparazioni "intere" (8 porzioni o piu': torte, biscotti, porchetta, lasagne in teglia)
   non si rimpiccioliscono: un sesto di torta non si inforna. Si ingrandiscono solo se a tavola
   c'e' piu' gente delle porzioni previste. */
function fattoreDosiP(p){
  const d = dosiAttuali();
  if(p >= 8 && d <= p) return 1;
  return d / p;
}
function fattoreDosi(r){ return fattoreDosiP(porzioniDi(r)); }
function rigaDosi(r){
  const p = porzioniDi(r);
  const intera = p >= 8 ? `<div class="mini" data-dosi-nota="${p}" style="margin-top:4px">${notaIntera(p)}</div>` : "";
  return `<div class="dosi">Dosi per <button data-dosi="-1" aria-label="Meno">\u2212</button>` +
         `<b data-dosi-n>${dosiAttuali()}</b>` +
         `<button data-dosi="1" aria-label="Piu">+</button> a tavola</div>` +
         (p !== PORZIONI ? `<div class="mini" style="margin-top:4px">La ricetta \u00e8 per ${p} porzioni.</div>` : "") + intera;
}
function notaIntera(p){
  return dosiAttuali() <= p
    ? "Dosi per la preparazione intera: quello che avanza si conserva."
    : "Dosi aumentate per tutti quelli a tavola.";
}
function scalaQ(q, f){
  const t = String(q);
  if(Math.abs(f - 1) < 0.001) return t;
  let val, resto, m = t.match(/^\s*(\d+)\s*\/\s*(\d+)(.*)$/);
  if(m){ val = (+m[1]) / (+m[2]); resto = m[3]; }
  else{
    m = t.match(/^\s*(\d+(?:[.,]\d+)?)(.*)$/);
    if(!m) return t;                                   /* "qualche foglia", "1 ciuffo" senza numero */
    val = parseFloat(m[1].replace(",", ".")); resto = m[2];
  }
  const u = resto.trim().toLowerCase();
  let v = val * f;
  if(/^(gr|g|ml)\b/.test(u)){
    v = v < 20 ? Math.max(1, Math.round(v))
      : v < 100 ? Math.round(v/5)*5
      : Math.round(v/10)*10;
  }
  else if(/^(kg|l)\b/.test(u))                              v = Math.round(v*20)/20;
  else if(/^(cucchia|tazz|bicchier|pizzic|tbsp|tsp|tablesp|teasp|cup)/.test(u)) v = Math.max(0.5, Math.round(v*2)/2);
  else                                                      v = Math.max(1, Math.round(v));
  let txt;
  if(Number.isInteger(v)) txt = String(v);
  else if(Math.abs(v % 1 - 0.5) < 0.001) txt = v < 1 ? "\u00bd" : Math.floor(v) + "\u00bd";
  else txt = String(Math.round(v*100)/100).replace(".", ",");
  if(v === 1) resto = resto.replace(/^(\s*)(cucchiai|cucchiaini|spicchi|fette|filetti|rametti|foglie|ciuffi|coste|bustine|rotoli)\b/,
    (t,sp,w)=>sp + ({cucchiai:"cucchiaio",cucchiaini:"cucchiaino",spicchi:"spicchio",fette:"fetta",
      filetti:"filetto",rametti:"rametto",foglie:"foglia",ciuffi:"ciuffo",coste:"costa",
      bustine:"bustina",rotoli:"rotolo"}[w] || w));
  return txt + resto;
}

/* ===========================================================
   Elenchi lunghi: al posto della tendina del telefono (che si apre a tutto
   schermo e costringe a scorrere tutto) una casella in cui si scrive e un
   elenco breve dei risultati. Vale per qualunque <select> con piu' di 15 voci.
   La <select> resta nascosta sotto e conserva il valore, quindi il resto
   del codice continua a leggerla come prima.
   =========================================================== */
function tendinaCercabile(sel){
  if(sel._cercabile || sel.options.length <= 15) return;
  sel._cercabile = true;
  const voci = [...sel.options].map(o=>({v:o.value, t:o.textContent.trim()}));
  const fisse = voci.filter(o=>o.v === "");          /* es. "— è un ingrediente nuovo —" */
  const normali = voci.filter(o=>o.v !== "");
  const testoDi = v => (voci.find(o=>o.v === v) || {t:""}).t;

  const box = document.createElement("div");
  box.className = "cb";
  box.innerHTML = `<div class="cb-riga"><input type="text" class="cb-in" autocomplete="off" enterkeyhint="done"
      placeholder="\u{1F50D} Scrivi per cercare fra ${normali.length} voci"><button type="button" class="cb-x" aria-label="Cancella">✕</button></div>
    <div class="cb-scelta"></div><div class="cb-lista" role="listbox"></div>`;
  sel.style.display = "none";
  sel.parentNode.insertBefore(box, sel.nextSibling);
  const inp = box.querySelector(".cb-in"), lista = box.querySelector(".cb-lista"),
        scelta = box.querySelector(".cb-scelta"), x = box.querySelector(".cb-x");

  const mostraScelta = ()=>{
    scelta.innerHTML = sel.value
      ? `Scelto: <b>${esc(testoDi(sel.value))}</b>`
      : (fisse[0] ? `Scelto: <b>${esc(fisse[0].t)}</b>` : "");
  };
  const scegli = v=>{
    sel.value = v;
    sel.dispatchEvent(new Event("change", {bubbles:true}));
    inp.value = ""; lista.innerHTML = ""; lista.classList.remove("aperta");
    mostraScelta();
  };
  const disegna = ()=>{
    const q = normTesto(inp.value);
    x.style.visibility = inp.value ? "visible" : "hidden";
    if(!q){ lista.innerHTML = ""; lista.classList.remove("aperta"); return; }
    const inizio = normali.filter(o=>normTesto(o.t).startsWith(q));
    const dentro = normali.filter(o=>!normTesto(o.t).startsWith(q) && normTesto(o.t).includes(q));
    const trovate = inizio.concat(dentro).slice(0, 12);
    lista.innerHTML =
      trovate.map(o=>`<button type="button" class="cb-voce" data-v="${esc(o.v)}">${esc(o.t)}</button>`).join("")
      + (trovate.length ? "" : `<div class="cb-vuoto">Nessuna voce con «${esc(inp.value)}»</div>`)
      + fisse.map(o=>`<button type="button" class="cb-voce cb-fissa" data-v="">${esc(o.t)}</button>`).join("");
    lista.classList.add("aperta");
  };
  inp.addEventListener("input", disegna);
  inp.addEventListener("keydown", e=>{
    if(e.key === "Enter"){ e.preventDefault(); const p = lista.querySelector(".cb-voce"); if(p) scegli(p.dataset.v); }
  });
  /* pointerdown invece di click: la tastiera che si chiude non fa saltare il tocco */
  lista.addEventListener("pointerdown", e=>{
    const b = e.target.closest(".cb-voce"); if(!b) return;
    e.preventDefault(); scegli(b.dataset.v);
  });
  x.onclick = ()=>{ inp.value = ""; disegna(); inp.focus(); };
  x.style.visibility = "hidden";
  sel._aggiorna = mostraScelta;   /* se il valore cambia da codice (es. regione dal GPS) */
  mostraScelta();
}
new MutationObserver(()=>document.querySelectorAll("select").forEach(tendinaCercabile))
  .observe(document.body, {childList:true, subtree:true});

/* ===========================================================
   Tasto ✕ nelle caselle di ricerca: svuota tutto con un tocco.
   Si aggiunge da solo a ogni casella elencata qui sotto (e a quelle
   di tipo "search"), anche quando la pagina viene ridisegnata.
   =========================================================== */
const CASELLE_CON_X = '#qIdea, #recCerca, #qScienza, #impUrl, input[type="search"]';
function aggiungiX(inp){
  if(inp._conX || inp.closest(".cx")) return;
  inp._conX = true;
  /* spostare la casella le toglie il cursore: se ce l'aveva, glielo ridò */
  const attiva = document.activeElement === inp;
  const pos = attiva ? [inp.selectionStart, inp.selectionEnd] : null;
  const w = document.createElement("span");
  w.className = "cx";
  inp.parentNode.insertBefore(w, inp);
  w.append(inp);
  if(attiva){ inp.focus({preventScroll:true}); try{ inp.setSelectionRange(pos[0], pos[1]); }catch(e){} }
  const x = document.createElement("button");
  x.type = "button"; x.className = "cx-x"; x.textContent = "✕";
  x.setAttribute("aria-label", "Cancella tutto");
  w.append(x);
  /* sempre visibile, cosi' si sa che c'e'; a casella vuota e' piu' tenue */
  const mostra = ()=>{ x.classList.toggle("vuota", !inp.value); };
  inp.addEventListener("input", mostra);
  /* pointerdown: la casella non perde il cursore e la tastiera resta aperta */
  x.addEventListener("pointerdown", e=>e.preventDefault());
  x.addEventListener("click", ()=>{
    inp.value = "";
    inp.dispatchEvent(new Event("input", {bubbles:true}));
    /* se la pagina si e' ridisegnata, rimetto il cursore nella casella nuova */
    const viva = inp.isConnected ? inp : (inp.id && document.getElementById(inp.id));
    if(viva){ viva.focus(); }
  });
  mostra();
}
new MutationObserver(()=>document.querySelectorAll(CASELLE_CON_X).forEach(aggiungiX))
  .observe(document.body, {childList:true, subtree:true});
document.querySelectorAll(CASELLE_CON_X).forEach(aggiungiX);

/* ===========================================================
   Link esterni (ricerche di ricette, Google, GialloZafferano...).
   Su Android, se l'app gira dentro una "scheda personalizzata" o come app
   installata, i link si aprivano in una finestrella senza "Copia link".
   Li apro invece in Chrome vero, dove i tre puntini permettono di copiarlo.
   Su iPhone e computer resta il comportamento normale.
   =========================================================== */
const SU_ANDROID = /Android/i.test(navigator.userAgent || "");
function intentChrome(url){
  const u = new URL(url);
  return "intent://" + u.host + u.pathname + u.search + u.hash.replace(/#/g, "%23") +
         "#Intent;scheme=" + u.protocol.replace(":", "") + ";package=com.android.chrome;" +
         "S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
}
function apriFuori(url){
  if(SU_ANDROID){ try{ location.href = intentChrome(url); return; }catch(e){} }
  window.open(url, "_blank", "noopener");
}
document.addEventListener("click", e=>{
  const a = e.target.closest && e.target.closest('a[target="_blank"]');
  if(!a || !SU_ANDROID || !/^https?:/i.test(a.href)) return;
  e.preventDefault();
  apriFuori(a.href);
}, true);

/* ===========================================================
   Modalita cucina: un passo per volta, timer, schermo acceso
   =========================================================== */
let cucina = null, schermo = null;
let timFine = 0, timInt = null, timSuonato = false;

async function tieniSchermo(){
  try{ if("wakeLock" in navigator) schermo = await navigator.wakeLock.request("screen"); }catch(e){}
}
function rilasciaSchermo(){ try{ schermo && schermo.release(); }catch(e){} schermo = null; }

const NUMPAROLA = {un:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,
  quindici:15,venti:20,venticinque:25,trenta:30,quaranta:40,cinquanta:50,sessanta:60};
function minutiPasso(t){
  let x = String(t).toLowerCase();
  x = x.replace(/\b(un|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|quindici|venti|venticinque|trenta|quaranta|cinquanta|sessanta)\s+(minut|or[ae])/g,
                (m,w,u)=>NUMPAROLA[w] + " " + u);
  let m = x.match(/(\d+)\s*(?:[-oe]\s*\d+\s*)?minut/);
  if(m) return +m[1];
  m = x.match(/(\d+)\s*min\b/);
  if(m) return +m[1];
  m = x.match(/(\d+)\s*or[ae]\b/);
  if(m) return Math.min(180, +m[1]*60);
  if(/\bun\s+minut/.test(x)) return 1;
  if(/mezz\s*\u2019?\s*ora/.test(x)) return 30;
  if(/un\s*\u2019?\s*ora/.test(x)) return 60;
  return 0;
}
const mmss = ms=>{
  const t = Math.max(0, Math.round(ms/1000));
  return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0");
};
function avviaTimer(min){
  timFine = Date.now() + min*60000; timSuonato = false;
  if(timInt) clearInterval(timInt);
  timInt = setInterval(battito, 1000);
  disegnaCucina();
}
function fermaTimer(){
  if(timInt) clearInterval(timInt);
  timInt = null; timFine = 0; timSuonato = false;
}
function battito(){
  const resta = timFine - Date.now();
  const el = document.getElementById("timerNum");
  if(el) el.textContent = mmss(resta);
  if(resta <= 0){
    clearInterval(timInt); timInt = null; timSuonato = true;
    sveglia();
    if(cucina && (cucina.voce || cucina.ascolta)) setTimeout(()=>parla(L("Tempo scaduto!","Time's up!")), 1600);
    if(veloAperto === "cucina") disegnaCucina();
  }
}
function sveglia(){
  try{ navigator.vibrate && navigator.vibrate([300,150,300,150,300]); }catch(e){}
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.6, 1.2].forEach(d=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.35);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.4);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 2500);
  }catch(e){}
}
/* ---------- Modalita cucina a voce ----------
   leggo il passo ad alta voce; con i comandi a voce si va avanti senza toccare lo schermo.
   Mentre parlo il microfono e' spento, cosi' non sento me stessa. */
let voceRec = null, voceParla = false;
function voceScelta(){
  const voci = ("speechSynthesis" in window) ? speechSynthesis.getVoices() : [];
  const lg = IN_INGLESE ? /^en/i : /^it/i;
  return voci.find(v=>lg.test(v.lang) && /female|donna|femmin|alice|elsa|paola|samantha|karen|serena|victoria|zira|susan|kate/i.test(v.name))
      || voci.find(v=>lg.test(v.lang)) || null;
}
function parla(testo){
  if(!("speechSynthesis" in window) || !testo) return;
  try{
    fermaAscolto(true);
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(testo);
    u.lang = L("it-IT","en-GB"); const v = voceScelta(); if(v) u.voice = v;
    u.rate = 0.95;
    voceParla = true;
    u.onend = u.onerror = ()=>{ voceParla = false; if(cucina && cucina.ascolta && veloAperto === "cucina") avviaAscolto(); };
    speechSynthesis.speak(u);
  }catch(e){ voceParla = false; }
}
function testoPiano(html){ const d = document.createElement("div"); d.innerHTML = html; return (d.textContent || "").replace(/\s+/g, " ").trim(); }
function leggiPasso(){
  if(!cucina) return;
  const r = cucina.r, n = r.proc.length, min = minutiPasso(r.proc[cucina.i]);
  let t = L(`Passo ${cucina.i+1} di ${n}. `, `Step ${cucina.i+1} of ${n}. `) + testoPiano(pulito(procR(r)[cucina.i]));
  if(min && timInt === null && !timSuonato) t += cucina.ascolta ? L(` C'\u00e8 un timer di ${min} minuti: d\u00ec timer per avviarlo.`, ` There's a ${min} minute timer: say timer to start it.`)
                                                                : L(` C'\u00e8 un timer di ${min} minuti.`, ` There's a ${min} minute timer.`);
  if(cucina.i === n - 1) t += L(" \u00c8 l'ultimo passo.", " This is the last step.");
  cucina.detto = cucina.i;
  parla(t);
}
function leggiIngredienti(){
  const r = cucina.r, f = fattoreDosi(r);
  parla(L("Ingredienti: ", "Ingredients: ") + r.ing.map(i=>{ const q = scalaQ(i.q, f); return (q && q !== "q.b." ? q + (!IN_INGLESE && /[a-z]\.?$/i.test(q) ? " di " : " ") : "") + (IN_INGLESE ? nomeIng(i.k || i.n) : i.n); }).join(", ") + ".");
}
function avviaAscolto(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR || !cucina || !cucina.ascolta || voceParla) return;
  try{
    if(!voceRec){
      voceRec = new SR();
      voceRec.lang = L("it-IT","en-GB"); voceRec.continuous = true; voceRec.interimResults = false;
      voceRec.onresult = ev=>{
        const t = ev.results[ev.results.length - 1][0].transcript.toLowerCase().trim();
        const s2 = document.getElementById("voceSentito"); if(s2) s2.textContent = "\u00ab" + t + "\u00bb";
        comandoVoce(t);
      };
      voceRec.onerror = ev=>{
        if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){
          cucina && (cucina.ascolta = false);
          alert(L("Per i comandi a voce serve il permesso di usare il microfono: puoi darlo dalle impostazioni del browser.","Voice commands need permission to use the microphone: you can grant it in the browser settings."));
          if(veloAperto === "cucina") disegnaCucina();
        }
      };
      voceRec.onend = ()=>{ voceRec.attivo = false;
        if(cucina && cucina.ascolta && veloAperto === "cucina" && !voceParla) setTimeout(avviaAscolto, 250); };
    }
    if(!voceRec.attivo){ voceRec.start(); voceRec.attivo = true; }
  }catch(e){}
}
function fermaAscolto(pausa){
  try{ if(voceRec && voceRec.attivo){ voceRec.abort(); voceRec.attivo = false; } }catch(e){}
  if(!pausa && voceRec){ voceRec.onend = null; voceRec = null; }
}
function spegniVoce(){
  if(cucina){ cucina.ascolta = false; cucina.voce = false; }
  fermaAscolto(false);
  try{ speechSynthesis.cancel(); }catch(e){}
  voceParla = false;
}
function comandoVoce(t){
  if(!cucina) return;
  const n = cucina.r.proc.length;
  const ha = re=>re.test(t);
  if(ha(/\b(ferma|stop|basta|spegni)\b/)){ if(timInt !== null || timSuonato){ fermaTimer(); disegnaCucina(); parla(L("Timer fermato.","Timer stopped.")); } return; }
  if(ha(/\b(timer|avvia|via|parti|start)\b/)){
    const min = minutiPasso(cucina.r.proc[cucina.i]);
    if(min){ avviaTimer(min); parla(L(`Timer di ${min} minuti avviato.`, `${min} minute timer started.`)); }
    else parla(L("In questo passo non c'\u00e8 un tempo da misurare.","There's no time to measure in this step."));
    return;
  }
  if(ha(/\b(avanti|prossim\w*|successiv\w*|dopo|next|forward)\b/)){
    if(cucina.i < n - 1){ cucina.i++; fermaTimer(); disegnaCucina(); }
    else parla(L("Era l'ultimo passo. Quando hai finito tocca Ho finito.","That was the last step. When you're done, tap I'm done."));
    return;
  }
  if(ha(/\b(indietro|precedente|torna|back|previous)\b/)){
    if(cucina.i > 0){ cucina.i--; fermaTimer(); disegnaCucina(); } else parla(L("Sei al primo passo.","You're at the first step."));
    return;
  }
  if(ha(/\b(ripeti|ancora|di nuovo|repeat|again)\b/)){ leggiPasso(); return; }
  if(ha(/\bingredient/)){ leggiIngredienti(); return; }
}

/* ===========================================================
   Manda una ricetta a un amico: testo leggibile + link che la importa
   (la ricetta viaggia dentro il link, compressa: niente server)
   =========================================================== */
async function codificaRicetta(r){
  const d = {n: nomeR(r), c: r.cat, t: r.tempo, f: r.diff, p: porzioniDi(r), i: r.ing.map(x=>[x.q, x.n]),
             s: procR(r).map(x=>testoPiano(pulito(x))), o: r.nota ? testoPiano(pulito(notaR(r))) : "", l: r.luogo || "",
             g: r.tags || [], a: r.all || [], u: r.unico ? 1 : 0, e: r.estero ? 1 : 0};
  let bytes = new TextEncoder().encode(JSON.stringify(d)), pre = "j";
  if(window.CompressionStream){
    try{ const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
         bytes = new Uint8Array(await new Response(cs).arrayBuffer()); pre = "z"; }catch(e){}
  }
  let bin = ""; bytes.forEach(b=>{ bin += String.fromCharCode(b); });
  return pre + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function decodificaRicetta(c){
  const pre = c[0]; let b64 = c.slice(1).replace(/-/g, "+").replace(/_/g, "/");
  while(b64.length % 4) b64 += "=";
  let bytes = Uint8Array.from(atob(b64), ch=>ch.charCodeAt(0));
  if(pre === "z"){ const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
                   bytes = new Uint8Array(await new Response(ds).arrayBuffer()); }
  const d = JSON.parse(new TextDecoder().decode(bytes));
  const ing = (d.i || []).map(([q, n])=>({n: String(n || "").toLowerCase(), q: q || "q.b.", k: chiaveDi(String(n || ""))})).filter(x=>x.n);
  return {id: 0, n: String(d.n || ""), cat: PORTATE.includes(d.c) ? d.c : "Primi", tempo: +d.t || 40, diff: d.f || "facile",
          porz: +d.p || PORZIONI, ing, proc: d.s || [], nota: d.o || "", luogo: d.l || "", estero: !!d.e,
          tags: d.g || [], all: d.a || [], unico: !!d.u, nvoci: ing.length, minimo: false, leggero: false, att: [], att_opz: []};
}
async function mandaRicetta(r, bottone){
  const codice = await codificaRicetta(r);
  const link = location.origin + location.pathname + "?ric=" + codice;
  const p = porzioniDi(r);
  const testo = `\u{1F37D}️ *${nomeR(r)}*\n` +
    L(`Per ${p} porzioni · ${r.tempo} minuti`, `Serves ${p} · ${r.tempo} minutes`) + "\n\n" +
    `*${L("Ingredienti","Ingredients")}*\n` + r.ing.map(i=>"• " + (i.q && i.q !== "q.b." ? i.q + " " : "") + i.n + (i.q === "q.b." ? " " + L("q.b.","to taste") : "")).join("\n") + "\n\n" +
    `*${L("Procedimento","Method")}*\n` + procR(r).map((x, i)=>(i + 1) + ". " + testoPiano(pulito(x))).join("\n") +
    (r.nota ? "\n\n" + testoPiano(pulito(notaR(r))) : "") +
    "\n\n\u{1F4F2} " + L("Aggiungila alle tue ricette di Che cucino? con un tocco:", "Add it to your Che cucino? recipes with one tap:") + "\n" + link;
  try{
    if(navigator.share){ await navigator.share({title: nomeR(r), text: testo}); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(testo); if(bottone) scriviTasto(bottone, L("Copiata: incollala dove vuoi","Copied: paste it anywhere"), "✅"); }
  catch(e){ prompt(L("Copia la ricetta:","Copy the recipe:"), testo); }
}

/* quantita' in numero + unita' confrontabile: kg->g, l/cl->ml; "2 cucchiai" -> 2 "cucchiai" */
function quantitaDi(q){
  const t = String(q || "").trim().toLowerCase();
  let m = t.match(/^(\d+)\s*\/\s*(\d+)\s*(.*)$/), v, resto;
  if(m){ v = (+m[1]) / (+m[2]); resto = m[3]; }
  else{ m = t.match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/); if(!m) return null; v = parseFloat(m[1].replace(",", ".")); resto = m[2]; }
  let u = (resto.match(/^[a-zà-ú]+\.?/) || [""])[0].replace(/\.$/, "");
  if(/^(g|gr|grammi|grammo)$/.test(u)) u = "g";
  else if(u === "kg"){ v *= 1000; u = "g"; }
  else if(/^(l|lt|litri|litro)$/.test(u)){ v *= 1000; u = "ml"; }
  else if(u === "cl"){ v *= 10; u = "ml"; }
  else if(u === "dl"){ v *= 100; u = "ml"; }
  else if(u === "ml"){}
  else if(/^(cucchiai|cucchiaio)$/.test(u)) u = "cucchiai";
  else if(/^(cucchiaini|cucchiaino)$/.test(u)) u = "cucchiaini";
  else if(/^(spicchi|spicchio)$/.test(u)) u = "spicchi";
  else if(/^(fette|fetta)$/.test(u)) u = "fette";
  else if(/^(bicchieri|bicchiere)$/.test(u)) u = "bicchieri";
  else if(/^(pizzichi|pizzico)$/.test(u)) u = "pizzichi";
  else u = "";
  return {v, u};
}
function testoQuantita(v, u){
  const n = x=>(Math.round(x * 10) / 10).toString().replace(".", ",");
  if(u === "g") return v >= 1000 ? n(v / 1000) + " kg" : Math.round(v) + " g";
  if(u === "ml") return v >= 1000 ? n(v / 1000) + " l" : Math.round(v) + " ml";
  return n(v) + (u ? " " + u : "");
}
/* tutte le ricette del menu: cosa manca, sommando le quantita' dello stesso ingrediente */
function spesaDelMenu(){
  const tot = new Map();
  menuSett().forEach(x=>{
    const r = trovaRicetta(x.id); if(!r) return;
    const p = porzioniDi(r), f = p >= 8 && x.dosi <= p ? 1 : x.dosi / p;
    r.ing.forEach(i=>{
      if(!i.k || possiedo(i.k) || sostituto(i.k)) return;
      const g = tot.get(i.k) || {k: i.k, nome: i.n, somme: {}, altro: [], ricette: new Set()};
      const qq = quantitaDi(scalaQ(i.q, f));
      if(qq) g.somme[qq.u] = (g.somme[qq.u] || 0) + qq.v;
      else if(i.q && i.q !== "q.b." && !g.altro.includes(i.q)) g.altro.push(i.q);
      g.ricette.add(nomeR(r));
      tot.set(i.k, g);
    });
  });
  return [...tot.values()].map(g=>{
    const parti = Object.entries(g.somme).map(([u, v])=>testoQuantita(v, u)).concat(g.altro);
    return {k: g.k, t: g.nome + (parti.length ? " — " + parti.join(" + ") : ""), n: g.ricette.size};
  });
}

const GIORNO_MS = 86400000;
/* cosa c'e' di nuovo da salvare: tengo l'elenco, cosi' si puo' vedere */
function segnaDaSalvare(tipo, id, nome){
  S.daSalvare = (S.daSalvare || 0) + 1;
  S.daSalvareElenco = (S.daSalvareElenco || []).filter(x=>!(x.tipo === tipo && x.id === id));
  S.daSalvareElenco.push({tipo, id, nome: String(nome || "").slice(0, 80), quando: Date.now()});
}
function elencoDaSalvare(){
  const l = (S.daSalvareElenco || []).filter(x=> x.tipo === "scheda" ? (S.schedeMie || []).some(m=>m.id === x.id) : !!trovaMia(x.id));
  /* salvataggi vecchi senza elenco: ricostruisco dalle ricette aggiunte dopo l'ultimo salvataggio */
  if(!l.length && (S.daSalvare || 0) > 0){
    const da = S.ultimoSalvataggio || 0;
    (S.mie || []).forEach(r=>{ const t = Math.abs(+r.id); if(t > 1e12 && t > da) l.push({tipo:"ricetta", id:r.id, nome:nomeR(r), quando:t}); });
  }
  return l.sort((a,b)=>b.quando - a.quando);
}

async function esportaDati(soloFile){
  /* le foto delle ricette (scritte a mano e originali) viaggiano nel salvataggio, cosi' non si perdono */
  const foto = {};
  for(const id of tutteLeFoto()){
    try{ const bl = await FotoDB.get(id); if(bl) foto[id] = await blobInDataUrl(bl); }catch(e){}
  }
  const testo = JSON.stringify({app:"che-cucino", versione:1, dati:S, foto}, null, 2);
  const giorno = new Date().toISOString().slice(0,10);
  /* sul telefono apro il menu "Condividi": cosi' si salva direttamente su Google Drive (cartella Dispensa).
     Chrome condivide solo alcuni tipi di file. Prima era un .txt (text/plain), ma Android lo offriva anche
     a "Che cucino?" stessa (che accetta testo condiviso per importare le ricette) e la proponeva per prima.
     Ora e' un .csv (text/csv): Drive lo accetta, "Che cucino?" non compare piu' fra le destinazioni.
     Dentro c'e' sempre lo stesso contenuto, e "Importa dati" lo rilegge. */
  if(!soloFile) try{
    const f = new File([testo], "che-cucino-" + giorno + ".csv", {type:"text/csv"});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:"Che cucino? \u2014 " + giorno});
      salvataggioFatto();
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  salvataggioFatto();
  const blob = new Blob([testo], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "che-cucino-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function importaDati(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json,text/plain,.txt,text/csv,.csv";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const g = JSON.parse(fr.result), d = g.dati || g;
        if(!d || typeof d !== "object" || !("profilo" in d)) throw new Error("formato");
        S = Object.assign(JSON.parse(JSON.stringify(VUOTO)), d);
        (S.mie || []).forEach(preparaRicetta);
        salva(); sess = nuovaSessione(); vai(0);
        const ff = g.foto && typeof g.foto === "object" ? Object.entries(g.foto) : [];
        Promise.all(ff.map(([id, u])=>fetch(u).then(x=>x.blob()).then(bl=>FotoDB.put(id, bl)).catch(()=>{})))
          .then(()=>alert(ff.length ? L(`Dati reimportati, con ${ff.length} foto di ricette.`, `Data re-imported, with ${ff.length} recipe photos.`) : "Dati reimportati."));
      }catch(err){ alert("Questo file non sembra un salvataggio di Che cucino?"); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

   Ingredienti: le chiavi della dispensa e come indovinarle
   =========================================================== */
function chiaviDispensa(){
  return Object.entries(CAT_DISP).flatMap(([c,l])=>(l||[]).map(k=>[k,c]));
}
/* come l'archivio chiama le cose: "maccheroni" e "trofie" sono entrambi "pasta" */
const NOMI_K = (()=>{
  const m = {};
  D.ricette.forEach(r=>r.ing.forEach(i=>{ const n = normTesto(i.n); if(!m[n]) m[n] = i.k; }));
  return m;
})();
function chiaveDi(nome){
  const n = normTesto(nome);
  if(!n) return "";
  if(IN_INGLESE){ const ki = chiaveDaInglese(nome); if(ki) return ki; }
  const tutte = chiaviDispensa().map(([k])=>k).concat(Array.from(BASE));
  const esatta = tutte.find(k=>normTesto(k) === n);
  if(esatta) return esatta;
  /* nomi brevi che in cucina vogliono dire una cosa precisa */
  const ALIAS_K = {"olio":"olio extravergine","olio d oliva":"olio extravergine","olio di oliva":"olio extravergine","pepe":"pepe nero","parmigiano reggiano":"parmigiano"};
  if(ALIAS_K[n]) return ALIAS_K[n];
  const rn = radiceIng(n);
  const stessa = tutte.find(k=>radiceIng(k) === rn);
  if(stessa) return stessa;
  if(NOMI_K[n]) return NOMI_K[n];
  /* la chiave più lunga contenuta nel nome scritto: "passata di pomodoro" batte "pomodoro" */
  let best = "", lung = 0;
  tutte.forEach(k=>{
    const x = normTesto(k);
    if(n.includes(x) && x.length > lung){ best = k; lung = x.length; }
  });
  if(best) return best;
  /* altrimenti la chiave piu' corta che contiene il nome scritto: "olio" -> "olio extravergine",
     non "carciofini sott'olio" */
  lung = 1e9;
  tutte.forEach(k=>{
    const x = normTesto(k);
    if(x.includes(n) && x.length < lung){ best = k; lung = x.length; }
  });
  if(best) return best;
  Object.keys(NOMI_K).forEach(x=>{
    if(x.length > 3 && n.includes(x) && x.length > lung){ best = NOMI_K[x]; lung = x.length; }
  });
  return best;
}
function categoriaDi(k){
  const t = chiaviDispensa().find(([x])=>x === k);
  return t ? t[1] : "";
}
