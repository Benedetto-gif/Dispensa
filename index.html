ervi subito con patata lessa a fette."],"nota":"Dieci minuti bastano. Oltre, il pesce si cuoce troppo e diventa gommoso. E va abbattuto prima, 24 ore a -20 gradi.","luogo":"Perù","estero":true,"all":["pesce"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["congelatore a -20 °C"],"att_opz":[]},{"id":123,"n":"Papa a la huancaína","cat":"Antipasti","tempo":35,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"patate","q":"1 kg","k":"patate"},{"n":"formaggio fresco","q":"250 gr","k":"formaggio fresco"},{"n":"peperoncino fresco","q":"2","k":"peperoncino fresco"},{"n":"latte","q":"150 ml","k":"latte"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"uova","q":"3","k":"uova"},{"n":"olive nere","q":"80 gr","k":"olive"}],"proc":["Lessa le patate con la buccia e lasciale intiepidire, poi sbucciale e affettale spesse.","Rassoda le uova per 9 minuti.","Salta cipolla e peperoncini privati dei semi in poco olio per cinque minuti.","Frulla con il formaggio e il latte fino a una crema liscia e densa.","Nappa le patate con la salsa e guarnisci con uova a spicchi e olive."],"nota":"La salsa deve nappare, non colare: si regola con il latte un cucchiaio alla volta.","luogo":"Perù","estero":true,"all":["latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":124,"n":"Empanadas di carne","cat":"Secondi","tempo":90,"diff":"media","tags":[],"ing":[{"n":"farina","q":"500 gr","k":"farina"},{"n":"burro","q":"150 gr","k":"burro"},{"n":"carne macinata","q":"500 gr","k":"carne macinata"},{"n":"cipolla","q":"3","k":"cipolla"},{"n":"uova","q":"3","k":"uova"},{"n":"olive verdi","q":"80 gr","k":"olive"},{"n":"cumino","q":"1 cucchiaino","k":"cumino"},{"n":"paprica","q":"1 cucchiaino","k":"paprica"}],"proc":["Impasta farina, burro freddo, un uovo, 150 ml d’acqua e sale; riposa un’ora in frigorifero.","Stufa le cipolle tritate per 15 minuti, poi unisci la carne e rosola.","Insaporisci con cumino e paprica e lascia raffreddare completamente.","Unisci al ripieno freddo due uova sode a pezzi e le olive.","Ricava dischi, farcisci, chiudi a mezzaluna e sigilla con la treccia o con la forchetta.","Inforna a 200 gradi per 20 minuti, spennellate d’uovo."],"nota":"Il ripieno va freddo: caldo scioglie il burro della pasta e le empanadas si aprono.","luogo":"Argentina","estero":true,"all":["glutine","latte","uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":125,"n":"Bistecca con chimichurri","cat":"Secondi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"carne di manzo a cubi","q":"800 gr","k":"manzo"},{"n":"prezzemolo","q":"2 ciuffi","k":"prezzemolo"},{"n":"aglio","q":"4 spicchi","k":"aglio"},{"n":"origano","q":"1 cucchiaio","k":"origano"},{"n":"aceto","q":"4 cucchiai","k":"aceto"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"}],"proc":["Trita a coltello prezzemolo, aglio e peperoncino: nel chimichurri non si frulla.","Mescola con origano, aceto, sale e abbondante olio, e lascia riposare almeno un’ora.","Porta la carne a temperatura ambiente e asciugala bene.","Cuocila su griglia o piastra rovente, senza muoverla, quattro minuti per lato.","Falla riposare cinque minuti prima di tagliarla, poi servila con il chimichurri."],"nota":"Il chimichurri migliora dopo qualche ora: preparalo prima della carne, non dopo.","luogo":"Argentina","estero":true,"all":["solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["frullatore o minipimer","griglia o piastra"],"att_opz":[]},{"id":126,"n":"Feijoada semplificata","cat":"Secondi","tempo":120,"diff":"facile","tags":[],"ing":[{"n":"fagioli","q":"600 gr","k":"fagioli"},{"n":"maiale","q":"500 gr","k":"maiale"},{"n":"salsiccia","q":"300 gr","k":"salsiccia"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"aglio","q":"4 spicchi","k":"aglio"},{"n":"alloro","q":"2 foglie","k":"alloro"},{"n":"arancia","q":"2","k":"arancia"},{"n":"riso","q":"300 gr","k":"riso"}],"proc":["Rosola il maiale a cubi e la salsiccia a pezzi in una pentola capiente.","Unisci cipolla e aglio tritati e falli appassire nel grasso.","Aggiungi i fagioli, l’alloro e acqua a coprire di tre dita.","Cuoci coperto a fuoco bassissimo per un’ora e mezza, schiacciando qualche fagiolo per addensare.","Servi con riso bianco e spicchi d’arancia, che sgrassano il piatto."],"nota":"L’arancia non è una decorazione: serve a tagliare la grassezza, e in Brasile non manca mai.","luogo":"Brasile","estero":true,"all":[],"unico":true,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":["pentola a pressione"]},{"id":127,"n":"Paella valenciana","cat":"Primi","tempo":70,"diff":"media","tags":[],"ing":[{"n":"riso","q":"400 gr","k":"riso"},{"n":"pollo a pezzi","q":"600 gr","k":"pollo"},{"n":"fagiolini","q":"200 gr","k":"fagiolini"},{"n":"fagioli","q":"150 gr","k":"fagioli"},{"n":"pomodori","q":"2","k":"pomodori"},{"n":"paprica","q":"1 cucchiaio","k":"paprica"},{"n":"zafferano","q":"1 bustina","k":"zafferano"},{"n":"rosmarino","q":"1 rametto","k":"rosmarino"},{"n":"brodo vegetale","q":"1,2 l","k":"brodo vegetale"}],"proc":["Scalda l’olio nella paellera e rosola il pollo a pezzi finché è ben dorato su tutti i lati.","Sposta la carne verso il bordo e salta i fagiolini, poi unisci i pomodori grattugiati e la paprica.","Versa il brodo bollente con lo zafferano e i fagioli, e fai sobbollire 20 minuti.","Distribuisci il riso a pioggia, in modo uniforme, e da questo momento non mescolare mai più.","Cuoci 10 minuti a fuoco vivo e 8 a fuoco dolce, aggiungendo il rosmarino.","Alza la fiamma 40 secondi per formare il socarrat, poi copri e lascia riposare 5 minuti."],"nota":"Non si mescola e non si copre durante la cottura: la paella non è un risotto.","luogo":"Spagna","estero":true,"all":[],"unico":true,"nvoci":9,"minimo":false,"leggero":true,"att":["paellera"],"att_opz":[]},{"id":128,"n":"Patatas bravas","cat":"Contorni","tempo":45,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"patate","q":"1 kg","k":"patate"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"paprica","q":"2 cucchiaini","k":"paprica"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"aceto","q":"1 cucchiaio","k":"aceto"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"}],"proc":["Taglia le patate a cubi irregolari di tre centimetri.","Friggile una prima volta a 140 gradi per 8 minuti, senza farle colorire, e scolale.","Prepara la salsa soffriggendo aglio e paprica, unendo passata, aceto e peperoncino, e cuocendo 15 minuti.","Rifriggi le patate a 190 gradi finché sono dorate e croccanti.","Sala subito e servi con la salsa a parte o versata sopra all’ultimo momento."],"nota":"La doppia frittura è obbligatoria: la prima cuoce dentro, la seconda fa la crosta.","luogo":"Spagna","estero":true,"all":["solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":129,"n":"Pulpo a la gallega","cat":"Antipasti","tempo":90,"diff":"media","tags":["senza forno"],"ing":[{"n":"polpo","q":"1,5 kg","k":"polpo"},{"n":"patate","q":"600 gr","k":"patate"},{"n":"paprica","q":"2 cucchiaini","k":"paprica"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"alloro","q":"2 foglie","k":"alloro"}],"proc":["Porta a bollore una pentola d’acqua con cipolla e alloro.","Immergi il polpo tre volte per pochi secondi prima di lasciarlo dentro: è quello che gli arriccia i tentacoli.","Cuoci 45 minuti a fuoco dolce, poi spegni e lascialo nell’acqua altri 15.","Lessa le patate nella stessa acqua e affettale spesse.","Taglia il polpo a rondelle con le forbici e disponilo sulle patate.","Condisci con sale grosso, paprica e abbondante olio."],"nota":"Il polpo va lasciato raffreddare nella sua acqua: tolto subito diventa gommoso.","luogo":"Spagna","estero":true,"all":["molluschi"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":130,"n":"Pisto manchego","cat":"Contorni","tempo":50,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"zucchine","q":"3","k":"zucchine"},{"n":"peperoni","q":"3","k":"peperoni"},{"n":"melanzane","q":"1","k":"melanzane"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"pomodori","q":"600 gr","k":"pomodori"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"uova","q":"4","k":"uova"}],"proc":["Taglia tutte le verdure a cubetti regolari, piccoli.","Stufa la cipolla in abbondante olio a fuoco dolce per 15 minuti.","Unisci peperoni, poi melanzane, poi zucchine, dando a ciascuna dieci minuti.","Aggiungi i pomodori pelati e a pezzi e cuoci mezz’ora finché è tutto molto morbido.","Servi con un uovo all’occhio di bue appoggiato sopra."],"nota":"A differenza della ratatouille qui le verdure si sfaldano: deve diventare una confettura salata.","luogo":"Spagna","estero":true,"all":["uova"],"unico":true,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":131,"n":"Pollo al ajillo","cat":"Secondi","tempo":40,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pollo a pezzi","q":"1,2 kg","k":"pollo"},{"n":"aglio","q":"2 teste","k":"aglio"},{"n":"vino bianco","q":"200 ml","k":"vino bianco"},{"n":"alloro","q":"2 foglie","k":"alloro"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Separa tutti gli spicchi d’aglio e schiacciali senza sbucciarli.","Scalda abbondante olio e falli rosolare piano finché sono dorati, poi tienili da parte.","Nello stesso olio rosola il pollo a fuoco vivo finché è ben colorito.","Rimetti l’aglio, sfuma col vino e unisci l’alloro.","Copri e cuoci 20 minuti a fuoco dolce, poi scopri e fai restringere il fondo.","Completa con prezzemolo tritato."],"nota":"Due teste d’aglio sembrano troppe. Non lo sono: cotto in camicia diventa dolce.","luogo":"Spagna","estero":true,"all":["solfiti"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":132,"n":"Crema catalana","cat":"Dolci","tempo":40,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"latte","q":"500 ml","k":"latte"},{"n":"uova","q":"5","k":"uova"},{"n":"zucchero","q":"150 gr","k":"zucchero"},{"n":"farina","q":"30 gr","k":"farina"},{"n":"limone","q":"1","k":"limone"},{"n":"cannella","q":"1 stecca","k":"cannella"}],"proc":["Scalda il latte con la scorza di limone e la cannella, e lascia in infusione 15 minuti.","Sbatti i tuorli con lo zucchero e la farina.","Versa il latte filtrato a filo, mescolando.","Rimetti sul fuoco dolce e cuoci mescolando finché si addensa, senza far bollire.","Versa nelle cocottine e raffredda almeno tre ore.","Cospargi di zucchero e caramella col cannello."],"nota":"A differenza della crème brûlée qui c’è latte e farina, non panna: è più leggera e meno delicata.","luogo":"Spagna","estero":true,"all":["glutine","latte","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["cannello","colino a maglie fitte","stampini"],"att_opz":[]},{"id":133,"n":"Bacalhau à Brás","cat":"Secondi","tempo":45,"diff":"media","tags":["senza forno"],"ing":[{"n":"baccalà dissalato","q":"500 gr","k":"baccalà dissalato"},{"n":"patate","q":"600 gr","k":"patate"},{"n":"uova","q":"6","k":"uova"},{"n":"cipolla","q":"3","k":"cipolla"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"olive nere","q":"80 gr","k":"olive"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Taglia le patate a fiammifero sottilissimi e friggile finché sono dorate. Scolale su carta.","Sfilaccia il baccalà a mano, togliendo lische e pelle.","Stufa le cipolle affettate sottili con l’aglio per 15 minuti.","Unisci il baccalà e cuoci cinque minuti, poi aggiungi le patatine.","Versa le uova sbattute e mescola a fuoco basso finché si rapprendono ma restano cremose.","Completa con olive e prezzemolo."],"nota":"Le uova non devono cuocere del tutto: il piatto si serve morbido, quasi bavoso.","luogo":"Portogallo","estero":true,"all":["pesce","uova"],"unico":true,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":134,"n":"Cataplana di frutti di mare","cat":"Secondi","tempo":45,"diff":"media","tags":["senza forno"],"ing":[{"n":"vongole","q":"800 gr","k":"vongole"},{"n":"cozze","q":"800 gr","k":"cozze"},{"n":"gamberi","q":"400 gr","k":"gamberi"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"peperoni","q":"1","k":"peperoni"},{"n":"pomodori","q":"4","k":"pomodori"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"vino bianco","q":"200 ml","k":"vino bianco"},{"n":"coriandolo fresco","q":"1 ciuffo","k":"coriandolo fresco"},{"n":"chorizo","q":"100 gr","k":"chorizo"}],"proc":["Spurga le vongole in acqua salata per due ore.","Nella cataplana stendi un letto di cipolla affettata, aglio, peperone e pomodori a fette.","Aggiungi il chorizo a rondelle, un filo d’olio e il vino.","Disponi sopra i molluschi e i gamberi, chiudi ermeticamente e cuoci 15 minuti a fuoco medio.","Apri solo a tavola, per non perdere il vapore profumato.","Completa con coriandolo fresco."],"nota":"La cataplana cuoce a vapore sotto pressione: aprirla prima significa buttare via metà del piatto.","luogo":"Portogallo","estero":true,"all":["crostacei","molluschi","solfiti"],"unico":true,"nvoci":10,"minimo":false,"leggero":false,"att":["cataplana"],"att_opz":[]},{"id":135,"n":"Caldo verde","cat":"Primi","tempo":50,"diff":"facile","tags":[],"ing":[{"n":"patate","q":"800 gr","k":"patate"},{"n":"cavolo nero","q":"400 gr","k":"cavolo nero"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"chorizo","q":"150 gr","k":"chorizo"},{"n":"brodo vegetale","q":"1,5 l","k":"brodo vegetale"}],"proc":["Stufa cipolla e aglio, unisci le patate a tocchi e il brodo, e cuoci 25 minuti.","Frulla tutto fino a una crema liscia e non troppo densa.","Affetta il cavolo nero a striscioline sottilissime, quasi capelli.","Tuffalo nella crema e cuoci solo cinque minuti: deve restare verde e croccante.","Rosola il chorizo a rondelle e distribuiscilo nei piatti con abbondante olio."],"nota":"Il cavolo tagliato grosso rovina tutto: deve essere quasi un filo.","luogo":"Portogallo","estero":true,"all":[],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":["frullatore o minipimer"],"att_opz":[]},{"id":136,"n":"Frango piri piri","cat":"Secondi","tempo":60,"diff":"facile","tags":[],"ing":[{"n":"pollo a pezzi","q":"1,4 kg","k":"pollo"},{"n":"peperoncino fresco","q":"4","k":"peperoncino fresco"},{"n":"aglio","q":"5 spicchi","k":"aglio"},{"n":"limone","q":"2","k":"limone"},{"n":"paprica","q":"1 cucchiaio","k":"paprica"},{"n":"aceto","q":"3 cucchiai","k":"aceto"}],"proc":["Frulla peperoncini, aglio, paprica, aceto, succo di limone, sale e olio fino a una marinata liquida.","Incidi il pollo fino all’osso e massaggialo con metà della marinata.","Lascia riposare in frigorifero almeno tre ore, meglio tutta la notte.","Cuoci in forno a 200 gradi per 40 minuti, oppure sulla griglia.","Spennella con la marinata rimasta ogni dieci minuti."],"nota":"Le incisioni fino all’osso servono a far entrare la marinata dove la carne è più spessa.","luogo":"Portogallo","estero":true,"all":["solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["frullatore o minipimer","griglia o piastra"],"att_opz":[]},{"id":137,"n":"Pastéis de nata","cat":"Dolci","tempo":60,"diff":"difficile","tags":["vegetariano"],"ing":[{"n":"pasta sfoglia","q":"1 rotolo","k":"pasta sfoglia"},{"n":"latte","q":"500 ml","k":"latte"},{"n":"zucchero","q":"200 gr","k":"zucchero"},{"n":"uova","q":"6","k":"uova"},{"n":"farina","q":"50 gr","k":"farina"},{"n":"limone","q":"1","k":"limone"},{"n":"cannella","q":"1 stecca","k":"cannella"}],"proc":["Scalda il latte con scorza di limone e cannella, e lascia in infusione.","Fai uno sciroppo con lo zucchero e 100 ml d’acqua, portandolo a 100 gradi.","Stempera la farina in poco latte freddo, poi unisci il latte caldo filtrato e cuoci fino ad addensare.","Versa lo sciroppo a filo, fai intiepidire e unisci i tuorli.","Arrotola la sfoglia, taglia dischi da un centimetro e stendili negli stampini con il pollice.","Riempi per tre quarti e cuoci a 250 gradi per 12 minuti: le macchie scure sulla superficie sono giuste."],"nota":"Il forno deve essere rovente. A temperatura bassa la crema si asciuga invece di bruciacchiarsi.","luogo":"Portogallo","estero":true,"all":["glutine","latte","uova"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":["colino a maglie fitte","stampini"],"att_opz":[]},{"id":138,"n":"Moussaka","cat":"Secondi","tempo":120,"diff":"media","tags":[],"ing":[{"n":"melanzane","q":"1,2 kg","k":"melanzane"},{"n":"carne macinata","q":"600 gr","k":"carne macinata"},{"n":"patate","q":"500 gr","k":"patate"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"passata di pomodoro","q":"400 gr","k":"passata di pomodoro"},{"n":"latte","q":"700 ml","k":"latte"},{"n":"burro","q":"70 gr","k":"burro"},{"n":"farina","q":"70 gr","k":"farina"},{"n":"formaggio gruviera","q":"100 gr","k":"formaggio gruviera"},{"n":"cannella","q":"1 pizzico","k":"cannella"},{"n":"uova","q":"2","k":"uova"}],"proc":["Affetta le melanzane, salale e lasciale spurgare un’ora, poi grigliale o infornale.","Affetta le patate e cuocile in forno dieci minuti.","Prepara il ragù con cipolla, carne, passata e un pizzico di cannella, cuocendo 30 minuti.","Fai la besciamella e, fuori dal fuoco, uniscici due tuorli e il formaggio.","In teglia alterna patate, melanzane, ragù e ancora melanzane, chiudendo con la besciamella.","Inforna a 180 gradi per 45 minuti e riposa mezz’ora prima di tagliare."],"nota":"La cannella nel ragù è quello che distingue una moussaka da una parmigiana con la carne.","luogo":"Grecia","estero":true,"all":["glutine","latte","uova"],"unico":true,"nvoci":11,"minimo":false,"leggero":false,"att":["griglia o piastra"],"att_opz":[]},{"id":139,"n":"Souvlaki di maiale","cat":"Secondi","tempo":40,"diff":"facile","tags":["senza forno"],"ing":[{"n":"maiale","q":"800 gr","k":"maiale"},{"n":"limone","q":"2","k":"limone"},{"n":"origano","q":"2 cucchiai","k":"origano"},{"n":"aglio","q":"4 spicchi","k":"aglio"},{"n":"yogurt greco","q":"200 gr","k":"yogurt greco"},{"n":"pane","q":"4 fette","k":"pane"}],"proc":["Taglia il maiale a cubi di tre centimetri.","Marinalo con olio, succo di limone, origano, aglio schiacciato, sale e pepe per almeno due ore.","Infila i cubi sugli spiedini, non troppo stretti.","Cuoci su griglia rovente 12 minuti girando spesso.","Servi con pane scaldato e yogurt condito con olio e origano."],"nota":"I cubi troppo stretti sullo spiedino non cuociono ai lati: lasciali respirare.","luogo":"Grecia","estero":true,"all":["glutine","latte"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":["griglia o piastra","spiedini"],"att_opz":[]},{"id":140,"n":"Tzatziki","cat":"Antipasti","tempo":20,"diff":"facile","tags":["vegetariano","senza cottura","senza forno"],"ing":[{"n":"yogurt greco","q":"500 gr","k":"yogurt greco"},{"n":"cetriolo","q":"2","k":"cetriolo"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"aceto","q":"1 cucchiaio","k":"aceto"},{"n":"menta","q":"1 ciuffo","k":"menta"}],"proc":["Grattugia i cetrioli, salali e lasciali scolare 30 minuti in un colino.","Strizzali con le mani: devono restare quasi asciutti.","Mescola lo yogurt con aglio schiacciato, aceto, olio e sale.","Unisci i cetrioli e la menta tritata.","Lascia riposare in frigorifero almeno un’ora prima di servire."],"nota":"Se non strizzi i cetrioli, dopo mezz’ora ti ritrovi una zuppa.","luogo":"Grecia","estero":true,"all":["latte","solfiti"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":141,"n":"Spanakopita","cat":"Secondi","tempo":70,"diff":"media","tags":["vegetariano"],"ing":[{"n":"pasta sfoglia","q":"2 rotoli","k":"pasta sfoglia"},{"n":"spinaci","q":"1 kg","k":"spinaci"},{"n":"formaggio feta","q":"400 gr","k":"formaggio feta"},{"n":"cipollotto","q":"4","k":"cipollotto"},{"n":"uova","q":"3","k":"uova"},{"n":"aneto","q":"1 ciuffo","k":"aneto"}],"proc":["Sbollenta gli spinaci un minuto, scolali e strizzali con forza.","Tritali e mescolali con feta sbriciolata, cipollotto affettato, uova e aneto.","Non salare: la feta è già molto sapida.","Fodera la teglia con una sfoglia, versa il ripieno e chiudi con la seconda.","Incidi la superficie a rombi e spennella d’olio.","Inforna a 180 gradi per 45 minuti."],"nota":"Gli spinaci vanno strizzati fino a sembrare troppo asciutti: in forno rilasciano ancora acqua.","luogo":"Grecia","estero":true,"all":["glutine","latte","uova"],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":142,"n":"İmam bayıldı","cat":"Secondi","tempo":80,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"melanzane","q":"4","k":"melanzane"},{"n":"cipolla","q":"4","k":"cipolla"},{"n":"pomodori","q":"4","k":"pomodori"},{"n":"aglio","q":"6 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"zucchero","q":"1 cucchiaino","k":"zucchero"}],"proc":["Sbuccia le melanzane a strisce alternate e incidile per il lungo, senza tagliarle del tutto.","Salale e lasciale spurgare mezz’ora, poi rosolale in olio da tutti i lati.","Stufa le cipolle affettate con l’aglio per 20 minuti, finché sono dolcissime.","Unisci i pomodori a cubetti, il prezzemolo e lo zucchero, e cuoci dieci minuti.","Farcisci le melanzane aprendo il taglio, adagiale in teglia con poca acqua e olio.","Inforna a 180 gradi per 40 minuti e servi tiepide o fredde."],"nota":"Il nome significa che l’imam svenne, e la leggenda dice per la quantità d’olio. Non lesinare.","luogo":"Turchia","estero":true,"all":[],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":143,"n":"Lahmacun","cat":"Secondi","tempo":90,"diff":"media","tags":[],"ing":[{"n":"farina","q":"400 gr","k":"farina"},{"n":"lievito di birra","q":"7 gr","k":"lievito di birra"},{"n":"agnello","q":"300 gr","k":"agnello"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"peperoni","q":"1","k":"peperoni"},{"n":"pomodori","q":"2","k":"pomodori"},{"n":"paprica","q":"1 cucchiaio","k":"paprica"},{"n":"prezzemolo","q":"2 ciuffi","k":"prezzemolo"},{"n":"limone","q":"2","k":"limone"}],"proc":["Impasta farina, lievito, 250 ml d’acqua tiepida e sale, e lascia lievitare un’ora.","Frulla carne, cipolla, peperone, pomodori, paprica, sale e pepe fino a un composto omogeneo.","Dividi l’impasto in otto palline e stendile sottilissime.","Spalma uno strato molto sottile di ripieno, arrivando fino al bordo.","Cuoci a 250 gradi per 6-8 minuti, finché i bordi sono croccanti.","Servi con prezzemolo, limone e arrotolando."],"nota":"Il ripieno deve essere velato: se lo metti spesso resta crudo e la base si inzuppa.","luogo":"Turchia","estero":true,"all":["glutine"],"unico":true,"nvoci":9,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":["pentola a pressione"]},{"id":144,"n":"Pide con formaggio e uova","cat":"Secondi","tempo":80,"diff":"media","tags":["vegetariano"],"ing":[{"n":"farina","q":"400 gr","k":"farina"},{"n":"lievito di birra","q":"7 gr","k":"lievito di birra"},{"n":"formaggio feta","q":"200 gr","k":"formaggio feta"},{"n":"mozzarella","q":"200 gr","k":"mozzarella"},{"n":"uova","q":"4","k":"uova"},{"n":"burro","q":"40 gr","k":"burro"}],"proc":["Prepara l’impasto come per la pizza e lascialo lievitare un’ora e mezza.","Dividi in quattro e stendi in ovali allungati.","Distribuisci i formaggi lasciando liberi tre centimetri di bordo.","Ripiega i bordi lunghi verso l’interno e pizzica le due estremità a forma di barca.","Inforna a 250 gradi per 10 minuti, poi sguscia un uovo al centro e prosegui 4 minuti.","Spennella i bordi col burro fuso appena esce dal forno."],"nota":"L’uovo si aggiunge a metà cottura, altrimenti diventa sodo prima che la pasta sia pronta.","luogo":"Turchia","estero":true,"all":["glutine","latte","uova"],"unico":true,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":145,"n":"Baklava","cat":"Dolci","tempo":90,"diff":"difficile","tags":["vegetariano"],"ing":[{"n":"pasta sfoglia","q":"2 rotoli","k":"pasta sfoglia"},{"n":"noci","q":"400 gr","k":"noci"},{"n":"burro","q":"200 gr","k":"burro"},{"n":"zucchero","q":"300 gr","k":"zucchero"},{"n":"miele","q":"100 gr","k":"miele"},{"n":"limone","q":"1","k":"limone"},{"n":"cannella","q":"1 cucchiaino","k":"cannella"}],"proc":["Trita grossolanamente le noci e mescolale con cannella e due cucchiai di zucchero.","Alterna in teglia strati di sfoglia sottile spennellati di burro fuso e strati di noci.","Taglia a rombi prima della cottura, arrivando fino al fondo.","Inforna a 170 gradi per 45 minuti finché è dorata.","Prepara lo sciroppo bollendo zucchero, acqua, miele e limone per dieci minuti.","Versalo freddo sul baklava caldo, o caldo su quello freddo: mai entrambi caldi."],"nota":"Sciroppo e dolce alla stessa temperatura fanno una poltiglia. Uno dei due dev’essere freddo.","luogo":"Turchia","estero":true,"all":["frutta a guscio","glutine","latte"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":146,"n":"Spuma di patate al sifone","cat":"Contorni","tempo":40,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"patate","q":"600 gr","k":"patate"},{"n":"panna","q":"200 ml","k":"panna"},{"n":"latte","q":"150 ml","k":"latte"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"noce moscata","q":"1 pizzico","k":"noce moscata"}],"proc":["Lessa le patate con la buccia, sbucciale ancora calde e passale al setaccio.","Scalda latte, panna e burro senza far bollire.","Unisci al passato di patate mescolando fino a una crema liscia e piuttosto liquida.","Regola di sale e noce moscata, poi filtra con un colino fine: nel sifone non deve entrare un grumo.","Riempi il sifone senza superare i due terzi, inserisci una carica e agita bene.","Tieni a bagnomaria a 60 gradi e servi al momento."],"nota":"Un solo grumo ostruisce l’ugello: il passaggio al colino non è facoltativo.","luogo":"Gourmet","estero":true,"all":["latte"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":["colino a maglie fitte","setaccio o schiacciapatate","sifone"],"att_opz":[]},{"id":147,"n":"Agnolotti del plin","cat":"Primi","tempo":120,"diff":"difficile","tags":[],"ing":[{"n":"farina","q":"400 gr","k":"farina"},{"n":"uova","q":"4","k":"uova"},{"n":"carne macinata","q":"300 gr","k":"carne macinata"},{"n":"vitello","q":"200 gr","k":"vitello"},{"n":"cavolo cappuccio","q":"200 gr","k":"cavolo cappuccio"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"salvia","q":"6 foglie","k":"salvia"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"}],"proc":["Impasta farina e uova, lavora dieci minuti e fai riposare mezz’ora coperto.","Rosola le carni con poco burro, sfuma col vino e cuoci coperto un’ora, poi unisci il cavolo stufato.","Trita tutto finissimo e lega con uova e parmigiano.","Tira la sfoglia sottilissima, disponi noccioline di ripieno a un centimetro l’una dall’altra.","Ripiega la sfoglia e pizzica fra un ripieno e l’altro: il plin è proprio quel pizzicotto.","Cuoci due minuti e condisci con burro fuso e salvia."],"nota":"Il plin va fatto con il pollice e l’indice, non con la rotella: è quello che dà la forma.","luogo":"Piemonte","estero":false,"all":["glutine","latte","solfiti","uova"],"unico":false,"nvoci":9,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":148,"n":"Tajarin al burro e salvia","cat":"Primi","tempo":60,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"farina","q":"400 gr","k":"farina"},{"n":"uova","q":"8","k":"uova"},{"n":"burro","q":"100 gr","k":"burro"},{"n":"salvia","q":"8 foglie","k":"salvia"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"}],"proc":["Impasta la farina con i tuorli: nei tajarin veri si usano solo quelli, trenta per chilo.","Lavora finché è liscio e fai riposare un’ora avvolto nella pellicola.","Tira la sfoglia sottile, infarina e arrotola, poi taglia a filo di coltello, larghi due millimetri.","Cuoci un minuto scarso in acqua salata.","Condisci con burro fatto sciogliere con la salvia, senza farlo friggere."],"nota":"Con tutti quei tuorli la pasta è gialla e ricca: il condimento deve restare minimo.","luogo":"Piemonte","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":149,"n":"Brasato al Barolo","cat":"Secondi","tempo":240,"diff":"media","tags":[],"ing":[{"n":"manzo","q":"1,2 kg","k":"manzo"},{"n":"vino rosso","q":"1 l","k":"vino rosso"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"carota","q":"2","k":"carota"},{"n":"sedano","q":"2 coste","k":"sedano"},{"n":"alloro","q":"2 foglie","k":"alloro"},{"n":"cannella","q":"1 stecca","k":"cannella"},{"n":"chiodi di garofano","q":"3","k":"chiodi di garofano"}],"proc":["Marina la carne nel vino con le verdure e le spezie per almeno dodici ore.","Scola e asciuga bene il pezzo, poi rosolalo in olio e burro su tutti i lati.","Unisci le verdure della marinata e lasciale insaporire.","Versa il vino filtrato, copri e cuoci a fuoco bassissimo per tre ore.","Togli la carne, frulla il fondo e rimettila a fette nella salsa per dieci minuti."],"nota":"La carne va asciugata dopo la marinata: bagnata non rosola e il brasato resta pallido.","luogo":"Piemonte","estero":false,"all":["sedano","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":["colino a maglie fitte","frullatore o minipimer"],"att_opz":["pentola a pressione"]},{"id":150,"n":"Panissa vercellese","cat":"Primi","tempo":70,"diff":"facile","tags":[],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"fagioli","q":"250 gr","k":"fagioli"},{"n":"salsiccia","q":"200 gr","k":"salsiccia"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"lardo","q":"50 gr","k":"lardo"},{"n":"vino rosso","q":"1 bicchiere","k":"vino rosso"},{"n":"brodo vegetale","q":"1 l","k":"brodo vegetale"}],"proc":["Cuoci i fagioli con la cotenna e tienili nel loro brodo.","Soffriggi cipolla e lardo tritati, unisci la salsiccia sbriciolata e rosola.","Tosta il riso, sfuma col vino rosso e lascia evaporare.","Bagna col brodo dei fagioli un mestolo per volta, per sedici minuti.","A metà cottura unisci i fagioli e finisci: deve restare all’onda, non asciutto."],"nota":"È un risotto ma non si manteca con burro e formaggio: la cremosità viene dai fagioli.","luogo":"Piemonte","estero":false,"all":["solfiti"],"unico":true,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":151,"n":"Bonet","cat":"Dolci","tempo":70,"diff":"facile","tags":["vegetariano"],"ing":[{"n":"latte","q":"500 ml","k":"latte"},{"n":"uova","q":"4","k":"uova"},{"n":"zucchero","q":"150 gr","k":"zucchero"},{"n":"cacao","q":"40 gr","k":"cacao"},{"n":"amaretti","q":"150 gr","k":"amaretti"},{"n":"rum","q":"30 ml","k":"rum"}],"proc":["Prepara un caramello con 80 gr di zucchero e poca acqua e versalo nello stampo.","Sbatti le uova con lo zucchero rimasto, unisci cacao e amaretti sbriciolati.","Versa il latte caldo a filo e il rum, mescolando.","Cola nello stampo caramellato e cuoci a bagnomaria a 160 gradi per 50 minuti.","Raffredda almeno quattro ore prima di sformare."],"nota":"Il bagnomaria non è facoltativo: a calore diretto l’uovo straccia e il bonet diventa granuloso.","luogo":"Piemonte","estero":false,"all":["latte","uova"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":152,"n":"Insalata russa","cat":"Antipasti","tempo":60,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"patate","q":"500 gr","k":"patate"},{"n":"carota","q":"300 gr","k":"carota"},{"n":"piselli","q":"200 gr","k":"piselli"},{"n":"uova","q":"4","k":"uova"},{"n":"olio di semi","q":"300 ml","k":"olio di semi"},{"n":"aceto","q":"2 cucchiai","k":"aceto"},{"n":"capperi","q":"30 gr","k":"capperi"}],"proc":["Lessa separatamente patate e carote a cubetti piccoli, tenendoli sodi, e i piselli.","Raffredda tutto stendendolo su un vassoio: non deve restare caldo e umido.","Prepara la maionese montando un tuorlo con l’olio a filo e l’aceto.","Condisci le verdure con la maionese, tenendone da parte per la copertura.","Riposa in frigorifero almeno tre ore e decora con uova sode e capperi."],"nota":"Le verdure vanno raffreddate e asciutte: se sono umide la maionese si smonta.","luogo":"Piemonte","estero":false,"all":["solfiti","uova"],"unico":true,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":153,"n":"Carbonade valdostana","cat":"Secondi","tempo":150,"diff":"facile","tags":[],"ing":[{"n":"manzo","q":"1 kg","k":"manzo"},{"n":"cipolla","q":"600 gr","k":"cipolla"},{"n":"vino rosso","q":"500 ml","k":"vino rosso"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"farina","q":"2 cucchiai","k":"farina"},{"n":"alloro","q":"2 foglie","k":"alloro"},{"n":"cannella","q":"1 pizzico","k":"cannella"}],"proc":["Taglia la carne a strisce e infarinala leggermente.","Rosolala nel burro a fuoco vivo, poca per volta, e tienila da parte.","Stufa le cipolle affettate nello stesso grasso per venti minuti.","Rimetti la carne, versa il vino, unisci alloro e cannella.","Cuoci coperto a fuoco bassissimo per due ore: la salsa deve diventare scura e densa.","Servi con la polenta."],"nota":"Le cipolle devono essere in peso quasi la metà della carne: sono loro a fare la salsa.","luogo":"Valle d’Aosta","estero":false,"all":["glutine","latte","solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":["pentola a pressione"]},{"id":154,"n":"Polenta concia","cat":"Primi","tempo":70,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"farina di mais","q":"300 gr","k":"farina di mais"},{"n":"formaggio fontina","q":"250 gr","k":"formaggio fontina"},{"n":"burro","q":"100 gr","k":"burro"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"}],"proc":["Porta a bollore un litro e mezzo d’acqua salata e versa la farina a pioggia mescolando.","Cuoci 45 minuti a fuoco basso, mescolando spesso.","Negli ultimi dieci minuti unisci la fontina a dadini e metà del burro.","Mescola finché fila, poi completa con parmigiano e il burro rimasto fuso e nocciola."],"nota":"Il burro nocciola versato sopra all’ultimo è la firma del piatto.","luogo":"Valle d’Aosta","estero":false,"all":["latte"],"unico":true,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":155,"n":"Ossobuco alla milanese","cat":"Secondi","tempo":120,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"ossobuco di vitello","q":"4","k":"ossobuco di vitello"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"farina","q":"3 cucchiai","k":"farina"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"brodo vegetale","q":"500 ml","k":"brodo vegetale"},{"n":"limone","q":"1","k":"limone"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"aglio","q":"1 spicchio","k":"aglio"}],"proc":["Incidi il bordo degli ossibuchi in più punti, così non si arricciano.","Infarinali e rosolali nel burro finché sono dorati da entrambi i lati.","Unisci la cipolla tritata e falla appassire, poi sfuma col vino.","Bagna col brodo, copri e cuoci a fuoco dolce per un’ora e mezza.","Prepara la gremolada con scorza di limone, aglio e prezzemolo tritati, e uniscila negli ultimi due minuti."],"nota":"La gremolada si aggiunge a fuoco spento: cotta perde tutto il profumo.","luogo":"Lombardia","estero":false,"all":["glutine","latte","solfiti"],"unico":false,"nvoci":9,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":156,"n":"Casoncelli bergamaschi","cat":"Primi","tempo":120,"diff":"difficile","tags":[],"ing":[{"n":"farina","q":"400 gr","k":"farina"},{"n":"uova","q":"4","k":"uova"},{"n":"carne macinata","q":"250 gr","k":"carne macinata"},{"n":"salsiccia","q":"100 gr","k":"salsiccia"},{"n":"pane raffermo","q":"60 gr","k":"pane"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"amaretti","q":"30 gr","k":"amaretti"},{"n":"uvetta","q":"30 gr","k":"uvetta"},{"n":"pancetta","q":"100 gr","k":"pancetta"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"salvia","q":"6 foglie","k":"salvia"}],"proc":["Prepara la sfoglia con farina e uova e falla riposare.","Rosola carne e salsiccia, poi unisci pane ammollato, parmigiano, amaretti e uvetta tritati.","Ricava dischi, farcisci e chiudi a caramella schiacciando le estremità.","Cuoci quattro minuti in acqua salata.","Condisci con burro fuso, pancetta croccante e salvia."],"nota":"Amaretti e uvetta nel ripieno di carne sono la firma bergamasca: sembrano fuori posto e non lo sono.","luogo":"Lombardia","estero":false,"all":["glutine","latte","solfiti","uova"],"unico":false,"nvoci":11,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":157,"n":"Pizzoccheri valtellinesi","cat":"Primi","tempo":60,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"grano saraceno","q":"400 gr","k":"grano saraceno"},{"n":"farina","q":"100 gr","k":"farina"},{"n":"verza","q":"300 gr","k":"verza"},{"n":"patate","q":"300 gr","k":"patate"},{"n":"formaggio fontina","q":"250 gr","k":"formaggio fontina"},{"n":"burro","q":"150 gr","k":"burro"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"salvia","q":"8 foglie","k":"salvia"}],"proc":["Impasta le due farine con acqua tiepida, stendi a tre millimetri e taglia tagliatelle corte e larghe.","Lessa patate a tocchi e verza a strisce per dieci minuti, poi butta i pizzoccheri.","Scola tutto insieme e alterna in una zuppiera con il formaggio a dadini e il parmigiano.","Fai imbiondire il burro con aglio e salvia e versalo bollente sopra.","Mescola solo alla fine, a tavola."],"nota":"Il burro deve essere caldissimo: è quello che scioglie il formaggio negli strati.","luogo":"Lombardia","estero":false,"all":["glutine","latte"],"unico":true,"nvoci":9,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":158,"n":"Cassoeula","cat":"Secondi","tempo":180,"diff":"media","tags":[],"ing":[{"n":"verza","q":"1,5 kg","k":"verza"},{"n":"salsiccia","q":"400 gr","k":"salsiccia"},{"n":"costine di maiale","q":"800 gr","k":"costine di maiale"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"carota","q":"1","k":"carota"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"passata di pomodoro","q":"150 gr","k":"passata di pomodoro"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"}],"proc":["Rosola le costine e la salsiccia in un tegame capiente, poi tienile da parte.","Fai il soffritto con cipolla, carota e sedano.","Rimetti le carni, sfuma col vino e unisci la passata.","Cuoci coperto un’ora, poi aggiungi la verza tagliata a strisce, poca per volta.","Prosegui un’altra ora a fuoco bassissimo: la verza deve disfarsi del tutto.","Sgrassa in superficie prima di servire."],"nota":"Si fa il giorno prima e si sgrassa da freddo: è il modo in cui si è sempre mangiata.","luogo":"Lombardia","estero":false,"all":["sedano","solfiti"],"unico":true,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":159,"n":"Mondeghili","cat":"Secondi","tempo":40,"diff":"facile","tags":[],"ing":[{"n":"carne macinata","q":"400 gr","k":"carne macinata"},{"n":"pane raffermo","q":"150 gr","k":"pane"},{"n":"latte","q":"150 ml","k":"latte"},{"n":"uova","q":"2","k":"uova"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"mortadella","q":"80 gr","k":"mortadella"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"pangrattato","q":"100 gr","k":"pangrattato"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"limone","q":"1","k":"limone"}],"proc":["Ammolla il pane nel latte e strizzalo.","Impasta con carne, mortadella tritata, uova, parmigiano, prezzemolo e scorza di limone.","Forma polpette schiacciate e passale nel pangrattato.","Friggile nel burro a fuoco medio, tre minuti per lato.","Servi calde, senza sugo."],"nota":"Nati per riciclare il lesso avanzato: se ne hai, usalo al posto della carne cruda.","luogo":"Lombardia","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":10,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":160,"n":"Spätzle agli spinaci","cat":"Primi","tempo":40,"diff":"facile","tags":["senza forno"],"ing":[{"n":"farina","q":"300 gr","k":"farina"},{"n":"spinaci","q":"250 gr","k":"spinaci"},{"n":"uova","q":"3","k":"uova"},{"n":"latte","q":"100 ml","k":"latte"},{"n":"panna","q":"200 ml","k":"panna"},{"n":"speck","q":"100 gr","k":"speck"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"}],"proc":["Sbollenta gli spinaci, strizzali bene e frullali con le uova e il latte.","Unisci la farina e lavora fino a una pastella densa che cade a nastro.","Fai passare l’impasto attraverso l’apposito attrezzo o uno scolapasta a fori larghi, direttamente nell’acqua bollente.","Raccogli gli spätzle appena vengono a galla.","Salta in padella con speck rosolato, cipolla e panna, e completa col parmigiano."],"nota":"Se non hai lo schiacciapatate a fori larghi, va bene una grattugia a fori grandi appoggiata sulla pentola.","luogo":"Trentino-Alto Adige","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":8,"minimo":false,"leggero":false,"att":["frullatore o minipimer","setaccio o schiacciapatate"],"att_opz":[]},{"id":161,"n":"Strudel di mele","cat":"Dolci","tempo":90,"diff":"media","tags":["vegetariano"],"ing":[{"n":"farina","q":"250 gr","k":"farina"},{"n":"uova","q":"1","k":"uova"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"mele","q":"1 kg","k":"mele"},{"n":"uvetta","q":"80 gr","k":"uvetta"},{"n":"pinoli","q":"50 gr","k":"pinoli"},{"n":"zucchero","q":"100 gr","k":"zucchero"},{"n":"cannella","q":"1 cucchiaino","k":"cannella"},{"n":"pangrattato","q":"60 gr","k":"pangrattato"}],"proc":["Impasta farina, uovo, burro fuso e acqua tiepida fino a una pasta elastica, poi riposa un’ora.","Affetta le mele sottili e condiscile con zucchero, cannella, uvetta ammollata e pinoli.","Tosta il pangrattato nel burro: serve ad assorbire il succo delle mele.","Stendi la pasta finissima su un telo, cospargi il pangrattato e distribuisci le mele.","Arrotola aiutandoti col telo, sigilla le estremità e spennella di burro.","Inforna a 180 gradi per 40 minuti."],"nota":"La pasta va tirata finché si legge olenta."],"nota":"Si monta a mano e da tiepido: con il frullatore si scalda e si separa.","luogo":"Veneto","estero":false,"all":["glutine","pesce"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":164,"n":"Baccalà alla vicentina","cat":"Secondi","tempo":240,"diff":"media","tags":["senza forno"],"ing":[{"n":"baccalà dissalato","q":"800 gr","k":"baccalà dissalato"},{"n":"cipolla","q":"500 gr","k":"cipolla"},{"n":"latte","q":"500 ml","k":"latte"},{"n":"acciughe sott’olio","q":"4 filetti","k":"acciughe sott’olio"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"},{"n":"farina","q":"3 cucchiai","k":"farina"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Stufa le cipolle affettate in abbondante olio per mezz’ora, poi unisci le acciughe sciolte.","Infarina i pezzi di baccalà e disponili in una casseruola alternandoli al soffritto.","Cospargi di parmigiano e prezzemolo, copri col latte e con altro olio.","Cuoci a fuoco bassissimo per tre ore e mezza <strong>senza mai mescolare</strong>.","Ogni tanto scuoti appena la pentola con un movimento rotatorio."],"nota":"Il gesto di scuotere senza mescolare si chiama pipare: se giri, il baccalà si sfalda.","luogo":"Veneto","estero":false,"all":["glutine","latte","pesce"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":165,"n":"Fegato alla veneziana","cat":"Secondi","tempo":40,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"fegato di vitello","q":"600 gr","k":"fegato di vitello"},{"n":"cipolla","q":"800 gr","k":"cipolla"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"vino bianco","q":"1/2 bicchiere","k":"vino bianco"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"}],"proc":["Affetta le cipolle sottilissime e falle stufare in olio e burro per trenta minuti, con poca acqua.","Devono diventare quasi una crema, senza colorire.","Alza la fiamma e unisci il fegato a strisce sottili.","Cuoci due minuti al massimo, girando: oltre diventa duro.","Sfuma col vino, sala solo ora e completa col prezzemolo."],"nota":"Il sale a inizio cottura indurisce il fegato: si mette sempre alla fine.","luogo":"Veneto","estero":false,"all":["latte","solfiti"],"unico":false,"nvoci":5,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":166,"n":"Sarde in saor","cat":"Antipasti","tempo":60,"diff":"facile","tags":["senza forno"],"ing":[{"n":"sarde","q":"800 gr","k":"sarde"},{"n":"cipolla","q":"800 gr","k":"cipolla"},{"n":"aceto","q":"150 ml","k":"aceto"},{"n":"uvetta","q":"60 gr","k":"uvetta"},{"n":"pinoli","q":"50 gr","k":"pinoli"},{"n":"farina","q":"100 gr","k":"farina"}],"proc":["Pulisci le sarde, infarinale e friggile in olio caldo. Scolale su carta e salale.","Affetta le cipolle e stufale in olio per venti minuti senza colorire.","Sfuma con l’aceto e lascia evaporare cinque minuti.","In un contenitore alterna sarde, cipolle, uvetta ammollata e pinoli.","Copri e lascia riposare in frigorifero almeno ventiquattro ore."],"nota":"Il giorno stesso non sa di niente: il saor ha bisogno di due o tre giorni.","luogo":"Veneto","estero":false,"all":["frutta a guscio","glutine","pesce","solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":167,"n":"Risotto al radicchio","cat":"Primi","tempo":40,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"radicchio","q":"400 gr","k":"radicchio"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"vino rosso","q":"1 bicchiere","k":"vino rosso"},{"n":"burro","q":"70 gr","k":"burro"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"brodo vegetale","q":"1,2 l","k":"brodo vegetale"}],"proc":["Affetta il radicchio e tienine da parte una manciata per la fine.","Stufa la cipolla nel burro, unisci il radicchio e lascialo appassire.","Tosta il riso, sfuma col vino rosso e lascia evaporare.","Procedi col brodo un mestolo per volta per sedici minuti.","Manteca con burro freddo e parmigiano, e completa col radicchio crudo rimasto."],"nota":"Il radicchio crudo alla fine tiene l’amaro vivo: tutto cotto diventa dolciastro.","luogo":"Veneto","estero":false,"all":["latte","solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":168,"n":"Jota triestina","cat":"Primi","tempo":90,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"fagioli","q":"300 gr","k":"fagioli"},{"n":"crauti","q":"400 gr","k":"crauti"},{"n":"patate","q":"400 gr","k":"patate"},{"n":"costine di maiale","q":"300 gr","k":"costine di maiale"},{"n":"alloro","q":"2 foglie","k":"alloro"},{"n":"cumino","q":"1 cucchiaino","k":"cumino"},{"n":"farina","q":"2 cucchiai","k":"farina"},{"n":"aglio","q":"2 spicchi","k":"aglio"}],"proc":["Cuoci i fagioli con le costine, l’alloro e acqua abbondante per un’ora.","A parte stufa i crauti con il cumino e poca acqua per venti minuti.","Unisci le patate a tocchi ai fagioli e cuoci altri venti minuti.","Schiaccia metà dei fagioli e delle patate contro il bordo per addensare.","Fai un roux con farina e aglio in poco olio e uniscilo alla zuppa.","Aggiungi i crauti e lascia sposare dieci minuti."],"nota":"Il roux è quello che la lega e la distingue da una qualsiasi zuppa di fagioli.","luogo":"Friuli-Venezia Giulia","estero":false,"all":["glutine"],"unico":true,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":169,"n":"Cjarsons","cat":"Primi","tempo":120,"diff":"difficile","tags":["vegetariano"],"ing":[{"n":"patate","q":"500 gr","k":"patate"},{"n":"farina","q":"150 gr","k":"farina"},{"n":"ricotta","q":"200 gr","k":"ricotta"},{"n":"uvetta","q":"50 gr","k":"uvetta"},{"n":"menta","q":"1 ciuffo","k":"menta"},{"n":"cannella","q":"1 pizzico","k":"cannella"},{"n":"zucchero","q":"30 gr","k":"zucchero"},{"n":"burro","q":"80 gr","k":"burro"},{"n":"ricotta affumicata","q":"60 gr","k":"ricotta affumicata"}],"proc":["Lessa le patate, schiacciale e impastale con la farina fino a una pasta morbida.","Prepara il ripieno con ricotta, uvetta ammollata, menta, cannella e zucchero.","Stendi la pasta sottile, ricava dischi e farcisci chiudendo a mezzaluna.","Cuoci tre minuti in acqua salata.","Condisci con burro fuso e ricotta affumicata grattugiata."],"nota":"Dolce e salato insieme: è la cucina della Carnia, e non è un errore di dosaggio.","luogo":"Friuli-Venezia Giulia","estero":false,"all":["glutine","latte","solfiti"],"unico":false,"nvoci":9,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":170,"n":"Farinata di ceci","cat":"Antipasti","tempo":50,"diff":"facile","tags":["vegetariano","vegano"],"ing":[{"n":"farina di ceci","q":"250 gr","k":"farina di ceci"},{"n":"acqua","q":"750 ml","k":"acqua"},{"n":"olio extravergine","q":"60 ml","k":"olio extravergine"},{"n":"rosmarino","q":"1 rametto","k":"rosmarino"}],"proc":["Sciogli la farina di ceci nell’acqua con una frusta, senza grumi.","Lascia riposare almeno quattro ore, meglio tutta la notte.","Togli la schiuma che si forma in superficie: è quella che la rende indigesta.","Unisci sale e metà dell’olio, versa in teglia unta con il resto.","Cuoci a 250 gradi per 15 minuti, finché è dorata e screziata."],"nota":"Lo strato deve essere di mezzo centimetro: più spessa diventa un budino.","luogo":"Liguria","estero":false,"all":[],"unico":true,"nvoci":2,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":171,"n":"Torta pasqualina","cat":"Secondi","tempo":100,"diff":"difficile","tags":["vegetariano"],"ing":[{"n":"farina","q":"400 gr","k":"farina"},{"n":"bietole","q":"1 kg","k":"bietole"},{"n":"ricotta","q":"400 gr","k":"ricotta"},{"n":"uova","q":"8","k":"uova"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"},{"n":"maggiorana","q":"1 ciuffo","k":"maggiorana"},{"n":"cipolla","q":"1","k":"cipolla"}],"proc":["Impasta farina, acqua, olio e sale e dividi in sei palline. Riposo un’ora.","Sbollenta le bietole, strizzale e saltale con la cipolla, poi mescola con ricotta, parmigiano e maggiorana.","Stendi tre sfoglie cinque minuti.","Salta gli umbricelli nel sugo con un po’ d’acqua di cottura."],"nota":"L’aglione della Valdichiana è dolce e digeribile: otto spicchi non sono un errore.","luogo":"Umbria","estero":false,"all":["glutine"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":189,"n":"Olive all’ascolana","cat":"Antipasti","tempo":120,"diff":"difficile","tags":[],"ing":[{"n":"olive verdi","q":"500 gr","k":"olive"},{"n":"carne macinata","q":"200 gr","k":"carne macinata"},{"n":"vitello","q":"150 gr","k":"vitello"},{"n":"pollo","q":"100 gr","k":"pollo"},{"n":"uova","q":"3","k":"uova"},{"n":"parmigiano","q":"80 gr","k":"parmigiano"},{"n":"noce moscata","q":"1 pizzico","k":"noce moscata"},{"n":"limone","q":"1","k":"limone"},{"n":"farina","q":"100 gr","k":"farina"},{"n":"pangrattato","q":"200 gr","k":"pangrattato"}],"proc":["Denocciola le olive con un taglio a spirale, tenendo la polpa in un pezzo solo.","Rosola le tre carni, poi tritale finissime e lega con uovo, parmigiano, noce moscata e scorza di limone.","Avvolgi ogni oliva attorno a una nocciola di ripieno, ricomponendo la spirale.","Passa nella farina, nell’uovo e nel pangrattato.","Friggi in olio a 170 gradi finché sono dorate."],"nota":"Il taglio a spirale è tutto il mestiere: fatto bene, l’oliva si richiude come se fosse intera.","luogo":"Marche","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":10,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":190,"n":"Brodetto all’anconetana","cat":"Primi","tempo":90,"diff":"media","tags":[],"ing":[{"n":"filetto di pesce bianco","q":"800 gr","k":"filetto di pesce bianco"},{"n":"seppie","q":"300 gr","k":"seppie"},{"n":"cozze","q":"500 gr","k":"cozze"},{"n":"vongole","q":"500 gr","k":"vongole"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"aceto","q":"3 cucchiai","k":"aceto"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"pane raffermo","q":"8 fette","k":"pane"}],"proc":["Apri cozze e vongole e filtra il liquido.","Soffriggi aglio in abbondante olio, unisci le seppie e cuoci venti minuti.","Sfuma con l’aceto: è il segno distintivo del brodetto anconetano.","Aggiungi la passata e il liquido dei molluschi, poi il pesce a tranci partendo dai più sodi.","Non mescolare mai: scuoti la pentola.","Servi con pane abbrustolito."],"nota":"Tredici tipi di pesce nella versione ortodossa. Con quattro si mangia comunque benissimo.","luogo":"Marche","estero":false,"all":["glutine","molluschi","pesce","solfiti"],"unico":false,"nvoci":9,"minimo":false,"leggero":false,"att":["colino a maglie fitte"],"att_opz":[]},{"id":191,"n":"Coniglio in porchetta","cat":"Secondi","tempo":100,"diff":"media","tags":[],"ing":[{"n":"coniglio","q":"1,3 kg","k":"coniglio"},{"n":"finocchietto selvatico","q":"1 ciuffo","k":"finocchietto selvatico"},{"n":"aglio","q":"4 spicchi","k":"aglio"},{"n":"pancetta","q":"150 gr","k":"pancetta"},{"n":"vino bianco","q":"200 ml","k":"vino bianco"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"}],"proc":["Disossa il coniglio o fallo disossare, tenendolo aperto.","Trita finocchietto, aglio, rosmarino e pancetta e distribuiscili all’interno.","Arrotola e lega stretto con lo spago.","Rosola in padella su tutti i lati, poi sfuma col vino.","Inforna a 180 gradi per un’ora, bagnando col fondo ogni venti minuti."],"nota":"Il finocchietto selvatico è quello che rende il piatto in porchetta: con quello coltivato non è la stessa cosa.","luogo":"Marche","estero":false,"all":["solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":192,"n":"Pasta alla gricia","cat":"Primi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"guanciale","q":"180 gr","k":"guanciale"},{"n":"pecorino romano","q":"120 gr","k":"pecorino romano"},{"n":"pepe nero","q":"2 cucchiai","k":"pepe nero"}],"proc":["Taglia il guanciale a listarelle spesse mezzo centimetro.","Mettilo in padella fredda senza grassi e rosola a fuoco medio finché è croccante e il grasso è sciolto.","Toglilo e tieni da parte, lasciando il grasso in padella.","Scola la pasta molto al dente e saltala nel grasso con un mestolo d’acqua di cottura.","Fuori dal fuoco manteca col pecorino grattugiato e pepe abbondante, aggiungendo acqua fino alla crema.","Rimetti il guanciale croccante solo all’ultimo."],"nota":"È la carbonara senza uovo e l’amatriciana senza pomodoro: la madre di entrambe.","luogo":"Lazio","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":3,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":193,"n":"Carciofi alla romana","cat":"Contorni","tempo":60,"diff":"facile","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"carciofi","q":"8","k":"carciofi"},{"n":"mentuccia","q":"1 ciuffo","k":"mentuccia"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"limone","q":"2","k":"limone"},{"n":"vino bianco","q":"1/2 bicchiere","k":"vino bianco"}],"proc":["Pulisci i carciofi togliendo le foglie dure, spunta e tornisci il gambo, poi tienili in acqua e limone.","Trita mentuccia, aglio e prezzemolo con sale e pepe e infilali fra le foglie.","Disponili a testa in giù in una casseruola stretta, in modo che stiano in piedi.","Copri per metà con acqua, vino e olio abbondante.","Cuoci coperto a fuoco dolce per trenta o quaranta minuti, finché la lama entra senza resistenza.","Servi tiepidi con il loro fondo."],"nota":"La mentuccia romana non è la menta: è più piccola e pepata, e cambia il piatto.","luogo":"Lazio","estero":false,"all":["solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":194,"n":"Carciofi alla giudia","cat":"Contorni","tempo":50,"diff":"media","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"carciofi","q":"8","k":"carciofi"},{"n":"limone","q":"2","k":"limone"}],"proc":["Usa i carciofi romaneschi, tondi e senza spine.","Pulisci girando il carciofo contro il coltello, a spirale, fino ad arrivare al cuore.","Batti il carciofo sul tagliere per aprire le foglie a fiore.","Friggi in olio a 130 gradi per dieci minuti, per cuocerli dentro.","Alza a 180 gradi e rituffali un minuto: è la seconda frittura che li fa croccanti.","Sala e servi subito."],"nota":"Due fritture a temperature diverse: la prima cuoce, la seconda apre le foglie e le rende vetrose.","luogo":"Lazio","estero":false,"all":[],"unico":false,"nvoci":2,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":195,"n":"Vignarola","cat":"Contorni","tempo":50,"diff":"facile","tags":["senza forno"],"ing":[{"n":"carciofi","q":"4","k":"carciofi"},{"n":"fave","q":"500 gr","k":"fave"},{"n":"piselli","q":"400 gr","k":"piselli"},{"n":"cipollotto","q":"3","k":"cipollotto"},{"n":"guanciale","q":"80 gr","k":"guanciale"},{"n":"mentuccia","q":"1 ciuffo","k":"mentuccia"},{"n":"lattuga romana","q":"1","k":"lattuga romana"}],"proc":["Pulisci i carciofi e tagliali a spicchi, tenendoli in acqua acidulata.","Rosola il guanciale e il cipollotto affettato.","Unisci i carciofi e cuoci dieci minuti con poca acqua.","Aggiungi fave e piselli sgusciati e prosegui quindici minuti.","Negli ultimi cinque minuti unisci la lattuga a strisce e la mentuccia."],"nota":"È il piatto della primavera romana: carciofi, fave e piselli si trovano insieme per poche settimane l’anno.","luogo":"Lazio","estero":false,"all":[],"unico":true,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":196,"n":"Coda alla vaccinara","cat":"Secondi","tempo":240,"diff":"media","tags":["vegetariano","vegano","senza forno"],"ing":[{"n":"coda di bue","q":"1,5 kg","k":"coda di bue"},{"n":"sedano","q":"4 coste","k":"sedano"},{"n":"cipolla","q":"2","k":"cipolla"},{"n":"carota","q":"2","k":"carota"},{"n":"passata di pomodoro","q":"500 gr","k":"passata di pomodoro"},{"n":"vino bianco","q":"200 ml","k":"vino bianco"},{"n":"pinoli","q":"30 gr","k":"pinoli"},{"n":"uvetta","q":"30 gr","k":"uvetta"},{"n":"cacao","q":"1 cucchiaino","k":"cacao"}],"proc":["Sbianca la coda in acqua bollente per dieci minuti e scolala.","Rosolala in olio con il soffritto di cipolla, carota e sedano.","Sfuma col vino, unisci la passata e acqua a coprire.","Cuoci coperto a fuoco bassissimo per tre ore e mezza: la carne deve staccarsi dall’osso.","Nell’ultima mezz’ora unisci il sedano a tocchi, i pinoli, l’uvetta e il cacao."],"nota":"Pinoli, uvetta e cacao sono la versione storica del quinto quarto: sembrano strani e chiudono il cerchio.","luogo":"Lazio","estero":false,"all":["frutta a guscio","sedano","solfiti"],"unico":false,"nvoci":9,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":197,"n":"Saltimbocca alla romana","cat":"Secondi","tempo":25,"diff":"facile","tags":["senza forno"],"ing":[{"n":"vitello","q":"600 gr","k":"vitello"},{"n":"prosciutto crudo","q":"8 fette","k":"prosciutto crudo"},{"n":"salvia","q":"8 foglie","k":"salvia"},{"n":"burro","q":"50 gr","k":"burro"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"farina","q":"2 cucchiai","k":"farina"}],"proc":["Batti le fettine sottili e appoggia su ciascuna una fetta di prosciutto e una foglia di salvia.","Ferma con uno stecchino, senza arrotolare: i saltimbocca romani sono aperti.","Infarina solo il lato della carne.","Cuoci nel burro dal lato della carne per due minuti, poi gira per un minuto.","Sfuma col vino, togli la carne e lascia restringere il fondo."],"nota":"Non si arrotolano e non si salano: il prosciutto porta già tutto il sale che serve.","luogo":"Lazio","estero":false,"all":["glutine","latte","solfiti"],"unico":false,"nvoci":6,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":198,"n":"Abbacchio a scottadito","cat":"Secondi","tempo":40,"diff":"facile","tags":[],"ing":[{"n":"agnello","q":"1,2 kg","k":"agnello"},{"n":"rosmarino","q":"3 rametti","k":"rosmarino"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"limone","q":"1","k":"limone"}],"proc":["Fai marinare le costolette con olio, aglio schiacciato e rosmarino per almeno un’ora.","Batti leggermente la parte carnosa per assottigliarla.","Scalda la griglia o la piastra finché è rovente.","Cuoci tre minuti per lato, senza muoverle.","Sala solo alla fine e servi subito, da mangiare con le mani."],"nota":"Il nome dice come si mangiano: appena tolte dalla griglia, tanto da scottarsi le dita.","luogo":"Lazio","estero":false,"all":[],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":["griglia o piastra"],"att_opz":[]},{"id":199,"n":"Puntarelle alla romana","cat":"Contorni","tempo":40,"diff":"facile","tags":["senza cottura","senza forno"],"ing":[{"n":"puntarelle","q":"1 kg","k":"puntarelle"},{"n":"acciughe sott’olio","q":"6 filetti","k":"acciughe sott’olio"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"aceto","q":"3 cucchiai","k":"aceto"}],"proc":["Stacca i germogli interni della cicoria catalogna e tagliali a listarelle sottili per il lungo.","Mettili in acqua fredda e ghiaccio per un’ora: si arricciano da soli.","Pesta le acciughe con l’aglio fino a una crema.","Unisci aceto e olio a filo continuando a battere.","Scola e asciuga bene le puntarelle e condisci solo al momento."],"nota":"L’arricciatura viene dall’acqua ghiacciata, non dal taglio: senza quel passaggio restano dritte e amare.","luogo":"Lazio","estero":false,"all":["pesce","solfiti"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":200,"n":"Trippa alla romana","cat":"Secondi","tempo":120,"diff":"media","tags":["vegetariano","senza forno"],"ing":[{"n":"trippa","q":"1 kg","k":"trippa"},{"n":"passata di pomodoro","q":"600 gr","k":"passata di pomodoro"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"carota","q":"1","k":"carota"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"mentuccia","q":"1 ciuffo","k":"mentuccia"},{"n":"pecorino romano","q":"100 gr","k":"pecorino romano"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"}],"proc":["Lessa la trippa già pulita per un’ora in acqua con alloro, poi tagliala a listarelle.","Prepara il soffritto con cipolla, carota e sedano.","Unisci la trippa, sfuma col vino e lascia insaporire.","Aggiungi la passata e cuoci un’ora a fuoco dolce.","Completa con abbondante mentuccia e pecorino grattugiato."],"nota":"Senza mentuccia e senza pecorino è una trippa qualsiasi: sono quelli a renderla romana.","luogo":"Lazio","estero":false,"all":["latte","sedano","solfiti"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":201,"n":"Supplì al telefono","cat":"Antipasti","tempo":90,"diff":"media","tags":[],"ing":[{"n":"riso","q":"320 gr","k":"riso"},{"n":"passata di pomodoro","q":"300 gr","k":"passata di pomodoro"},{"n":"carne macinata","q":"200 gr","k":"carne macinata"},{"n":"mozzarella","q":"200 gr","k":"mozzarella"},{"n":"uova","q":"3","k":"uova"},{"n":"pangrattato","q":"200 gr","k":"pangrattato"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"},{"n":"cipolla","q":"1","k":"cipolla"}],"proc":["Prepara un ragù con cipolla, carne e passata, cuocendo quaranta minuti.","Cuoci il riso nel ragù allungato con acqua, come un risotto, finché è asciutto.","Manteca con parmigiano e un uovo, poi stendi e fai raffreddare completamente.","Forma crocchette inserendo al centro un bastoncino di mozzarella.","Passa nell’uovo e nel pangrattato e friggi a 175 gradi."],"nota":"Il telefono è il filo di mozzarella che si tende spezzandoli: se non fila, il supplì è sbagliato.","luogo":"Lazio","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":202,"n":"Pasta e ceci alla romana","cat":"Primi","tempo":60,"diff":"facile","tags":[],"ing":[{"n":"pasta","q":"200 gr","k":"pasta"},{"n":"ceci","q":"500 gr","k":"ceci"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"rosmarino","q":"2 rametti","k":"rosmarino"},{"n":"acciughe sott’olio","q":"3 filetti","k":"acciughe sott’olio"},{"n":"passata di pomodoro","q":"100 gr","k":"passata di pomodoro"}],"proc":["Scalda l’olio con aglio in camicia e rosmarino, poi sciogli le acciughe.","Unisci i ceci e la passata e copri con la loro acqua di cottura.","Frulla un terzo dei ceci e rimettili nella pentola.","Cuoci la pasta direttamente dentro, mescolando spesso.","Spegni, togli il rosmarino e lascia riposare dieci minuti."],"nota":"Le acciughe non si sentono ma danno la sapidità di fondo: è il trucco della cucina romana povera.","luogo":"Lazio","estero":false,"all":["glutine","pesce"],"unico":true,"nvoci":6,"minimo":false,"leggero":true,"att":["frullatore o minipimer"],"att_opz":[]},{"id":203,"n":"Frittata di carciofi","cat":"Secondi","tempo":35,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"carciofi","q":"4","k":"carciofi"},{"n":"uova","q":"6","k":"uova"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"},{"n":"aglio","q":"1 spicchio","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"limone","q":"1","k":"limone"}],"proc":["Pulisci i carciofi, affettali sottili e tienili in acqua e limone.","Saltali in padella con aglio e olio per dieci minuti, sala e lascia intiepidire.","Sbatti le uova con parmigiano, prezzemolo, sale e pepe.","Unisci i carciofi e versa in padella antiaderente.","Cuoci a fuoco basso sette minuti, poi gira con un coperchio e prosegui quattro."],"nota":"I carciofi vanno affettati davvero sottili: a spicchi grossi la frittata non si compatta.","luogo":"Lazio","estero":false,"all":["latte","uova"],"unico":true,"nvoci":6,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":204,"n":"Maccheroni alla chitarra","cat":"Primi","tempo":90,"diff":"media","tags":[],"ing":[{"n":"semola","q":"300 gr","k":"semola"},{"n":"farina","q":"100 gr","k":"farina"},{"n":"uova","q":"4","k":"uova"},{"n":"carne macinata","q":"300 gr","k":"carne macinata"},{"n":"passata di pomodoro","q":"600 gr","k":"passata di pomodoro"},{"n":"cipolla","q":"1","k":"cipolla"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"},{"n":"pecorino romano","q":"80 gr","k":"pecorino romano"}],"proc":["Impasta semola, farina e uova e lascia riposare mezz’ora.","Stendi sfoglie spesse quanto la distanza fra i fili della chitarra, circa due millimetri.","Appoggia la sfoglia sui fili e premi col mattarello: cadono spaghetti a sezione quadrata.","Prepara un ragù con cipolla, carne e passata, cuocendo un’ora.","Cuoci la pasta due minuti e condisci con il ragù e il pecorino."],"nota":"La sezione quadrata trattiene il sugo molto più di quella tonda: è tutto il senso della chitarra.","luogo":"Abruzzo","estero":false,"all":["glutine","latte","uova"],"unico":false,"nvoci":8,"minimo":false,"leggero":true,"att":[],"att_opz":[]},{"id":205,"n":"Pallotte cacio e ova","cat":"Secondi","tempo":50,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pane raffermo","q":"200 gr","k":"pane"},{"n":"pecorino romano","q":"200 gr","k":"pecorino romano"},{"n":"uova","q":"4","k":"uova"},{"n":"aglio","q":"2 spicchi","k":"aglio"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"passata di pomodoro","q":"500 gr","k":"passata di pomodoro"},{"n":"basilico","q":"1 ciuffo","k":"basilico"}],"proc":["Ammolla il pane in acqua e strizzalo bene.","Impasta con pecorino grattugiato, uova, aglio e prezzemolo tritati.","Forma palline grandi come una noce e friggile in olio caldo.","Prepara un sugo semplice con olio, passata e basilico.","Tuffa le pallotte nel sugo e cuoci venti minuti a fuoco dolce."],"nota":"Polpette senza carne, nate dalla povertà: il pecorino deve essere tanto e stagionato.","luogo":"Abruzzo","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":206,"n":"Pampanella molisana","cat":"Secondi","tempo":90,"diff":"facile","tags":[],"ing":[{"n":"maiale","q":"1 kg","k":"maiale"},{"n":"paprica","q":"3 cucchiai","k":"paprica"},{"n":"peperoncino secco","q":"2","k":"peperoncino secco"},{"n":"aglio","q":"4 spicchi","k":"aglio"},{"n":"aceto","q":"100 ml","k":"aceto"}],"proc":["Taglia il maiale a pezzi regolari, tenendo un po’ di grasso.","Prepara la marinata con paprica dolce, peperoncino, aglio tritato, sale e aceto.","Massaggia bene la carne e lasciala riposare almeno due ore.","Disponi in teglia coperta e inforna a 180 gradi per un’ora.","Scopri e alza a 200 gradi per gli ultimi quindici minuti."],"nota":"L’aceto versato a fine cottura è quello che le dà il carattere: non saltarlo.","luogo":"Molise","estero":false,"all":["solfiti"],"unico":false,"nvoci":5,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":207,"n":"Pasta alla Genovese","cat":"Primi","tempo":240,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pasta","q":"400 gr","k":"pasta"},{"n":"cipolla","q":"1,5 kg","k":"cipolla"},{"n":"manzo","q":"600 gr","k":"manzo"},{"n":"carota","q":"1","k":"carota"},{"n":"sedano","q":"1 costa","k":"sedano"},{"n":"vino bianco","q":"1 bicchiere","k":"vino bianco"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"}],"proc":["Affetta le cipolle sottilissime: devono essere almeno il doppio della carne.","Metti in pentola carne, cipolle, carota e sedano tritati, con poco olio e niente acqua.","Cuoci coperto a fuoco bassissimo per tre ore: le cipolle rilasciano tutta la loro acqua.","Scopri, sfuma col vino e prosegui finché il fondo è cremoso e biondo scuro.","Condisci gli ziti spezzati a mano con la salsa e abbondante formaggio."],"nota":"Di genovese non ha nulla: il nome viene dai cuochi liguri che lavoravano al porto di Napoli.","luogo":"Campania","estero":false,"all":["glutine","latte","sedano","solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":208,"n":"Pasta alla scarpariello","cat":"Primi","tempo":30,"diff":"facile","tags":["vegetariano","senza forno"],"ing":[{"n":"pasta","q":"320 gr","k":"pasta"},{"n":"pomodorini","q":"600 gr","k":"pomodorini"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"basilico","q":"1 ciuffo","k":"basilico"},{"n":"pecorino romano","q":"80 gr","k":"pecorino romano"},{"n":"parmigiano","q":"60 gr","k":"parmigiano"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"}],"proc":["Soffriggi l’aglio in camicia con il peperoncino, poi toglilo.","Unisci i pomodorini tagliati a metà e cuoci dieci minuti a fuoco vivo, schiacciandone alcuni.","Cuoci la pasta molto al dente e scolala tenendo l’acqua.","Saltala nel sugo e togli dal fuoco.","Manteca con i due formaggi e acqua di cottura, mescolando finché diventa cremoso."],"nota":"Il nome viene dai calzolai, che la facevano il lunedì con i formaggi avanzati dalla domenica.","luogo":"Campania","estero":false,"all":["glutine","latte"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":[]},{"id":209,"n":"Polpo alla luciana","cat":"Secondi","tempo":90,"diff":"media","tags":["senza forno"],"ing":[{"n":"polpo","q":"1,2 kg","k":"polpo"},{"n":"pomodorini","q":"400 gr","k":"pomodorini"},{"n":"aglio","q":"3 spicchi","k":"aglio"},{"n":"peperoncino secco","q":"1","k":"peperoncino secco"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"olive","q":"80 gr","k":"olive"},{"n":"capperi","q":"30 gr","k":"capperi"}],"proc":["Metti il polpo in una casseruola di coccio con olio, aglio, peperoncino e pomodorini.","Non aggiungere acqua: il polpo deve cuocere nella propria.","Chiudi con carta forno e coperchio pesante, e cuoci a fuoco bassissimo per un’ora.","Controlla solo alla fine: ogni volta che sollevi il coperchio perdi vapore.","Unisci olive e capperi e completa con il prezzemolo."],"nota":"Il detto napoletano è che il polpo si cuoce nell’acqua sua. Coperchio pesante e pazienza.","luogo":"Campania","estero":false,"all":["molluschi"],"unico":false,"nvoci":7,"minimo":false,"leggero":true,"att":[],"att_opz":["pentola a pressione"]},{"id":210,"n":"Ragù napoletano","cat":"Primi","tempo":300,"diff":"facile","tags":["senza forno"],"ing":[{"n":"pasta","q":"400 gr","k":"pasta"},{"n":"manzo","q":"800 gr","k":"manzo"},{"n":"salsiccia","q":"300 gr","k":"salsiccia"},{"n":"cipolla","q":"500 gr","k":"cipolla"},{"n":"passata di pomodoro","q":"1,5 l","k":"passata di pomodoro"},{"n":"vino rosso","q":"200 ml","k":"vino rosso"},{"n":"parmigiano","q":"100 gr","k":"parmigiano"}],"proc":["Rosola i pezzi interi di carne e la salsiccia in olio, a fuoco vivo.","Unisci le cipolle affettate e lasciale appassire lentamente.","Sfuma col vino rosso e fai evaporare del tutto.","Versa la passata e porta a sobbollire appena, il famoso pippiare.","Cuoci scoperto quattro o cinque ore, mescolando ogni mezz’ora con un cucchiaio di legno.","La carne si serve come secondo, il sugo condisce la pasta."],"nota":"Non deve mai bollire: deve fare la bolla ogni tanto, piano. È quello che i napoletani chiamano pippiare.","luogo":"Campania","estero":false,"all":["glutine","latte","solfiti"],"unico":false,"nvoci":7,"minimo":false,"leggero":false,"att":[],"att_opz":["pentola a pressione"]},{"id":211,"n":"Impepata di cozze","cat":"Antipasti","tempo":20,"diff":"facile","tags":["senza forno"],"ing":[{"n":"cozze","q":"2 kg","k":"cozze"},{"n":"pepe nero","q":"3 cucchiai","k":"pepe nero"},{"n":"limone","q":"2","k":"limone"},{"n":"prezzemolo","q":"1 ciuffo","k":"prezzemolo"},{"n":"pane raffermo","q":"8 fette","k":"pane"}],"proc":["Pulisci le cozze raschiando i gusci.","Mettile in una pentola larga con abbondante pepe macinato grosso e niente altro.","Copri e cuoci a fuoco vivo cinque minuti, scuotendo la pentola.","Spegni appena sono aperte e unisci prezzemolo e succo di limone.","Servi con pane abbrustolito per raccogliere il fondo."],"nota":"Niente aglio, niente vino, niente pomodoro: solo cozze e pepe. È il piatto più essenziale che ci sia.","luogo":"Campania","estero":false,"all":["glutine","molluschi"],"unico":false,"nvoci":4,"minimo":true,"leggero":true,"att":[],"att_opz":[]},{"id":212,"n":"Alici indorate e fritte","cat":"Secondi","tempo":40,"diff":"facile","tags":[],"ing":[{"n":"alici fresche","q":"800 gr","k":"alici fresche"},{"n":"farina","q":"150 gr","k":"farina"},{"n":"uova","q":"3","k":"uova"},{"n":"limone","q":"2","k":"limone"}],"proc":["Pulisci le alici togliendo testa e lisca, e aprile a libro senza dividerle.","Passale nella farina e poi nell’uovo sbattuto e salato.","Friggi in olio caldo poche per volta, un minuto per lato.","Scola su carta e sala solo ora.","Servi subito con spicchi di limone."],"nota":"Indorate vuol dire nell’uovo, non impanate: il pangrattato qui non c’entra.","luogo":"Campania","estero":false,"all":["glutine","pesce","uova"],"unico":false,"nvoci":4,"minimo":true,"leggero":false,"att":[],"att_opz":[]},{"id":213,"n":"Gattò di patate","cat":"Secondi","tempo":80,"diff":"facile","tags":[],"ing":[{"n":"patate","q":"1,2 kg","k":"patate"},{"n":"uova","q":"3","k":"uova"},{"n":"parmigiano","q":"120 gr","k":"parmigiano"},{"n":"mozzarella","q":"250 gr","k":"mozzarella"},{"n":"prosciutto cotto","q":"150 gr","k":"prosciutto cotto"},{"n":"burro","q":"60 gr","k":"burro"},{"n":"pangrattato","q":"80 gr","k":"pangrattato"},{"n":"latte","q":"100 ml","k":"latte"}],"proc":["Lessa le patate con la buccia, sbucciale da calde e passale allo schiacciapatate.","Condisci con burro, latte, uova, parmigiano, sale e pepe.","Stendi metà del composto in teglia imburrata e cosparsa di pangrattato.","Farcisci con mozzarella scolata e prosciutto a dadini, poi copri con il resto.","Cospargi di pangrattato e fiocchetti di burro e inforna a 200 gradi per 40 minuti."],"nota":"La mozzarella va tagliata e fatta scolare un’ora: altrimenti il gattò si allaga.","luogo":"Campania","estero":false,"all":["glutine","latte","uova"],"unico":true,"nvoci":8,"minimo":false,"leggero":false,"att":["setaccio o schiacciapatate"],"att_opz":[]},{"id":214,"n":"Peperoni imbottiti","cat":"Secondi","tempo":70,"diff":"facile","tags":[],"ing":[{"n":"peperoni","q":"6","k":"peperoni"},{"n":"pane raffermo","q":"200 gr","k":"pane"},{"n":"olive","q":"80 gr","k":"olive"},{"n":"capperi","q":"40 gr","k":"capperi"},{"n":"acciugh
