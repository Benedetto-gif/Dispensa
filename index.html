    };
  });

  pulsanti("Indietro", "La dispensa è a posto", ()=>vai(3), ()=>vai(1));
}

  if(qi){ qi.oninput = e=>{ sess.cerca = e.target.value; }; }
  const segnaRec = v=>{
    const i = sess.recupero.indexOf(v);
    if(i < 0){
      sess.recupero.push(v);
      if(!S.dispensa.includes(v)){
        S.dispensa.push(v);
        S.dispensaData = new Date().toLocaleDateString("it-IT");
        salva();
      }
    }else sess.recupero.splice(i, 1);
  };
  ["rec","recTrova"].forEach(id=>{
    const box = document.getElementById(id);
    if(box) box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      segnaRec(b.dataset.i);
      if(id === "recTrova"){ cercaRec = ""; tappaVoglia(); }
      else b.classList.toggle("on");
    });
  });
  const rc = document.getElementById("recCerca");
  if(rc) rc.oninput = e=>{
    cercaRec = e.target.value;
    const pos = e.target.selectionStart;
    tappaVoglia();
    const n2 = document.getElementById("recCerca");
    if(n2){ n2.focus(); n2.setSelectionRange(pos, pos); }
  };
  const ra = document.getElementById("recAdd");
  if(ra) ra.onclick = ()=>{
    const nome = cercaRec.trim();
    if(!nome) return;
    const k = aggiungiIngrediente(nome, indovinaCat(nome));
    if(k) segnaRec(k);
    cercaRec = "";
    tappaVoglia();
  };
  app.querySelectorAll("#port .chip[data-v]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.v, i=sess.portate.indexOf(v); i<0?sess.portate.push(v):sess.portate.splice(i,1); b.classList.toggle("on"); });
  document.getElementById("swUnico").onclick=()=>{ sess.unico=!sess.unico; tappaVoglia(); };
  app.querySelectorAll("#stile .chip").forEach(b=>b.onclick=()=>{ sess.stile=b.dataset.v; tappaVoglia(); });
  app.querySelectorAll("#tempo .chip").forEach(b=>b.onclick=()=>{ sess.tempo=b.dataset.v; tappaVoglia(); });
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ sess.accordo=b.dataset.a; tappaVoglia(); });

  pulsanti("Indietro", "Vedi le ricette", ()=>vai(4), ()=>vai(2));
}

/* ===========================================================
   Dosi: l'archivio e' scritto per quattro, qui si riscala
   =========================================================== */
const PER_QUATTRO = 4;
function dosiAttuali(){ return dosiPer || Math.max(1, tavolata().length); }
function fattoreDosi(){ return dosiAttuali() / PER_QUATTRO; }
function rigaDosi(){
  return `<div class="dosi">Dosi per <button data-dosi="-1" aria-label="Meno">\u2212</button>` +
         `<b data-dosi-n>${dosiAttuali()}</b>` +
         `<button data-dosi="1" aria-label="Piu">+</button> a tavola</div>`;
}
function scalaQ(q, f){
  const t = String(q);
  if(Math.abs(f - 1) < 0.001) return t;
  let val, resto, m = t.match(/^\s*(\d+)\s*\/\s*(\d+)(.*)$/);
  if(m){ val = (+m[1]) / (+m[2]); resto = m[3]; }
  else{
    m = t.match(/^\s*(\d+(?:[.,]\d+)?)(.*)$/);
    if(!m) return t;                                   /* "qualche foglia", "1 ciuffo" senza numero */
    val = parseFloat(m[1].replace(",", ".")); resto = m[2];
  }
  const u = resto.trim().toLowerCase();
  let v = val * f;
  if(/^(gr|g|ml)\b/.test(u)){
    v = v < 20 ? Math.max(1, Math.round(v))
      : v < 100 ? Math.round(v/5)*5
      : Math.round(v/10)*10;
  }
  else if(/^(kg|l)\b/.test(u))                              v = Math.round(v*20)/20;
  else if(/^(cucchia|tazz|bicchier|pizzic)/.test(u)) v = Math.max(0.5, Math.round(v*2)/2);
  else                                                      v = Math.max(1, Math.round(v));
  let txt;
  if(Number.isInteger(v)) txt = String(v);
  else if(Math.abs(v % 1 - 0.5) < 0.001) txt = v < 1 ? "\u00bd" : Math.floor(v) + "\u00bd";
  else txt = String(Math.round(v*100)/100).replace(".", ",");
  if(v === 1) resto = resto.replace(/^(\s*)(cucchiai|cucchiaini|spicchi|fette|filetti|rametti|foglie|ciuffi|coste|bustine|rotoli)\b/,
    (t,sp,w)=>sp + ({cucchiai:"cucchiaio",cucchiaini:"cucchiaino",spicchi:"spicchio",fette:"fetta",
      filetti:"filetto",rametti:"rametto",foglie:"foglia",ciuffi:"ciuffo",coste:"costa",
      bustine:"bustina",rotoli:"rotolo"}[w] || w));
  return txt + resto;
}
function aggiornaDosi(){
  const f = fattoreDosi();
  document.querySelectorAll("em[data-q]").forEach(e=>{ e.textContent = scalaQ(e.dataset.q, f); });
  document.querySelectorAll("[data-dosi-n]").forEach(e=>{ e.textContent = dosiAttuali(); });
}

/* ===========================================================
   Modalita cucina: un passo per volta, timer, schermo acceso
   =========================================================== */
let cucina = null, schermo = null;
let timFine = 0, timInt = null, timSuonato = false;

async function tieniSchermo(){
  try{ if("wakeLock" in navigator) schermo = await navigator.wakeLock.request("screen"); }catch(e){}
}
function rilasciaSchermo(){ try{ schermo && schermo.release(); }catch(e){} schermo = null; }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && veloAperto === "cucina") tieniSchermo();
});

const NUMPAROLA = {un:1,una:1,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10,
  quindici:15,venti:20,venticinque:25,trenta:30,quaranta:40,cinquanta:50,sessanta:60};
function minutiPasso(t){
  let x = String(t).toLowerCase();
  x = x.replace(/\b(un|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|quindici|venti|venticinque|trenta|quaranta|cinquanta|sessanta)\s+(minut|or[ae])/g,
                (m,w,u)=>NUMPAROLA[w] + " " + u);
  let m = x.match(/(\d+)\s*(?:[-oe]\s*\d+\s*)?minut/);
  if(m) return +m[1];
  m = x.match(/(\d+)\s*min\b/);
  if(m) return +m[1];
  m = x.match(/(\d+)\s*or[ae]\b/);
  if(m) return Math.min(180, +m[1]*60);
  if(/\bun\s+minut/.test(x)) return 1;
  if(/mezz\s*\u2019?\s*ora/.test(x)) return 30;
  if(/un\s*\u2019?\s*ora/.test(x)) return 60;
  return 0;
}
const mmss = ms=>{
  const t = Math.max(0, Math.round(ms/1000));
  return Math.floor(t/60) + ":" + String(t%60).padStart(2,"0");
};
function avviaTimer(min){
  timFine = Date.now() + min*60000; timSuonato = false;
  if(timInt) clearInterval(timInt);
  timInt = setInterval(battito, 1000);
  disegnaCucina();
}
function fermaTimer(){
  if(timInt) clearInterval(timInt);
  timInt = null; timFine = 0; timSuonato = false;
}
function battito(){
  const resta = timFine - Date.now();
  const el = document.getElementById("timerNum");
  if(el) el.textContent = mmss(resta);
  if(resta <= 0){
    clearInterval(timInt); timInt = null; timSuonato = true;
    sveglia();
    if(veloAperto === "cucina") disegnaCucina();
  }
}
function sveglia(){
  try{ navigator.vibrate && navigator.vibrate([300,150,300,150,300]); }catch(e){}
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.6, 1.2].forEach(d=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.35);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.4);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 2500);
  }catch(e){}
}
function apriCucina(r){
  cucina = {r, i:0};
  fermaTimer();
  tieniSchermo();
  disegnaCucina();
}
function disegnaCucina(){
  const r = cucina.r, n = r.proc.length, passoT = pulito(r.proc[cucina.i]);
  const min = minutiPasso(r.proc[cucina.i]);
  const ultimo = cucina.i === n - 1;
  const inCorso = timInt !== null;
  const blocco = timSuonato
    ? `<div class="timer suona"><b>tempo scaduto</b>
         <button class="chiudi" data-cuc="reset">Va bene</button></div>`
    : inCorso
      ? `<div class="timer"><b id="timerNum">${mmss(timFine - Date.now())}</b>
           <button class="chiudi" data-cuc="reset">Ferma</button></div>`
      : min ? `<div class="timer"><b>${min} min</b>
           <button class="chiudi" data-cuc="timer">Avvia il timer</button></div>` : "";

  apriVelo("cucina", `
    <div class="velo-top">
      <h2>${esc(r.n)}</h2>
      <button class="chiudi" data-cuc="chiudi">Chiudi</button>
    </div>
    <div class="passo-n">Passo ${cucina.i+1} di ${n}</div>
    <div class="passo-g">${passoT}</div>
    ${blocco}
    <details class="gruppo"><summary>Ingredienti <em>per ${dosiAttuali()} a tavola</em></summary>
      <div class="corpo"><ul class="ing-l">${r.ing.map(i=>
        `<li><span>${esc(i.n)}</span><em data-q="${esc(i.q)}">${esc(scalaQ(i.q, fattoreDosi()))}</em></li>`).join("")}</ul>
        ${rigaDosi()}</div>
    </details>
    ${r.nota && ultimo ? `<div class="nota">${pulito(r.nota)}</div>` : ""}
    <div class="azioni">
      ${cucina.i > 0 ? `<button class="btn ghost" data-cuc="giu">Indietro</button>` : ""}
      ${ultimo ? `<button class="btn" data-cuc="fine">Ho finito</button>`
               : `<button class="btn" data-cuc="su">Avanti</button>`}
    </div>`);
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-cuc]");
  if(!b || !cucina) return;
  const a = b.dataset.cuc;
  if(a === "chiudi"){ chiudiVelo(); cucina = null; return; }
  if(a === "su"){ cucina.i++; fermaTimer(); disegnaCucina(); return; }
  if(a === "giu"){ cucina.i--; fermaTimer(); disegnaCucina(); return; }
  if(a === "timer"){ avviaTimer(minutiPasso(cucina.r.proc[cucina.i])); return; }
  if(a === "reset"){ fermaTimer(); disegnaCucina(); return; }
  if(a === "fine"){ const r = cucina.r; rilasciaSchermo(); apriFine(r); return; }
});

for(const [cat, ks] of Object.entries(CAT_DISP)) (ks||[]).forEach(k=>{ CAT_OF[k] = cat; });

      <div class="card">

        <p class="mini">Sono già spuntati i freschi. Togli la spunta a quello che ti è avanzato.</p>

          const fresco = DEPERIBILI.includes(CAT_OF[i.k] || "");

    <div class="azioni">

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-fine]");
  if(!b) return;
  if(b.dataset.fine === "annulla"){ chiudiVelo(); cucina = null; return; }
  const r = trovaRicetta(+b.dataset.id);
  if(!r) return;
  S.cucinate[r.id] = Date.now();
  const inSpesa = document.getElementById("fineSpesa");
  const tolti = [...document.querySelectorAll("[data-usato]:checked")].map(c=>c.dataset.usato);
  if(tolti.length){
    S.dispensa = S.dispensa.filter(k=>!tolti.includes(k));
    if(inSpesa && inSpesa.checked)
      tolti.forEach(k=>{
        const ing = r.ing.find(i=>i.k === k);
        metti(k, ing ? ing.n : k, ing ? scalaQ(ing.q, fattoreDosi()) : "");
      });
  }
  salva();
  chiudiVelo(); cucina = null;
  if(passo === 4) tappaRicette();
});

function metti(k, nome, quanto){
  if(S.spesa.some(x=>x.k === k)) return;
  S.spesa.push({k, t: nome + (quanto ? " \u2014 " + quanto : ""), presa:false});
}
function aggiungiSpesa(r){
  const f = fattoreDosi();
  r.ing.forEach(i=>{
    if(possiedo(i.k) || sostituto(i.k)) return;
    metti(i.k, i.n, scalaQ(i.q, f));
  });
  salva();
}

/* ===========================================================
   Ingredienti: le chiavi della dispensa e come indovinarle
   =========================================================== */
function chiaviDispensa(){
  return Object.entries(CAT_DISP).flatMap(([c,l])=>(l||[]).map(k=>[k,c]));
}
/* come l'archivio chiama le cose: "maccheroni" e "trofie" sono entrambi "pasta" */
const NOMI_K = (()=>{
  const m = {};
  D.ricette.forEach(r=>r.ing.forEach(i=>{ const n = normTesto(i.n); if(!m[n]) m[n] = i.k; }));
  return m;
})();
function chiaveDi(nome){
  const n = normTesto(nome);
  if(!n) return "";
  const tutte = chiaviDispensa().map(([k])=>k).concat(Array.from(BASE));
  const esatta = tutte.find(k=>normTesto(k) === n);
  if(esatta) return esatta;
  if(NOMI_K[n]) return NOMI_K[n];
  /* la chiave più lunga contenuta nel nome scritto: "passata di pomodoro" batte "pomodoro" */
  let best = "", lung = 0;
  tutte.forEach(k=>{
    const x = normTesto(k);
    if((n.includes(x) || x.includes(n)) && x.length > lung){ best = k; lung = x.length; }
  });
  if(best) return best;
  Object.keys(NOMI_K).forEach(x=>{
    if(x.length > 3 && n.includes(x) && x.length > lung){ best = NOMI_K[x]; lung = x.length; }
  });
  return best;
}
function categoriaDi(k){
  const t = chiaviDispensa().find(([x])=>x === k);
  return t ? t[1] : "";
}
const INDIZI = [
  [/(pesce|tonno|salmone|gamber|cozz|vongol|alic|sard|polp|calamar|merluzz|spigol|orat|seppi|baccal|stocc|spada)/, "Pesce"],
  [/(manzo|vitell|pollo|maial|agnell|salsicc|prosciutt|salam|pancett|guancial|speck|lard|tacchin|coniglio|bresaol|mortadell|carne)/, "Carne e salumi"],
  [/(latte|formagg|ricott|mozzarell|burro|yogurt|uov|panna|pecorin|parmigian|scamorz|provol|fontin|gorgonzol|stracchin|mascarpon|feta)/, "Latticini e uova"],
  [/(surgelat|congelat|gelat)/, "Surgelati e congelati"],
  [/(scatol|barattol|pelati|passata|conserv|sott.olio|sottaceto|tonno in|legumi in)/, "Scatolette e conserve"],
  [/(origan|basilic|prezzemol|rosmarin|timo|salvi|allor|menta|cannell|pepe|paprica|curry|cumin|zafferan|noce moscat|spezi|erba|semi di)/, "Erbe e spezie"],
  [/(insalat|pomodor|zucchin|melanzan|peperon|carot|cipoll|agli|patat|spinac|broccol|cavol|finocchi|carciof|funghi|zucca|sedano|porro|rap|bietol|cicori|radicchi|fagiolini|verdur|frutt|mel[ae]|pera|limon|aranc|banan)/, "Verdure e ortaggi"]
];
function indovinaCat(nome){
  const k = chiaveDi(nome);
  if(k) return categoriaDi(k);
  const n = normTesto(nome);
  const t = INDIZI.find(([re])=>re.test(n));
  return t ? t[1] : "Dispensa";
}
function aggiungiIngrediente(nome, cat){
  const k = nome.trim().toLowerCase();
  if(!k) return "";
  if(chiaviDispensa().some(([x])=>x === k)) return k;
  CAT_DISP[cat] = CAT_DISP[cat] || [];
  CAT_DISP[cat].push(k);
  S.ingMiei[cat] = S.ingMiei[cat] || [];
  S.ingMiei[cat].push(k);
  salva();
  return k;
}

function spostaIngrediente(k, cat){
  const mio = Object.values(S.ingMiei || {}).some(l=>(l||[]).includes(k));
  for(const c in CAT_DISP) CAT_DISP[c] = CAT_DISP[c].filter(x=>x !== k);
  CAT_DISP[cat] = CAT_DISP[cat] || [];
  CAT_DISP[cat].push(k);
  S.ingSpostati[k] = cat;
  if(mio){
    for(const c in S.ingMiei) S.ingMiei[c] = (S.ingMiei[c]||[]).filter(x=>x !== k);
    S.ingMiei[cat] = S.ingMiei[cat] || [];
    S.ingMiei[cat].push(k);
  }
  salva();
}
function togliIngrediente(k){
  for(const c in CAT_DISP) CAT_DISP[c] = CAT_DISP[c].filter(x=>x !== k);
  for(const c in S.ingMiei) S.ingMiei[c] = (S.ingMiei[c]||[]).filter(x=>x !== k);
  delete S.ingSpostati[k];
  if(!S.ingTolti.includes(k)) S.ingTolti.push(k);
  S.dispensa = S.dispensa.filter(x=>x !== k);
  salva();
}
function rimettiTolti(){
  (S.ingTolti || []).forEach(k=>{
    const cat = S.ingSpostati[k] || indovinaCat(k);
    CAT_DISP[cat] = CAT_DISP[cat] || [];
    if(!CAT_DISP[cat].includes(k)) CAT_DISP[cat].push(k);
    if(!D.dispensa[cat] || !D.dispensa[cat].includes(k)){
      S.ingMiei[cat] = S.ingMiei[cat] || [];
      if(!S.ingMiei[cat].includes(k)) S.ingMiei[cat].push(k);
    }
  });
  S.ingTolti = [];
  salva();
}

/* ===========================================================
   Leggere una ricetta scritta a mano o copiata dal web
   =========================================================== */
const UNITA = "cucchiaini|cucchiaino|cucchiaio|cucchiai|bicchieri|bicchiere|pizzichi|pizzico|spicchio|spicchi|bustine|bustina|rametti|rametto|filetti|filetto|foglie|foglia|ciuffi|ciuffo|rotoli|rotolo|coste|costa|fette|fetta|tazze|tazza|kg|gr|ml|cl|g|l";
function leggiIng(riga){
  let t = riga.replace(/^[\s\-\u2022*\u00b7]+/, "").replace(/^\d{1,2}[.)]\s+/, "").trim();
  if(!t) return null;
  let q = "", n = t;
  if(/\bq\.?\s*b\.?\s*$/i.test(t)){ q = "q.b."; t = t.replace(/\bq\.?\s*b\.?\s*$/i, "").replace(/[:,\-\s]+$/, "").trim(); n = t; }
  let m = t.match(new RegExp("^((?:\\d+\\s*/\\s*\\d+|\\d+[.,]?\\d*)\\s*(?:" + UNITA + ")?)\\s*(?:di\\s+|d\u2019|d')?(.+)$", "i"));
  if(m){ q = m[1].trim(); n = m[2].trim(); }
  else{
    m = t.match(new RegExp("^(.+?)[\\s,:]+((?:\\d+[.,]?\\d*)\\s*(?:" + UNITA + "))$", "i"));
    if(m){ n = m[1].trim(); q = m[2].trim(); }
  }
  n = n.replace(/\s*\(.*?\)\s*/g, " ").replace(/[.;:,]+$/, "").trim();
  if(!n) return null;
  return {n: n.toLowerCase(), q: q || "q.b.", k: chiaveDi(n)};
}
function leggiTesto(testo){
  const righe = testo.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let nome = "", ing = [], proc = [], zona = "";
  const isIng   = x=>/^ingredient/i.test(x);
  const isProc  = x=>/^(procedimento|preparazione|esecuzione|come si prepara|istruzioni|metodo)/i.test(x);
  righe.forEach((x, i)=>{
    if(isIng(x)){ zona = "i"; return; }
    if(isProc(x)){ zona = "p"; return; }
    if(!nome && zona === "" && x.length < 70 && !/^\d/.test(x)){ nome = x; return; }
    if(zona === "i"){ const g = leggiIng(x); if(g) ing.push(g); return; }
    if(zona === "p"){ proc.push(x.replace(/^\d+[.)]\s*/, "")); return; }
    /* nessuna intestazione: decido riga per riga */
    if(/^[\s\-\u2022*]*\d/.test(x) || x.length < 45){ const g = leggiIng(x); if(g) ing.push(g); }
    else proc.push(x.replace(/^\d+[.)]\s*/, ""));
  });
  return {nome, ing, proc};
}
async function scaricaDaWeb(url, dove){
  dove.textContent = "Provo a scaricare la pagina\u2026";
  try{

}

    <p class="mini">Questi ingredienti non li ho riconosciuti. Dimmi a cosa corrispondono in dispensa, oppure lasciali come nuovi: li aggiungo io nel reparto che indichi.</p>
    ${orfani.map((i, n)=>`
      <div class="card">
        <b>${esc(i.n)}</b>
        <label class="campo" style="margin-top:8px"><span>Corrisponde a</span>
          <select data-ab-k="${n}">
            <option value="">— è un ingrediente nuovo —</option>
            ${opzioni.map(k=>`<option value="${esc(k)}">${k}</option>`).join("")}
          </select></label>
        <label class="campo"><span>Se è nuovo, in che reparto</span>
          <select data-ab-c="${n}">
            ${Object.keys(CAT_DISP).map(c=>`<option ${c===indovinaCat(i.n)?"selected":""}>${c}</option>`).join("")}
          </select></label>
      </div>`).join("")}
    <div class="azioni">
      <button class="btn" data-ab="ok">Va bene, salva</button>
      <button class="btn ghost" data-ab="annulla">Annulla</button>
    </div>`);
  velo._bozza = bozza; velo._orfani = orfani;
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-ab]");
  if(!b) return;
  if(b.dataset.ab === "annulla"){ chiudiVelo(); return; }
  const bozza = velo._bozza, orfani = velo._orfani;
  orfani.forEach((i, n)=>{
    const scelta = velo.querySelector(`[data-ab-k="${n}"]`).value;
    const cat = velo.querySelector(`[data-ab-c="${n}"]`).value;
    i.k = scelta || aggiungiIngrediente(i.n, cat);
  });
  salvaMia(bozza);
});

function salvaMia(r){
  preparaRicetta(r);
  S.mie = (S.mie || []).filter(x=>x.id !== r.id);
  S.mie.push(r);
  salva();
  chiudiVelo();
  passo === 4 ? tappaRicette() : apriMie();
}

/* ===========================================================
   Ricette nascoste

function apriNascoste(){
  const l = S.nascoste.map(trovaRicetta).filter(Boolean);
  apriVelo("nascoste", `
    <div class="velo-top"><h2>Ricette nascoste</h2>
      <button class="chiudi" data-nas="chiudi">Chiudi</button></div>
    ${l.length ? `<p class="mini">Non te le propongo più. Puoi rimetterle in circolo quando vuoi.</p>
      <ul class="spesa-l">${l.map(r=>
        `<li><span>${esc(r.n)}</span>
         <button class="chiudi" data-nas="su" data-id="${r.id}">Rimetti</button></li>`).join("")}</ul>`
      : `<div class="vuoto"><p>Non hai nascosto nessuna ricetta.</p>
         <p class="mini">Il tasto «Non propormela più» lo trovi dentro ogni ricetta.</p></div>`}`);
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-nas]");
  if(!b) return;
  if(b.dataset.nas === "chiudi"){ chiudiVelo(); return; }
  S.nascoste = S.nascoste.filter(x=>x !== +b.dataset.id);
  salva(); apriNascoste();
});

/* --- menu --- */
const menuPan = document.getElementById("menuPan");
const menuBtn = document.getElementById("menuBtn");
menuBtn.onclick = ()=>{ menuAperto=!menuAperto; disegnaMenu(); };

  const pronta = S.dispensa.length > 0;
  menuPan.innerHTML = `<div class="menu-pan">
    <div class="sez">Scorciatoia</div>
    <button id="mSalta" ${pronta?"":"disabled"}>${pronta?"Vai diretto alle ricette fattibili":"Prima carica la dispensa"}</button>

    <button data-go="1">Chi c'è a tavola</button>
    <button data-go="2">La dispensa</button>
    <button data-go="3">Cosa cucinare</button>
    <div class="sez">Strumenti</div>
    <button id="mSpesa">Lista della spesa${S.spesa.filter(x=>!x.presa).length?` (${S.spesa.filter(x=>!x.presa).length})`:""}</button>
    <button id="mMie">Le mie ricette${S.mie.length?` (${S.mie.length})`:""}</button>
    <button id="mNasc">Ricette nascoste${S.nascoste.length?` (${S.nascoste.length})`:""}</button>
    <button id="mSalva">Salva i miei dati in un file</button>
    <button id="mCarica">Reimporta da un file</button>
    <div class="sez">Altro</div>
    <button id="mNuova">Ricomincia il percorso</button>
    <button id="mReset" class="rischio">Azzera tutti i dati</button></div>`;
  menuPan.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ menuAperto=false; disegnaMenu(); vai(+b.dataset.go); });
  if(pronta) document.getElementById("mSalta").onclick=()=>{
    sess = nuovaSessione(); sess.modo="app"; menuAperto=false; disegnaMenu(); vai(4); };
  document.getElementById("mSpesa").onclick=()=>{ menuAperto=false; disegnaMenu(); apriSpesa(); };
  document.getElementById("mMie").onclick=()=>{ menuAperto=false; disegnaMenu(); apriMie(); };
  document.getElementById("mNasc").onclick=()=>{ menuAperto=false; disegnaMenu(); apriNascoste(); };
  document.getElementById("mSalva").onclick=()=>{ menuAperto=false; disegnaMenu(); esportaDati(); };
  document.getElementById("mCarica").onclick=()=>{ menuAperto=false; disegnaMenu(); importaDati(); };
  document.getElementById("mNuova").onclick=()=>{ sess = nuovaSessione(); menuAperto=false; disegnaMenu(); vai(0); };
  document.getElementById("mReset").onclick=()=>{
    if(confirm("Cancello profilo, ospiti e dispensa. Sicuro?")){
      S = JSON.parse(JSON.stringify(VUOTO)); sess = nuovaSessione(); salva(); menuAperto=false; disegnaMenu(); vai(0); }
  };
}

/* ===========================================================
   Radio
   Per cambiare o aggiungere un genere basta toccare questo elenco:
   ogni voce ha uno o piu indirizzi, provati in ordine finche uno risponde.
   =========================================================== */
const RADIO = [
  {n:"Classica",   u:["https://stream.srg-ssr.ch/m/rsc_it/mp3_128",
                      "https://stream.srg-ssr.ch/m/rsc_de/mp3_128"]},
  {n:"Jazz",       u:["https://stream.srg-ssr.ch/m/rsj/mp3_128"]},
  {n:"Rock",       u:["https://stream.radioparadise.com/rock-128",
                      "https://stream.radioparadise.com/mp3-128"]},
  {n:"House",      u:["https://ice5.somafm.com/beatblender-128-mp3",
                      "https://ice.somafm.com/beatblender"]},
  {n:"Elettronica",u:["https://ice5.somafm.com/groovesalad-128-mp3",
                      "https://ice.somafm.com/groovesalad"]},
  {n:"Folk",       u:["https://ice5.somafm.com/folkfwd-128-mp3",
                      "https://ice.somafm.com/folkfwd"]},
  {n:"Lounge",     u:["https://ice5.somafm.com/secretagent-128-mp3",
                      "https://ice.somafm.com/secretagent"]},
  {n:"Pop",        u:["https://stream.srg-ssr.ch/m/rsp/mp3_128"]}
];

const radioAudio = new Audio();
radioAudio.preload = "none";
let radioSel = -1, radioUrl = 0, radioMsg = "", radioAperto = false, radioAvanza = false;

function apriFlusso(){
  const st = RADIO[radioSel];
  radioMsg = "Collego " + st.n + "\u2026";
  radioAudio.src = st.u[radioUrl];
  disegnaRadio();
  radioAudio.play().catch(()=>avanzaRadio());
  try{
    if("mediaSession" in navigator)
      navigator.mediaSession.metadata = new MediaMetadata({title:st.n, artist:"Che cucino?"});
  }catch(e){}
}
function avanzaRadio(){
  if(radioSel < 0 || radioAvanza) return;
  radioAvanza = true;
  setTimeout(()=>{ radioAvanza = false; }, 400);
  if(radioUrl + 1 < RADIO[radioSel].u.length){ radioUrl++; apriFlusso(); }
  else{
    radioMsg = RADIO[radioSel].n + " non risponde adesso. Prova un altro genere.";
    radioSel = -1; disegnaRadio();
  }
}
function fermaRadio(){
  radioAudio.pause();
  radioAudio.removeAttribute("src");
  radioAudio.load();
  radioSel = -1; radioMsg = ""; disegnaRadio();
}
function accendiRadio(i){
  if(i === radioSel){ fermaRadio(); return; }
  radioSel = i; radioUrl = 0; apriFlusso();
}
radioAudio.addEventListener("error", avanzaRadio);
radioAudio.addEventListener("playing", ()=>{
  radioMsg = "In onda: " + RADIO[radioSel].n;
  disegnaRadio();
});

function disegnaRadio(){
  const btn = document.getElementById("radioBtn"), pan = document.getElementById("radioPan");
  btn.classList.toggle("suona", radioSel >= 0);
  btn.setAttribute("aria-expanded", radioAperto ? "true" : "false");
  if(!radioAperto){ pan.innerHTML = ""; return; }
  pan.innerHTML = `<div class="radio-pan">
    <div class="sez">Musica mentre cucini</div>
    ${radioMsg ? `<div class="stato">${esc(radioMsg)}</div>` : ""}
    ${RADIO.map((r,i)=>`<button data-i="${i}" class="${i===radioSel?"on":""}">${r.n}</button>`).join("")}
    ${radioSel>=0 ? `<button class="spegni" id="radioStop">Spegni</button>` : ""}
  </div>`;
  pan.querySelectorAll("[data-i]").forEach(b=>b.onclick = ()=>accendiRadio(+b.dataset.i));
  const stop = document.getElementById("radioStop");
  if(stop) stop.onclick = fermaRadio;
}
document.getElementById("radioBtn").onclick = e=>{
  e.stopPropagation();
  radioAperto = !radioAperto;
  disegnaRadio();
};
document.addEventListener("click", e=>{
  if(radioAperto && !e.target.closest("#radioPan") && !e.target.closest("#radioBtn")){
    radioAperto = false; disegnaRadio();
  }
});

/* ===========================================================
   La regione dalla posizione
   =========================================================== */
const ALIAS_REG = {
  "piedmont":"Piemonte", "aosta valley":"Valle d\u2019Aosta", "valle d aosta":"Valle d\u2019Aosta",
  "lombardy":"Lombardia", "trentino south tyrol":"Trentino-Alto Adige",
  "trentino alto adige sudtirol":"Trentino-Alto Adige", "south tyrol":"Trentino-Alto Adige",
  "trentino":"Trentino-Alto Adige", "veneto":"Veneto", "friuli venezia giulia":"Friuli-Venezia Giulia",
  "liguria":"Liguria", "emilia romagna":"Emilia-Romagna", "tuscany":"Toscana", "umbria":"Umbria",
  "marche":"Marche", "the marches":"Marche", "latium":"Lazio", "abruzzo":"Abruzzo", "abruzzi":"Abruzzo",
  "molise":"Molise", "campania":"Campania", "apulia":"Puglia", "basilicata":"Basilicata",
  "calabria":"Calabria", "sicily":"Sicilia", "sicilia":"Sicilia", "sardinia":"Sardegna"
};
function normReg(x){
  return (x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
         .replace(/[^a-z]+/g," ").trim();
}
function abbinaRegione(nome){
  const n = normReg(nome);
  if(!n) return "";
  const diretta = REGIONI.find(r=>normReg(r)===n);
  if(diretta) return diretta;
  if(ALIAS_REG[n]) return ALIAS_REG[n];
  return REGIONI.find(r=>{ const x=normReg(r); return x.indexOf(n)===0 || n.indexOf(x)===0; }) || "";
}
function trovaRegione(btn, esito){
  if(!navigator.geolocation){
    esito.textContent = "Questo telefono non sa dirmi dove sei. Scegli la regione dall\u2019elenco.";
    return;
  }
  btn.disabled = true;
  esito.textContent = "Cerco la posizione\u2026";
  navigator.geolocation.getCurrentPosition(async pos=>{
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    try{
      const rsp = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="
                  + la + "&longitude=" + lo + "&localityLanguage=it");
      const d = await rsp.json();
      const reg = abbinaRegione(d.principalSubdivision);
      const citta = d.city || d.locality || "";
      if(reg){
        S.profilo.regione = reg; salva();
        const sel = document.getElementById("pReg"); if(sel) sel.value = reg;
        esito.textContent = "Sei in " + reg + (citta ? " (" + citta + ")" : "")
                          + ". Le ricette del posto saliranno in cima.";
      }else{
        esito.textContent = (d.countryName && d.countryName !== "Italia")
          ? "Sei in " + d.countryName + ", fuori dalle regioni italiane. Scegline una dall\u2019elenco se vuoi."
          : "Posizione trovata ma non la regione. Scegli dall\u2019elenco.";
      }
    }catch(e){
      esito.textContent = "Non sono riuscito a leggere la regione. Scegli dall\u2019elenco.";
    }finally{ btn.disabled = false; }
  }, err=>{
    btn.disabled = false;
    esito.textContent = (err.code === err.PERMISSION_DENIED)
      ? "Permesso negato. Puoi scegliere la regione a mano."
      : "Posizione non disponibile adesso. Scegli la regione a mano.";
  }, {enableHighAccuracy:false, timeout:10000, maximumAge:600000});
}

/* ===========================================================
   Cursore chiaro/scuro
   =========================================================== */
(function(){
  const cur = document.getElementById("tono"), radice = document.documentElement;
  const meta = document.getElementById("metaTema");
  const applica = v=>{
    radice.style.setProperty("--tono", v);
    v >= 55 ? radice.setAttribute("data-scuro","") : radice.removeAttribute("data-scuro");
    if(meta) meta.content = getComputedStyle(radice).getPropertyValue("--carta").trim();
  };
  let t = null;
  try{ t = localStorage.getItem("checucino.tono"); }catch(e){}
  if(t === null) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "80" : "15";
  cur.value = t;
  applica(+t);
  cur.addEventListener("input", ()=>applica(+cur.value));
  cur.addEventListener("change", ()=>{ try{ localStorage.setItem("checucino.tono", cur.value); }catch(e){} });
})();

vai(S.profilo.fatto && S.dispensa.length ? 3 : 0);

/* ===========================================================
   Schermata d'apertura e service worker
   =========================================================== */
(function(){
  const sp = document.getElementById("splash");
  if(!sp) return;
  let chiuso = false;
  const chiudi = ()=>{
    if(chiuso) return; chiuso = true;
    sp.classList.add("via");
    setTimeout(()=>sp.remove(), 500);
  };
  const minimo = new Promise(r=>setTimeout(r, 1600));
  const pronta = new Promise(r=>{
    document.readyState === "complete" ? r() : window.addEventListener("load", r, {once:true});
  });
  Promise.all([minimo, pronta]).then(chiudi);
  setTimeout(chiudi, 4000);
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
