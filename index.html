  [/(lettuce|salad|tomato|courgette|zucchini|aubergine|eggplant|pepper|carrot|onion|garlic|potato|spinach|broccoli|cabbage|kale|fennel|artichoke|mushroom|pumpkin|squash|celery|leek|beet|chard|bean|pea|vegetable|cucumber|asparagus|radish)/, "Verdure e ortaggi"]
];
function indovinaCat(nome){
  /* come si conserva conta prima di cosa e': sott'olio e in scatola nelle conserve,
     essiccato o disidratato nel suo reparto, anche se il fresco ha un altro reparto */
  const nn = normTesto(nome);
  if(/sott ?(olio|aceto)|in scatola|in barattolo/.test(nn)) return "Scatolette e conserve";
  if(eEssiccato(nome) && !/^peperoncino secco$/.test(nn)) return "Essiccati e disidratati";
  if(eCantina(nome)) return "Cantina";   /* prima delle chiavi: "gin" sta dentro "olio extravergine" */
  const k = chiaveDi(nome);
  const c = k ? categoriaDi(k) : "";
  if(c) return c;   /* se la chiave non sta in nessun reparto, provo con gli indizi del nome */
  const n = normTesto(nome);
  const t = INDIZI.find(([re])=>re.test(n)) || (IN_INGLESE ? INDIZI_EN.find(([re])=>re.test(n)) : null);
  return t ? t[1] : "Dispensa";
}
function aggiungiIngrediente(nome, cat){
  const k = nome.trim().toLowerCase();
  if(!k) return "";
  if(chiaviDispensa().some(([x])=>x === k)) return k;
  /* una voce che avevi tolto torna nel reparto dove stava, non dove la indovino io */
  if((S.ingTolti || []).includes(k)){
    S.ingTolti = S.ingTolti.filter(x=>x !== k);
    const prima = (S.ingToltiCat || {})[k];
    if(prima){ cat = prima; delete S.ingToltiCat[k]; }
    if(Object.values(D.dispensa).some(l=>(l||[]).includes(k))){
      CAT_DISP[cat] = CAT_DISP[cat] || [];
      if(!CAT_DISP[cat].includes(k)) CAT_DISP[cat].push(k);
      if(!(D.dispensa[cat] || []).includes(k)) S.ingSpostati[k] = cat;
      ordinaCat(cat); salva(); return k;
    }
  }
  /* "carote" quando c'e' gia' "carota": uso quello che c'e' */
  const gia = chiaviDispensa().find(([x])=>radiceIng(x) === radiceIng(k));
  if(gia) return gia[0];
  CAT_DISP[cat] = CAT_DISP[cat] || [];
  CAT_DISP[cat].push(k);
  ordinaCat(cat);
  S.ingMiei[cat] = S.ingMiei[cat] || [];
  S.ingMiei[cat].push(k);
  salva();
  return k;
}

function spostaIngrediente(k, cat){
  const mio = Object.values(S.ingMiei || {}).some(l=>(l||[]).includes(k));
  for(const c in CAT_DISP) CAT_DISP[c] = CAT_DISP[c].filter(x=>x !== k);
  CAT_DISP[cat] = CAT_DISP[cat] || [];
  CAT_DISP[cat].push(k);
  ordinaCat(cat);
  S.ingSpostati[k] = cat;
  if(mio){
    for(const c in S.ingMiei) S.ingMiei[c] = (S.ingMiei[c]||[]).filter(x=>x !== k);
    S.ingMiei[cat] = S.ingMiei[cat] || [];
    S.ingMiei[cat].push(k);
  }
  salva();
}
function togliIngrediente(k){
  const era = categoriaDi(k);
  if(era){ S.ingToltiCat = S.ingToltiCat || {}; S.ingToltiCat[k] = era; }
  for(const c in CAT_DISP) CAT_DISP[c] = CAT_DISP[c].filter(x=>x !== k);
  for(const c in S.ingMiei) S.ingMiei[c] = (S.ingMiei[c]||[]).filter(x=>x !== k);
  delete S.ingSpostati[k];
  if(!S.ingTolti.includes(k)) S.ingTolti.push(k);
  S.dispensa = S.dispensa.filter(x=>x !== k);
  salva();
}
/* corregge il nome di una voce (es. "uova 4" -> "uova", "tuorlo freschissimo" -> "tuorlo"):
   resta nello stesso reparto, segnata se lo era, con le sue scadenze e le sue bottiglie;
   le tue ricette che la usavano passano al nome nuovo. Se il nome nuovo esiste gia', le due voci si uniscono. */
function rinominaIngrediente(vecchio, nuovoNome){
  const nuovo = (nuovoNome || "").trim().toLowerCase().replace(/\s+/g, " ");
  if(!nuovo || nuovo === vecchio) return vecchio;
  const cat = categoriaDi(vecchio) || indovinaCat(nuovo) || "Dispensa";
  let dest = chiaviDispensa().find(([x])=>x === nuovo);
  if(!dest) dest = chiaviDispensa().find(([x])=>x !== vecchio && radiceIng(x) === radiceIng(nuovo));
  const k = dest ? dest[0] : nuovo;
  const ufficiale = Object.values(D.dispensa).some(l=>(l||[]).includes(vecchio)) || BASE.has(vecchio);
  /* tolgo il vecchio nome dagli elenchi */
  for(const c in CAT_DISP) CAT_DISP[c] = CAT_DISP[c].filter(x=>x !== vecchio);
  for(const c in S.ingMiei) S.ingMiei[c] = (S.ingMiei[c]||[]).filter(x=>x !== vecchio);
  if(S.ingSpostati[vecchio]) delete S.ingSpostati[vecchio];
  if(ufficiale && !S.ingTolti.includes(vecchio)) S.ingTolti.push(vecchio);
  /* metto il nuovo nello stesso reparto, se non c'e' gia' */
  if(!dest){
    S.ingTolti = (S.ingTolti || []).filter(x=>x !== k);
    CAT_DISP[cat] = CAT_DISP[cat] || [];
    if(!CAT_DISP[cat].includes(k)) CAT_DISP[cat].push(k);
    ordinaCat(cat);
    if(Object.values(D.dispensa).some(l=>(l||[]).includes(k))){ if(!(D.dispensa[cat]||[]).includes(k)) S.ingSpostati[k] = cat; }
    else { S.ingMiei[cat] = S.ingMiei[cat] || []; if(!S.ingMiei[cat].includes(k)) S.ingMiei[cat].push(k); }
  }
  /* dispensa segnata, lista della spesa, ricette mie */
  S.dispensa = S.dispensa.map(x=>x === vecchio ? k : x).filter((x, i, a)=>a.indexOf(x) === i);
  (S.spesa || []).forEach(x=>{ if(x.k === vecchio) x.k = k; });
  (S.mie || []).forEach(r=>(r.ing || []).forEach(i=>{ if(i.k === vecchio) i.k = k; }));
  /* scadenze e cantina: se ci sono gia' sul nome nuovo, le unisco */
  if(S.scad && S.scad[vecchio] != null){
    const tutte = listaScad(k).concat(listaScad(vecchio));
    delete S.scad[vecchio];
    if(tutte.length) scriviScad(k, tutte.sort());
  }
  if(S.cantina && S.cantina[vecchio]){ S.cantina[k] = (S.cantina[k] || []).concat(S.cantina[vecchio]); delete S.cantina[vecchio]; }
  salva();
  return k;
}
function rimettiTolti(){
  (S.ingTolti || []).forEach(k=>{
    const cat = S.ingSpostati[k] || (S.ingToltiCat || {})[k] || indovinaCat(k);
    CAT_DISP[cat] = CAT_DISP[cat] || [];
    if(!CAT_DISP[cat].includes(k)) CAT_DISP[cat].push(k);
    ordinaCat(cat);
    if(!D.dispensa[cat] || !D.dispensa[cat].includes(k)){
      S.ingMiei[cat] = S.ingMiei[cat] || [];
      if(!S.ingMiei[cat].includes(k)) S.ingMiei[cat].push(k);
    }
  });
  S.ingTolti = [];
  salva();
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-io]");
  if(!b) return;
  const a = b.dataset.io;
  if(a === "chiudi"){ chiudiVelo(); tornaDovEro(); return; }
  const k = b.dataset.k;
  if(a === "scfoto"){ scattaFoto(f=>dataDaFoto(f, iso=>{ document.getElementById("ioScad").value = iso; statoScad("✅ " + L("Data letta: ","Date read: ") + dataLeggibile(iso) + L(". Controllala e tocca «Salva la scadenza».",". Check it and tap “Save the date”.")); })); return; }
  if(a === "scadd"){ aggiungiConfezione(k, document.getElementById("ioScad").value || ""); chiudiVelo(); ridisegnaDopoScad(); return; }
  if(a === "scfin"){ finitaConfezione(k); chiudiVelo(); ridisegnaDopoScad(); return; }
  if(a === "sc" || a === "scsalva" || a === "scvia"){
    segnaScadenza(k, a === "sc" ? fraGiorni(+b.dataset.g) : a === "scvia" ? "" : (document.getElementById("ioScad").value || ""));
    chiudiVelo(); ridisegnaDopoScad(); return;
  }
  if(a === "rinomina"){
    const campo = document.getElementById("ioNome");
    const nuovo = (campo.value || "").trim().toLowerCase();
    if(!nuovo){ campo.focus(); return; }
    if(nuovo !== k){
      const gia = chiaviDispensa().find(([x])=>x === nuovo && x !== k);
      if(gia && !confirm(L(`«${nuovo}» c’è già in elenco: unisco «${k}» a «${nuovo}»?`, `“${nuovo}” is already on the list: merge “${k}” into it?`))) return;
      rinominaIngrediente(k, nuovo);
    }
  }
  if(a === "sposta") spostaIngrediente(k, document.getElementById("ioCat").value);
  if(a === "del"){
    if(!confirm("Tolgo «" + k + "» dall'elenco della dispensa?")) return;
    togliIngrediente(k);
  }
  chiudiVelo();
  if(passo === 2){ tappaDispensa(); tornaDovEro(); }
});

/* ---------- leggere l'etichetta da una foto o dal codice a barre ----------
   Tutto gira sul telefono: il testo con Tesseract (la prima volta scarica circa 4 MB),
   il codice a barre con il lettore del telefono o con ZXing, poi l'archivio libero Open Food Facts. */
const CDN_TESS = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/";
const CDN_BARRE = "https://cdn.jsdelivr.net/npm/barcode-detector@3.2.2/dist/iife/ponyfill.js";
const _script = {};
function caricaScript(url){
  return _script[url] = _script[url] || new Promise((ok, ko)=>{
    const el = document.createElement("script"); el.src = url; el.async = true;
    el.onload = ok; el.onerror = ()=>{ delete _script[url]; el.remove(); ko(new Error("rete")); };
    document.head.appendChild(el);
  });
}
function statoCantina(t, tipo){ const p = document.getElementById("cnStato"); if(p){ p.innerHTML = t; p.className = "mini cant-stato" + (tipo ? " " + tipo : ""); } }
/* ---------- scheda del vino da una pagina web (Vivino, enoteche online, siti delle cantine) ----------
   Le enoteche hanno una scheda prodotto nascosta (schema.org Product) con nome e produttore;
   l'annata di solito e' nel nome; il vitigno lo cerco nel testo ("Vitigno: ...", "Uvaggio: ...")
   o confrontando la pagina con l'elenco dei vitigni. Quello che non trovo resta vuoto. */
const SITI_VINO = /(vivino|tannico|callmewine|xtrawine|vino\.com|winelivery|bernabei|enoteca|wine-searcher|winemag|gamberorosso|bibenda|doctorwine|vinoweb|cantin|tenut|winery|wine)/i;
function cercaProdottoJson(o, prof){
  if(!o || typeof o !== "object" || (prof||0) > 6) return null;
  if(Array.isArray(o)){ for(const x of o){ const r = cercaProdottoJson(x, (prof||0)+1); if(r) return r; } return null; }
  const t = [].concat(o["@type"] || []).join(" ");
  if(/product|wine|drink/i.test(t)) return o;
  for(const k of ["@graph","mainEntity","itemListElement","item"]) if(o[k]){ const r = cercaProdottoJson(o[k], (prof||0)+1); if(r) return r; }
  return null;
}
function nomeDi(x){ if(!x) return ""; if(typeof x === "string") return x; if(Array.isArray(x)) return nomeDi(x[0]); return x.name || ""; }
function tipoVinoDa(testo){
  const t = normTesto(testo);
  if(/prosecco/.test(t)) return "prosecco";
  if(/spumant|champagne|metodo classico|franciacorta|trento ?doc|cava\b|cremant|brut\b|pas dose|extra dry/.test(t)) return "spumante";
  if(/marsala/.test(t)) return "marsala";
  if(/vin ?santo/.test(t)) return "vin santo";
  if(/moscato|passito|zibibbo|malvasia delle lipari/.test(t)) return "moscato";
  if(/rosato|\brose\b|ros[eé]\b|cerasuolo/.test(t)) return "vino rosato";
  const r = (t.match(/\brosso\b|\brossi\b|\bred\b/g) || []).length, b = (t.match(/\bbianco\b|\bbianchi\b|\bwhite\b/g) || []).length;
  return b > r ? "vino bianco" : "vino rosso";
}
function leggiVinoDaPagina(html, url, forza){
  if(!html) return null;
  const doc = new DOMParser().parseFromString(html, "text/html");
  if([...doc.querySelectorAll('script[type*="ld+json" i]')].some(sc=>{ try{ return cercaRicettaJson(JSON.parse(sc.textContent)); }catch(e){ return false; } })) return null;
  let o = null;
  for(const sc of doc.querySelectorAll('script[type*="ld+json" i]')){ try{ o = cercaProdottoJson(JSON.parse(sc.textContent.trim())); if(o) break; }catch(e){} }
  const meta = n=>{ const m = doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`); return m ? (m.getAttribute("content") || "").trim() : ""; };
  doc.querySelectorAll("script,style,noscript,nav,footer,header").forEach(x=>x.remove());
  /* il documento letto non e' a schermo: gli a capo li rimetto io dopo ogni blocco */
  if(doc.body) doc.body.querySelectorAll("p,div,li,dt,dd,tr,td,th,h1,h2,h3,h4,h5,h6,br,section,article,span[class*=label i],label").forEach(el=>el.after(doc.createTextNode("\n")));
  const corpo = ((doc.body ? doc.body.textContent : "") || "").replace(/[ \t\u00a0]+/g, " ").replace(/ ?\n ?/g, "\n").replace(/\n{2,}/g, "\n");
  let nome = pulisciTesto(nomeDi(o) || meta("og:title") || (doc.querySelector("h1") || {}).textContent || "");
  nome = nome.replace(/\s*[|\u2013\u2014-]\s*(vivino|tannico|callmewine|xtrawine|vino\.com|acquista|compra|buy|online|shop|enoteca)[^|]*$/i, "").trim();
  const descr = pulisciTesto(o && o.description || meta("og:description") || "");
  const tutto = nome + "\n" + descr + "\n" + corpo;
  const sembra = /\b(vino|vini|wine|annata|vendemmia|vintage|vitign|uvaggio|grape|doc[gp]?\b|igt\b|cantina|winery|sommelier|bottiglia)\b/i.test(tutto)
               && ((o && /product|wine/i.test([].concat(o["@type"]||[]).join(" "))) || SITI_VINO.test(url || "") || /(vitign|uvaggio|annata|vendemmia|grape|vintage)/i.test(corpo));
  if((!sembra && !forza) || !nome) return null;
  /* annata: prima nel nome, poi accanto a "annata/vendemmia/vintage" */
  const anno = s=>{ const m = String(s).match(/\b(19[5-9]\d|20[0-4]\d)\b/); return m ? m[1] : ""; };
  let annata = anno(nome);
  if(!annata){ const m = corpo.match(/(annata|vendemmia|vintage)[^\n\d]{0,20}(19[5-9]\d|20[0-4]\d)/i); if(m) annata = m[2]; }
  /* azienda: marca o produttore della scheda, oppure una riga "Produttore/Cantina/Azienda: ..." */
  let azienda = pulisciTesto(nomeDi(o && (o.brand || o.manufacturer || o.producer)) || "");
  if(!azienda){ const m = corpo.match(/(produttore|prodotto da|imbottigliato da|imbottigliatore|cantina|azienda|winery|producer|bottled by)\s*[:\n]?\s*([^\n]{2,60})/i); if(m) azienda = m[2].split(/[.;|]\s/)[0].trim(); }
  if(/vivino|tannico|amazon|callmewine|xtrawine/i.test(azienda)) azienda = "";
  /* vitigno: riga dedicata, altrimenti i vitigni conosciuti nominati nella pagina */
  let vitigno = "";
  const mv = corpo.match(/(vitigni?|uvaggio|uve|grapes?|variet[aà])\s*[:\n]\s*([^\n]{3,80})/i);
  if(mv && VITIGNI.some(x=>normTesto(mv[2]).includes(normTesto(x)))) vitigno = mv[2].split(/\.\s|;|\|/)[0].replace(/\s+/g, " ").trim();
  if(!vitigno){
    const conta = VITIGNI.map(x=>{ const re = new RegExp("\\b" + normTesto(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "g");
      return [x, (normTesto(nome + " " + descr).match(re) || []).length * 5 + (normTesto(corpo).match(re) || []).length]; })
      .filter(([, n])=>n >= 2).sort((a, b)=>b[1] - a[1]);
    vitigno = conta.slice(0, 2).map(([x])=>x).join(", ");
  }
  /* nome in etichetta senza annata, formato, produttore ripetuto */
  let etichetta = nome.replace(/\b(19[5-9]\d|20[0-4]\d)\b/g, "").replace(/\b\d+([.,]\d+)?\s*(cl|ml|l|lt|litri)\b/gi, "").replace(/\b(magnum|bottiglia|cassa da \d+)\b/gi, "");
  if(azienda) etichetta = etichetta.replace(new RegExp("\\s*[-\u2013,]?\\s*" + azienda.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*[-\u2013,]?\\s*", "i"), " ");
  etichetta = etichetta.replace(/\s{2,}/g, " ").replace(/^[\s\-\u2013,]+|[\s\-\u2013,]+$/g, "").trim();
  return {etichetta, azienda, vitigno, annata, tipo: tipoVinoDa(nome + " " + descr + " " + corpo.slice(0, 4000)), fonte: url || ""};
}

/* foto ridotta a 1600 px sul lato lungo: Tesseract e' piu' veloce e legge uguale */
async function immagineRidotta(file, lato){
  const img = await createImageBitmap(file);
  const k = Math.min(1, lato / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const RE_NON_NOME = /(denominazione|\bd\.?\s?o\.?\s?c\.?\s?g?\b|\bi\.?\s?g\.?\s?[tp]\b|indicazione|origine|% ?vol|\bvol\b|\bml\b|\bcl\b|\blitr|solfiti|contiene|imbottigliat|prodott[oa]|product of|italia|italy|\blotto\b|www\.|\.it\b|\.com\b|\be ?7[05]0\b)/i;
const RE_AZIENDA = /(azienda agricola|az\.? ?agr|societ[aà] agricola|soc\.? ?agr|tenut[ae]|cantin[ae]\b|fattoria|castello|podere|vigneti|marchesi|marchese|feudo|baglio|masseria|cascina|winery|estate|domaine|ch[aâ]teau|\bconti\b|\bduca\b|principe|barone|famiglia)/i;
function vitignoNelTesto(t){
  const n = " " + normTesto(t).replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ") + " ";
  return VITIGNI.filter(v=>n.includes(" " + normTesto(v).replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ") + " "))
                .sort((a, b)=>b.length - a.length)[0] || "";
}
function annataNelTesto(t){
  const oggi = new Date().getFullYear(), anni = [];

  while((m = re.exec(t))){
    const a = +m[1], prima = t.slice(Math.max(0, m.index - 14), m.index + 1).toLowerCase();
    if(a > oggi || /(dal|since|fondat|anno di fondazione|est\.?)\s*$/.test(prima.trim())) continue;
    anni.push({a, vend: /vendemmia|vintage|annata/.test(t.slice(Math.max(0, m.index - 25), m.index + 10).toLowerCase())});
  }
  return String((anni.find(x=>x.vend) || anni[0] || {}).a || "");
}
function leggiTestoEtichetta(testo, righe){
  const pulisci = x=>x.replace(/[|_~^`*«»<>]/g, " ").replace(/\s+/g, " ").trim();
  const cand = (righe || []).map(l=>({t: pulisci(l.text || ""), h: l.bbox ? l.bbox.y1 - l.bbox.y0 : 0, c: l.confidence || 0}))
    .filter(l=>l.t.length >= 3 && l.c >= 45 && (l.t.match(/[a-zàèéìòù]/gi) || []).length >= Math.max(3, l.t.length * .6));
  let azienda = "";
  const imb = testo.match(/imbottigliat[oa][^\n]{0,30}?\bda\s+([^\n,–-]{3,50})/i);
  if(imb) azienda = pulisci(imb[1]);
  const rAz = cand.filter(l=>RE_AZIENDA.test(l.t) && !RE_NON_NOME.test(l.t)).sort((a, b)=>b.h - a.h)[0];
  if(rAz) azienda = rAz.t;
  const nomi = cand.filter(l=>!RE_NON_NOME.test(l.t) && l.t !== azienda && !/^\d/.test(l.t)).sort((a, b)=>b.h - a.h);
  const etichetta = (nomi[0] || {}).t || "";
  return { etichetta: etichetta.length > 40 ? "" : etichetta, azienda: azienda.length > 50 ? "" : azienda,

}

}

/* ===========================================================
   Leggere una ricetta scritta a mano o copiata dal web

const UNITA = "tablespoons|tablespoon|teaspoons|teaspoon|tbsp|tsp|cups|cup|ounces|ounce|oz|pounds|pound|lbs|lb|grams|gram|cloves|clove|pinch|slices|slice|cucchiaini|cucchiaino|cucchiaio|cucchiai|bicchieri|bicchiere|pizzichi|pizzico|spicchio|spicchi|bustine|bustina|rametti|rametto|filetti|filetto|foglie|foglia|ciuffi|ciuffo|rotoli|rotolo|coste|costa|fette|fetta|tazze|tazza|kg|gr|ml|cl|g|l";
/* toglie markdown e segni di impaginazione copiati dal web: **grassetto**, # titoli, > citazioni,
   [testo](link), `codice`, emoji-punto elenco, linee di separazione */
function pulisciRiga(riga){
  return String(riga || "")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/https?:\/\/\S+/g, "")
    .replace(/[*_`~]{1,3}/g, "")
    .replace(/^\s*(#{1,6}|>+|[-=_*]{3,}|[\u2022\u25CF\u25AA\u25E6\u2023\u2043\u2219\u2713\u2714\u2705\u27A4\u25B6\u2192\u2794])\s*/, "")
    .replace(/^[\s\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]+/u, "")
    .replace(/\s{2,}/g, " ").trim();
}
function leggiIng(riga){
  riga = pulisciRiga(riga);
  /* "Per la salsa:", "Per il ripieno:", "Ingredienti per la base:" sono titoletti, non ingredienti */
  if(/:\s*$/.test(riga) && !/\d/.test(riga) && !/q\.?\s*b/i.test(riga)) return null;
  if(!/[a-z\u00e0-\u00fa]{2}/i.test(riga)) return null;
  let t = riga.replace(/^[\s\-\u2022*\u00b7]+/, "").replace(/^\d{1,2}[.)]\s+/, "").trim();
  if(!t) return null;
  let q = "", n = t;
  if(/\bq\.?\s*b\.?\s*$/i.test(t)){ q = "q.b."; t = t.replace(/\bq\.?\s*b\.?\s*$/i, "").replace(/[:,\-\s]+$/, "").trim(); n = t; }
  let m = t.match(new RegExp("^((?:\\d+\\s*/\\s*\\d+|\\d+[.,]?\\d*)\\s*(?:(?:" + UNITA + ")\\b\\.?)?)\\s*(?:di\\s+|d\u2019|d'|of\\s+)?(.+)$", "i"));
  if(m){ q = m[1].trim(); n = m[2].trim(); }
  else{
    m = t.match(new RegExp("^(.+?)[\\s,:]+((?:\\d+[.,]?\\d*)\\s*(?:" + UNITA + "))$", "i"));
    if(m){ n = m[1].trim(); q = m[2].trim(); }
  }
  n = n.replace(/\s*\(.*?\)\s*/g, " ").replace(/[.;:,]+$/, "").trim();
  if(!n) return null;
  return {n: n.toLowerCase(), q: q || "q.b.", k: chiaveDi(n)};
}
function leggiTesto(testo){
  const righe = testo.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let nome = "", ing = [], proc = [], zona = "";
  const isIng   = x=>/^ingredient/i.test(x);
  const isProc  = x=>/^(procedimento|preparazione|esecuzione|come si prepara|istruzioni|metodo|method|directions|instructions|preparation|steps)/i.test(x);
  righe.forEach((x, i)=>{
    const titolo = /^#{1,6}\s/.test(x), h = x.replace(/^#{1,6}\s*/, "").replace(/[*_]/g, "").trim();
    if(zona === "fine") return;
    if(h.length < 40 && isIng(h)){ zona = "i"; return; }
    if(h.length < 40 && isProc(h)){ zona = "p"; return; }
    /* un nuovo titolo dopo i passaggi chiude il procedimento (dopo ci sono ricette simili, commenti...) */
    if(titolo && zona === "p" && proc.length){ zona = "fine"; return; }
    if(titolo && zona !== "") return;
    if(!nome && zona === "" && x.length < 70 && !/^\d/.test(x)){ nome = x; return; }
    if(zona === "i"){ const g = leggiIng(x); if(g) ing.push(g); return; }
    /* "Per 4 persone", "Serves 4": e' la resa, non un passaggio */
    if(/^(serves|yield|makes|servings|dosi per|per \d+ persone|porzioni)\b/i.test(x) && x.length < 30) return;
    if(zona === "p"){ proc.push(x.replace(/^\d+[.)]\s*/, "")); return; }
    /* nessuna intestazione: decido riga per riga */
    if(/^[\s\-\u2022*]*\d/.test(x) || x.length < 45){ const g = leggiIng(x); if(g) ing.push(g); }
    else proc.push(x.replace(/^\d+[.)]\s*/, ""));
  });
  const mp = testo.match(/\b(\d{1,2})\s*(?:persone|porzioni|pers\.|people|servings|portions)/i)
          || testo.match(/\b(?:porzioni|persone|dosi|serves|servings|yield)\s*:?\s*(\d{1,2})\b/i);
  const porz = mp ? Math.max(1, Math.min(60, +mp[1])) : PORZIONI;
  return {nome, ing, proc, porz};
}
/* ---- La versione "nascosta" della ricetta (dati strutturati schema.org) ----
   Quasi tutti i siti di ricette mettono nella pagina, invisibile, una scheda
   ordinata (JSON-LD o microdati) con nome, porzioni, tempi, ingredienti e passaggi.
   Se c'è, la leggo da lì; se no, torno alla lettura del testo riga per riga. */
function pulisciTesto(x){
  if(x == null) return "";
  const d = document.createElement("div");
  d.innerHTML = String(x).replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|li|div)>/gi, "\n");
  return (d.textContent || "").replace(/[ \t ]+/g, " ").replace(/\n\s*\n+/g, "\n").trim();
}
function tipoRicetta(o){
  const t = o && o["@type"];
  return Array.isArray(t) ? t.some(x=>/recipe$/i.test(String(x))) : /recipe$/i.test(String(t || ""));
}
function cercaRicettaJson(o, prof){
  if(!o || typeof o !== "object" || (prof||0) > 6) return null;
  if(Array.isArray(o)){
    for(const x of o){ const r = cercaRicettaJson(x, (prof||0)+1); if(r) return r; }
    return null;
  }
  if(tipoRicetta(o)) return o;
  for(const k of ["@graph", "mainEntity", "itemListElement", "item"]){
    if(o[k]){ const r = cercaRicettaJson(o[k], (prof||0)+1); if(r) return r; }
  }
  return null;
}
function minutiIso(d){
  if(!d) return 0;
  const m = String(d).match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);
  if(!m) return parseInt(d, 10) || 0;
  return (+m[1]||0)*1440 + (+m[2]||0)*60 + (+m[3]||0);
}
function passaggiDa(x){
  if(!x) return [];
  if(typeof x === "string") return pulisciTesto(x).split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(Array.isArray(x)) return x.flatMap(passaggiDa);
  if(typeof x === "object"){
    if(x.itemListElement) return passaggiDa(x.itemListElement);   /* HowToSection */
    return passaggiDa(x.text || x.name || "");                      /* HowToStep */
  }
  return [];
}
function portataDa(cat, nome){
  const t = ([].concat(cat || []).join(" ") + " " + (nome || "")).toLowerCase();
  if(/dolc|dessert|torta|biscott|gelat|crostat|tiramis|budin|pasticc/.test(t)) return "Dolci";
  if(/antipast|stuzzich|aperitiv|finger/.test(t)) return "Antipasti";
  if(/contorn|insalat/.test(t)) return "Contorni";
  if(/secondo|secondi|carne|pesce|pollo|arrost|polpett/.test(t)) return "Secondi";
  if(/primo|primi|pasta|risott|zupp|minestr|gnocch|lasagn|spaghett|vellutat/.test(t)) return "Primi";
  return "";
}
function porzioniDa(y){
  const v = [].concat(y || []).map(String).join(" ");
  const m = v.match(/\d+/);
  const n = m ? +m[0] : 0;
  return n > 0 && n <= 40 ? n : 0;
}
function ricettaDaMicrodati(doc){
  const box = doc.querySelector('[itemtype*="schema.org/Recipe" i]');
  if(!box) return null;
  const p = n=>[...box.querySelectorAll(`[itemprop="${n}"]`)];
  const val = el=>el.getAttribute("content") || el.getAttribute("datetime") || el.textContent;
  return {
    name: p("name")[0] && val(p("name")[0]),
    recipeIngredient: p("recipeIngredient").concat(p("ingredients")).map(val),
    recipeInstructions: p("recipeInstructions").map(el=>{
      const passi = [...el.querySelectorAll('[itemprop="text"]')].map(val);
      return passi.length ? passi : (el.getAttribute("content") || el.innerHTML);
    }),
    totalTime: p("totalTime")[0] && val(p("totalTime")[0]),
    prepTime: p("prepTime")[0] && val(p("prepTime")[0]),
    cookTime: p("cookTime")[0] && val(p("cookTime")[0]),
    recipeYield: p("recipeYield")[0] && val(p("recipeYield")[0]),

/* alcuni siti (es. il Cucchiaio d'Argento) mettono nella scheda nascosta solo gli ingredienti:
   in quel caso cerco nella pagina il titolo "Procedimento" e prendo i paragrafi che lo seguono */
const TITOLO_PROC = /^(procedimento|preparazione|come (si )?prepar|istruzioni|esecuzione|metodo|method|directions|instructions|preparation)\b/i;
const FINE_PROC = /^(consigl|conservazion|varianti|curiosit|ricette (correlate|simili)|potrebbe|ti potrebbe|leggi anche|guarda anche|commenti|abbinament|il consiglio|note\b|tips|related|you may|comments)/i;
/* tiene solo le righe che sono davvero passaggi: via dosi di ingredienti ("200 g di ricotta"),
   tempi e dati della scheda ("Tempo totale 43 min", "Difficoltà: facile"); se non resta
   nessuna frase vera (almeno 35 caratteri) il procedimento si considera mancante */
function soloPassi(proc){
  const via = t=>/^(tempo|tempi|preparazione|cottura|riposo|difficolt|porzioni|dosi|costo|calorie|kcal|total|prep|cook)\b[^.]{0,30}$/i.test(t)
    || /^\d+([.,]\d+)?\s*(g|gr|kg|ml|cl|l|dl|cucchia\w*|pz|n\.?|spicch\w*|fett\w*|bustin\w*)?\b[^.]{0,45}$/i.test(t)
    || (t.length < 35 && !/[.!]$/.test(t) && !/\b(\w+ate|\w+ete|\w+ite|aggiungi|mescola|cuoci|versa|taglia|lessa|friggi|servi)\b/i.test(t));
  const r = (proc || []).map(x=>String(x).trim()).filter(t=>t && !via(t));
  return r.some(t=>t.length >= 35) ? r : [];
}
function procDaPagina(doc){
  if(!doc || !doc.body) return [];
  const testo = e=>(e.textContent || "").replace(/\s+/g, " ").trim();
  const titoli = [...doc.body.querySelectorAll("h1,h2,h3,h4,h5,h6,p,strong,b,span,div,dt")].filter(e=>{
    if(e.closest("nav,footer,header,aside,form")) return false;
    const t = testo(e).replace(/[:.]\s*$/, "");
    return t.length < 30 && TITOLO_PROC.test(t) && !/\d/.test(t);
  }).filter(e=>![...e.children].some(c=>TITOLO_PROC.test(testo(c))));
  for(const tit of titoli){ const p = soloPassi(passiDopo(tit)); if(p.length) return p; }
  return [];
}
/* scorre la pagina dopo il titolo: raccoglie il testo blocco per blocco e si ferma al primo
   titolo che viene dopo i passaggi (o a un titolo grande prima di trovarne, per non sconfinare) */
function passiDopo(tit){
  const doc = tit.ownerDocument;
  const w = doc.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
  w.currentNode = tit;
  let n = w.nextNode();
  while(n && tit.contains(n)) n = w.nextNode();

  for(; n; n = w.nextNode()){
    if(n.nodeType === 1){
      if(n.closest("script,style,noscript,nav,footer,aside,form,button,select")) continue;
      if(n.tagName === "BR"){ rompi = true; continue; }
      const m = n.tagName.match(/^H([1-6])$/);
      if(m){ if(pezzi.length) break; if(+m[1] <= 3) break; continue; }
      if(FINE_PROC.test(testo1(n)) && testo1(n).length < 60 && pezzi.length) break;
      continue;
    }
    const p = n.parentElement;
    if(!p || p.closest("script,style,noscript,nav,footer,aside,form,button,select")) continue;
    const t = n.nodeValue.replace(/\s+/g, " ").trim(); if(!t) continue;
    const b = p.closest("p,li,dd,td,blockquote,div,section,article") || p;
    if(b !== ultimo || rompi || !pezzi.length){ if(pezzi.length >= 40) break; pezzi.push([]); }
    pezzi[pezzi.length - 1].push(t); ultimo = b; rompi = false;
  }
  return pezzi.map(v=>v.join(" ").replace(/\s+([,.;:!?])/g, "$1").trim())
    .filter(t=>t.length >= 20 && !/(https?:|iscriviti|newsletter|cookie|pubblicit)/i.test(t))
    .map(t=>t.replace(/^\d+[.)]\s*/, ""));
}
function testo1(e){ return (e.textContent || "").replace(/\s+/g, " ").trim(); }
function leggiRicettaNascosta(html, url){
  if(!html || !/schema\.org|ld\+json|recipeIngredient/i.test(html)) return null;
  const doc = new DOMParser().parseFromString(html, "text/html");
  let o = null;
  for(const s of doc.querySelectorAll('script[type*="ld+json" i]')){
    try{
      const j = JSON.parse(s.textContent.replace(/^\s*<!\[CDATA\[|\]\]>\s*$/g, "").trim());
      o = cercaRicettaJson(j);
      if(o) break;
    }catch(e){}
  }
  if(!o) o = ricettaDaMicrodati(doc);
  if(!o) return null;

  const righe = [].concat(o.recipeIngredient || o.ingredients || []).map(pulisciTesto).filter(Boolean);
  let proc  = soloPassi(passaggiDa(o.recipeInstructions));
  if(!righe.length) return null;
  if(!proc.length) proc = procDaPagina(doc);

  const porz = porzioniDa(o.recipeYield) || PORZIONI;
  const ing = righe.map(leggiIng).filter(Boolean);
  const tempo = minutiIso(o.totalTime) || (minutiIso(o.prepTime) + minutiIso(o.cookTime));
  const nome = pulisciTesto(o.name);
  const cucina = [].concat(o.recipeCuisine || []).join(" ");
  const regione = REGIONI.find(x=>new RegExp(x.split(/[ -]/)[0], "i").test(cucina + " " + nome)) || "";
  const estero = !regione && !!cucina && !/ital/i.test(cucina);
  const diete = [].concat(o.suitableForDiet || []).join(" ");
  const tags = [];
  if(/vegan/i.test(diete)) tags.push("vegano", "vegetariano");
  else if(/vegetarian/i.test(diete)) tags.push("vegetariano");
  let fonte = "";
  try{ fonte = url ? new URL(url).hostname.replace(/^www\./, "") : ""; }catch(e){}
  const nota = fonte ? "Fonte: " + fonte + "." : "";
  return {
    id: 0, n: nome, cat: portataDa(o.recipeCategory, nome) || "Primi",
    tempo: tempo ? Math.max(5, Math.min(600, Math.round(tempo / 5) * 5)) : 40,
    diff: "facile", tags, ing, proc, nota, luogo: regione, estero, porz,
    all: [], unico: false, nvoci: ing.length, minimo: false, leggero: false, att: [], att_opz: []
  };
}
async function scaricaConLimite(indirizzo, opzioni){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 15000);
  try{
    const r = await fetch(indirizzo, {...(opzioni || {}), signal: ctrl.signal});
    if(!r.ok) throw new Error("no");
    return await r.text();
  }finally{ clearTimeout(t); }
}
/* barra di avanzamento della lettura dal web: ogni tentativo ha la sua fetta,
   e dentro la fetta la barra avanza piano finche' il sito non risponde */
let impProgT = null;
function avanzamento(da, a, testo){
  const box = document.getElementById("impProg"), fill = document.getElementById("impProgFill"), pct = document.getElementById("impProgPct");
  if(!box) return;
  clearInterval(impProgT);
  if(da == null){ box.hidden = true; return; }
  box.hidden = false;
  let v = da; const passo = (a - da) / 60;   /* ~15 secondi per arrivare quasi in fondo alla fetta */
  const disegna = ()=>{ fill.style.width = v + "%"; pct.textContent = Math.round(v) + "%"; };
  disegna();
  if(a > da) impProgT = setInterval(()=>{ v = Math.min(a - 1, v + passo * Math.max(.25, (a - v) / (a - da))); disegna(); }, 250);
  if(testo){ const e = document.getElementById("impEsito"); if(e) e.textContent = testo; }
}
async function scaricaDaWeb(url, dove){
  if(!/^https?:\/\//i.test(url)) url = "https://" + url;
  const bott = document.querySelector('[data-imp="scarica"]'); if(bott){ bott.disabled = true; bott.textContent = "Sto leggendo la ricetta\u2026"; }
  const fine = ()=>{ if(bott){ bott.disabled = false; bott.textContent = "Leggi la ricetta dal link"; } };
  document.getElementById("impEsame").innerHTML = "";
  avvisoSito(url);
  const nonStd = !sitoConsigliato(url);
  dove.textContent = "Cerco la scheda della ricetta nella pagina…";
  /* 1) la pagina originale, per trovare la scheda nascosta */
  const vie = [
    ()=>scaricaConLimite("https://r.jina.ai/" + url, {headers: {"X-Return-Format": "html"}}),
    ()=>scaricaConLimite("https://api.allorigins.win/raw?url=" + encodeURIComponent(url)),
    ()=>scaricaConLimite("https://corsproxy.io/?url=" + encodeURIComponent(url))
  ];
  const fette = [[3,30,"Collego il sito e cerco la scheda della ricetta (1 di 4)\u2026"],
                 [30,52,"Il sito \u00e8 lento: provo una seconda strada (2 di 4)\u2026"],
                 [52,72,"Provo una terza strada (3 di 4)\u2026"]];
  for(let i = 0; i < vie.length; i++){
    avanzamento(fette[i][0], fette[i][1], fette[i][2]);
    try{
      const pagina = await vie[i]();
      const ric = leggiRicettaNascosta(pagina, url);
      if(!ric){ const vino = leggiVinoDaPagina(pagina, url);
        if(vino){ avanzamento(null); fine(); chiudiVelo(); apriCantinaDaWeb(vino); return; } }
      if(ric && !ric.proc.length){
        /* la scheda c'era ma senza procedimento: lo cerco nel testo della pagina */
        try{ const p = soloPassi(leggiTesto(await scaricaConLimite("https://r.jina.ai/" + url)).proc); if(p.length) ric.proc = p; }catch(e){}
      }
      if(ric && nonStd) ric._nonStd = true;
      if(ric){ avanzamento(100, 100, "Ricetta trovata: controllo che sia leggibile\u2026"); setTimeout(()=>{ avanzamento(null); fine(); consegnaImport(ric); }, 350); return; }
    }catch(e){}
  }
  /* 2) niente scheda: prendo il testo della pagina e lo leggo riga per riga */
  avanzamento(72, 96, "La pagina non ha la scheda ordinata: provo a leggerne il testo (4 di 4)\u2026");
  try{
    const t = await scaricaConLimite("https://r.jina.ai/" + url);
    avanzamento(100, 100);
    document.getElementById("impTesto").value = t.slice(0, 20000);
    apriTestoImport();
    setTimeout(()=>{ avanzamento(null); fine(); leggiTestoImport(t.slice(0, 20000), true, nonStd); }, 300);
  }catch(e){
    avanzamento(null); fine();
    dove.textContent = "Non sono riuscito a leggere quel sito. Apri la pagina, copia il testo della ricetta e incollalo qui sotto.";
    apriTestoImport();
  }
}

/* --- controllo di qualita' della ricetta importata --- */
const NON_ING = /(https?:|www\.|iscriv|newsletter|comment|pubblicit|cookie|leggi anche|guarda anche|stampa|condividi|clicca|seguici|instagram|facebook|pinterest|whatsapp|valutazion|recension|\bvoti?\b|difficolt|\bcosto\b|tempo di|preparazione:|cottura:|porzioni|kcal|calorie|\u00a9|copyright|privacy|login|accedi|registrati|abbonati|scarica l|app store|google play|video|foto di|photo|advertis|sponsor|ricetta di|autore|share|subscribe)/i;
function sembraIngrediente(i){
  const t = (i.q && i.q !== "q.b." ? i.q + " " : "") + i.n;
  if(!/[a-z\u00e0-\u00fa]/i.test(i.n)) return false;
  if(t.length > 70) return false;
  if(NON_ING.test(t)) return false;
  if(i.n.split(/\s+/).length > 9) return false;
  return true;
}
function esameImport(ric){
  const ing = ric.ing || [], N = ing.length;
  const spazzatura = ing.filter(i=>!sembraIngrediente(i));
  const buoni = ing.filter(sembraIngrediente);
  const ignoti = buoni.filter(i=>!i.k);
  const P = (ric.proc || []).filter(x=>x.length > 8).length;
  let idonea = true, motivo = "", e2 = "";
  if(!buoni.length){ idonea = false; motivo = "non ho trovato un elenco di ingredienti"; e2 = "I couldn\u2019t find an ingredient list"; }
  else if(!P){ idonea = false; motivo = "non ho trovato il procedimento"; e2 = "I couldn\u2019t find the method"; }
  else if(spazzatura.length >= 4 && spazzatura.length / N > .35){ idonea = false; motivo = `${spazzatura.length} righe su ${N} dell\u2019elenco ingredienti non sono ingredienti`; e2 = `${spazzatura.length} of the ${N} lines in the ingredient list aren\u2019t ingredients`; }
  else if(ignoti.length >= 6 && ignoti.length / buoni.length > .6){ idonea = false; motivo = `${ignoti.length} ingredienti su ${buoni.length} non li riconosco`; e2 = `I don\u2019t recognise ${ignoti.length} of the ${buoni.length} ingredients`; }
  return {idonea, motivo, motivoEn: e2, spazzatura, pulita: Object.assign({}, ric, {ing: buoni, nvoci: buoni.length})};
}

function paroleNome(t){ return normTesto(t || "").split(" ").filter(w=>w.length > 2 && !PAROLE_VUOTE.has(w)); }
function giaInArchivio(nome, dueVersi){
  const p = paroleNome(nome); if(!p.length) return [];
  const n = normTesto(nome);
  return archivio().filter(r=>{
    if(tutteTrovate(p, nomeRicetta(r))) return true;
    if(!dueVersi) return false;
    const q = paroleNome(r.n); return q.length >= 1 && tutteTrovate(q, n);
  }).sort((a,b)=>nomeRicetta(a).length - nomeRicetta(b).length).slice(0, 5);
}

  let db = null;
  function apri(){
    return db || (db = new Promise((ok, ko)=>{
      const q = indexedDB.open("checucino-foto", 1);
      q.onupgradeneeded = ()=>q.result.createObjectStore("foto");
      q.onsuccess = ()=>ok(q.result);
      q.onerror = ()=>ko(q.error);
    }));
  }
  async function op(modo, fn){
    const d = await apri();
    return new Promise((ok, ko)=>{
      const t = d.transaction("foto", modo), r = fn(t.objectStore("foto"));
      t.oncomplete = ()=>ok(r ? r.result : undefined);
      t.onerror = ()=>ko(t.error);
    });
  }
  return { put:(k, v)=>op("readwrite", s=>s.put(v, k)), get:k=>op("readonly", s=>s.get(k)), del:k=>op("readwrite", s=>s.delete(k)) };
})();

      ${gal.length > 1 ? `<button type="button" data-fz="prec" aria-label="${L("Pagina precedente","Previous page")}">‹</button><button type="button" data-fz="succ" aria-label="${L("Pagina successiva","Next page")}">›</button>` : ""}
      <button type="button" data-fz="chiudi">${L("Chiudi","Close")}</button></div>
    <div class="fz-area"><img alt=""></div>`;
  document.body.append(ov);

  let z = 1;
  const mostra = async ()=>{ z = 1; img.style.width = "100%"; img.src = await urlFoto(gal[i]); ov.querySelector(".fz-n").textContent = gal.length > 1 ? (i + 1) + " / " + gal.length : ""; };
  const zoom = d=>{ z = Math.max(1, Math.min(5, z + d)); img.style.width = (z * 100) + "%"; };
  ov.addEventListener("click", ev=>{

/* ===== Cerca una ricetta sul web dentro l'app =====
   Cerco nei siti consigliati (GialloZafferano e motori di ricerca ristretti a quei siti),
   passando dagli stessi "ponti" usati per leggere le ricette; tocchi un risultato e la scarico. */
function pontiPagina(url){
  return [
    ()=>scaricaConLimite("https://api.allorigins.win/raw?url=" + encodeURIComponent(url)),
    ()=>scaricaConLimite("https://corsproxy.io/?url=" + encodeURIComponent(url)),
    ()=>scaricaConLimite("https://r.jina.ai/" + url, {headers: {"X-Return-Format": "html"}})
  ];
}
function primaPagina(url){
  return new Promise((ok, ko)=>{
    const vie = pontiPagina(url); let falliti = 0;
    vie.forEach(v=>v().then(t=>{ if(t && t.length > 500) ok(t); else if(++falliti === vie.length) ko(); })
                      .catch(()=>{ if(++falliti === vie.length) ko(); }));
  });
}
function linkVero(h){
  try{
    if(!h) return "";
    if(h.startsWith("//")) h = "https:" + h;
    const u = new URL(h, "https://duckduckgo.com/");
    if(/duckduckgo\.com$/.test(u.hostname) && u.searchParams.get("uddg")) return u.searchParams.get("uddg");
    if(/bing\.com$/.test(u.hostname) && u.pathname.startsWith("/ck/") && u.searchParams.get("u")){
      let b = u.searchParams.get("u").replace(/^a1/, "").replace(/-/g, "+").replace(/_/g, "/");
      while(b.length % 4) b += "=";
      return atob(b);
    }
    return u.href;
  }catch(e){ return ""; }
}
function sembraRicetta(url){
  let u; try{ u = new URL(url); }catch(e){ return false; }
  if(!/^https?:$/.test(u.protocol) || !sitoConsigliato(url)) return false;
  const parti = decodeURIComponent(u.pathname).toLowerCase().split("/").filter(Boolean);
  if(!parti.length) return false;                                   /* home del sito */
  if(/ricerca-ricette|\/categori|\/tag\/|\/tags\/|\/author\/|\/autore\/|\/page\/\d|\/feed|[?&]s=|\/search/.test(u.href.toLowerCase())) return false;
  if(/(^|\.)giallozafferano\.it$/.test(u.hostname) && /^(www\.)?giallozafferano\.it$/.test(u.hostname)) return false;   /* www. = indici, le ricette sono su ricette. e blog. */
  return true;
}
function titoloPulito(t, url){
  t = (t || "").replace(/\s+/g, " ").trim().replace(/\s*[-|–—]\s*(GialloZafferano|Giallo Zafferano|Fatto in casa da Benedetta|Misya\.info|Misya|Ricette della Nonna|Cookaround|BBC Good Food|Allrecipes|Serious Eats|Simply Recipes).*$/i, "");
  if(!t || t.length < 3 || /^https?:/.test(t)){
    try{ t = decodeURIComponent(new URL(url).pathname).split("/").filter(Boolean).pop().replace(/\.\w+$/, "").replace(/[-_]+/g, " "); }catch(e){}
  }
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function risultatiDaPagina(html){
  const doc = new DOMParser().parseFromString(html, "text/html"), out = [];
  doc.querySelectorAll("a[href]").forEach(a=>{
    const url = linkVero(a.getAttribute("href")); if(!url || !sembraRicetta(url)) return;
    const card = a.closest("article, li, .gz-card, .result, .b_algo");
    const im = card && card.querySelector("img");
    let foto = im ? (im.getAttribute("data-src") || im.getAttribute("data-lazy-src") || im.getAttribute("src") || "") : "";
    if(!/^https:\/\//.test(foto)) foto = "";
    out.push({url: url.split("#")[0], t: titoloPulito(a.getAttribute("title") || a.textContent, url), foto});
  });
  return out;
}
async function cercaRicetteWeb(q, quando){
  const siti = IN_INGLESE ? SITI_OK_EN : SITI_OK_IT;
  const filtro = siti.map(([d])=>"site:" + d).join(" OR ");
  const parola = L("ricetta ","recipe ");
  const fonti = [];
  if(!IN_INGLESE) fonti.push("https://www.giallozafferano.it/ricerca-ricette/" + encodeURIComponent(q.trim().replace(/\s+/g, " ")) + "/");
  fonti.push("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(parola + q + " " + filtro));
  fonti.push("https://www.bing.com/search?q=" + encodeURIComponent(parola + q + " (" + filtro + ")"));
  const visti = new Set(), tutti = [];
  await Promise.allSettled(fonti.map(f=>primaPagina(f).then(html=>{
    risultatiDaPagina(html).forEach(r=>{ const k = r.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""); if(visti.has(k)) return; visti.add(k);
      const vecchio = tutti.find(x=>x.t.toLowerCase() === r.t.toLowerCase() && nomeSito(x.url) === nomeSito(r.url)); if(vecchio){ if(!vecchio.foto && r.foto) vecchio.foto = r.foto; return; }
      tutti.push(r); });
    quando(tutti.slice(0, 15));
  })));
  return tutti.slice(0, 15);
}
function nomeSito(url){
  try{ const h = new URL(url).hostname.replace(/^www\./, ""); const s = SITI_OK_IT.concat(SITI_OK_EN).find(([d])=>h === d || h.endsWith("." + d)); return s ? s[1] : h; }catch(e){ return ""; }
}

function adattaCasella(t){
  if(!t || t.tagName !== "TEXTAREA" || t.offsetParent === null) return;
  t.style.height = "auto";
  t.style.height = (t.scrollHeight + 4) + "px";
}

new MutationObserver(lista=>{
  let serve = false;
  for(const m of lista){ for(const n of m.addedNodes){ if(n.nodeType === 1 && (n.tagName === "TEXTAREA" || n.querySelector && n.querySelector("textarea"))){ serve = true; break; } } if(serve) break; }
  if(serve) requestAnimationFrame(()=>adattaCaselle());
}).observe(document.documentElement, {childList:true, subtree:true});

function salvaMia(r){
  preparaRicetta(r);
  segnaDaSalvare("ricetta", r.id, nomeR(r));
  S.mie = (S.mie || []).filter(x=>x.id !== r.id);
  S.mie.push(r);
  salva();
  chiudiVelo();
  passo === 4 ? tappaRicette() : apriMie();
}

let riconoscimentoAttivo = null;
function dettaIngrediente(bottone, onTesto){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert("La dettatura vocale non è disponibile su questo browser. Prova con Chrome o con l'app.");
    return;
  }
  if(riconoscimentoAttivo){ riconoscimentoAttivo.stop(); return; }
  const r = new SR();
  r.lang = L("it-IT", "en-GB");
  r.interimResults = false;
  r.maxAlternatives = 1;
  bottone.classList.add("in-ascolto");
  riconoscimentoAttivo = r;
  r.onresult = e=>{
    const testo = e.results[0][0].transcript.trim();
    if(testo) onTesto(testo);
  };
  r.onerror = ()=>{};
  r.onend = ()=>{ riconoscimentoAttivo = null; bottone.classList.remove("in-ascolto"); };
  try{ r.start(); }catch(e){ riconoscimentoAttivo = null; bottone.classList.remove("in-ascolto"); }
}

    <div class="sez"><strong>"What’s cooking?"</strong> isn't just for singles, it's for families too.</div>
    <p>If you have guests, the app takes into account who is vegan, vegetarian or omnivore, and everyone's allergies and intolerances, so everyone at the table is safe.</p>

    <div class="sez">You choose what, and how much time you have</div>
    <p>Choose whether to cook a starter, a first course, a main, a dessert or a one-dish meal, and how much time you can spend. Then tick what you have in the pantry: the app remembers it, and next time you only fix what has changed.</p>

    <div class="sez"><strong>Already have an idea?</strong></div>
    <p>If you already know what you want to make, the app checks whether you have all the ingredients. If something is missing, it suggests a substitute from what you already have, or adds the rest to the shopping list.</p>
    <p>If the recipe isn't in the archive, tap <strong>“Search Google on recommended sites”</strong>: the search is limited to BBC Good Food, Allrecipes, Serious Eats and Simply Recipes, which publish recipes in a standard format the app reads in full.</p>
    <p>Open the recipe you like, tap the <strong>three dots ⋮</strong> at the top right, then <strong>Share</strong> → <strong>Che cucino?</strong>: the recipe arrives on its own. Check ingredients and method and save.</p>
    <p>If you pick a different site the app still tries, but warns you the recipe may arrive incomplete and suggests looking on the recommended sites. If you're not happy with it, you can still delete it. (On iPhone Share can't reach the app: copy the link and paste it in <strong>Add recipes</strong>.)</p>
    <p>Now you have a new recipe in the archive.</p>
    <div class="sez"><strong>Want an idea?</strong></div>
    <p>The app also looks at the season and the time of day: in winter it won't put granitas and rice salads first, in summer soups and braises; and in the evening, if you choose <strong>🌙 dinner</strong>, lighter dishes come first and fried or hearty ones go to the bottom. They stay in the list, and if you search a dish by name you'll always find it.</p>
    <p>Let the app choose: <strong>"What’s cooking?"</strong> shows you the recipes you can make 100% with what you have, then those at 90% and so on, so you always have dozens of recipes to pick from: some ready right away, others one ingredient away.</p>

    <div class="sez"><strong>A complete themed menu</strong></div>
    <p>In <strong>Themed menu</strong> the app puts together a whole meal, from starter to dessert: the cooking of a country (Spanish, Greek, French, Japanese and more), a seafood or land menu, a low-calorie one with the calorie total, a trip round the world, or the holiday menus for Easter, Christmas and New Year's Eve.</p>

    <p>Messy hands? Tap <strong>🔊 Read aloud</strong> and the app reads you one step at a time; with <strong>🎙️ Voice commands</strong> it listens, and you just say “next”, “back”, “repeat”, “ingredients”, or “timer” when the step has a time to measure and “stop” to turn it off. When time is up, it tells you.</p>
    <p>When it's ready, you can look for elegant plating photos on the web without leaving the app, for nice ideas on how to serve it.</p>

    <div class="sez"><strong>Want to clear out the fridge?</strong></div>
    <p>Every now and then it pays to use up what is about to expire: an omelette or a leftovers dish is a classic. Look up the ingredient you want to use up and the app suggests a recipe you can make from it and from what you have.</p>
    <p>You can also mark when what you have at home expires: in the pantry press and hold an ingredient, or tap <strong>⏳ Use-by dates</strong>. Pick the date yourself, or photograph it on the pack and the app reads it; with the barcode the app recognises the product and puts it in the pantry. If you have several packs of the same product with different dates, each keeps its own: when you finish one tap “Finished one” and the app moves on to the next date. When something is about to expire you'll find it at the top of the home page, with the <strong>“What can I cook with these?”</strong> button showing recipes to use it up.</p>

    <div class="sez"><strong>The week at the table</strong></div>
    <p>On any recipe card tap <strong>📅 Add to this week's menu</strong>. On the home page, in <strong>This week's menu</strong>, you'll find the recipes you picked, can change how many are at the table for each, and with one tap put everything missing on the shopping list: quantities from the recipes add up, what you already have stays out and the list is split by department.</p>

    <div class="sez"><strong>Your recipes, your memories</strong></div>
    <p>Have a cookbook or an old family recipe notebook? In <strong>Add recipes</strong>, printed pages go in with <strong>📷 Printed page</strong>: the app reads them and you correct and save. Grandma's handwritten recipes go in with <strong>📜 Handwritten</strong>: they are kept as photos, the original with its handwriting, and you can have them transcribed by Claude or Gemini whenever you like, checking the text next to the photo.</p>

let STAG_EMI = null;
function stagioni(){
  const emi = suEmisferoSud() ? "sud" : "nord";
  if(!STAG || STAG_EMI !== emi){
    const base = DATI["stagioni-data"];
    if(emi === "nord") STAG = base;
    else{
      /* sei mesi avanti; i fermi della pesca sono regole italiane e non valgono altrove, tranne i divieti di sempre */
      const sposta = m => ((m + 5) % 12) + 1;
      STAG = {};
      Object.keys(base).forEach(k=>{ STAG[k] = base[k].map(x=>{
        const y = Object.assign({}, x, {m: x.m.map(sposta)});
        if(x.f && x.f.length === 12){ y.f = x.f; } else { delete y.f; delete y.n; delete y.ne; }
        if(x.f && x.f.length === 12){ y.n = x.n; y.ne = x.ne; }
        return y; }); });
    }
    STAG_EMI = emi;
  }
  return STAG;
}
const STAG_TAB = [["ort","\u{1F955}","Ortaggi","Vegetables","#32723F"],["fru","\u{1F34E}","Frutta","Fruit","#A74915"],["pes","\u{1F41F}","Pesce","Fish","#176A9B"],["cro","\u{1F990}","Crostacei e molluschi","Shellfish","#6D3FA0"]];
const iconaStag = x => x.i || x.e;
const fermoIn = (x, m) => (x.f || []).includes(m);
function notaStag(x, m){
  if(fermoIn(x, m)) return x.m.length ? L("\u{1F6AB} fermo biologico","\u{1F6AB} closed season") : L("\u{1F6AB} vietati sempre","\u{1F6AB} always banned");
  if(x.m.length === 12) return L("tutto l’anno","all year");
  const prima = x.m.includes(m === 1 ? 12 : m-1), dopo = x.m.includes(m === 12 ? 1 : m+1);
  if(!prima) return L("inizia ora","just starting");
  if(!dopo) return L("ultimo mese","last month");
  let f = m; for(let k=0; k<11 && x.m.includes(f === 12 ? 1 : f+1); k++) f = f === 12 ? 1 : f+1;
  return L("fino a ","until ") + nomeMese(f);
}
function ricettePerStag(x){
  const re = new RegExp("(^| )(" + x.r + ")", "i");
  return archivio().filter(r=>!(S.nascoste||[]).includes(r.id) && r.ing.some(i=>re.test(i.k))).map(valutaCompleta).sort((a,b)=>b.pct-a.pct);
}

function centraMese(){ const c = velo.querySelector(".st-mesi .chip.on"); if(c) c.parentElement.scrollLeft = c.offsetLeft - c.parentElement.clientWidth/2 + c.offsetWidth/2; }
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-stag-tab],[data-stag-vista],[data-stag-mese],[data-stag-item],[data-stag-torna]");
  if(!t) return;
  const d = t.dataset;
  if(d.stagTab){ stagTab = d.stagTab; apriStagioni(); }
  else if(d.stagVista){ stagVista = d.stagVista; apriStagioni(); }
  else if(d.stagMese){ stagMese = +d.stagMese; apriStagioni(); }
  else if(d.stagItem != null){ apriStagioni(+d.stagItem); }
  else apriStagioni();
  centraMese();
  if(!d.stagMese){ const vi = velo.querySelector(".velo"); if(vi) vi.scrollTop = 0; }
});

    dipingiCursori(lst[n]);
    if(!daOk){
      const o = SFONDO.aOklch(lst[n]); if(o[1] > .004) tintaMem = o[2];
      metti("aspOL", Math.round(o[0]*100)); metti("aspOC", Math.min(100, Math.round(o[1]/OKC*100))); metti("aspOH", Math.round(tintaMem));
    }
    dipingiOk(okDaCur());
    clearTimeout(attesa);
    const memo = ()=>{ SFONDO.salva(lst, n); aggiornaTastoSfondo(); };
    if(salvaOra) memo(); else attesa = setTimeout(memo, 250);
  };
  dipingiCursori(c);
  dipingiOk(okDaCur());
  ["L","C","H"].forEach(k=>{
    const r = document.getElementById("aspO"+k), n = document.getElementById("aspO"+k+"n");
    r.oninput = ()=>usaOk();
    r.onchange = ()=>usaOk(true);
    n.oninput = ()=>{ const v = n.value; if(v === "" || isNaN(+v)) return; r.value = Math.max(+r.min, Math.min(+r.max, +v)); usaOk(); };
  });
  const usaRiq = () => {
    const v = {b:+document.getElementById("aspORB").value/100, l:+document.getElementById("aspORL").value/100};
    ["RB","RL"].forEach(k=>{ const n = document.getElementById("aspO"+k+"n"); if(document.activeElement !== n) n.value = document.getElementById("aspO"+k).value; });
    SFONDO.salvaRiq(v);
  };
  ["RB","RL"].forEach(k=>{
    const r = document.getElementById("aspO"+k), n = document.getElementById("aspO"+k+"n");
    r.oninput = usaRiq;
    n.oninput = ()=>{ const v = n.value; if(v === "" || isNaN(+v)) return; r.value = Math.max(+r.min, Math.min(+r.max, +v)); usaRiq(); };
  });
  document.getElementById("aspRiqZero").onclick = ()=>{ metti("aspORB", 100); metti("aspORL", 0); usaRiq(); };
  K.forEach(k=>{
    document.getElementById("asp"+k).oninput = ()=>usa(leggi());
    document.getElementById("asp"+k).onchange = ()=>usa(leggi(), true);
    document.getElementById("asp"+k+"n").oninput = e=>{ const v = e.target.value; if(v === "" || isNaN(+v)) return; const col = leggi(); col[K.indexOf(k)] = +v; usa(col); };
  });
  document.getElementById("aspHex").oninput = e=>{
    const m = /^#?([0-9a-f]{6})$/i.exec(e.target.value.trim()); if(!m) return;
    usa([0,2,4].map(o=>parseInt(m[1].substr(o,2),16)), true);
  };
  document.querySelectorAll("[data-asp-sel]").forEach(b=>b.onclick=()=>{
    const lst = SFONDO.lista(), n = +b.dataset.aspSel; SFONDO.salva(lst, n); SFONDO.applica(lst[n]); aggiornaTastoSfondo(); apriImpostazioni();
  });
  document.getElementById("aspNuova").onclick = ()=>{
    const lst = SFONDO.lista(); if(lst.length >= 9) return;
    lst.push(lst[SFONDO.sel()].slice()); SFONDO.salva(lst, lst.length - 1); aggiornaTastoSfondo(); apriImpostazioni();
  };
  const el = document.getElementById("aspElimina");
  if(el) el.onclick = ()=>{
    const lst = SFONDO.lista(), n = SFONDO.sel(); if(lst.length < 2) return;
    if(!confirm(L(`Elimino la scelta ${n+1}?`, `Delete choice ${n+1}?`))) return;
    lst.splice(n, 1); const m = Math.max(0, n - 1); SFONDO.salva(lst, m); SFONDO.applica(lst[m]); aggiornaTastoSfondo(); apriImpostazioni();
  };
  document.querySelectorAll("#aspPronti [data-pronto]").forEach(b=>b.onclick=()=>usa(SFONDO.PREDEF[+b.dataset.pronto].c.slice(), true));
  document.getElementById("impFiligrana").onchange = e=>{
    if(e.target.checked){ localStorage.setItem("checucino.filigrana","1"); document.body.setAttribute("data-filigrana","1"); }
    else{ localStorage.removeItem("checucino.filigrana"); document.body.removeAttribute("data-filigrana"); }
  };
}

const radioAudio = new Audio();
radioAudio.preload = "none";
/* le stazioni: quelle dell'app, poi quelle trovate e aggiunte dall'utente, poi quella in prova */
let radioProva = null;
function stazioni(){ return RADIO.concat(S.radioMie || [], radioProva ? [radioProva] : []); }
let radioSel = -1, radioUrl = 0, radioMsg = "", radioAperto = false, radioAvanza = false, radioAttesa = null, radioInOnda = false;

function apriFlusso(){
  const st = stazioni()[radioSel];
  radioMsg = "Collego " + st.n + "\u2026";
  radioAudio.src = st.u[radioUrl];
  disegnaRadio();
  /* se un indirizzo non risponde e non da' nemmeno errore (succede sui telefoni), dopo 7 secondi si prova il successivo */
  clearTimeout(radioAttesa);
  const sel = radioSel, url = radioUrl;
  radioInOnda = false;
  radioAttesa = setTimeout(()=>{ if(radioSel === sel && radioUrl === url && !radioInOnda) avanzaRadio(); }, 7000);
  radioAudio.play().catch(err=>{ if(err && (err.name === "NotAllowedError" || err.name === "AbortError")) return; if(radioSel === sel && radioUrl === url) avanzaRadio(); });
  try{
    if("mediaSession" in navigator)
      navigator.mediaSession.metadata = new MediaMetadata({title:st.n, artist:L("Che cucino?","What\u2019s cooking?")});
  }catch(e){}
}
function avanzaRadio(){
  if(radioSel < 0 || radioAvanza) return;
  radioAvanza = true;
  setTimeout(()=>{ radioAvanza = false; }, 400);
  if(radioUrl + 1 < stazioni()[radioSel].u.length){ radioUrl++; apriFlusso(); }
  else{
    radioMsg = stazioni()[radioSel].n + " non risponde adesso. Prova un altro genere.";
    radioSel = -1; disegnaRadio();
  }
}
function fermaRadio(){
  clearTimeout(radioAttesa);
  radioAudio.pause();
  radioAudio.removeAttribute("src");
  radioAudio.load();
  radioSel = -1; radioMsg = ""; disegnaRadio();
}
function accendiRadio(i){
  if(i === radioSel){ fermaRadio(); return; }
  radioSel = i; radioUrl = 0; apriFlusso();
}
radioAudio.addEventListener("error", avanzaRadio);
radioAudio.addEventListener("playing", ()=>{
  clearTimeout(radioAttesa);
  radioInOnda = true;
  radioMsg = "In onda: " + stazioni()[radioSel].n;
  disegnaRadio();
});

  pan.querySelectorAll("[data-i]").forEach(b=>b.onclick = ()=>accendiRadio(+b.dataset.i));

/* ===========================================================
   Cerca altre radio: l'archivio libero di radio-browser.info
   (decine di migliaia di stazioni nel mondo). Solo flussi https,
   gli unici che un'app sicura puo' suonare. Le radio aggiunte
   restano nei dati dell'utente (S.radioMie) e viaggiano nel backup.
   =========================================================== */
const RB_SERVER = ["https://de1.api.radio-browser.info","https://fi1.api.radio-browser.info","https://de2.api.radio-browser.info","https://nl1.api.radio-browser.info"];
const RB_GENERI = [["jazz","Jazz"],["classical","Classica"],["lounge","Lounge"],["chillout","Chill out"],["ambient","Ambient"],["blues","Blues"],["soul","Soul"],["swing","Swing"],["bossa nova","Bossa nova"],["acoustic","Acustica"],["oldies","Anni passati"],["italian","Italiana"],["opera","Lirica"],["baroque","Barocca"],["piano","Pianoforte"],["world","World"]];
const RB_PAESI = [["","Tutto il mondo"],["IT","Italia"],["FR","Francia"],["ES","Spagna"],["PT","Portogallo"],["GR","Grecia"],["GB","Regno Unito"],["US","Stati Uniti"],["BR","Brasile"],["CU","Cuba"],["JP","Giappone"]];
let rbRisultati = [], rbStato = "", rbGenere = "", rbPaese = "", rbTesto = "";
const rbBandiera = cc => /^[A-Z]{2}$/.test(cc||"") ? String.fromCodePoint(...[...cc].map(c=>0x1F1E6 + c.charCodeAt(0) - 65)) : "";
async function rbCerca(){
  const q = new URLSearchParams({hidebroken:"true", is_https:"true", order:"clickcount", reverse:"true", limit:"40"});
  if(rbTesto) q.set("name", rbTesto);
  if(rbGenere) q.set("tag", rbGenere);
  if(rbPaese) q.set("countrycode", rbPaese);
  if(!rbTesto && !rbGenere && !rbPaese){ rbStato = L("Scrivi un nome o scegli un genere o un paese.","Type a name or choose a genre or a country."); disegnaCercaRadio(); return; }
  rbStato = L("Cerco…","Searching…"); rbRisultati = []; disegnaCercaRadio();
  for(const srv of RB_SERVER){
    try{
      const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), 8000);
      const r = await fetch(srv + "/json/stations/search?" + q, {signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok) continue;
      const visti = new Set();
      rbRisultati = (await r.json()).filter(x=>/^https:/i.test(x.url_resolved || "") && x.name && !visti.has(x.url_resolved) && visti.add(x.url_resolved))
        .map(x=>({id:x.stationuuid, n:String(x.name).trim().slice(0,60), u:[x.url_resolved], cc:(x.countrycode||"").toUpperCase(),
                  tags:String(x.tags||"").split(",").map(t=>t.trim()).filter(Boolean).slice(0,4).join(", "), br:x.bitrate||0, ico:/^https:/i.test(x.favicon||"") ? x.favicon : ""}));
      rbStato = rbRisultati.length ? "" : L("Nessuna radio trovata: prova con un altro nome o genere.","No stations found: try another name or genre.");
      disegnaCercaRadio(); return;
    }catch(e){}
  }
  rbStato = L("L’archivio delle radio non risponde adesso: riprova tra poco (serve la connessione).","The radio directory isn’t answering right now: try again shortly (you need a connection).");
  disegnaCercaRadio();
}
let rbInCima = "";
function apriCercaRadio(){ disegnaCercaRadio(true); }
function rigaRadio(r, mia){
  const ico = r.ico ? `<img class="rb-ico" src="${esc(r.ico)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'rb-ico',textContent:'\u{1F4FB}'}))">` : `<span class="rb-ico">\u{1F4FB}</span>`;
  const st = stazioni(), suona = radioSel >= 0 && st[radioSel] && st[radioSel].u[0] === r.u[0];
  const giaMia = (S.radioMie||[]).some(x=>x.u[0] === r.u[0]);
  return `<li class="rb-riga">${ico}<span class="rb-nome" data-no-tr><b>${esc(r.n)}</b><span class="mini">${rbBandiera(r.cc)} ${esc(r.tags || "")}${r.br ? " · " + r.br + " kbps" : ""}</span></span>
    <span class="rb-az"><button class="chiudi" data-rb="${suona ? "stop" : "ascolta"}" data-u="${esc(r.u[0])}">${suona ? "⏹️ " + L("Ferma","Stop") : "▶️ " + L("Ascolta","Listen")}</button>
    ${mia ? `<button class="chiudi" data-rb="togli" data-u="${esc(r.u[0])}">✕ ${L("Togli","Remove")}</button>`
          : giaMia ? `<span class="mini">✓ ${L("tra le tue","saved")}</span>` : `<button class="chiudi" data-rb="aggiungi" data-u="${esc(r.u[0])}">＋ ${L("Aggiungi","Add")}</button>`}</span></li>`;
}
function disegnaCercaRadio(nuova){
  const mie = S.radioMie || [];
  const html = `<div class="velo-top"><h2>\u{1F4FB} ${L("Cerca altre radio","Find more radio stations")}</h2>
      <button class="chiudi" onclick="chiudiVelo()">${L("Chiudi","Close")}</button></div>
    <p class="mini">${L("Cerca tra le radio di tutto il mondo per nome, genere o paese. Prima ascoltale, poi aggiungi quelle che ti piacciono: le ritrovi nel tasto ♪ della radio, sotto «Le tue radio».","Search stations from all over the world by name, genre or country. Listen first, then add the ones you like: you’ll find them under the ♪ radio button, in “Your stations”.")}</p>

    <div class="chips" id="rbGeneri">${RB_GENERI.map(([t,n])=>`<button class="chip ${rbGenere===t?"on":""}" data-g="${t}">${L(n, t.charAt(0).toUpperCase()+t.slice(1))}</button>`).join("")}</div>

    ${rbStato ? `<p class="mini" style="margin-top:12px" aria-live="polite">${esc(rbStato)}</p>` : ""}
    ${rbRisultati.length ? `<div class="sez" style="margin-top:12px">${L("Trovate","Found")} (${rbRisultati.length})</div><ul class="rb-l">${rbRisultati.map(r=>rigaRadio(r,false)).join("")}</ul>` : ""}
    ${mie.length ? `<div class="sez" style="margin-top:16px">${L("Le tue radio","Your stations")} (${mie.length})</div><ul class="rb-l">${mie.map(r=>rigaRadio(r,true)).join("")}</ul>` : ""}
    <p class="mini" style="margin-top:14px">${L("Elenco libero e curato dagli ascoltatori (radio-browser.info): qualche stazione può non rispondere, in quel caso provane un’altra.","Free listener-curated directory (radio-browser.info): some stations may not answer; if so, try another.")}</p>`;
  const vi = velo.querySelector(".velo"), y = vi && !nuova ? vi.scrollTop : 0;
  apriVelo("radio-cerca", html);
  const vi2 = velo.querySelector(".velo"); if(vi2 && y) vi2.scrollTop = y;
  if(rbInCima){ const b = velo.querySelector(`.rb-l [data-u="${CSS.escape(rbInCima)}"]`); rbInCima = "";
    const li = b && b.closest("ul.rb-l"); if(li && vi2){ const d = li.getBoundingClientRect().top - vi2.getBoundingClientRect().top - 40; vi2.scrollTop += d; } }
  const t = document.getElementById("rbTesto");
  document.getElementById("rbVai").onclick = ()=>{ rbTesto = t.value.trim(); rbCerca(); };
  t.onkeydown = e=>{ if(e.key === "Enter"){ rbTesto = t.value.trim(); rbCerca(); } };
  document.querySelectorAll("#rbGeneri [data-g]").forEach(b=>b.onclick=()=>{ rbTesto = t.value.trim(); rbGenere = rbGenere === b.dataset.g ? "" : b.dataset.g; rbCerca(); });
  document.querySelectorAll("#rbPaesi [data-c]").forEach(b=>b.onclick=()=>{ rbTesto = t.value.trim(); rbPaese = b.dataset.c; rbCerca(); });
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-rb]"); if(!b) return;
  const u = b.dataset.u, a = b.dataset.rb;
  const trova = ()=>rbRisultati.find(x=>x.u[0] === u) || (S.radioMie||[]).find(x=>x.u[0] === u);
  if(a === "stop"){ fermaRadio(); }
  else if(a === "ascolta"){
    const r = trova(); if(!r) return;
    if(radioSel >= 0) fermaRadio();
    /* la radio che ascolti sale in testa alla sua lista */
    const k = rbRisultati.findIndex(x=>x.u[0] === u); if(k > 0) rbRisultati.unshift(rbRisultati.splice(k, 1)[0]);
    let j = (S.radioMie||[]).findIndex(x=>x.u[0] === u);
    if(j > 0){ S.radioMie.unshift(S.radioMie.splice(j, 1)[0]); j = 0; salva(); }
    rbInCima = u;
    if(j >= 0){ radioProva = null; accendiRadio(RADIO.length + j); }
    else{ radioProva = {n:r.n, u:r.u.slice(), cc:r.cc, ico:r.ico, tags:r.tags, br:r.br}; accendiRadio(stazioni().length - 1); }
    try{ fetch(RB_SERVER[0] + "/json/url/" + encodeURIComponent(r.id || "")).catch(()=>{}); }catch(err){}
  }
  else if(a === "aggiungi"){
    const r = trova(); if(!r) return;
    S.radioMie = S.radioMie || [];
    if(!S.radioMie.some(x=>x.u[0] === u)){
      const inProva = radioProva && radioProva.u[0] === u && radioSel === stazioni().length - 1;
      S.radioMie.push({n:r.n, u:r.u.slice(), cc:r.cc, ico:r.ico, tags:r.tags, br:r.br});
      if(inProva){ radioProva = null; radioSel = RADIO.length + S.radioMie.length - 1; }
      salva();
    }
  }
  else if(a === "togli"){
    const j = (S.radioMie||[]).findIndex(x=>x.u[0] === u); if(j < 0) return;
    if(radioSel === RADIO.length + j) fermaRadio();
    else if(radioSel > RADIO.length + j) radioSel--;
    S.radioMie.splice(j, 1); salva();
  }
  disegnaCercaRadio();
});

const ALIAS_REG = {
  "piedmont":"Piemonte", "aosta valley":"Valle d\u2019Aosta", "valle d aosta":"Valle d\u2019Aosta",
  "lombardy":"Lombardia", "trentino south tyrol":"Trentino-Alto Adige",
  "trentino alto adige sudtirol":"Trentino-Alto Adige", "south tyrol":"Trentino-Alto Adige",
  "trentino":"Trentino-Alto Adige", "veneto":"Veneto", "friuli venezia giulia":"Friuli-Venezia Giulia",
  "liguria":"Liguria", "emilia romagna":"Emilia-Romagna", "tuscany":"Toscana", "umbria":"Umbria",
  "marche":"Marche", "the marches":"Marche", "latium":"Lazio", "abruzzo":"Abruzzo", "abruzzi":"Abruzzo",
  "molise":"Molise", "campania":"Campania", "apulia":"Puglia", "basilicata":"Basilicata",
  "calabria":"Calabria", "sicily":"Sicilia", "sicilia":"Sicilia", "sardinia":"Sardegna"
};
function normReg(x){
  return (x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
         .replace(/[^a-z]+/g," ").trim();
}
function abbinaRegione(nome){
  const n = normReg(nome);
  if(!n) return "";
  const diretta = REGIONI.find(r=>normReg(r)===n);
  if(diretta) return diretta;
  if(ALIAS_REG[n]) return ALIAS_REG[n];
  return REGIONI.find(r=>{ const x=normReg(r); return x.indexOf(n)===0 || n.indexOf(x)===0; }) || "";
}
/* "Dove vivi": dal nome del luogo ricavo l'emisfero (e, se e' in Italia, la regione).
   Se ci sono luoghi con lo stesso nome in emisferi diversi, chiedo quale. */
let luogoUltimo = "";
/* mappamondo con l'emisfero in cui vivi colorato */
/* tieni premuto il mappamondo: compare la nota sull'emisfero; sollevando il dito sparisce */
(function(){
  let nota = null;
  const togli = ()=>{ if(nota){ nota.remove(); nota = null; } };
  document.addEventListener("pointerdown", e=>{
    const g = e.target.closest && e.target.closest("svg.globo"); if(!g) return;
    e.preventDefault(); togli();
    const sud = g.dataset.emi === "sud";
    nota = document.createElement("div"); nota.className = "globo-nota"; nota.setAttribute("role","status");
    nota.textContent = sud
      ? L("Emisfero sud: le stagionalit\u00e0 di frutta, verdura e pesce sono adeguate al tuo emisfero (spostate di sei mesi).","Southern hemisphere: the seasons for fruit, vegetables and fish are adjusted to your hemisphere (shifted by six months).")
      : L("Emisfero nord: le stagionalit\u00e0 di frutta, verdura e pesce sono adeguate al tuo emisfero.","Northern hemisphere: the seasons for fruit, vegetables and fish are adjusted to your hemisphere.");
    document.body.appendChild(nota);
    const r = g.getBoundingClientRect(), w = nota.offsetWidth;
    nota.style.left = Math.min(Math.max(r.left + r.width/2, w/2 + 8), innerWidth - w/2 - 8) + "px";
    nota.style.top = (r.top - 10) + "px";
    if(r.top - nota.offsetHeight < 10){ nota.style.transform = "translate(-50%,0)"; nota.style.top = (r.bottom + 10) + "px"; nota.classList.add("sotto"); }
  });
  ["pointerup","pointercancel","scroll","blur"].forEach(ev=>addEventListener(ev, togli, true));
  document.addEventListener("contextmenu", e=>{ if(e.target.closest && e.target.closest("svg.globo")) e.preventDefault(); });

function globo(emi){

function bandiera(cod){ return (cod && /^[a-z]{2}$/i.test(cod)) ? String.fromCodePoint(...cod.toUpperCase().split("").map(c=>0x1F1E6 + c.charCodeAt(0) - 65)) : "\u{1F4CD}"; }

function impostaLuogo(nome, paese, lat, regIt, cod, prov){

/* cerca un nome su Open-Meteo; se non c'e', prova a staccare i prefissi ("Acicastello" -> "Aci Castello")
   e infine chiede a OpenStreetMap, che conosce anche i nomi scritti attaccati */
async function cercaNome(nome){
  const lingua = IN_INGLESE ? "en" : "it";
  const om = async n => { const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&language=" + lingua + "&name=" + encodeURIComponent(n)); const d = await r.json(); return d.results || []; };
  let ris = await om(nome);
  if(ris.length) return ris;
  const varianti = new Set();
  const m = nome.match(/^(aci|san|santa|sant|santo|santi|castel|castello|monte|porto|villa|torre|borgo|rocca|ponte|pieve|casal|campo|val|bagno|bagni|marina|lido|serra|terra|forte|riva|colle|poggio|pozzo|fiume|piano|mezzo|sotto|sopra)(.+)$/i);
  if(m) varianti.add(m[1] + " " + m[2]);
  const n2 = nome.replace(/([a-z])(castello|castel|monte|marina|terme|superiore|inferiore|scalo|lido)$/i, "$1 $2");
  if(n2 !== nome) varianti.add(n2);
  if(/[-']/.test(nome)) varianti.add(nome.replace(/[-']/g, " "));
  for(const v of varianti){ ris = await om(v); if(ris.length) return ris; }
  try{
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=" + lingua + "&q=" + encodeURIComponent(nome));
    const d = await r.json();
    return (d || []).filter(x=>x.address).map(x=>{ const a = x.address; return {
      name: a.city || a.town || a.village || a.municipality || a.hamlet || x.name || nome,
      country: a.country || "", country_code: (a.country_code || "").toUpperCase(),
      admin1: a.state || a.region || "", admin2: a.province || a.county || "", latitude: +x.lat, longitude: +x.lon }; });
  }catch(e){ return []; }
}
async function cercaLuogo(q){
  q = (q || "").trim();
  const es = document.getElementById("pLuogoEsito"), sc = document.getElementById("pLuogoScelte");
  if(!q || q === luogoUltimo || q === S.profilo.luogo) return;
  luogoUltimo = q;
  es.textContent = L("Cerco il luogo\u2026","Looking up the place\u2026"); sc.innerHTML = "";
  try{
    let ris = await cercaNome(q.split(",")[0].trim());
    /* se ha scritto anche il paese ("Cordoba, Argentina") tengo solo quello */
    const paeseScritto = q.includes(",") ? normTesto(q.split(",").slice(1).join(" ")) : "";
    if(paeseScritto){ const f = ris.filter(x=>normTesto((x.country||"") + " " + (x.admin1||"")).includes(paeseScritto)); if(f.length) ris = f; }
    if(!ris.length){ es.textContent = L("Non trovo questo luogo: controlla come l\u2019hai scritto, oppure usa il GPS.","I can\u2019t find that place: check the spelling, or use the GPS."); luogoUltimo = ""; return; }
    const reg = x => (x.country_code === "IT" ? abbinaRegione(x.admin1 || "") : "");
    const nord = ris.filter(x=>x.latitude >= 0), sud = ris.filter(x=>x.latitude < 0);
    if(!nord.length || !sud.length){
      const x = ris[0]; impostaLuogo(x.name, x.country || "", x.latitude, reg(x), x.country_code, x.admin2); return;
    }
    /* omonimi in emisferi diversi: chiedo quale */
    es.textContent = L(`Ci sono pi\u00f9 luoghi chiamati \u00ab${x0(q)}\u00bb, in emisferi diversi. Qual \u00e8 il tuo?`, `There are several places called \u00ab${x0(q)}\u00bb, in different hemispheres. Which one is yours?`);
    sc.innerHTML = ris.slice(0,6).map((x,i)=>`<button class="chip" data-luogo="${i}">${bandiera(x.country_code)} ${esc(x.name)} (${esc([x.admin1, x.country].filter(Boolean).join(", "))})</button>`).join("");
    sc.querySelectorAll("[data-luogo]").forEach(b=>b.onclick=()=>{ const x = ris[+b.dataset.luogo]; impostaLuogo(x.name, x.country || "", x.latitude, reg(x), x.country_code, x.admin2); });
  }catch(e){
    luogoUltimo = "";
    es.textContent = L("Non riesco a cercare il luogo adesso (sei senza rete?). Usa il GPS o riprova pi\u00f9 tardi.","I can\u2019t look up the place right now (are you offline?). Use the GPS or try again later.");
  }
  function x0(t){ return esc(t.split(",")[0].trim()); }
}
function trovaRegione(btn, esito){
  if(!navigator.geolocation){
    esito.textContent = L("Questo telefono non sa dirmi dove sei: scrivi il luogo qui sopra.","This phone can\u2019t tell where you are: type the place above.");
    return;
  }
  btn.disabled = true;
  esito.textContent = "Cerco la posizione\u2026";
  navigator.geolocation.getCurrentPosition(async pos=>{
    const la = pos.coords.latitude, lo = pos.coords.longitude;
    S.profilo.emisfero = la < 0 ? "sud" : "nord"; salva();
    try{
      /* prima OpenStreetMap: sulla costa e' piu' preciso (l'altro servizio scambia Aci Castello per il mar Ionio) */
      try{
        const rn = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1&accept-language="
                    + (IN_INGLESE ? "en" : "it") + "&lat=" + la + "&lon=" + lo);
        const n = await rn.json(), a = (n && n.address) || {};
        const comune = a.city || a.town || a.village || a.municipality || a.hamlet || a.suburb || "";
        if(comune){
          const cod = (a.country_code || "").toUpperCase();
          impostaLuogo(comune, a.country || "", la, cod === "IT" ? abbinaRegione(a.state || a.region || "") : "", cod, a.province || a.county || "");
          return;
        }
      }catch(e){}
      const rsp = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="
                  + la + "&longitude=" + lo + "&localityLanguage=it");
      const d = await rsp.json();
      const reg = abbinaRegione(d.principalSubdivision);
      const citta = d.city || (d.principalSubdivision ? d.locality : "") || "";
      const prov = (((d.localityInfo || {}).administrative || []).find(x=>x.adminLevel === 6) || {}).name || "";
      if(citta || d.countryName){ impostaLuogo(citta || d.countryName, citta ? (d.countryName || "") : "", la, reg, d.countryCode, citta ? prov : ""); return; }
      esito.textContent = L("Posizione trovata, ma non il nome del luogo: scrivilo qui sopra.","Position found, but not the place name: type it above.");
    }catch(e){
      esito.textContent = L("Non sono riuscito a leggere il luogo: scrivilo qui sopra.","I couldn\u2019t read the place: type it above.");
    }finally{ btn.disabled = false; }
  }, err=>{
    btn.disabled = false;
    esito.textContent = (err.code === err.PERMISSION_DENIED)
      ? L("Permesso negato: scrivi il luogo qui sopra.","Permission denied: type the place above.")
      : L("Posizione non disponibile adesso: scrivi il luogo qui sopra.","Position not available right now: type the place above.");
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

/* ===========================================================
   Schermata d'apertura e service worker
   =========================================================== */
(function(){
  const sp = document.getElementById("splash");
  if(!sp){ document.documentElement.classList.remove("avvio"); return; }
  let chiuso = false;
  const chiudi = ()=>{
    if(chiuso) return; chiuso = true;
    sp.classList.add("via");
    document.documentElement.classList.remove("avvio");
    try{ const c = getComputedStyle(document.documentElement).getPropertyValue("--carta").trim(); document.getElementById("metaTema").content = c || window.TEMA_DOPO; }catch(e){}
    setTimeout(()=>sp.remove(), 500);
  };
  /* barra di caricamento: avanza a scatti come un download e arriva al 100% allo scadere dei 5 secondi */
  const DURATA = 5000, fill = document.getElementById("caricaFill"), pct = document.getElementById("caricaPct"), txt = document.getElementById("caricaTxt");
  const ING = (typeof IN_INGLESE !== "undefined" && IN_INGLESE);
  const FASI = ING
    ? [[0,"Warming up the kitchen…"],[25,"Loading recipes…"],[55,"Checking the pantry…"],[82,"Setting the table…"],[100,"Ready!"]]
    : [[0,"Preparo la cucina…"],[25,"Carico le ricette…"],[55,"Controllo la dispensa…"],[82,"Apparecchio la tavola…"],[100,"Pronto!"]];
  /* tappe [tempo, percentuale]: tratti veloci e piccole soste, come un vero scaricamento */
  const TAPPE = [[0,0],[.12,18],[.22,23],[.38,47],[.47,52],[.6,71],[.7,74],[.85,93],[.93,96],[1,100]];
  const valore = f=>{ for(let k=1;k<TAPPE.length;k++){ const [t1,v1]=TAPPE[k-1],[t2,v2]=TAPPE[k]; if(f<=t2) return v1+(v2-v1)*(f-t1)/(t2-t1); } return 100; };
  const t0 = performance.now();
  const passo = ()=>{
    if(chiuso || !fill) return;
    const f = Math.min(1,(performance.now()-t0)/DURATA), v = Math.round(valore(f));
    fill.style.width = v+"%"; pct.textContent = v+"%";
    let fase = FASI[0][1]; FASI.forEach(([soglia,testo])=>{ if(v>=soglia) fase = testo; }); txt.textContent = fase;
    if(f<1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
  /* resta in vista qualche secondo per godersi l'animazione; un tocco la chiude subito */
  const minimo = new Promise(r=>setTimeout(r, DURATA + 250));
  sp.addEventListener("click", ()=>chiudi());
  const pronta = new Promise(r=>{
    document.readyState === "complete" ? r() : window.addEventListener("load", r, {once:true});
  });
  Promise.all([minimo, pronta]).then(chiudi);
  setTimeout(chiudi, 7500);
})();

/* la versione vera e' quella della cache installata dal service worker: l'etichetta si allinea da sola */
async function versioneInstallata(){
  try{
    const n = (await caches.keys()).map(k=>(k.match(/^checucino-v(\d+)$/)||[])[1]).filter(Boolean).map(Number);
    if(n.length){ const v = "v" + Math.max(...n); scriviVersione(v); return v; }

  return versioneMia();
}
async function versioneOnline(){
  const t = await (await fetch("service-worker.js?n=" + Date.now(), {cache:"no-store"})).text();

  return m ? "v" + m[1] : "";
}
async function aggiornaApp(btn){
  const scrivi = t=>{ if(btn) btn.textContent = t; };
  scrivi("⏳ " + L("Controllo…","Checking…"));

  try{ online = await versioneOnline(); }
  catch(e){ scrivi("\u{1F504} " + L("Aggiorna l’app","Update the app")); alert(L("Per aggiornare serve la connessione a internet.","An internet connection is needed to update.")); return; }
  const mia = await versioneInstallata();
  if(online && online === mia &&
     !confirm(L(`Hai già l’ultima versione (${mia}).\nRicarico comunque l’app da capo? I tuoi dati restano dove sono.`,
                `You already have the latest version (${mia}).\nReload the app from scratch anyway? Your data stays where it is.`))){
    scrivi("\u{1F504} " + L("Aggiorna l’app","Update the app")); return; }
  scrivi("⏳ " + L("Scarico la versione nuova…","Downloading the new version…"));
  /* i dati (ricette, dispensa, cantina, foto) non stanno nella cache dei file: non vengono toccati */
  const file = ["./","./index.html","./dati/ricette.js","./dati/ricette-en.js","./dati/scuola.js","./dati/icone-scuola.js","./dati/stagioni.js","./manifest.json"];
  await Promise.all(file.map(f=>fetch(f, {cache:"reload"}).catch(()=>{})));
  try{ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }catch(e){}
  try{ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){}
  location.replace(location.pathname + "?agg=" + Date.now());
}
