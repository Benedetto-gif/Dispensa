<!DOCTYPE html>
<html lang="it" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Che cucino?</title>
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F4EE" id="metaTema">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Che cucino?">
<script>
/* la luminosita scelta va applicata prima del primo disegno, o si vede lo sfarfallio */
(function(){try{var t=localStorage.getItem("checucino.tono");
if(t===null)t=window.matchMedia("(prefers-color-scheme: dark)").matches?"100":"0";
document.documentElement.style.setProperty("--tono",t);
if(+t>=55)document.documentElement.setAttribute("data-scuro","");
var tc=localStorage.getItem("checucino.chiaro"); if(tc)document.documentElement.setAttribute("data-chiaro",tc);
var ts=localStorage.getItem("checucino.scuroTema"); if(ts)document.documentElement.setAttribute("data-scuro-t",ts);
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --tono:15;
  color-scheme:light;
  --carta:          #F2F4EE;
  --superficie:     #FFFFFF;
  --superficie2:    #E7EBDE;
  --inchiostro:     #1C2A18;
  --inchiostro-soft:#51604C;
  --linea:          #D3D9C4;
  --verde:          #3F7A4E;
  --verde-chiaro:   #DCE9DC;
  --senape:         #B97A1E;
  --mattone:        #A0472E;
  --ombra:0 1px 0 hsl(150 17% 13% / 0.06);
  --r:14px;
}
/* scuro di base: blu profondo Pantone 295 */
:root[data-scuro]{
  color-scheme:dark;
  --carta:#0A1E45; --superficie:#0E244F; --superficie2:#163266;
  --inchiostro:#EEF2FA; --inchiostro-soft:#B6C3DE; --linea:#26407A;
  --verde:#5FA875; --verde-chiaro:#1E4430; --senape:#E0A73E; --mattone:#D97A55;
  --ombra:0 1px 0 hsl(150 17% 13% / 0.3);
}
/* --- 4 temi chiari a scelta (Impostazioni) --- */
:root[data-chiaro="2"]{ --carta:#F6F1E7; --superficie:#FFFDF8; --superficie2:#ECE3D0; --inchiostro:#2B2013; --inchiostro-soft:#5C4E37; --linea:#DCCFAF; }
:root[data-chiaro="3"]{ --carta:#EEF3F5; --superficie:#FFFFFF; --superficie2:#DCE6EA; --inchiostro:#132225; --inchiostro-soft:#48595D; --linea:#C4D3D8; }
:root[data-chiaro="4"]{ --carta:#FBEFEF; --superficie:#FFFFFF; --superficie2:#F3DCDC; --inchiostro:#2A1414; --inchiostro-soft:#5E3D3D; --linea:#E0BEBE; }
/* --- 4 temi scuri a scelta (il primo, senza attributo, è il blu Pantone 295) --- */
:root[data-scuro][data-scuro-t="2"]{ --carta:#151515; --superficie:#1E1E1E; --superficie2:#292929; --inchiostro:#F1F1F1; --inchiostro-soft:#C6C6C6; --linea:#393939; }
:root[data-scuro][data-scuro-t="3"]{ --carta:#17281A; --superficie:#1D321F; --superficie2:#28402A; --inchiostro:#ECF3EC; --inchiostro-soft:#B6C8B6; --linea:#375038; }
:root[data-scuro][data-scuro-t="4"]{ --carta:#2A1520; --superficie:#341A28; --superficie2:#432235; --inchiostro:#F5ECF1; --inchiostro-soft:#D3B9C7; --linea:#5A2E48; }
/* filigrana facoltativa: ortaggi, frutta, uova come sfondo tenue */
body[data-filigrana="1"]::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:.07;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><text x="6" y="42" font-size="36">%F0%9F%A5%95</text><text x="96" y="96" font-size="36">%F0%9F%8D%85</text><text x="20" y="150" font-size="36">%F0%9F%A5%9A</text><text x="112" y="34" font-size="36">%F0%9F%8D%87</text></svg>');
  background-repeat:repeat;
}
#app{position:relative;z-index:1}
.pcella.cat-gruppo{padding:0}
.pcella.cat-gruppo > summary{padding:14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}
.pcella.cat-gruppo > summary::-webkit-details-marker{display:none}
.pcella.cat-gruppo > summary em{font-style:normal;font-weight:600;opacity:1;font-size:.88rem}
.pcella.cat-gruppo .corpo{padding:0 14px 14px}
/* colori convenzionali HACCP per i reparti della dispensa */
.pcella.cat-verdure{background:#32723F;color:#fff}
.pcella.cat-frutta{background:#516E1C;color:#fff}
.pcella.cat-essiccati{background:#8D5A3B;color:#fff}
:root[data-scuro] .pcella.cat-essiccati{background:#885A3C}
.sotto-rep{font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.4)}
.sotto-rep:first-child{border-top:0;padding-top:0;margin-top:2px}   /* verde HACCP, tono piu' chiaro per distinguerla dalle verdure */
.pcella.cat-carne{background:#B83729;color:#fff}
.pcella.cat-pesce{background:#176A9B;color:#fff}
.pcella.cat-grigio{background:#5F6572;color:#fff}
.pcella.cat-ocra{background:#835F08;color:#fff}
.pcella.cat-giallo{background:#E3B400;color:#3A2E00;border:1px solid #C79A00}
.pcella.cat-latticini{background:#FAF8F2;color:#2A2A22;border:1px solid #DCD6C4}
.pcella.cat-ghiaccio{background:#E7F5FA;color:#1B3A44;border:1px solid #C7E3ED}
:root[data-scuro] .pcella.cat-verdure{background:#337140}
:root[data-scuro] .pcella.cat-frutta{background:#526C22}
:root[data-scuro] .pcella.cat-carne{background:#B23B30}
:root[data-scuro] .pcella.cat-pesce{background:#206997}
:root[data-scuro] .pcella.cat-grigio{background:#5D656F}
:root[data-scuro] .pcella.cat-ocra{background:#7E5F13}
:root[data-scuro] .pcella.cat-giallo{background:#E3B400;color:#3A2E00}
:root[data-scuro] .pcella.cat-latticini{background:#EDE9DD;color:#2A2A22}
:root[data-scuro] .pcella.cat-ghiaccio{background:#D7EEF6;color:#1B3A44}
.pcella.cat-giallo .mini,.pcella.cat-latticini .mini,.pcella.cat-ghiaccio .mini{opacity:.9}
.pcella.cat-giallo > summary em,.pcella.cat-latticini > summary em,.pcella.cat-ghiaccio > summary em{opacity:.85}
#cerca.ing-ok{border-color:var(--verde);background:color-mix(in srgb,var(--verde) 10%,var(--superficie))}
.ing-esito-ok{color:var(--verde);font-weight:700}
.pcella[class*="c-"] .ing-esito-ok{color:#EAFFEA;opacity:1}
*{box-sizing:border-box}

/* ===== INNER PAGES BENTO ===== */
.pag{padding:10px 0 calc(90px + env(safe-area-inset-bottom))}
.pag-intro{padding:2px 2px 12px}
.pag-intro h2{font-size:1.35rem;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
.pag-intro p{font-size:.9rem;color:var(--inchiostro-soft);margin:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pgrid .full{grid-column:1/-1}
.pgrid3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.pcella{border-radius:14px;padding:14px;border:2px solid transparent;
  background:var(--superficie2);cursor:pointer;transition:transform .12s,border-color .15s;-webkit-tap-highlight-color:transparent}
.pcella:active{transform:scale(.97)}
.pcella.sel{border-color:var(--verde);background:color-mix(in srgb,var(--verde) 12%,var(--superficie2))}
.pcella svg{width:28px;height:28px;margin-bottom:8px;display:block;opacity:.85}
.pcella b{display:block;font-size:.98rem;font-weight:800;line-height:1.2}
.pcella small{display:block;font-size:.76rem;color:var(--inchiostro-soft);margin-top:3px;line-height:1.3}
.ric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.ws-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ws-links.q4{grid-template-columns:repeat(2,1fr)}
.cerco-altro{margin:18px 0 6px;text-align:center}
.cerco-altro>.btn{width:100%}
.cerco-altro-box{margin-top:10px}
.ws-links a{border-radius:12px;padding:12px 8px;background:var(--superficie2);
  text-align:center;font-size:.84rem;font-weight:600;color:inherit;text-decoration:none;
  border:1px solid var(--linea)}

/* ===== HOME BENTO ===== */
.home{padding:6px 0 calc(80px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.home-saluto{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:6px 0 16px;padding:0 2px}
.home-saluto small{display:block;font-size:.85rem;font-weight:400;color:var(--inchiostro-soft);margin-top:2px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bento .avvia{grid-column:1/-1}
.bento .bcella{z-index:1}
.az-riga{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:.95rem;line-height:1.35}
.az-riga input{width:20px;height:20px;flex:none;margin-top:1px}
.btn.rischio-btn{background:#B23B30;color:#fff}
.globo,.pcella svg.globo{display:inline-block;width:28px;height:28px;vertical-align:middle;margin:0 4px 0 0;background:#fff;border-radius:50%}
.bcella.hconosci{margin-top:-20px;padding:30px 16px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;
  z-index:0;border-radius:0 0 18px 18px;transition:transform .28s cubic-bezier(.3,1.4,.5,1),margin .28s,box-shadow .28s;animation:conosciScivola .6s ease-out .25s both}
.bcella.hconosci.su{transform:translateY(-6px);margin-top:4px;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.22)}
@keyframes conosciScivola{from{transform:translateY(-34px);opacity:.3}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.bcella.hconosci{animation:none}}
.bcella.hconosci svg{width:58px !important;height:38px !important;margin:0;grid-row:span 2}
.bcella.hconosci b{font-size:1rem}
.bcella.hconosci small{margin-top:2px}
.bcella{border-radius:18px;padding:16px 16px 14px;cursor:pointer;
  border:1.5px solid transparent;
  transition:transform .15s,box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden}
.bcella:active{transform:scale(.97)}
/* colori bento: vividi, cibo-ispirati, testo sempre bianco */
.bcella.c-verde,  .pcella.c-verde  {background:#B83729;color:#fff}   /* rosso pomodoro        */
.bcella.c-menta,  .pcella.c-menta  {background:#1768A9;color:#fff}   /* blu cielo             */
.bcella.c-crema,  .pcella.c-crema  {background:#865D00;color:#fff}   /* oro zafferano         */
.bcella.c-senape, .pcella.c-senape {background:#6D3FA0;color:#fff}   /* viola melanzana       */
.bcella.c-auto,   .pcella.c-auto   {background:#157159;color:#fff}   /* verde basilico        */
.bcella.c-mattone,.pcella.c-mattone{background:#A74915;color:#fff}   /* arancio peperone      */
/* adatta leggermente in modalita scura */
:root[data-scuro] .bcella.c-verde,  :root[data-scuro] .pcella.c-verde  {background:#B33C2D}
:root[data-scuro] .bcella.c-menta,  :root[data-scuro] .pcella.c-menta  {background:#1C69A2}
:root[data-scuro] .bcella.c-crema,  :root[data-scuro] .pcella.c-crema  {background:#805E09}
:root[data-scuro] .bcella.c-senape, :root[data-scuro] .pcella.c-senape {background:#7E50B5}
:root[data-scuro] .bcella.c-auto,   :root[data-scuro] .pcella.c-auto   {background:#16725B}
:root[data-scuro] .bcella.c-mattone,:root[data-scuro] .pcella.c-mattone{background:#A14D1D}
.bcella.c-bordeaux, .pcella.c-bordeaux{background:#8B3A52;color:#fff}
:root[data-scuro] .pcella.c-bordeaux{background:#9E4A62}
/* pcella colorata: testo e icona leggibili sopra il colore pieno */
.pcella[class*="c-"]{border-color:transparent}
.pcella[class*="c-"] small{color:#fff;opacity:1;font-weight:600}
.pcella[class*="c-"] svg{opacity:1}
.pcella[class*="c-"].sel{outline:3px solid rgba(255,255,255,.9);outline-offset:-3px}
.pcella[class*="c-"] input[type=text],.pcella[class*="c-"] select{color:var(--inchiostro)}
.pcella[class*="c-"] .campo>span{color:#fff;opacity:1;font-weight:600}
.pcella[class*="c-"] .mini{color:#fff;opacity:1;font-weight:600}
.pcella[class*="c-"] .btn.ghost{color:#fff;border-color:rgba(255,255,255,.55)}
.mic-btn{flex:none;width:44px;height:44px;border-radius:11px;border:1px solid var(--linea);
  background:var(--carta);color:var(--inchiostro);display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.mic-btn svg{width:20px;height:20px}
.mic-btn.in-ascolto{background:var(--mattone);border-color:var(--mattone);color:#fff;
  animation:mic-pulsa 1s ease-in-out infinite}
@keyframes mic-pulsa{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mattone) 45%,transparent)}
  50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--mattone) 0%,transparent)}}
.bcella svg{width:36px;height:36px;margin-bottom:10px;display:block;opacity:1}
.bcella.avvia svg{width:48px;height:48px;margin-bottom:12px}
.bcella b{display:block;font-size:1.08rem;font-weight:800;line-height:1.2}
.bcella.avvia b{font-size:1.38rem}
.bcella small{display:block;font-size:.86rem;font-weight:600;opacity:.97;margin-top:4px;line-height:1.35}
.bcella .badge{position:absolute;top:12px;right:14px;
  background:rgba(0,0,0,.18);color:inherit;
  border-radius:999px;font-size:.72rem;font-weight:700;padding:2px 8px;
  line-height:1.6}
.bcella.tre{grid-column:auto}
/* box lista della spesa in home: spento se vuota, acceso se c'è qualcosa */
.bcella.hspesa{margin-top:10px;transition:background .3s,color .3s,box-shadow .3s}
.bcella.hspesa.spenta{background:var(--superficie2);color:var(--inchiostro-soft);border:1.5px dashed currentColor;opacity:.75}
.bcella.hspesa.accesa{background:#1F742A;color:#fff;border:2px solid #fff;
  box-shadow:0 0 0 3px #1F742A,0 0 22px 4px rgba(46,173,63,.75);animation:spesaAccesa 2.2s ease-in-out infinite}
:root[data-scuro] .bcella.hspesa.accesa{background:#1F742C;box-shadow:0 0 0 3px #1F742C,0 0 26px 6px rgba(52,194,74,.8)}
@keyframes spesaAccesa{50%{box-shadow:0 0 0 3px #1F742A,0 0 34px 10px rgba(46,173,63,.95)}}
@media(prefers-reduced-motion:reduce){.bcella.hspesa.accesa{animation:none}}
.hspesa-l{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.hspesa-l li{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600}
.bento-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
/* ===== Impariamo a cucinare ===== */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sc-gruppo{font-size:1.1rem;margin:20px 0 -2px}
.sc-agg{width:100%;margin-top:10px}
.imp-prog{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.imp-prog[hidden]{display:none}
.imp-prog-bar{flex:1;height:10px;border-radius:999px;background:var(--superficie2);overflow:hidden;border:1px solid var(--linea)}
.imp-prog-bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .25s linear;
  background:repeating-linear-gradient(45deg,#0F6E78 0 10px,#2C8C97 10px 20px);background-size:28px 28px;animation:impScorri .8s linear infinite}
@keyframes impScorri{to{background-position:28px 0}}
.imp-prog span{font-weight:800;font-size:.85rem;min-width:38px;text-align:right}
.imp-ko{background:#FBEAE7;border:2px solid #B23B30;border-radius:14px;padding:12px 14px;margin:10px 0;color:#5A1A14}
:root[data-scuro] .imp-ko{background:#3A1A16;color:#F6D6D1}
.imp-ko .btn.ghost{color:inherit}
.imp-tolte{background:var(--superficie2);border-radius:14px;padding:10px 14px;margin:6px 0 12px}
.imp-tolte ul{margin:6px 0;padding-left:1.1em;font-size:.85rem;color:var(--inchiostro-soft)}
.imp-tolte li{text-decoration:line-through}
.ico-in{display:inline-grid;place-items:center;vertical-align:middle;margin:0 2px;line-height:1}
.ico-musica{width:30px;height:30px;border-radius:50%;border:1px solid var(--linea);background:var(--superficie);color:var(--verde);font-size:1.05rem;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.ico-nutri{font-size:1.15rem}
.ms-corso{margin-bottom:14px}
.ms-cat{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin:4px 2px 6px;color:var(--inchiostro-soft)}
.ms-alt{margin-top:6px;align-items:center}
.ms-alt .chip{font-size:.82rem}
/* ===== Di stagione ===== */
.st-mesi{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;margin-top:6px;scrollbar-width:none}
.st-mesi .chip{flex:none;text-transform:capitalize}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(max-width:360px){.st-grid{grid-template-columns:1fr 1fr}}
.st-card{background:var(--st);color:#fff;border:0;border-radius:16px;padding:12px 6px 10px;text-align:center;cursor:pointer;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent}
.st-card:active{transform:scale(.97)}
.st-card .st-e{font-size:2.2rem;line-height:1.1;background:rgba(255,255,255,.92);border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.st-card b{font-size:.92rem;font-weight:800;line-height:1.15}
.st-card small{font-size:.76rem;font-weight:600;opacity:.95}
.st-tabw{overflow-x:auto;margin-top:10px}
.st-tab{border-collapse:separate;border-spacing:2px;width:100%;font-size:.85rem}
.st-tab th{font-weight:800;font-size:.75rem;text-transform:uppercase;padding:2px 0;min-width:16px}
.st-tab th.ora{color:var(--st)}
.st-tab td:first-child{font-weight:700;font-size:.8rem;line-height:1.15;padding-right:4px;max-width:104px;position:sticky;left:0;background:var(--carta)}
.st-tab th:not(:first-child),.st-tab td:not(:first-child){width:7%}
.st-tab td{height:22px;border-radius:5px;background:var(--superficie2)}
.st-tab td.si{background:var(--st)}
.st-tab td.ora{outline:2px solid var(--inchiostro);outline-offset:-1px}
.st-tab tr{cursor:pointer}
.st-det{text-align:center;margin-top:6px}
.st-card .st-e svg{width:40px;height:40px}
.st-det-e svg{width:66px;height:66px}
.st-ti{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.st-ti svg{width:18px;height:18px}
.st-card.fermo{background:var(--superficie2);color:var(--inchiostro);outline:2px dashed #B23B30;outline-offset:-2px}
.st-card.fermo small{color:#B23B30;font-weight:800}
.st-tab td.no,.st-barra span.no{background:repeating-linear-gradient(45deg,#B23B30 0 4px,#8A2A21 4px 8px);color:#fff}
.sc-box.st-nota.fermo{background:#8A2A21}
.st-leg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st-q{display:inline-block;width:14px;height:14px;border-radius:4px}
.st-q.si{background:var(--st,#176A9B)}
.st-q.no{background:repeating-linear-gradient(45deg,#B23B30 0 3px,#8A2A21 3px 6px)}
.st-nota{text-align:left;margin-top:10px}
.st-det-e{font-size:3.4rem;line-height:1;background:var(--superficie2);border-radius:50%;width:92px;height:92px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.st-det h3{font-size:1.35rem;margin:0}
.st-barra{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:12px 0 4px}
.st-barra span{font-size:.72rem;font-weight:800;padding:6px 0;border-radius:6px;background:var(--superficie2);color:var(--inchiostro-soft);text-transform:uppercase}
.st-barra span.si{background:var(--st);color:#fff}
.st-barra span.ora{outline:2px solid var(--inchiostro);outline-offset:-1px}
.sc-fig{background:var(--superficie2);border-radius:16px;padding:8px;margin:8px 0}
.sc-fig svg{display:block;width:100%;height:auto}
.sc-key{display:inline-flex;align-items:center;gap:5px;margin-right:10px;font-size:.88rem;font-weight:600}
.sc-key i{width:14px;height:14px;border-radius:4px;display:inline-block}
.sm-icone .chip{font-size:1.25rem;padding:4px 8px;min-width:42px}
#smTesto,#smCons{width:100%;box-sizing:border-box;font:inherit;border-radius:12px;padding:10px;border:1px solid var(--linea);background:var(--carta);color:var(--inchiostro)}
.sc-nav a.btn{text-decoration:none;display:inline-flex;align-items:center}
.sc-lez .sc-intro+.sc-intro{margin-top:8px}
.sc-grid .bcella{padding:14px}
.sc-grid .bcella .sc-e{font-size:1.9rem;line-height:1;display:block;margin-bottom:8px}
.sc-lez .sc-intro{font-size:1rem;line-height:1.55;margin:6px 0 4px}
.sc-lez h3{font-size:1.05rem;margin:22px 0 6px;padding-top:12px;border-top:1px solid var(--linea)}
.sc-lez p{line-height:1.55;margin:6px 0}
.sc-lez ul{margin:6px 0;padding-left:1.15em}
.sc-lez ul li{margin-bottom:6px;line-height:1.5}
.sc-lez .passi li{line-height:1.5}
.sc-tabw{overflow-x:auto;margin:8px 0}
.sc-tab{width:100%;border-collapse:collapse;font-size:.88rem}
.sc-tab th{text-align:left;background:var(--superficie2);padding:7px 8px;font-weight:700}
.sc-tab td{padding:7px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
.sc-box{background:#157159;color:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.5}
:root[data-scuro] .sc-box{background:#16725B}
.sc-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
@media(max-width:340px){.bento-3{grid-template-columns:1fr 1fr}}

/* cursore chiaro/scuro */
.tono{display:flex;align-items:center;gap:4px;flex:none;
  padding:3px 6px;border-radius:999px;background:var(--superficie);border:1px solid var(--linea)}
.tono svg{width:12px;height:12px;flex:none;color:var(--inchiostro-soft)}
.tono input[type=range]{-webkit-appearance:none;appearance:none;width:38px;height:5px;margin:0;
  border-radius:999px;border:1px solid var(--linea);
  background:linear-gradient(90deg,hsl(80 19% 94%),hsl(80 19% 7%))}
.tono input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--senape);border:2px solid var(--superficie);cursor:pointer}
.tono input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
  background:var(--senape);border:2px solid var(--superficie);cursor:pointer}
.tono input[type=range]:focus-visible{outline:2px solid var(--verde);outline-offset:3px}

/* pannelli a tutto schermo: cucina, spesa, fine ricetta */
.velo{position:fixed!important;inset:0!important;z-index:60!important;background:var(--carta);overflow-y:auto;
  padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.velo-in{max-width:620px;margin:0 auto}
.velo-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.velo-top h2{flex:1;font-size:1.3rem}
.perche .velo-top h2{font-size:1.75rem;line-height:1.2}
.perche .sez{font-size:1.22rem;font-weight:800;line-height:1.3;margin:24px 0 6px;color:var(--verde)}
.perche .sez strong{font-weight:800}
.perche p{font-size:1rem;line-height:1.55}
.chiudi{flex:none;background:var(--superficie);border:1px solid var(--linea);border-radius:10px;
  padding:7px 12px;cursor:pointer;font-size:.88rem;color:inherit}
.passo-n{font-size:.76rem;color:var(--inchiostro-soft);letter-spacing:.03em;margin-top:14px}
.passo-g{font-size:1.3rem;line-height:1.5;margin:8px 0 18px;max-width:34ch}
.timer{display:flex;align-items:center;gap:12px;margin:16px 0;padding:12px 14px;
  border:1px solid var(--linea);border-radius:12px;background:var(--superficie)}
.timer b{flex:1;font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700}
.timer.suona{border-color:var(--verde);background:var(--verde-chiaro);color:var(--verde)}
.dosi{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--inchiostro-soft);margin:0 0 10px}
.dosi button{width:30px;height:30px;border-radius:8px;border:1px solid var(--linea);
  background:var(--carta);color:inherit;font-size:1.1rem;line-height:1;cursor:pointer}
.dosi b{color:var(--inchiostro);font-variant-numeric:tabular-nums;min-width:1.2em;text-align:center}
.azioni{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.spesa-l{list-style:none;margin:10px 0 0;padding:0}
.spesa-l li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--linea)}
.spesa-l li:last-child{border-bottom:0}
.spesa-l span{flex:1}
.spesa-l li.presa span{text-decoration:line-through;color:var(--inchiostro-soft)}
.spesa-l input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--verde)}
.riga-add{display:flex;gap:8px;margin-top:12px}
.riga-add input{flex:1}
.tag.fatta{background:var(--superficie2);color:var(--inchiostro-soft);font-weight:700}
.tag.pref{background:color-mix(in srgb,var(--senape) 16%,transparent);color:var(--senape);font-weight:700}

/* radio */
.radio-btn{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:26;
  width:48px;height:48px;border-radius:50%;border:1px solid var(--linea);background:var(--superficie);
  color:var(--verde);font-size:1.5rem;line-height:1;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.18)}
.radio-btn.suona{background:var(--verde);color:var(--carta);border-color:var(--verde)}
.radio-pan{position:fixed;right:16px;bottom:calc(146px + env(safe-area-inset-bottom));z-index:27;
  width:min(250px,calc(100vw - 32px));background:var(--superficie);border:1px solid var(--linea);
  border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden}
.radio-pan .sez{padding:9px 14px 5px;font-size:.72rem;color:var(--inchiostro-soft)}
.radio-pan .chips{display:flex;flex-wrap:wrap;gap:7px;padding:6px 12px 10px}
.radio-pan .chips button{flex:none;border:0;border-radius:999px;padding:8px 14px;font-size:.87rem;
  font-weight:700;color:#fff;cursor:pointer}
.radio-pan .chips button.on{outline:3px solid rgba(255,255,255,.85);outline-offset:-5px}
.radio-pan .rc0{background:#B83729}.radio-pan .rc1{background:#1768A9}.radio-pan .rc2{background:#865D00}
.radio-pan .rc3{background:#6D3FA0}.radio-pan .rc4{background:#157159}.radio-pan .rc5{background:#A74915}
.radio-pan .rc6{background:#8B3A52}
:root[data-scuro] .radio-pan .rc0{background:#B33C2D}:root[data-scuro] .radio-pan .rc1{background:#1C69A2}
:root[data-scuro] .radio-pan .rc2{background:#805E09}:root[data-scuro] .radio-pan .rc3{background:#7E50B5}
:root[data-scuro] .radio-pan .rc4{background:#16725B}:root[data-scuro] .radio-pan .rc5{background:#A14D1D}
:root[data-scuro] .radio-pan .rc6{background:#9E4A62}
.radio-pan button.spegni{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mattone);
  padding:11px 14px;border-top:1px solid var(--linea);font-size:.93rem;font-weight:700;cursor:pointer}
.radio-pan .stato{padding:10px 14px;font-size:.78rem;color:var(--inchiostro-soft);
  border-bottom:1px solid var(--linea)}

/* schermata d'apertura */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;gap:16px;
  background:linear-gradient(180deg,#2E5B43,#1C3A2B);transition:opacity .45s ease}
#splash.via{opacity:0;pointer-events:none}
#splash svg{width:min(44vw,180px);height:auto}
#splash .nome{font-family:Newsreader,Georgia,serif;font-size:clamp(1.7rem,7.5vw,2.4rem);
  font-weight:600;letter-spacing:-.01em;line-height:1.1;text-align:center;color:#F0DFB8;
  opacity:0;animation:sp-nome .5s ease .75s forwards}
#splash .pentola{opacity:0;animation:sp-pentola .5s ease .1s forwards}
#splash .vapore{stroke-dasharray:300;stroke-dashoffset:300;
  animation:sp-vapore .95s cubic-bezier(.4,0,.2,1) .35s forwards}
#splash .punto{opacity:0;transform-box:fill-box;transform-origin:center;animation:sp-punto .3s ease 1.15s forwards}
@keyframes sp-pentola{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-vapore{to{stroke-dashoffset:0}}
@keyframes sp-punto{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes sp-nome{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none !important;opacity:1 !important;stroke-dashoffset:0 !important}
}
html,body{margin:0;padding:0}
body{background:var(--carta);color:var(--inchiostro);
  font-family:Karla,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
h2{font-size:1.45rem;letter-spacing:-.01em}
h3{font-size:1.08rem}
p{margin:.5em 0}
button{font:inherit;color:inherit}
a{color:var(--verde)}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 136px}

header.top{position:sticky;top:0;z-index:30;background:var(--carta);border-bottom:1px solid var(--linea);padding:10px 16px 8px}
.top-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.marchio{font-family:Newsreader,serif;font-size:1.25rem;font-weight:600;letter-spacing:-.015em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marchio span{color:var(--verde)}
.menu-btn{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.88rem;font-weight:500}
.menu-pan{position:absolute;right:16px;top:52px;z-index:40;width:min(300px,calc(100vw - 32px));
  background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.16);
  overflow-y:auto;max-height:calc(100vh - 72px);padding:10px}
.menu-box{border-radius:12px;padding:9px 10px 8px;margin:0 0 8px}
.menu-box:last-child{margin-bottom:0}
.menu-box .sez{padding:2px 2px 7px;font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:0;color:inherit;opacity:1}
.menu-box button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.16);color:inherit;
  border:0;border-radius:8px;border-bottom:0;padding:11px 11px;margin:0 0 6px;font-size:.98rem;font-weight:700;cursor:pointer}
.menu-box button:last-child{margin-bottom:0}
.menu-box button:hover{background:rgba(255,255,255,.27)}
.menu-box button[disabled]{opacity:.5;cursor:default}
.menu-box button.rischio{color:#fff;font-weight:700}
.menu-box.mb-teal{background:#157159;color:#fff}
.menu-box.mb-blu{background:#1768A9;color:#fff}
.menu-box.mb-oro{background:#8F5200;color:#fff}  /* ambra scuro: testo bianco leggibile */
.menu-box.mb-oro button{background:rgba(255,255,255,.12)}
.menu-box.mb-oro button:hover{background:rgba(255,255,255,.2)}
.menu-box.mb-bordeaux{background:#8B3A52;color:#fff}
.menu-box.mb-senape{background:#6D3FA0;color:#fff}
:root[data-scuro] .menu-box.mb-teal{background:#16725B}
:root[data-scuro] .menu-box.mb-blu{background:#1C69A2}
:root[data-scuro] .menu-box.mb-oro{background:#8F5200}
:root[data-scuro] .menu-box.mb-bordeaux{background:#9E4A62}
:root[data-scuro] .menu-box.mb-senape{background:#7E50B5}

.rail{display:flex;gap:4px;max-width:620px;margin:8px auto 0}
.rail div{flex:1;text-align:center;font-size:.66rem;color:var(--inchiostro-soft);line-height:1.25;cursor:pointer}
.rail i{display:block;height:3px;border-radius:2px;background:var(--linea);margin-bottom:5px}
.rail div.fatto i{background:var(--verde);opacity:.45}
.rail div.ora i{background:var(--verde)}
.rail div.ora{color:var(--verde);font-weight:700}

.card{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--ombra)}
.intro{margin:18px 0 6px}
.intro p{color:var(--inchiostro-soft);font-size:.95rem;max-width:54ch}
label.campo{display:block;margin:12px 0 0}
label.campo > span{display:block;font-size:.83rem;color:var(--inchiostro-soft);margin-bottom:5px}
input[type=text],select{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--carta);color:var(--inchiostro);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--verde);outline-offset:1px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--carta);color:var(--inchiostro);border:1px solid var(--linea);border-radius:999px;padding:7px 13px;font-size:.87rem;cursor:pointer;user-select:none}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:700}
.chip.on::before{content:"\2713 ";font-weight:700}
.pcella[class*="c-"] .chip.on{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.chip.rossa.on{background:var(--mattone);border-color:var(--mattone);color:#fff}
.pcella[class*="c-"] .chip.rossa.on{box-shadow:0 0 0 2px rgba(255,255,255,.85)}

.tile{display:block;width:100%;text-align:left;background:var(--superficie2);border:2px solid transparent;
  border-left:4px solid var(--linea);border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}
.tile.on{border-color:var(--verde);border-left-color:var(--verde);background:var(--verde-chiaro)}
.tile b{display:block;font-size:1.02rem;margin-bottom:2px}
.tile small{color:var(--inchiostro-soft);font-size:.85rem;line-height:1.35;display:block}

.riga{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.riga:last-child{border-bottom:0}
.mini{font-size:.82rem;color:var(--inchiostro-soft)}
.btn{background:var(--verde);color:var(--carta);border:0;border-radius:11px;padding:13px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--inchiostro);border:1px solid var(--linea)}
.btn.small{padding:8px 12px;font-size:.87rem;font-weight:500;border-radius:9px}
.btn.btn-web{background:#0F6E78;color:#fff}   /* stesso peso del tasto accanto, nel colore del riquadro del link */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:var(--carta);
  border-top:1px solid var(--linea);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barra-in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.barra .btn{flex:1}
.barra .btn.ghost{flex:0 0 auto}

.gruppo{border:1px solid var(--linea);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--superficie)}
.gruppo > summary{padding:13px 14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}
.gruppo > summary::-webkit-details-marker{display:none}
.gruppo > summary em{font-style:normal;font-weight:400;color:var(--inchiostro-soft);font-size:.83rem}
.gruppo .corpo{padding:0 14px 14px}

.ric{border:1px solid var(--linea);border-radius:var(--r);background:var(--superficie);margin:12px 0;overflow:hidden}
.ric > summary{padding:14px;cursor:pointer;list-style:none}
.ric > summary::-webkit-details-marker{display:none}
.ric-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ric-nome{font-family:Newsreader,serif;font-size:1.18rem;font-weight:600;line-height:1.2}
.pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;white-space:nowrap}
.btn-nutri{background:none;border:none;padding:0 2px;cursor:pointer;font-size:1rem;line-height:1;vertical-align:middle}
.meta{font-size:.78rem;color:var(--inchiostro-soft);margin-top:3px}
.tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--superficie2);margin:6px 5px 0 0}
.tag.zona{background:var(--verde-chiaro);color:var(--verde);font-weight:700}
.tag.stag{background:color-mix(in srgb,var(--senape) 16%,transparent);color:var(--senape);font-weight:700}
.ing-stag{font-size:.82em;opacity:.9}
.ing-stag-no{opacity:.28;filter:grayscale(1)}
.fatt{height:6px;border-radius:3px;background:var(--superficie2);margin:10px 0 8px;overflow:hidden;display:flex}
.fatt i{display:block;height:100%}
.fatt i.pieno{background:var(--verde)}
.fatt i.sost{background:var(--senape)}
.v-alta .pct{color:var(--verde)}
.v-media .pct{color:var(--senape)}
.v-bassa .pct{color:var(--mattone)}
.manca{font-size:.87rem}
.manca b{color:var(--mattone);font-weight:700}
.ric .dett{padding:14px;border-top:1px solid var(--linea)}
.ing-l{list-style:none;margin:0;padding:0}
.ing-l li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--linea);font-size:.92rem}
.ing-l li:last-child{border-bottom:0}
.ing-l li.no{color:var(--mattone)}
.ing-l li.sub{color:var(--senape)}
.ing-l li em{font-style:normal;color:var(--inchiostro-soft);font-size:.82rem;white-space:nowrap}
.passi{margin:14px 0 0;padding-left:1.15em}
.passi li{margin-bottom:8px;font-size:.93rem}
.nota{border-left:3px solid var(--senape);background:color-mix(in srgb,var(--senape) 9%,transparent);
  padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem;margin:12px 0 0}
.avviso{border-left:3px solid var(--mattone);background:color-mix(in srgb,var(--mattone) 9%,transparent);
  padding:9px 12px;border-radius:0 8px 8px 0;font-size:.86rem;margin:10px 0 0}
.bevanda{border-left:3px solid var(--verde);background:color-mix(in srgb,var(--verde) 8%,transparent);
  padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem;margin:12px 0 0}
.bevanda .cerca-web{margin-top:8px}
.attrezzi{border-left:3px solid var(--senape);background:color-mix(in srgb,var(--senape) 8%,transparent);
  padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem;margin:12px 0 0}
.attrezzi-l{list-style:none;margin:8px 0 0;padding:0}
.attrezzi-l li{margin:0 0 8px}
.attrezzi-l li:last-child{margin-bottom:0}
.attrezzi-l li b{display:block}
.attrezzi-l li .mini{display:block;margin-top:1px}
.vuoto{text-align:center;padding:34px 12px;color:var(--inchiostro-soft)}
.riep{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.riep span{font-size:.75rem;background:var(--superficie2);border-radius:999px;padding:4px 10px}
hr.sep{border:0;border-top:1px solid var(--linea);margin:20px 0}
.cerca-web{display:inline-block;margin-top:10px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.fatt i{transition:width .4s ease}}

/* casella "Ho in mente un piatto": ben visibile, nel colore della sua card */
.idea-box{background:#6D3FA0;color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:0 0 0 3px #FFD45C, 0 6px 22px rgba(109,63,160,.45);animation:ideaLuce 2.4s ease-in-out infinite}
.idea-box b{display:block;font-size:1.05rem;margin-bottom:8px}
.idea-riga{display:flex;gap:8px;align-items:stretch}
.idea-riga input{flex:1;min-width:0;font-size:1.15rem;padding:13px 12px;border-radius:11px;border:3px solid #FFD45C;

const EN_INV = {};
const _normEn = x => String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
for(const k in EN){ const v = _normEn(EN[k]); if(v && !(v in EN_INV)) EN_INV[v] = k; }

function chiaveDaInglese(nome){
  const n = _normEn(nome);
  if(EN_ALIAS[n]) return EN_ALIAS[n];
  if(EN_INV[n]) return EN_INV[n];
  /* plurale/singolare inglese semplice */
  const alt = n.endsWith("es") ? [n.slice(0,-2), n.slice(0,-1)] : n.endsWith("s") ? [n.slice(0,-1)] : [n + "s", n + "es"];
  for(const a of alt) if(EN_INV[a]) return EN_INV[a];
  return "";
}

const _cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const _low = s => s.charAt(0).toLowerCase() + s.slice(1);

/* unita' di misura nelle quantita' */
const EN_UNITA = {
  "gr":"g","g":"g","kg":"kg","ml":"ml","cl":"cl","l":"l",
  "cucchiaio":"tbsp","cucchiai":"tbsp","cucchiaino":"tsp","cucchiaini":"tsp",

  "filetto":"fillet","filetti":"fillets","rotolo":"sheet","rotoli":"sheets",
  "bacca":"pod","bacche":"berries","mazzetto":"bunch","mazzo":"bunch",
  "pagnotta":"loaf","pezzo":"piece","stecca":"stick","testa":"head","teste":"heads",
  "cespo":"head","cespi":"heads","bustina":"sachet","bustine":"sachets",
  "foglio":"sheet","fogli":"sheets","tuorlo":"yolk","tuorli":"yolks",
  "panino":"roll","panini":"rolls","arance":"oranges","medie":"medium","maturi":"ripe",
  "bottiglia piccola":"small bottle","bottiglia":"bottle","noce":"knob","scatola":"tin","barattolo":"jar","vasetto":"pot"
};
function trQuantita(q){
  const t = String(q).trim();
  if(EN[t]) return EN[t];
  const m = t.match(/^(\d+\s*\/\s*\d+|\d*½|\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(!m) return null;
  const num = m[1].replace(",", ".");
  let resto = m[2].trim(), virgola = "";
  const v = resto.match(/^(.*?)(,\s*.+)$/);
  if(v){ resto = v[1].trim(); virgola = v[2]; }
  if(!resto) return num + (virgola ? trVirgola(virgola) : "");
  const u = resto.toLowerCase();
  let unit = EN_UNITA[u];
  if(!unit){
    const p = u.split(" ");
    if(EN_UNITA[p[0]]){ unit = EN_UNITA[p[0]] + " " + (trSemplice(p.slice(1).join(" ")) || p.slice(1).join(" ")); }
    else unit = trSemplice(resto);
  }
  if(!unit) return null;   /* "14/10/2026", "3 settimane"...: non e' una quantita' che conosco */
  if(num === "1") unit = unit.replace(/^(\S+)/, w=>({cloves:"clove",leaves:"leaf",sheets:"sheet",berries:"berry",sprigs:"sprig",stalks:"stalk",
    fillets:"fillet",slices:"slice",heads:"head",bunches:"bunch",rolls:"roll",yolks:"yolk",glasses:"glass",cups:"cup",pinches:"pinch",sachets:"sachet",handfuls:"handful"}[w] || w));
  return num + " " + unit + (virgola ? trVirgola(virgola) : "");
}
function trVirgola(v){
  const s = v.replace(/^,\s*/, "");
  const x = {"a fette sottili":"thinly sliced"}[s];
  return ", " + (x || trSemplice(s) || s);
}

/* traduzione esatta (con le varianti maiuscola/minuscola) */
function trSemplice(s){
  if(!s) return null;
  if(EN[s] !== undefined) return EN[s];
  const c = _cap(s), l = _low(s);
  if(s !== c && EN[c] !== undefined) return _low(EN[c]);
  if(s !== l && EN[l] !== undefined) return _cap(EN[l]);
  return null;
}
/* traduce, o lascia com'e' (per i pezzi dentro le frasi composte) */
const trOCopia = s => trTesto(s) ?? s;
/* elenchi "a, b, c": tradotti solo se ogni voce e' conosciuta */
function trElenco(s, sep){
  const parti = s.split(sep).map(p=>p.trim());
  if(parti.length < 2) return null;
  /* solo elenchi di voci brevi (nomi), non frasi con virgole */
  if(parti.some(p=>p.length > 45 || p.split(" ").length > 6)) return null;
  const t = parti.map(p=>trSemplice(p) ?? trQuantita(p));
  const note = t.filter(x=>x != null).length;
  if(note * 2 < parti.length) return null;
  return t.map((x,i)=>x ?? parti[i]).join(sep);
}

    if(t == null){ const pu = dx.match(/^puoi usare (.+)$/); if(pu) t = "you can use " + trOCopia(pu[1]); }
    if(t == null) t = trQuantita(dx);
    if(t == null) return null;
    const sx = m[1].trim();
    return (sx ? (trSemplice(sx) ?? sx) + " " : "") + "— " + t;
  }]
];
function trMotivo(x){
  const t = trSemplice(x); if(t) return t;
  let m = x.match(/^contiene (.+), da escludere per qualcuno a tavola$/);
  if(m) return `it contains ${trOCopia(m[1])}, which someone at the table must avoid`;
  m = x.match(/^contiene (.+), che non ti piace$/);
  if(m) return `it contains ${trOCopia(m[1])}, which you don't like`;
  m = x.match(/^non è (.+)$/);
  if(m) return `it isn't ${trOCopia(m[1])}`;
  return x;
}

/* traduzione di un testo intero: esatta, poi schemi, poi pezzi separati da " · " e da ", " */
const _cacheTr = new Map();
function trTesto(s){
  if(s == null) return null;
  const t = String(s).replace(/\s+/g, " ").trim();
  if(!t || !/[A-Za-zÀ-ú]/.test(t)) return null;
  if(_cacheTr.has(t)) return _cacheTr.get(t);
  let r = trSemplice(t);
  if(r == null){
    for(const [re, f] of EN_SCHEMI){ const m = t.match(re); if(m){ r = f(m); if(r != null) break; } }
  }
  if(r == null && t.includes(" · ")){
    const parti = t.split(" · ");
    const tr = parti.map(p=>p === "" ? "" : (trTesto(p) ?? p));
    if(tr.some((x,i)=>x !== parti[i])) r = tr.join(" · ");
  }
  if(r == null && / ·$/.test(t)){ const x = trTesto(t.replace(/ ·$/, "")); if(x != null) r = x + " ·"; }
  if(r == null && /^[\d½]/.test(t)) r = trQuantita(t);
  if(r == null && t.includes(", ")) r = trElenco(t, ", ");
  if(r == null) r = trQuantita(t);
  /* "🇪🇸 Spagnolo": simboli davanti, parola conosciuta dopo */
  if(r == null){ const m = t.match(/^([^A-Za-zÀ-ú\d]+)\s(.+)$/); if(m){ const x = trSemplice(m[2]); if(x != null) r = m[1] + " " + x; } }
  _cacheTr.set(t, r);
  return r;
}

/* il traduttore a schermo */
const EN_ATTR = ["placeholder", "title", "aria-label"];
function _saltare(el){
  return !el || el.closest("script,style,textarea,[data-no-tr]") || el.isContentEditable;
}
function traduciNodoTesto(n){
  const v = n.nodeValue;
  if(!v || !/[A-Za-zÀ-ú]/.test(v)) return;
  if(_saltare(n.parentElement)) return;
  const r = trTesto(v);
  if(r == null || r === v.trim()) return;
  const pre = v.match(/^\s*/)[0], post = v.match(/\s*$/)[0];
  /* <option> senza value: il value resta l'originale italiano, che il codice legge */
  const p = n.parentElement;
  if(p && p.tagName === "OPTION" && !p.hasAttribute("value")) p.setAttribute("value", p.textContent);
  n.nodeValue = pre + r + post;
}
function traduciElemento(el){
  if(!el || !el.closest || el.closest("script,style,[data-no-tr]")) return;
  EN_ATTR.forEach(a=>{
    const v = el.getAttribute && el.getAttribute(a);
    if(v){ const r = trTesto(v); if(r != null && r !== v) el.setAttribute(a, r); }
  });
  /* i suggerimenti della ricerca in dispensa: valori in inglese */
  if(el.tagName === "OPTION" && el.parentElement && el.parentElement.tagName === "DATALIST"){
    const v = el.getAttribute("value"); const r = v && trSemplice(v);
    if(r){ el.setAttribute("data-it", v); el.setAttribute("value", r); }
  }
}
function traduciSotto(root){
  if(!root) return;
  if(root.nodeType === 3){ traduciNodoTesto(root); return; }
  if(root.nodeType !== 1) return;
  traduciElemento(root);
  root.querySelectorAll("*").forEach(traduciElemento);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())) traduciNodoTesto(n);
}
if(IN_INGLESE){
  const avvia = ()=>{
    traduciSotto(document.body);
    new MutationObserver(lista=>{
      for(const m of lista){
        if(m.type === "characterData") traduciNodoTesto(m.target);
        else if(m.type === "attributes") traduciElemento(m.target);
        else m.addedNodes.forEach(traduciSotto);
      }
    }).observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:EN_ATTR});
  };
  document.body ? avvia() : document.addEventListener("DOMContentLoaded", avvia);
  const _alert = window.alert.bind(window), _confirm = window.confirm.bind(window);
  window.alert = m => _alert(trTesto(m) ?? m);
  window.confirm = m => _confirm(trTesto(m) ?? m);
  document.title = "What\u2019s cooking?";
  /* il nome dell'app in inglese: logo, schermata d'avvio, titoli */
  const nomeEn = ()=>{
    const m = document.getElementById("logoHome"); if(m) m.innerHTML = "What\u2019s cooking<span>?</span>";

    const ap = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(ap) ap.content = "What\u2019s cooking?";
  };
  document.body ? nomeEn() : document.addEventListener("DOMContentLoaded", nomeEn);
}

/* criteri di ordinamento disponibili per l'elenco ricette: val() legge il valore su cui ordinare, def e' il verso naturale */
const CRITERI_ORDINE = [
  {key:"fattibilita",  label:"Fattibilità",   val:o=>o.pct,                                          def:"desc"},
  {key:"calorie",      label:"Calorie",       val:o=>{ if(o.r._kcal==null) o.r._kcal=calorieRicetta(o.r); return o.r._kcal||0; }, def:"asc"},

  {key:"leggerezza",   label:"Leggerezza",    val:o=>o.r.leggero?1:0,                                def:"desc"},
  {key:"ingredienti",  label:"N. ingredienti",val:o=>o.r.ing.length,                                 def:"asc"},
  {key:"mancanti",     label:"Ingredienti mancanti", val:o=>o.mancanti.length,                       def:"asc"},
  {key:"posseduti",    label:"Ingredienti che hai",  val:o=>o.r.ing.length-o.mancanti.length-o.sostituibili.length, def:"desc"},
  {key:"nonfatta",     label:"Da più tempo non fatta", val:o=>S.cucinate[o.r.id]||0,                 def:"asc"},
  {key:"regione",      label:"Della tua regione",    val:o=>o.zona?1:0,                                 def:"desc"},
  {key:"alfabetico",   label:"Alfabetico",           cmp:(a,b)=>nomeR(a.r).localeCompare(nomeR(b.r),L("it","en")),       def:"asc"},
  /* nutrienti: valore per 100 g di piatto pronto, lo stesso mostrato dal tasto \u{1F4CA} */
  {key:"n_p",     label:"Proteine",     nutri:"p",     val:o=>nutriDi(o.r).p,     def:"desc"},
  {key:"n_g",     label:"Grassi",       nutri:"g",     val:o=>nutriDi(o.r).g,     def:"asc"},
  {key:"n_c",     label:"Carboidrati",  nutri:"c",     val:o=>nutriDi(o.r).c,     def:"asc"},
  {key:"n_fibra", label:"Fibre",        nutri:"fibra", val:o=>nutriDi(o.r).fibra, def:"desc"},
  {key:"n_sale",  label:"Sale",         nutri:"sale",  val:o=>nutriDi(o.r).sale,  def:"asc"},
  {key:"n_pporz", label:"Proteine/porzione", nutri:"pporz", val:o=>{ const n=nutriDi(o.r); return n.p*n.peso/100/porzioniDi(o.r); }, def:"desc"},
  {key:"n_dens",  label:"Densità proteica",  nutri:"dens",  val:o=>{ const n=nutriDi(o.r); return n.kcal ? n.p/n.kcal : 0; },               def:"desc"},
];
function nutriDi(r){ if(!r._nutri) r._nutri = valoriNutrizionali100g(r); return r._nutri; }
function criterioAttivo(){ return CRITERI_ORDINE.find(c=>c.key===ordinaPer) || CRITERI_ORDINE[0]; }
/* ordina un elenco gia' filtrato secondo ordinaPer/ordinaDir; le "cucinate di recente" restano sempre in fondo,
   e la vecchia catena di spareggio (fattibilita', stagionalita', zona, tempo) resta come ripiego a parita' di valore */
function ordinaLista(out){
  const c = criterioAttivo();
  const dir = ordinaDir || c.def;
  const segno = dir === "asc" ? 1 : -1;
  out.sort((a,b)=> (a.fatta?1:0)-(b.fatta?1:0)
                 || segno*(c.cmp ? c.cmp(a,b) : c.val(a)-c.val(b))
                 || b.pct-a.pct || (b.stag.in-a.stag.in) || (b.zona?1:0)-(a.zona?1:0)
                 || a.r.tempo-b.r.tempo);
  return out;
}

function tavolata(){
  const p = S.profilo;
  return [{nome:p.nome||"Io", stile:p.stile, allergeni:p.allergeni, io:true}].concat(sess.ospiti);
}
function allergeniTavolo(){
  const s = new Set(); tavolata().forEach(c=>c.allergeni.forEach(a=>s.add(a))); return [...s];
}
function stilePiuStretto(){
  return tavolata().reduce((m,c)=> RANGO[c.stile] > RANGO[m] ? c.stile : m, "onnivoro");
}
let _radDisp = {chiave:null, set:null};
function radiciDispensa(){
  const chiave = S.dispensa.join("|");
  if(_radDisp.chiave !== chiave) _radDisp = {chiave, set: new Set(S.dispensa.map(radiceIng))};
  return _radDisp.set;
}
function possiedo(k){
  if(S.dispensa.includes(k)) return true;
  if((EQUIV[k]||[]).some(x=>S.dispensa.includes(x))) return true;
  /* stesso ingrediente scritto al singolare o al plurale */
  const r = radiciDispensa();
  return r.has(radiceIng(k)) || (EQUIV[k]||[]).some(x=>r.has(radiceIng(x)));
}
function sostituto(k){
  return (D.sost_k[k]||[]).find(alt=>possiedo(alt)) || null;
}
function valuta(r){
  const mancanti = [], sostituibili = [];
  r.ing.forEach(i=>{
    if(possiedo(i.k)) return;
    const alt = sostituto(i.k);
    alt ? sostituibili.push([i.k, alt]) : mancanti.push(i.n);
  });
  const n = r.ing.length;
  const ho = n - mancanti.length - sostituibili.length;
  return {mancanti, sostituibili,
          pieno: Math.round(ho/n*100),
          sost: Math.round(sostituibili.length/n*100),
          pct: Math.round((ho + sostituibili.length*0.6)/n*100)};
}
function diStagione(r){
  const st = r.ing.map(i=>D.stagioni[i.k]).filter(Boolean);
  return {tot: st.length, in: st.filter(m=>m.includes(meseStagione())).length};
}
function chiEsclude(r){
  return tavolata().filter(c=> RANGO[r.stile] < RANGO[c.stile] || c.allergeni.some(a=>r.all.includes(a)));
}
/* ricerca: senza accenti, su nome, ingredienti, regione e tag */
function testoRicetta(r){
  if(!r._txt) r._txt = normTesto(r.n + " " + r.ing.map(i=>i.n + " " + i.k).join(" ")
                                 + " " + (r.luogo||"") + " " + (r.tags||[]).join(" ")
                                 + (IN_INGLESE ? " " + [r.n_en||"", ...r.ing.map(i=>nomeIng(i.n) + " " + nomeIng(i.k)), nomeIng(r.luogo||""), ...(r.tags||[]).map(nomeIng)].join(" ") : ""));
  return r._txt;
}
function nomeRicetta(r){
  if(!r._n) r._n = normTesto(r.n + (IN_INGLESE && r.n_en ? " " + r.n_en : ""));
  return r._n;
}
/* Ricerca tollerante: una parola cercata trova una parola del testo se ne e' l'inizio
   ("melanz" -> melanzane, ma "pita" non trova piu' "spanakopita"), oppure se le somiglia
   abbastanza da essere un errore di battitura: doppie e scempie si equivalgono
   ("caciucco" = "cacciucco") e da 5 lettere si perdona una lettera sbagliata. */
const scempia = x => x.replace(/([a-z])\1+/g, "$1");
function distanza(a, b){
  if(Math.abs(a.length - b.length) > 2) return 9;
  let prec = Array.from({length: b.length + 1}, (_, j)=>j);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prec[j] + 1, cur[j-1] + 1, prec[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prec = cur;
  }
  return prec[b.length];
}
let ricercaTollerante = false;   /* si accende solo se la ricerca esatta non trova niente */
function parolaTrova(w, testo){
  const parole = testo.split(" ");
  if(parole.some(p=>p.startsWith(w))) return true;
  if(!ricercaTollerante || w.length < 5) return false;
  const ws = scempia(w), tolleranza = ws.length >= 8 ? 2 : 1;
  return parole.some(p=>{
    const ps = scempia(p);
    return ps.startsWith(ws) || distanza(ws, ps) <= tolleranza
        || (ps.length > ws.length && distanza(ws, ps.slice(0, ws.length)) <= 1);
  });
}
const tutteTrovate = (parole, testo) => parole.every(w=>parolaTrova(w, testo));
/* ricette il cui nome combacia ma che i filtri del tavolo tengono fuori, con il motivo */
function paroleEvita(){
  const parole = (S.profilo.evita||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);
  return parole.map(v=>{ const k = IN_INGLESE ? chiaveDaInglese(v) : ""; return k || v; });
}
function esclusePerNome(){
  if(sess.modo !== "idea" || !sess.cerca.trim()) return [];
  const parole = normTesto(sess.cerca).split(" ").filter(Boolean);
  const evita = paroleEvita();
  const alg = allergeniTavolo();
  const out = [];
  archivio().forEach(r=>{
    if(!tutteTrovate(parole, nomeRicetta(r))) return;
    const m = [];
    if(S.nascoste.includes(r.id)) m.push("l'avevi nascosta (la rimetti da Strumenti \u2192 Ricette nascoste)");
    if(soloPref && !S.preferite.includes(r.id)) m.push("stai guardando solo le preferite");
    const a = alg.filter(x=>r.all.includes(x));
    if(a.length) m.push("contiene " + a.join(", ") + ", da escludere per qualcuno a tavola");
    const e = evita.filter(v=>r.ing.some(i=>i.k.includes(v)));
    if(e.length) m.push("contiene " + e.join(", ") + ", che non ti piace");
    if(sess.accordo === "unico" && RANGO[r.stile] < RANGO[sess.stile]) m.push("non \u00e8 " + sess.stile);
    if(m.length) out.push({r, motivo: m.join("; ")});
  });
  return out;
}

/* per i Menu a tema: stile scelto (vegetariano/vegano), allergie a tavola, ingredienti da evitare, ricette nascoste */
function adattaAlTavolo(r){
  if((S.nascoste||[]).includes(r.id)) return false;
  if(RANGO[r.stile] < RANGO[sess.stile]) return false;
  const alg = allergeniTavolo(); if(alg.some(a=>r.all.includes(a))) return false;
  const evita = paroleEvita(); if(evita.some(v=>r.ing.some(i=>i.k.includes(v)))) return false;
  return true;
}
function notaStileTema(){
  const p = [];
  if(sess.stile && sess.stile !== "onnivoro") p.push(L(sess.stile, sess.stile === "vegano" ? "vegan" : "vegetarian"));
  if(allergeniTavolo().length) p.push(L("allergie a tavola","table allergies"));
  if(paroleEvita().length) p.push(L("ingredienti che non ti piacciono","ingredients you dislike"));
  return p.length ? `<p class="mini" style="margin-top:-2px">\u2705 ${L("Rispetto: ","Respecting: ")}${p.join(", ")}.</p>` : "";
}
/* come valuta(), ma con tutti i campi che scheda() si aspetta (usata fuori da filtra(), es. nel Menu a tema) */
function valutaCompleta(r){
  const v = valuta(r);
  v.r = r;
  v.zona = S.profilo.regione && r.luogo === S.profilo.regione;
  v.stag = diStagione(r);
  v.pref = S.preferite.includes(r.id);
  const q = S.cucinate[r.id];
  v.fatta = q ? (Date.now() - q) < GIORNI_RIPOSO*86400000 : false;
  return v;
}
function filtra(){
  ricercaTollerante = false;
  let out = filtraUnaVolta();
  if(!out.length && sess.modo === "idea" && sess.cerca.trim() && !esclusePerNome().length){
    ricercaTollerante = true;
    out = filtraUnaVolta();
    if(!out.length && !esclusePerNome().length) ricercaTollerante = false;
  }
  return out;
}
function filtraUnaVolta(){
  const evita = paroleEvita();
  const alg = allergeniTavolo();
  const lim = +sess.tempo;

  const parole = sess.modo === "idea" ? normTesto(sess.cerca).split(" ").filter(Boolean) : [];

  let out = archivio().filter(r=>{
    if(S.nascoste.includes(r.id)) return false;
    if(soloPref && !S.preferite.includes(r.id)) return false;
    if(alg.some(a=>r.all.includes(a))) return false;
    if(evita.some(v=>r.ing.some(i=>i.k.includes(v)))) return false;
    if(sess.accordo === "unico" && RANGO[r.stile] < RANGO[sess.stile]) return false;

    /* se hai scritto il nome del piatto, tempo e portata non te lo nascondono */
    let perNome = false;
    if(parole.length){
      if(!tutteTrovate(parole, testoRicetta(r))) return false;
      perNome = tutteTrovate(parole, nomeRicetta(r));
    }
    if(!perNome){
      if(sess.portate.length && !sess.portate.includes(r.cat)) return false;
      if(sess.unico && !r.unico) return false;
      if(r.tempo > lim) return false;
    }
    if(sess.modo === "recupero" && sess.recupero.length){
      if(!sess.recupero.some(k=>r.ing.some(i=>i.k===k || (EQUIV[i.k]||[]).includes(k)))) return false;
    }
    return true;
  }).map(r=>{
    const v = valuta(r);
    v.r = r;
    v.zona = S.profilo.regione && r.luogo === S.profilo.regione;
    v.stag = diStagione(r);
    v.pref = S.preferite.includes(r.id);
    const q = S.cucinate[r.id];
    v.fatta = q ? (Date.now() - q) < GIORNI_RIPOSO*86400000 : false;
    if(sess.modo === "recupero") v.usa = sess.recupero.filter(k=>r.ing.some(i=>i.k===k || (EQUIV[i.k]||[]).includes(k)));
    return v;
  });

  /* quelle cucinate da poco scendono in fondo: e' cosi che l'archivio non si riduce a otto piatti */
  ordinaLista(out);
  return out;
}

/* saluto vocale femminile nella pagina Conosciamoci */
let ultimoSaluto = "";
function salutoVocale(nome){
  if(!nome || !("speechSynthesis" in window)) return;
  if(ultimoSaluto === nome) return;
  ultimoSaluto = nome;
  try{
    const dire = ()=>{
      const voci = speechSynthesis.getVoices();
      const lg = IN_INGLESE ? /^en/i : /^it/i;
      const voceF = voci.find(v=>lg.test(v.lang) && /female|donna|femmin|alice|elsa|paola|samantha|karen|serena|victoria|zira|susan|kate/i.test(v.name))
                 || voci.find(v=>lg.test(v.lang));
      const u = new SpeechSynthesisUtterance(L("Ciao ", "Hi ") + nome);
      u.lang = L("it-IT", "en-GB");
      if(voceF) u.voice = voceF;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.getVoices().length) dire();
    else speechSynthesis.onvoiceschanged = dire;
  }catch(e){}
}

function statoCercaDisp(){
  const q = cercaDisp.trim().toLowerCase();
  const matchEsatto = q ? TUTTI_ING.find(i=>i.toLowerCase()===q || nomeIng(i).toLowerCase()===q) : null;
  const trovato = !!matchEsatto || (q && !BASE.has(q) && TUTTI_ING.some(i=>i.toLowerCase().includes(q) || (IN_INGLESE && nomeIng(i).toLowerCase().includes(q))))
    || (q && Object.values(CAT_DISP).flat().some(i=>radiceIng(i) === radiceIng(q)))
    || (q && IN_INGLESE && !!chiaveDaInglese(q));
  return {q, trovato};
}
function htmlRispostaDisp(){
  const {q, trovato} = statoCercaDisp();
  return `
      ${q && trovato ? `<p class="mini ing-esito-ok" id="ingEsitoOk">\u2713 C'è già in elenco, lo trovi qui sotto.</p>` : ""}

}
function htmlRepartiDisp(){
  const {q} = statoCercaDisp();
  const COLORE_REPARTO = {
    "Verdure e ortaggi":"cat-verdure", "Frutta":"cat-frutta", "Carne e salumi":"cat-carne", "Pesce":"cat-pesce",
    "Latticini e uova":"cat-latticini", "Dispensa":"cat-giallo", "Erbe e spezie":"cat-ocra", "Essiccati e disidratati":"cat-essiccati",
    "Surgelati e congelati":"cat-ghiaccio", "Scatolette e conserve":"cat-grigio"
  };
  return `${Object.entries(CAT_DISP).map(([tit,listaCompleta],idx)=>{
    const lista = listaCompleta;
    const qk = q && IN_INGLESE ? chiaveDaInglese(q) : "";
    const vis = lista.filter(i=>!q || i.toLowerCase().includes(q) || radiceIng(i) === radiceIng(q)
                               || (IN_INGLESE && (nomeIng(i).toLowerCase().includes(q) || i === qk)));
    if(!vis.length) return "";
    const presi = lista.filter(i=>S.dispensa.includes(i)).length;
    const chip = i=>{ const mesi = D.stagioni[i];
          const stag = mesi ? (mesi.includes(meseStagione())?` <span class="ing-stag" title="Di stagione ora">\u{1F5D3}\uFE0F</span>`:` <span class="ing-stag ing-stag-no" title="Non \u00e8 la sua stagione">\u{1F5D3}\uFE0F</span>`) : "";
          return `<button class="chip ${S.dispensa.includes(i)?"on":""}" data-i="${esc(i)}">${i}${stag}</button>`; };
    const sotto = sottoReparti(tit, vis);
    return `<details class="pcella full cat-gruppo ${COLORE_REPARTO[tit]||"cat-grigio"}" ${q||presi?"open":""}>
      <summary>${tit} <em>${presi?presi+" segnati":lista.length+" voci"}</em></summary>
      <div class="corpo">${sotto
        ? sotto.map(([nome, l])=>`<div class="sotto-rep">${nome}</div><div class="chips">${l.map(chip).join("")}</div>`).join("")
        : `<div class="chips">${vis.map(chip).join("")}</div>`}
      </div></details>`;
  }).join("")}`;
}

function collegaRispostaDisp(){
  const ingAddBtn = document.getElementById("ingAdd"), ingC = document.getElementById("ingCat");
  if(ingAddBtn){
    const g = indovinaCat(cercaDisp); if(g) ingC.value = g;
    ingAddBtn.onclick = ()=>{

      if(!nome) return;
      const k = aggiungiIngrediente(nome, ingC.value);
      if(k && !S.dispensa.includes(k)) S.dispensa.push(k);
      S.dispensaData = new Date().toLocaleDateString("it-IT");
      salva();
      cercaDisp = "";
      tappaDispensa();
    };

function collegaRepartiDisp(){
  /* tocco breve: segno o tolgo dalla dispensa. Tocco lungo: sposta o togli dall'elenco */
  app.querySelectorAll("[data-i]").forEach(b=>{
    let attesa = null, lungo = false;
    const ferma = ()=>{ clearTimeout(attesa); attesa = null; };
    const parti = ()=>{
      lungo = false;
      ferma();
      attesa = setTimeout(()=>{
        lungo = true;
        try{ navigator.vibrate && navigator.vibrate(30); }catch(err){}
        apriIngOpz(b.dataset.i);
      }, 500);
    };
    b.addEventListener("touchstart", parti, {passive:true});
    ["touchend","touchmove","touchcancel","mouseup","mouseleave"].forEach(ev=>b.addEventListener(ev, ferma));
    b.addEventListener("mousedown", parti);
    b.addEventListener("contextmenu", ev=>{ ev.preventDefault(); ferma(); apriIngOpz(b.dataset.i); });
    b.onclick = ()=>{
      if(lungo){ lungo = false; return; }
      const v=b.dataset.i, i=S.dispensa.indexOf(v);
      if(i<0){ S.dispensa.push(v); if(BASE.has(v)) S.spesa = S.spesa.filter(x=>x.k!==v); }
      else{ S.dispensa.splice(i,1); if(BASE.has(v)) metti(v, v, ""); }
      b.classList.toggle("on");
      S.dispensaData = new Date().toLocaleDateString("it-IT"); salva();
    };
  });

}

  /* la casella non viene mai ridisegnata mentre scrivi: cosi' il tasto Cancella tenuto
     premuto continua a cancellare (prima ogni lettera ricostruiva la pagina e lo fermava) */
  c.oninput = e=>{ cercaDisp = e.target.value; aggiornaCercaDisp(); };
  document.getElementById("svuotaCerca").onclick = ()=>{ cercaDisp = ""; c.value = ""; aggiornaCercaDisp(); c.focus(); };
  const mic = document.getElementById("micCerca");
  if(mic) mic.onclick = ()=> dettaIngrediente(mic, testo=>{ cercaDisp = testo; c.value = testo; aggiornaCercaDisp(); });
  collegaRispostaDisp();
  document.getElementById("logoHome").onclick = ()=>{ if(S.profilo.fatto) vai(5); };
  collegaRepartiDisp();

  pulsanti("Indietro", "La dispensa è a posto", ()=>vai(3), ()=>vai(1));
}

/* ===========================================================
   Menu a tema: un paese, dall'antipasto al dolce
   =========================================================== */
function apriMenuTema(paese, nome){
  const corsi = ["Antipasti","Primi","Secondi","Dolci"];
  const blocchi = corsi.map(cat=>{
    const candidate = D.ricette.filter(r=>r.estero && r.luogo===paese && r.cat===cat && adattaAlTavolo(r));
    if(!candidate.length){
      const sing = SING[cat] || cat.toLowerCase();
      const nomeEn = trTesto(nome) || nome, singEn = trTesto(sing) || sing;
      const q = encodeURIComponent(IN_INGLESE ? nomeEn + " " + singEn + " recipe" : sing + " " + nome.toLowerCase());
      return `<div class="pcella full c-crema" style="cursor:default">
        <b>${cat}</b>
        <p class="mini" style="margin-top:4px" data-no-tr>${L(`Non ho ancora un ${sing} ${nome.toLowerCase()} in archivio.`, `I don't have a ${nomeEn} ${singEn} in the archive yet.`)}</p>
        <a class="cerca-web" target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}" data-no-tr>${L(`Cerca un ${sing} ${nome.toLowerCase()} sul web`, `Search the web for a ${nomeEn} ${singEn}`)}</a>
      </div>`;
    }
    const migliore = candidate.map(valutaCompleta).sort((a,b)=>b.pct-a.pct)[0];
    return `<div class="ric-grid" style="margin-bottom:10px">${scheda(migliore)}</div>`;
  }).join("");
  apriVelo("tema", `
    <div class="velo-top"><h2>Menu ${esc(nome)}</h2>
      <button class="chiudi" data-tema="chiudi" onclick="chiudiVelo()">Chiudi</button></div>
    <p class="mini">La proposta pi\u00f9 fattibile per ciascun corso, in base a quello che hai in dispensa.</p>
    ${notaStileTema()}
    ${blocchi}
  `);
}
/* menu a tema non legati a un paese */
let MS = null;   /* stato del menu speciale aperto: tema, scelte per corso, alternative */
function candidatiSpeciale(t, cat){
  const ok = r => r.cat === cat && adattaAlTavolo(r);
  if(t.ids){
    const scelte = (t.ids[cat]||[]).map(trovaRicetta).filter(Boolean).filter(adattaAlTavolo);
    if(scelte.length || sess.stile === "onnivoro") return scelte.map(valutaCompleta);
    /* per vegetariani/vegani, se nessun classico della festa va bene, propongo altri piatti adatti */
    return D.ricette.filter(r=>ok(r) && !r.estero).map(valutaCompleta).sort((a,b)=>b.pct-a.pct).slice(0,6);
  }
  let c = D.ricette.filter(ok);
  if(t.v === "mare") c = c.filter(r=>!eDiCarne(r) && (cat === "Dolci" ? (r.leggero || !r.ing.some(i=>LATT.has(i.k))) : eDiPesce(r)));
  else if(t.v === "terra") c = c.filter(r=>!eDiPesce(r) && (cat !== "Secondi" || sess.stile !== "onnivoro" || eDiCarne(r)));
  else if(t.v === "leggero"){
    c = c.filter(r=>{ if(r._kcal==null) r._kcal = calorieRicetta(r); return r._kcal > 0 && r._kcal <= KCAL_MAX[cat] && !/fritt|frittur|pastell|impanat|scapece|fried/i.test(r.n); });
    const l = c.filter(r=>r.leggero); if(l.length >= 3) c = l;
  }
  else if(t.v === "mondo") c = c.filter(r=>r.estero);
  if(t.v !== "mondo") c = c.filter(r=>!r.estero);
  return c.map(valutaCompleta).sort((a,b)=>b.pct-a.pct || ((a.r._kcal||0)-(b.r._kcal||0)));
}
function apriMenuSpeciale(v, scelte){
  const t = TEMI_SPECIALI.find(x=>x.v===v), corsi = ["Antipasti","Primi","Secondi","Dolci"];
  if(!scelte){
    scelte = {}; const usati = new Set();
    corsi.forEach(cat=>{
      let c = candidatiSpeciale(t, cat);
      if(t.ids) c = c.slice().sort((a,b)=>b.pct-a.pct);
      if(v === "mondo") c = c.filter(o=>!usati.has(o.r.luogo));
      if(c.length){ scelte[cat] = c[0].r.id; if(v === "mondo") usati.add(c[0].r.luogo); }
    });
  }
  MS = {v, scelte};
  if(v === "mare" && sess.stile !== "onnivoro"){

      <div class="ric-grid">${scheda(sc)}</div>

    </div>`;
  }).join("");

    <div class="velo-top"><h2>${t.e} <span data-no-tr>${L(t.t, t.ten)}</span></h2>
      <button class="chiudi" data-tema="chiudi" onclick="chiudiVelo()">${L("Chiudi","Close")}</button></div>

    ${notaStileTema()}

  `);
}

/* peso stimato (grammi) di un pezzo, quando la quantita' e' solo un numero (es. "2") */
const PEZZO_G = {
  "uova":60,"limone":90,"lime":50,"arancia":150,"arance":150,"mele":150,"pere":150,
  "pomodori":120,"pomodorini":18,"peperoncino secco":2,"peperoncino fresco":10,
  "cipolla":100,"cipollotto":30,"patate":150,"carota":60,"zucchine":150,
  "melanzane":250,"peperoni":150,"banane":120
};
function stimaGrammi(qTxt, chiave){
  const t = String(qTxt||"").toLowerCase().trim();
  if(!t || t.includes("q.b") || t.includes("qb")) return 0;
  const fr = t.match(/^(\d+)\s*\/\s*(\d+)/);
  const num = (t.match(/[\d.,]+/)||[])[0];
  const n = fr ? (+fr[1] / +fr[2]) : (num ? parseFloat(num.replace(",",".")) : null);
  if(/kg\b/.test(t)) return n*1000;
  if(/\bl\b|litro|litri/.test(t)) return n*1000;
  if(/ml\b/.test(t)) return n;
  if(/g\b|gr\b|grammi/.test(t)) return n;
  /* filetti: d'acciuga pochi grammi, di pesce o carne una porzione */
  if(/filett/.test(t)) return (n||1) * (/acciug|alic/.test(chiave||"") ? 4 : 150);
  for(const u in UNITA_G){ if(t.includes(u)) return (n||1) * UNITA_G[u]; }
  if(n!=null){
    /* numero senza unita' riconosciuta ("2", "1/2", "2 medie", "6 arance"): pezzi interi */
    const peso = PEZZO_G[chiave] != null ? PEZZO_G[chiave] : 50;
    return n * peso;
  }
  return 0;
}
/* calorie stimate a porzione: e' una stima approssimativa, non un dato nutrizionale certificato */
function calorieRicetta(r){
  let tot = 0;
  r.ing.forEach(i=>{
    const kcal100 = KCAL_100G[i.k];
    if(kcal100 == null) return;
    const g = stimaGrammi(i.q, i.k);
    tot += kcal100 * g / 100;
  });
  /* si divide per le porzioni della ricetta (4 di base; torte, porchette ecc. ne hanno di piu').
     nvoci e' il numero di ingredienti, non le porzioni */
  return Math.round(tot / porzioniDi(r) / 10) * 10;
}

/* Tabella nutrizionale per 100 g di piatto finito, non per porzione: ogni voce di MACRO_100G e'
   [proteine, grassi, carboidrati, fibre, sale, alcol, fattore di resa in cottura], tutti per 100 g
   dell'ingrediente crudo. Le quantita' di nutrienti restano quelle sommate dagli ingredienti (cuocere
   non crea ne' distrugge proteine o grassi); a cambiare e' il peso totale del piatto, che l'acqua persa
   o assorbita in cottura riduce o aumenta: il fattore di resa stima quel peso finale, ed e' quello che
   permette di riportare i nutrienti "per 100 g" del piatto pronto invece che degli ingredienti crudi. */
function valoriNutrizionali100g(r){
  let kcal=0, p=0, g=0, c=0, fibra=0, sale=0, alc=0, pesoCotto=0;
  r.ing.forEach(i=>{
    const kcal100 = KCAL_100G[i.k], m = MACRO_100G[i.k];
    if(kcal100 == null || m == null) return;
    const gr = stimaGrammi(i.q, i.k);
    if(!gr) return;
    const [mp,mg,mc,mf,ms,ma,resa] = m;
    kcal += kcal100 * gr/100;
    p += mp * gr/100; g += mg * gr/100; c += mc * gr/100;
    fibra += mf * gr/100; sale += ms * gr/100; alc += ma * gr/100;
    pesoCotto += gr * resa;
  });
  if(pesoCotto <= 0) return null;
  const f = 100 / pesoCotto;
  return {
    kcal: Math.round(kcal*f),
    p: Math.round(p*f*10)/10, g: Math.round(g*f*10)/10, c: Math.round(c*f*10)/10,
    fibra: Math.round(fibra*f*10)/10, sale: Math.round(sale*f*100)/100, alc: Math.round(alc*f*10)/10,
    peso: Math.round(pesoCotto)
  };
}
function apriNutrizione(r){
  const n = valoriNutrizionali100g(r);
  apriVelo("nutrizione", `
    <div class="velo-top"><h2>Valori nutrizionali</h2>
      <button class="chiudi" onclick="chiudiVelo()">Chiudi</button></div>
    <p class="mini" style="opacity:.8"><span data-no-tr>${esc(nomeR(r))}</span> \u2014 stima per 100 g di piatto pronto (peso finito stimato: ${n?n.peso:"?"} g in totale)</p>
    ${n ? `
    <table class="tab-nutri">
      <tr><td>Energia</td><td><b>${n.kcal}</b> kcal</td></tr>
      <tr><td>Proteine</td><td><b>${n.p}</b> g</td></tr>
      <tr><td>Grassi</td><td><b>${n.g}</b> g</td></tr>
      <tr><td>Carboidrati</td><td><b>${n.c}</b> g</td></tr>
      <tr><td>di cui fibre</td><td><b>${n.fibra}</b> g</td></tr>
      <tr><td>Sale</td><td><b>${n.sale}</b> g</td></tr>
      ${n.alc>0?`<tr><td>Alcol</td><td><b>${n.alc}</b> g</td></tr>`:""}
    </table>
    <p class="mini" style="margin-top:10px;opacity:.75">Valori stimati in base agli ingredienti e a un fattore di resa in cottura per ciascuno: non sono un dato nutrizionale certificato.</p>
    ` : `<p>Non ci sono abbastanza dati sugli ingredienti per calcolare questa tabella.</p>`}
  `);
}


function abbinamentoBevanda(r){

  const piccante = contiene(chiavi, ["peperoncino","nduja","harissa"]);

  const carneBianca = contiene(chiavi, ["pollo","tacchino","coniglio","faraona"]);
  const formaggioStag = contiene(chiavi, ["parmigiano","pecorino","grana","gorgonzola","taleggio","provolone","stravecchio","stagionat"]);

      alt:"In alternativa: una birra scura e dolce (stout), oppure un tè freddo poco zuccherato o una spuma nera per restare analcolici."});
  if(pizza)
    return bibita({tipo:"Birra chiara, tipo lager o pilsner", car:"fresca, ben frizzante, leggermente amara",
      alt:"In alternativa: un vino rosso giovane e frizzante (es. Lambrusco), o un'acqua molto fredda e frizzante."});
  if(pesce)
    return bibita({tipo:fritto?"Vino bianco frizzante o spumante Brut":"Vino bianco secco",
      car:fritto?"bollicine fini, acidità decisa, utili a sgrassare il fritto":

  if(carneRossa)

      car:r.leggero?"morbido, fruttato, tannini non troppo marcati (es. Chianti giovane, Montepulciano)":
                     "strutturato, tannico, adatto a un piatto sostanzioso (es. Nero d'Avola, Chianti Classico, Montepulciano d'Abruzzo)",
      alt:"In alternativa: una birra ambrata o doppio malto, dal corpo pieno."});
  if(carneBianca)
    return bibita({tipo:"Vino rosso leggero o bianco strutturato",
      car:"poco tannico, fruttato se rosso; morbido e con un breve affinamento se bianco (es. Vermentino strutturato, Chardonnay)",
      alt:"In alternativa: una birra chiara artigianale dal profilo morbido."});
  if(formaggioStag)
    return bibita({tipo:"Vino rosso robusto o, per i più stagionati, un passito",
      car:"sapido e strutturato, capace di reggere il gusto deciso del formaggio",
      alt:"In alternativa: una birra ambrata o un vino bianco molto strutturato."});
  if(funghiTartufo)
    return bibita({tipo:"Vino rosso elegante", car:"terroso, delicato, non troppo tannico (es. Nebbiolo, Barbera)",
      alt:"In alternativa: un bianco strutturato e maturo."});
  return bibita({tipo:"Vino bianco leggero o rosato", car:"fresco, snello, facile da abbinare a un piatto delicato di verdure o legumi",
    alt:"In alternativa: una birra chiara leggera, o acqua frizzante con erbe aromatiche."});

/* ===========================================================
   Dosi: ogni ricetta ha le sue porzioni (4 di base), qui si riscala
   =========================================================== */
function dosiAttuali(){ return dosiPer || Math.max(1, tavolata().length); }
/* Le preparazioni "intere" (8 porzioni o piu': torte, biscotti, porchetta, lasagne in teglia)
   non si rimpiccioliscono: un sesto di torta non si inforna. Si ingrandiscono solo se a tavola
   c'e' piu' gente delle porzioni previste. */
function fattoreDosiP(p){
  const d = dosiAttuali();
  if(p >= 8 && d <= p) return 1;
  return d / p;
}
function fattoreDosi(r){ return fattoreDosiP(porzioniDi(r)); }
function rigaDosi(r){
  const p = porzioniDi(r);
  const intera = p >= 8 ? `<div class="mini" data-dosi-nota="${p}" style="margin-top:4px">${notaIntera(p)}</div>` : "";
  return `<div class="dosi">Dosi per <button data-dosi="-1" aria-label="Meno">\u2212</button>` +
         `<b data-dosi-n>${dosiAttuali()}</b>` +
         `<button data-dosi="1" aria-label="Piu">+</button> a tavola</div>` +
         (p !== PORZIONI ? `<div class="mini" style="margin-top:4px">La ricetta \u00e8 per ${p} porzioni.</div>` : "") + intera;
}
function notaIntera(p){
  return dosiAttuali() <= p
    ? "Dosi per la preparazione intera: quello che avanza si conserva."
    : "Dosi aumentate per tutti quelli a tavola.";
}
function scalaQ(q, f){
  const t = String(q);
  if(Math.abs(f - 1) < 0.001) return t;
  let val, resto, m = t.match(/^\s*(\d+)\s*\/\s*(\d+)(.*)$/);
  if(m){ val = (+m[1]) / (+m[2]); resto = m[3]; }
  else{
    m = t.match(/^\s*(\d+(?:[.,]\d+)?)(.*)$/);
    if(!m) return t;                                   /* "qualche foglia", "1 ciuffo" senza numero */
    val = parseFloat(m[1].replace(",", ".")); resto = m[2];
  }
  const u = resto.trim().toLowerCase();
  let v = val * f;
  if(/^(gr|g|ml)\b/.test(u)){
    v = v < 20 ? Math.max(1, Math.round(v))
      : v < 100 ? Math.round(v/5)*5
      : Math.round(v/10)*10;
  }
  else if(/^(kg|l)\b/.test(u))                              v = Math.round(v*20)/20;
  else if(/^(cucchia|tazz|bicchier|pizzic|tbsp|tsp|tablesp|teasp|cup)/.test(u)) v = Math.max(0.5, Math.round(v*2)/2);
  else                                                      v = Math.max(1, Math.round(v));
  let txt;
  if(Number.isInteger(v)) txt = String(v);
  else if(Math.abs(v % 1 - 0.5) < 0.001) txt = v < 1 ? "\u00bd" : Math.floor(v) + "\u00bd";
  else txt = String(Math.round(v*100)/100).replace(".", ",");
  if(v === 1) resto = resto.replace(/^(\s*)(cucchiai|cucchiaini|spicchi|fette|filetti|rametti|foglie|ciuffi|coste|bustine|rotoli)\b/,
    (t,sp,w)=>sp + ({cucchiai:"cucchiaio",cucchiaini:"cucchiaino",spicchi:"spicchio",fette:"fetta",
      filetti:"filetto",rametti:"rametto",foglie:"foglia",ciuffi:"ciuffo",coste:"costa",
      bustine:"bustina",rotoli:"rotolo"}[w] || w));
  return txt + resto;
}
function aggiornaDosi(){
  document.querySelectorAll("em[data-q]").forEach(e=>{
    e.textContent = scalaQ(e.dataset.q, fattoreDosiP(+e.dataset.p || PORZIONI));
  });
  document.querySelectorAll("[data-dosi-nota]").forEach(e=>{ e.textContent = notaIntera(+e.dataset.dosiNota); });
  document.querySelectorAll("[data-dosi-n]").forEach(e=>{ e.textContent = dosiAttuali(); });
}

   Elenchi lunghi: al posto della tendina del telefono (che si apre a tutto

   elenco breve dei risultati. Vale per qualunque <select> con piu' di 15 voci.
