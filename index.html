<script>
/* Lo sfondo: l'utente sceglie un colore (luminosita', brillantezza e tinta in OKLCH, oppure RGB) e ne memorizza piu' d'uno; il tasto in alto passa da una scelta all'altra.
   Da quel colore ricavo da solo superfici, linee e testo (scuro sui colori chiari, chiaro su quelli scuri).
   Va applicato prima del primo disegno, o si vede lo sfarfallio. */
window.SFONDO = (function(){
  var R = document.documentElement, W = [255,255,255], B = [0,0,0];
  var PREDEF = [
    {n:"Verde salvia",c:[242,244,238]},{n:"Crema",c:[246,241,231]},{n:"Azzurro",c:[238,243,245]},{n:"Rosa antico",c:[251,239,239]},
    {n:"Blu profondo",c:[10,30,69]},{n:"Antracite",c:[21,21,21]},{n:"Verde scuro",c:[23,40,26]},{n:"Bordeaux scuro",c:[42,21,32]}];
  function lim(x){ return Math.max(0, Math.min(255, Math.round(x))); }
  function hex(c){ return "#" + c.map(function(x){ return ("0" + lim(x).toString(16)).slice(-2); }).join(""); }
  function mix(c, t, a){ return [c[0]+(t[0]-c[0])*a, c[1]+(t[1]-c[1])*a, c[2]+(t[2]-c[2])*a]; }
  function lum(c){ var f = function(v){ v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
    return 0.2126*f(c[0]) + 0.7152*f(c[1]) + 0.0722*f(c[2]); }
  function scuro(c){ return lum(c) < 0.18; }
  /* --- OKLCH: luminosita' (L 0-1), brillantezza (C), tinta (H 0-360) --- */
  function lin(v){ v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }
  function gam(v){ return 255 * (v <= 0.0031308 ? 12.92*v : 1.055*Math.pow(v, 1/2.4) - 0.055); }
  function aOklch(c){
    var r = lin(c[0]), g = lin(c[1]), b = lin(c[2]);
    var l = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b),
        m = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b),
        s = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
    var L = 0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
        A = 1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
        B = 0.0259040371*l + 0.7827717662*m - 0.8086757660*s;
    var h = Math.atan2(B, A) * 180 / Math.PI; if(h < 0) h += 360;
    return [L, Math.sqrt(A*A + B*B), h];
  }
  function grezzo(L, C, H){
    var a = C * Math.cos(H*Math.PI/180), b = C * Math.sin(H*Math.PI/180);
    var l = Math.pow(L + 0.3963377774*a + 0.2158037573*b, 3),
        m = Math.pow(L - 0.1055613458*a - 0.0638541728*b, 3),
        s = Math.pow(L - 0.0894841775*a - 1.2914855480*b, 3);
    return [ 4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
            -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
            -0.0041960863*l - 0.7034186147*m + 1.7076147010*s];
  }
  function dentro(v){ return v.every(function(x){ return x >= -0.0005 && x <= 1.0005; }); }
  /* da OKLCH a RGB; se il colore non e' visualizzabile abbasso solo la brillantezza, tinta e luce restano */
  function daOklch(L, C, H){
    L = Math.max(0, Math.min(1, L)); C = Math.max(0, C);
    if(!dentro(grezzo(L, C, H))){
      var lo = 0, hi = C;
      for(var i = 0; i < 24; i++){ var md = (lo + hi) / 2; if(dentro(grezzo(L, md, H))) lo = md; else hi = md; }
      C = lo;
    }
    return grezzo(L, C, H).map(function(v){ return lim(gam(Math.max(0, Math.min(1, v)))); });
  }
  /* riquadri colorati: brillantezza (moltiplica la C) e luce (sposta la L) */
  function riq(){ try{ var r = JSON.parse(localStorage.getItem("checucino.riq") || "null"); if(r) return {b:+r.b || 1, l:+r.l || 0}; }catch(e){} return {b:1, l:0}; }
  function applicaRiq(r){
    R.style.setProperty("--riq-b", String(Math.max(.3, Math.min(1.8, r.b))));
    R.style.setProperty("--riq-l", String(Math.max(-.12, Math.min(.12, r.l))));
  }
  function salvaRiq(r){ try{ localStorage.setItem("checucino.riq", JSON.stringify(r)); }catch(e){} applicaRiq(r); }
  function lista(){
    try{ var l = JSON.parse(localStorage.getItem("checucino.sfondi") || "null");
      if(l && l.length) return l.map(function(c){ return [lim(c[0]), lim(c[1]), lim(c[2])]; }); }catch(e){}
    /* prima volta: riparto dai due sfondi che l'utente aveva scelto con il vecchio pannello */
    var tc = 1, ts = 1;
    try{ tc = +(localStorage.getItem("checucino.chiaro") || 1); ts = +(localStorage.getItem("checucino.scuroTema") || 1); }catch(e){}
    return [PREDEF[(tc-1) % 4].c.slice(), PREDEF[4 + (ts-1) % 4].c.slice()];
  }
  function sel(){
    var n = lista().length, v = null;
    try{ v = localStorage.getItem("checucino.sfondoSel"); }catch(e){}
    if(v === null){
      var t = null; try{ t = localStorage.getItem("checucino.tono"); }catch(e){}
      if(t === null) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "80" : "15";
      v = +t >= 55 ? 1 : 0;
    }
    v = +v || 0; return v < n ? v : 0;
  }
  function salva(l, i){ try{ localStorage.setItem("checucino.sfondi", JSON.stringify(l)); localStorage.setItem("checucino.sfondoSel", String(i)); }catch(e){} }
  function applica(c){
    /* superfici, linee e testi ricavati in OKLCH: stessa tinta dello sfondo, cambia solo la luce */
    var d = scuro(c), k = aOklch(c), L = k[0], C = k[1], H = k[2];
    var f = function(l, cc){ return daOklch(l, cc, H); };
    var v = d
      ? {carta:c, superficie:f(L+.035, C), superficie2:f(L+.08, C), linea:f(L+.15, C*.9),
         inchiostro:f(Math.max(.94, L+.5), Math.min(C*.3, .02)), "inchiostro-soft":f(Math.max(.8, L+.4), Math.min(C*.5, .03))}
      : {carta:c, superficie:f(L+(1-L)*.7, C*.4), superficie2:f(L-.04, C), linea:f(L-.12, C*1.1),
         inchiostro:f(Math.max(.12, Math.min(.27, L-.48)), Math.min(C*1.5, .04)), "inchiostro-soft":f(Math.max(.2, Math.min(.47, L-.34)), Math.min(C*1.3, .035))};
    for(var k in v) R.style.setProperty("--" + k, hex(v[k]));
    R.style.setProperty("--tono", d ? "80" : "15");
    if(d) R.setAttribute("data-scuro", ""); else R.removeAttribute("data-scuro");
    var m = document.getElementById("metaTema"); if(m) m.content = hex(c);
  }
  return {PREDEF:PREDEF, hex:hex, lum:lum, scuro:scuro, lista:lista, sel:sel, salva:salva, applica:applica,
    aOklch:aOklch, daOklch:daOklch, riq:riq, salvaRiq:salvaRiq, applicaRiq:applicaRiq};
})();
try{ SFONDO.applica(SFONDO.lista()[SFONDO.sel()]); SFONDO.applicaRiq(SFONDO.riq()); }catch(e){}
/* durante l'animazione d'apertura barra di stato e fondo hanno il colore dell'icona: nessuno stacco fra avvio del telefono e app */
try{ document.documentElement.classList.add("avvio"); var mt = document.getElementById("metaTema"); window.TEMA_DOPO = mt.content; mt.content = "#17281A"; }catch(e){}
</script>

<style>
:root{
  --tono:15;
  color-scheme:light;
  --carta:          #F2F4EE;
  --superficie:     #FFFFFF;
  --superficie2:    #E7EBDE;
  --inchiostro:     #1C2A18;
  --inchiostro-soft:#51604C;
  --linea:          #D3D9C4;
  --verde:          #3F7A4E;
  --verde-chiaro:   #DCE9DC;
  --senape:         #B97A1E;
  --mattone:        #A0472E;
  --ombra:0 1px 0 hsl(150 17% 13% / 0.06);
  --r:14px;
}
/* scuro di base: blu profondo Pantone 295 */
:root[data-scuro]{
  color-scheme:dark;
  --carta:#0A1E45; --superficie:#0E244F; --superficie2:#163266;
  --inchiostro:#EEF2FA; --inchiostro-soft:#B6C3DE; --linea:#26407A;
  --verde:#5FA875; --verde-chiaro:#1E4430; --senape:#E0A73E; --mattone:#D97A55;
  --ombra:0 1px 0 hsl(150 17% 13% / 0.3);
}
/* --- 4 temi chiari a scelta (Impostazioni) --- */
:root[data-chiaro="2"]{ --carta:#F6F1E7; --superficie:#FFFDF8; --superficie2:#ECE3D0; --inchiostro:#2B2013; --inchiostro-soft:#5C4E37; --linea:#DCCFAF; }
:root[data-chiaro="3"]{ --carta:#EEF3F5; --superficie:#FFFFFF; --superficie2:#DCE6EA; --inchiostro:#132225; --inchiostro-soft:#48595D; --linea:#C4D3D8; }
:root[data-chiaro="4"]{ --carta:#FBEFEF; --superficie:#FFFFFF; --superficie2:#F3DCDC; --inchiostro:#2A1414; --inchiostro-soft:#5E3D3D; --linea:#E0BEBE; }
/* --- 4 temi scuri a scelta (il primo, senza attributo, è il blu Pantone 295) --- */
:root[data-scuro][data-scuro-t="2"]{ --carta:#151515; --superficie:#1E1E1E; --superficie2:#292929; --inchiostro:#F1F1F1; --inchiostro-soft:#C6C6C6; --linea:#393939; }
:root[data-scuro][data-scuro-t="3"]{ --carta:#17281A; --superficie:#1D321F; --superficie2:#28402A; --inchiostro:#ECF3EC; --inchiostro-soft:#B6C8B6; --linea:#375038; }
:root[data-scuro][data-scuro-t="4"]{ --carta:#2A1520; --superficie:#341A28; --superficie2:#432235; --inchiostro:#F5ECF1; --inchiostro-soft:#D3B9C7; --linea:#5A2E48; }
/* filigrana facoltativa: ortaggi, frutta, uova come sfondo tenue */
body[data-filigrana="1"]::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  opacity:.07;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><text x="6" y="42" font-size="36">%F0%9F%A5%95</text><text x="96" y="96" font-size="36">%F0%9F%8D%85</text><text x="20" y="150" font-size="36">%F0%9F%A5%9A</text><text x="112" y="34" font-size="36">%F0%9F%8D%87</text></svg>');
  background-repeat:repeat;
}

.sotto-rep:first-child{border-top:0;padding-top:0;margin-top:2px}   /* verde HACCP, tono piu' chiaro per distinguerla dalle verdure */
.pcella.cat-carne{background:#B83729;color:#fff}
.pcella.cat-pesce{background:#176A9B;color:#fff}
.pcella.cat-grigio{background:#5F6572;color:#fff}
.pcella.cat-ocra{background:#835F08;color:#fff}
.pcella.cat-giallo{background:#E3B400;color:#3A2E00;border:1px solid #C79A00}
.pcella.cat-latticini{background:#FAF8F2;color:#2A2A22;border:1px solid #DCD6C4}
.pcella.cat-ghiaccio{background:#E7F5FA;color:#1B3A44;border:1px solid #C7E3ED}
.pcella.cat-cantina{background:#6E1E35;color:#fff}
.cant-n{font-weight:800;font-size:.85em;opacity:.85;margin-left:2px}
/* scadenze */
.scad-b{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:999px;font-size:.72em;font-weight:800;line-height:1.5;vertical-align:middle}
.scad-rossa{background:#B3261E;color:#fff}.scad-arancio{background:#E8730C;color:#fff}.scad-ok{background:rgba(0,0,0,.18);color:inherit}
.hscad{background:#8E1F1A;color:#fff;margin-top:10px;cursor:default}
.hscad ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.hscad li{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:600}
.hscad .azioni{margin-top:10px;gap:8px}
.hscad .btn{background:#fff;color:#8E1F1A}.hscad .btn.ghost{background:transparent;color:#fff;border-color:#fff}
.scad-riga{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.scad-riga b{flex:1;min-width:110px}
.scad-riga input[type=date]{padding:6px 8px;border-radius:10px;border:1px solid var(--linea);background:var(--superficie);color:var(--inchiostro);font:inherit}
.scad-riga .chip{font-size:.75rem;padding:4px 9px}
.scad-gruppo{margin:6px 0;border:1px solid var(--linea);border-radius:12px;padding:6px 12px}
.scad-gruppo summary{cursor:pointer;font-weight:700;padding:6px 0}
.scad-gruppo summary em{font-style:normal;opacity:.6;font-weight:600;margin-left:6px}
.scad-conf{flex-basis:100%}
.scad-conf-r{display:flex;align-items:center;gap:8px;margin:4px 0}
.scad-conf-r .mini{min-width:24px;font-weight:700}
.scad-quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cant-bott{border:1px solid var(--linea);border-left:5px solid #6E1E35;border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--carta)}
.cant-tit{font-weight:800;font-size:1.05rem}
.cant-det{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:.92rem;color:var(--inchiostro-soft)}
.cant-az{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cant-riga{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cant-leggi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cant-stato{margin-top:8px}
.cant-stato.cant-ok{color:#2E6B3F;font-weight:600}
.cant-stato.cant-avviso{color:#A0402A;font-weight:600}
.cant-testo{margin-top:6px;font-weight:400;color:var(--inchiostro-soft)}
.cant-testo pre{white-space:pre-wrap;font:inherit;font-size:.85rem;margin:6px 0 0;max-height:160px;overflow:auto}
.cant-dom{font-weight:700;font-size:1.05rem;margin:10px 0 8px}
.cant-scelta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.cant-scelta.uno{grid-template-columns:1fr;margin-top:12px}
.cant-sc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px 12px;border:0;border-radius:14px;color:#fff;font:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.cant-sc span{font-size:1.8rem;line-height:1}
.cant-sc small{opacity:.9;font-size:.8rem;line-height:1.3}
.cs-si{background:#2E6B3F}.cs-det{background:#6E1E35}
[data-cantina] input.cant-letto{border-color:#2E6B3F;box-shadow:0 0 0 3px rgba(46,107,63,.25)}
[data-cantina] input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--carta);color:var(--inchiostro);font:inherit}
:root[data-scuro] .pcella.cat-cantina{background:#7A2640}
:root[data-scuro] .pcella.cat-verdure{background:#337140}
:root[data-scuro] .pcella.cat-frutta{background:#526C22}
:root[data-scuro] .pcella.cat-carne{background:#B23B30}
:root[data-scuro] .pcella.cat-pesce{background:#206997}
:root[data-scuro] .pcella.cat-grigio{background:#5D656F}
:root[data-scuro] .pcella.cat-ocra{background:#7E5F13}
:root[data-scuro] .pcella.cat-giallo{background:#E3B400;color:#3A2E00}
:root[data-scuro] .pcella.cat-latticini{background:#EDE9DD;color:#2A2A22}
:root[data-scuro] .pcella.cat-ghiaccio{background:#D7EEF6;color:#1B3A44}
.pcella.cat-giallo .mini,.pcella.cat-latticini .mini,.pcella.cat-ghiaccio .mini{opacity:.9}
.pcella.cat-giallo > summary em,.pcella.cat-latticini > summary em,.pcella.cat-ghiaccio > summary em{opacity:.85}

.ing-esito-ok{color:var(--verde);font-weight:700}
.pcella[class*="c-"] .ing-esito-ok{color:#EAFFEA;opacity:1}
*{box-sizing:border-box}

/* ===== INNER PAGES BENTO ===== */
.pag{padding:10px 0 calc(90px + env(safe-area-inset-bottom))}
.pag-intro{padding:2px 2px 12px}
.pag-intro h2{font-size:1.35rem;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
.pag-intro p{font-size:.9rem;color:var(--inchiostro-soft);margin:0}
.pcella.tendina{padding:0;overflow:hidden}
.tendina .tend-testa{all:unset;box-sizing:border-box;width:100%;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;color:inherit}

/* "Cosa ti va oggi?": il box si apre come pagina a tutto schermo, nel suo colore */

.pcella.box-pagina{position:fixed;inset:0;z-index:50;margin:0;padding:0;border:0;border-radius:0;outline:0;
  display:flex;flex-direction:column;cursor:default;transform:none;transition:none;will-change:clip-path}
.pcella.box-pagina:active{transform:none}
.bp-testa{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  border-bottom:1px solid rgba(255,255,255,.28)}
.bp-tit{flex:1;display:flex;align-items:center;gap:12px;font-size:1.3rem;font-weight:800;line-height:1.2}

  background:rgba(255,255,255,.16);color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer;display:grid;place-items:center}
.bp-corpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 24px;width:100%;max-width:620px;margin:0 auto;box-sizing:border-box}

.bp-corpo .orologio{padding:0;max-width:340px;margin:0 auto}
.bp-piede{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.28)}
.bp-piede .btn{display:block;width:100%;max-width:620px;margin:0 auto;background:#fff;color:#1F2A30;font-size:1.05rem}
.tendina .tend-freccia{font-size:1rem}
.tendina .orologio .tend-ok{margin:10px 0 0 auto}
.pcella .orologio svg{display:block;width:min(250px,72vw)!important;height:auto!important;max-width:none;margin:4px auto 0!important;opacity:1!important;margin:0 auto;touch-action:none;cursor:grab;color:#fff}
.pcella .orologio svg:active{cursor:grabbing}
.oro-tasti{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.oro-tasti b{min-width:9em;text-align:center;font-size:1.05rem}
.oro-tasti .chip{font-weight:700;font-size:1rem;padding:6px 14px}
.oro-rapidi{justify-content:center;margin-top:10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pgrid .full{grid-column:1/-1}
.pgrid3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.pcella{border-radius:14px;padding:14px;border:2px solid transparent;
  background:var(--superficie2);cursor:pointer;transition:transform .12s,border-color .15s;-webkit-tap-highlight-color:transparent}
.pcella:active{transform:scale(.97)}
.pcella.sel{border-color:var(--verde);background:color-mix(in srgb,var(--verde) 12%,var(--superficie2))}
.pcella svg{width:28px;height:28px;margin-bottom:8px;display:block;opacity:.85}
.pcella b{display:block;font-size:.98rem;font-weight:800;line-height:1.2}
.pcella small{display:block;font-size:.76rem;color:var(--inchiostro-soft);margin-top:3px;line-height:1.3}
.ric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.ws-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ws-links.q4{grid-template-columns:repeat(2,1fr)}
.ws-links.ws-google{grid-template-columns:1fr}
.ws-links.ws-google a:first-child{background:#2E7D4F;color:#fff;border-color:#2E7D4F;font-size:1.02rem;padding:14px 8px}
.ws-guida{margin-top:12px;padding:10px 14px;border-radius:14px;background:#1F6F8B;color:#fff;line-height:1.5}
.ws-guida ol{margin:6px 0 0;padding-left:1.2em}
.ws-guida li{margin-bottom:4px}
.ws-guida b{color:#fff}
.link-mini{border:0;background:none;color:var(--verde,#2E7D4F);font-weight:700;text-decoration:underline;padding:0;cursor:pointer;font:inherit}
.imp-avviso{margin:12px 0;padding:10px 14px;border-radius:14px;background:#FFF3CD;color:#5C4400;border:1px solid #E8C25A;line-height:1.5}
.imp-avviso a{color:#5C4400;font-weight:700}
.ed-avviso{margin:0 0 12px;padding:10px 14px;border-radius:14px;background:#FFF3CD;color:#5C4400;border:1px solid #E8C25A}
.ws-links.q4 a:first-child{grid-column:1/-1}
.cerco-altro{margin:18px 0 6px;text-align:center}
.cerco-altro>.btn{width:100%}
.cerco-altro-box{margin-top:10px}
.ws-links a{border-radius:12px;padding:12px 8px;background:var(--superficie2);
  text-align:center;font-size:.84rem;font-weight:600;color:inherit;text-decoration:none;
  border:1px solid var(--linea)}

/* ===== HOME BENTO ===== */
.home{padding:6px 0 calc(80px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.home-saluto{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:6px 0 16px;padding:0 2px}
.home-saluto small{display:block;font-size:.85rem;font-weight:400;color:var(--inchiostro-soft);margin-top:2px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bento .avvia{grid-column:1/-1}
.bento .bcella{z-index:1}
.promemoria-salva{background:#0F6E78;color:#fff;border-radius:18px;padding:14px 16px;margin:0 0 12px;display:flex;flex-direction:column;gap:4px}
.promemoria-salva b{font-size:1rem;line-height:1.3}
.promemoria-salva .mini{color:#fff;opacity:.92;font-size:.86rem}
.promemoria-salva .azioni{margin-top:8px}
.promemoria-salva .btn{background:#fff;color:#0F6E78}
.promemoria-salva .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.az-riga{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:.95rem;line-height:1.35}
.az-riga input{width:20px;height:20px;flex:none;margin-top:1px}
.btn.rischio-btn{background:#B23B30;color:#fff}
.globo-nota{position:fixed;z-index:9000;max-width:250px;padding:10px 12px;border-radius:12px;background:#1F2A30;color:#fff;
  font-size:.9rem;font-weight:600;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none;transform:translate(-50%,-100%)}
.globo-nota::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#1F2A30}
.globo-nota.sotto::after{top:-6px;bottom:auto;border-top:0;border-bottom:6px solid #1F2A30}
.globo{cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.globo,.pcella svg.globo{display:inline-block;width:28px;height:28px;vertical-align:middle;margin:0 4px 0 0;background:#fff;border-radius:50%}
/* "Conosciamoci" a profilo compilato: un cassetto chiuso sotto Dispensa e A tavola, con l'orecchietta per tirarlo fuori */
.cassetto{position:relative;margin-top:-16px;padding-bottom:24px;z-index:0}
.bcella.hconosci{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;
  max-height:24px;padding:0 16px;overflow:hidden;border-radius:0 0 14px 14px;
  transition:max-height .38s ease,padding .38s ease,border-radius .38s}
.bcella.hconosci > *{opacity:0;transition:opacity .2s}
.cassetto.aperto .bcella.hconosci{max-height:130px;padding:28px 16px 14px;border-radius:0 0 18px 18px}
.cassetto.aperto .bcella.hconosci > *{opacity:1;transition-delay:.15s}
.bcella.hconosci svg{width:58px !important;height:38px !important;margin:0;grid-row:span 2}
.bcella.hconosci b{font-size:1rem}
.bcella.hconosci small{margin-top:2px}
.orecchio{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:76px;height:24px;border:0;cursor:pointer;
  border-radius:0 0 14px 14px;background:#B83729;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:.8rem;font-weight:800;box-shadow:0 3px 6px rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent}
.orecchio svg{width:14px;height:14px;transition:transform .3s}
.cassetto.aperto .orecchio svg{transform:rotate(180deg)}
:root[data-scuro] .orecchio{background:#B33C2D}
.bcella{border-radius:18px;padding:16px 16px 14px;cursor:pointer;
  border:1.5px solid transparent;
  transition:transform .15s,box-shadow .15s;
  -webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden}
.bcella:active{transform:scale(.97)}
/* colori bento: vividi, cibo-ispirati, testo sempre bianco */
.bcella.c-verde,  .pcella.c-verde  {background:#B83729;color:#fff}   /* rosso pomodoro        */
.bcella.c-menta,  .pcella.c-menta  {background:#1768A9;color:#fff}   /* blu cielo             */
.bcella.c-crema,  .pcella.c-crema  {background:#865D00;color:#fff}   /* oro zafferano         */
.bcella.c-senape, .pcella.c-senape {background:#6D3FA0;color:#fff}   /* viola melanzana       */
.bcella.c-auto,   .pcella.c-auto   {background:#157159;color:#fff}   /* verde basilico        */
.bcella.c-mattone,.pcella.c-mattone{background:#A74915;color:#fff}   /* arancio peperone      */
/* adatta leggermente in modalita scura */
:root[data-scuro] .bcella.c-verde,  :root[data-scuro] .pcella.c-verde  {background:#B33C2D}
:root[data-scuro] .bcella.c-menta,  :root[data-scuro] .pcella.c-menta  {background:#1C69A2}
:root[data-scuro] .bcella.c-crema,  :root[data-scuro] .pcella.c-crema  {background:#805E09}
:root[data-scuro] .bcella.c-senape, :root[data-scuro] .pcella.c-senape {background:#7E50B5}
:root[data-scuro] .bcella.c-auto,   :root[data-scuro] .pcella.c-auto   {background:#16725B}
:root[data-scuro] .bcella.c-mattone,:root[data-scuro] .pcella.c-mattone{background:#A14D1D}
.bcella.c-bordeaux, .pcella.c-bordeaux{background:#8B3A52;color:#fff}
:root[data-scuro] .pcella.c-bordeaux{background:#9E4A62}
/* Gli stessi colori in OKLCH: i cursori "Riquadri colorati" in Aspetto ne regolano
   brillantezza (--riq-b moltiplica la C) e luce (--riq-l sposta la L, con un tetto per il testo bianco). */
@supports (color: oklch(clamp(.2, calc(.3 + 0), .6) calc(.1 * 1) 30)){
  .bcella.c-verde, .pcella.c-verde{background:oklch(clamp(.28, calc(0.5272 + var(--riq-l, 0)), .64) min(.24, calc(0.1679 * var(--riq-b, 1))) 29.9)}
  :root[data-scuro] .bcella.c-verde, :root[data-scuro] .pcella.c-verde{background:oklch(clamp(.28, calc(0.5248 + var(--riq-l, 0)), .64) min(.24, calc(0.1572 * var(--riq-b, 1))) 30.3)}
  .bcella.c-menta, .pcella.c-menta{background:oklch(clamp(.28, calc(0.5052 + var(--riq-l, 0)), .64) min(.24, calc(0.1268 * var(--riq-b, 1))) 248.6)}
  :root[data-scuro] .bcella.c-menta, :root[data-scuro] .pcella.c-menta{background:oklch(clamp(.28, calc(0.5043 + var(--riq-l, 0)), .64) min(.24, calc(0.1158 * var(--riq-b, 1))) 246.0)}
  .bcella.c-crema, .pcella.c-crema{background:oklch(clamp(.28, calc(0.5088 + var(--riq-l, 0)), .64) min(.24, calc(0.1058 * var(--riq-b, 1))) 78.7)}
  :root[data-scuro] .bcella.c-crema, :root[data-scuro] .pcella.c-crema{background:oklch(clamp(.28, calc(0.5039 + var(--riq-l, 0)), .64) min(.24, calc(0.1005 * var(--riq-b, 1))) 83.0)}
  .bcella.c-senape, .pcella.c-senape{background:oklch(clamp(.28, calc(0.4708 + var(--riq-l, 0)), .64) min(.24, calc(0.1527 * var(--riq-b, 1))) 302.8)}
  :root[data-scuro] .bcella.c-senape, :root[data-scuro] .pcella.c-senape{background:oklch(clamp(.28, calc(0.5299 + var(--riq-l, 0)), .64) min(.24, calc(0.156 * var(--riq-b, 1))) 302.4)}
  .bcella.c-auto, .pcella.c-auto{background:oklch(clamp(.28, calc(0.4912 + var(--riq-l, 0)), .64) min(.24, calc(0.0905 * var(--riq-b, 1))) 170.2)}
  :root[data-scuro] .bcella.c-auto, :root[data-scuro] .pcella.c-auto{background:oklch(clamp(.28, calc(0.4948 + var(--riq-l, 0)), .64) min(.24, calc(0.09 * var(--riq-b, 1))) 171.2)}
  .bcella.c-mattone, .pcella.c-mattone{background:oklch(clamp(.28, calc(0.5206 + var(--riq-l, 0)), .64) min(.24, calc(0.1379 * var(--riq-b, 1))) 44.8)}
  :root[data-scuro] .bcella.c-mattone, :root[data-scuro] .pcella.c-mattone{background:oklch(clamp(.28, calc(0.5181 + var(--riq-l, 0)), .64) min(.24, calc(0.1261 * var(--riq-b, 1))) 46.7)}
  .bcella.c-bordeaux, .pcella.c-bordeaux{background:oklch(clamp(.28, calc(0.4647 + var(--riq-l, 0)), .64) min(.24, calc(0.1128 * var(--riq-b, 1))) 4.0)}
  :root[data-scuro] .bcella.c-bordeaux, :root[data-scuro] .pcella.c-bordeaux{background:oklch(clamp(.28, calc(0.5219 + var(--riq-l, 0)), .64) min(.24, calc(0.1142 * var(--riq-b, 1))) 3.8)}
}
/* pcella colorata: testo e icona leggibili sopra il colore pieno */
.pcella[class*="c-"]{border-color:transparent}
.pcella[class*="c-"] small{color:#fff;opacity:1;font-weight:600}
.pcella[class*="c-"] svg{opacity:1}
.pcella[class*="c-"].sel{outline:3px solid rgba(255,255,255,.9);outline-offset:-3px}
.pcella[class*="c-"] input[type=text],.pcella[class*="c-"] select{color:var(--inchiostro)}
.pcella[class*="c-"] .campo>span{color:#fff;opacity:1;font-weight:600}
.pcella[class*="c-"] .mini{color:#fff;opacity:1;font-weight:600}
.pcella[class*="c-"] .btn.ghost{color:#fff;border-color:rgba(255,255,255,.55)}
.mic-btn{flex:none;width:44px;height:44px;border-radius:11px;border:1px solid var(--linea);
  background:var(--carta);color:var(--inchiostro);display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.mic-btn svg{width:20px;height:20px}
.mic-btn.in-ascolto{background:var(--mattone);border-color:var(--mattone);color:#fff;
  animation:mic-pulsa 1s ease-in-out infinite}
@keyframes mic-pulsa{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--mattone) 45%,transparent)}
  50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--mattone) 0%,transparent)}}
.bcella svg{width:36px;height:36px;margin-bottom:10px;display:block;opacity:1}
.bcella.avvia svg{width:48px;height:48px;margin-bottom:12px}
.bcella b{display:block;font-size:1.08rem;font-weight:800;line-height:1.2}
.bcella.avvia b{font-size:1.38rem}
.bcella small{display:block;font-size:.86rem;font-weight:600;opacity:.97;margin-top:4px;line-height:1.35}
.bcella .badge{position:absolute;top:12px;right:14px;
  background:rgba(0,0,0,.18);color:inherit;
  border-radius:999px;font-size:.72rem;font-weight:700;padding:2px 8px;
  line-height:1.6}
.bcella.tre{grid-column:auto}
/* box lista della spesa in home: spento se vuota, acceso se c'è qualcosa */
.bcella.hspesa{margin-top:10px;transition:background .3s,color .3s,box-shadow .3s}
.bcella.hspesa.spenta{background:var(--superficie2);color:var(--inchiostro-soft);border:1.5px dashed currentColor;opacity:.75}
.bcella.hspesa.accesa{background:#1F742A;color:#fff;border:2px solid #fff;
  box-shadow:0 0 0 3px #1F742A,0 0 22px 4px rgba(46,173,63,.75);animation:spesaAccesa 2.2s ease-in-out infinite}
:root[data-scuro] .bcella.hspesa.accesa{background:#1F742C;box-shadow:0 0 0 3px #1F742C,0 0 26px 6px rgba(52,194,74,.8)}
@keyframes spesaAccesa{50%{box-shadow:0 0 0 3px #1F742A,0 0 34px 10px rgba(46,173,63,.95)}}
@media(prefers-reduced-motion:reduce){.bcella.hspesa.accesa{animation:none}}
.hspesa-l{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.hspesa-l li{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:600}
.bento-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
/* ===== Impariamo a cucinare ===== */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sc-gruppo{font-size:1.1rem;margin:20px 0 -2px}
.sc-agg{width:100%;margin-top:10px}
.imp-prog{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.imp-prog[hidden]{display:none}
.imp-prog-bar{flex:1;height:10px;border-radius:999px;background:var(--superficie2);overflow:hidden;border:1px solid var(--linea)}
.imp-prog-bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .25s linear;
  background:repeating-linear-gradient(45deg,#0F6E78 0 10px,#2C8C97 10px 20px);background-size:28px 28px;animation:impScorri .8s linear infinite}
@keyframes impScorri{to{background-position:28px 0}}
.imp-prog span{font-weight:800;font-size:.85rem;min-width:38px;text-align:right}
.imp-ko{background:#FBEAE7;border:2px solid #B23B30;border-radius:14px;padding:12px 14px;margin:10px 0;color:#5A1A14}
:root[data-scuro] .imp-ko{background:#3A1A16;color:#F6D6D1}
.imp-ko .btn.ghost{color:inherit}
.imp-tolte{background:var(--superficie2);border-radius:14px;padding:10px 14px;margin:6px 0 12px}
.imp-tolte ul{margin:6px 0;padding-left:1.1em;font-size:.85rem;color:var(--inchiostro-soft)}
.imp-tolte li{text-decoration:line-through}
.ico-in{display:inline-grid;place-items:center;vertical-align:middle;margin:0 2px;line-height:1}
.ico-musica{width:30px;height:30px;border-radius:50%;border:1px solid var(--linea);background:var(--superficie);color:var(--verde);font-size:1.05rem;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.ico-nutri{font-size:1.15rem}
.ms-corso{margin-bottom:14px}
.ms-cat{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin:4px 2px 6px;color:var(--inchiostro-soft)}
.ms-alt{margin-top:6px;align-items:center}
.ms-alt .chip{font-size:.82rem}
/* ===== Di stagione ===== */
.st-mesi{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;margin-top:6px;scrollbar-width:none}
.st-mesi .chip{flex:none;text-transform:capitalize}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(max-width:360px){.st-grid{grid-template-columns:1fr 1fr}}
.st-card{background:var(--st);color:#fff;border:0;border-radius:16px;padding:12px 6px 10px;text-align:center;cursor:pointer;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent}
.st-card:active{transform:scale(.97)}
.st-card .st-e{font-size:2.2rem;line-height:1.1;background:rgba(255,255,255,.92);border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.st-card b{font-size:.92rem;font-weight:800;line-height:1.15}
.st-card small{font-size:.76rem;font-weight:600;opacity:.95}
.st-tabw{overflow-x:auto;margin-top:10px}
.st-tab{border-collapse:separate;border-spacing:2px;width:100%;font-size:.85rem}
.st-tab th{font-weight:800;font-size:.75rem;text-transform:uppercase;padding:2px 0;min-width:16px}
.st-tab th.ora{color:var(--st)}
.st-tab td:first-child{font-weight:700;font-size:.8rem;line-height:1.15;padding-right:4px;max-width:104px;position:sticky;left:0;background:var(--carta)}
.st-tab th:not(:first-child),.st-tab td:not(:first-child){width:7%}
.st-tab td{height:22px;border-radius:5px;background:var(--superficie2)}
.st-tab td.si{background:var(--st)}
.st-tab td.ora{outline:2px solid var(--inchiostro);outline-offset:-1px}
.st-tab tr{cursor:pointer}
.st-det{text-align:center;margin-top:6px}
.st-card .st-e svg{width:40px;height:40px}
.st-det-e svg{width:66px;height:66px}
.st-ti{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.st-ti svg{width:18px;height:18px}
.st-card.fermo{background:var(--superficie2);color:var(--inchiostro);outline:2px dashed #B23B30;outline-offset:-2px}
.st-card.fermo small{color:#B23B30;font-weight:800}
.st-tab td.no,.st-barra span.no{background:repeating-linear-gradient(45deg,#B23B30 0 4px,#8A2A21 4px 8px);color:#fff}
.sc-box.st-nota.fermo{background:#8A2A21}
.st-leg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.st-q{display:inline-block;width:14px;height:14px;border-radius:4px}
.st-q.si{background:var(--st,#176A9B)}
.st-q.no{background:repeating-linear-gradient(45deg,#B23B30 0 3px,#8A2A21 3px 6px)}
.st-nota{text-align:left;margin-top:10px}
.st-det-e{font-size:3.4rem;line-height:1;background:var(--superficie2);border-radius:50%;width:92px;height:92px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.st-det h3{font-size:1.35rem;margin:0}
.st-barra{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:12px 0 4px}
.st-barra span{font-size:.72rem;font-weight:800;padding:6px 0;border-radius:6px;background:var(--superficie2);color:var(--inchiostro-soft);text-transform:uppercase}

.radio-btn.suona{background:var(--verde);color:var(--carta);border-color:var(--verde)}
.radio-pan{position:fixed;right:16px;bottom:calc(146px + env(safe-area-inset-bottom));z-index:27;

.radio-pan .chips button{flex:none;border:0;border-radius:999px;padding:8px 14px;font-size:.87rem;

.rb-nome b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

:root[data-scuro] .radio-pan .rc0{background:#B33C2D}:root[data-scuro] .radio-pan .rc1{background:#1C69A2}
:root[data-scuro] .radio-pan .rc2{background:#805E09}:root[data-scuro] .radio-pan .rc3{background:#7E50B5}
:root[data-scuro] .radio-pan .rc4{background:#16725B}:root[data-scuro] .radio-pan .rc5{background:#A14D1D}
:root[data-scuro] .radio-pan .rc6{background:#9E4A62}
.radio-pan button.spegni{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mattone);
  padding:11px 14px;border-top:1px solid var(--linea);font-size:.93rem;font-weight:700;cursor:pointer}
.radio-pan .stato{padding:10px 14px;font-size:.78rem;color:var(--inchiostro-soft);
  border-bottom:1px solid var(--linea)}

/* schermata d'apertura */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;align-content:center;gap:16px;
  background:#17281A;transition:opacity .45s ease}
#splash.via{opacity:0;pointer-events:none}
#splash svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(56vw,230px);height:auto}
#splash{align-content:start !important;padding-top:calc(50vh + min(28vw,115px) + 16px)}
#splash .ver-splash{margin-top:-8px;font:700 .85rem/1 Inter,system-ui,sans-serif;letter-spacing:.06em;color:#F0DFB8;opacity:0;animation:sp-nome .5s ease .9s forwards}
#avvisoAgg{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#2E6B3F;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);font-weight:600}
#avvisoAgg span{flex:1;line-height:1.3}
#avvisoAgg button{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:800;background:#fff;color:#2E6B3F;cursor:pointer}
#avvisoAgg .agg-x{background:transparent;color:#fff;padding:6px 8px}
.perche-agg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--verde) 14%,transparent)}
#infoBtn .ver{font:700 .62rem/1 Inter,system-ui,sans-serif;font-style:normal;margin-left:3px;opacity:.75;letter-spacing:.02em}
#splash .autore-splash{margin-top:-10px;font:italic 500 1rem/1.2 Newsreader,Georgia,serif;letter-spacing:.01em;color:#F0DFB8;text-align:center;opacity:0;animation:sp-nome .5s ease .85s forwards}
.perche .autore{margin:-4px 0 14px;font:italic 500 1rem/1.3 Newsreader,Georgia,serif;opacity:.8}
#splash .nome{font-family:Newsreader,Georgia,serif;font-size:clamp(1.7rem,7.5vw,2.4rem);
  font-weight:600;letter-spacing:-.01em;line-height:1.1;text-align:center;color:#F0DFB8;
  opacity:0;animation:sp-nome .5s ease .75s forwards}
/* l'animazione parte dallo stesso disegno dell'icona: niente stacco con l'avvio del telefono */
#splash .fluttua{transform-box:view-box;animation:sp-fluttua 2.4s ease-in-out .2s infinite}
#splash .q1{animation-delay:.4s;animation-duration:2.1s}#splash .q3{animation-delay:.6s;animation-duration:2.7s}
#splash .fumo path{stroke-dasharray:140;stroke-dashoffset:140;opacity:0;animation:sp-fumo 2.2s ease-out infinite}
#splash .fumo .f2{animation-delay:.7s}#splash .fumo .f3{animation-delay:1.3s;stroke-width:7}
#splash .bolle circle{opacity:0;transform-box:fill-box;transform-origin:center;animation:sp-bolla 1.6s ease-out infinite}
#splash .bolle .b1{animation-delay:.3s}#splash .bolle .b2{animation-delay:.8s}#splash .bolle .b3{animation-delay:1.2s}
#splash .riflesso{animation:sp-riflesso 1.1s ease-in-out .5s forwards}
@keyframes sp-pentola{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sp-vapore{to{stroke-dashoffset:0}}
@keyframes sp-punto{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes sp-nome{to{opacity:1}}
@keyframes sp-fumo{0%{opacity:0;stroke-dashoffset:140;transform:translateY(6px)}25%{opacity:.55}70%{opacity:.35}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-26px)}}
@keyframes sp-fluttua{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sp-bolla{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:.8}100%{opacity:0;transform:translateY(-46px) scale(1.2)}}
@keyframes sp-riflesso{0%{opacity:0;transform:translateX(0)}40%{opacity:.55}100%{opacity:0;transform:translateX(240px)}}
@keyframes sp-alone{0%,100%{opacity:.05;transform:scale(.96)}50%{opacity:.11;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none !important;opacity:1 !important;stroke-dashoffset:0 !important}
  #splash .riflesso{opacity:0 !important}#splash .bolle,#splash .fumo{display:none}
}
html,body{margin:0;padding:0}
body{background:var(--carta);color:var(--inchiostro);
  font-family:Karla,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.15;margin:0}
h2{font-size:1.45rem;letter-spacing:-.01em}
h3{font-size:1.08rem}
p{margin:.5em 0}
button{font:inherit;color:inherit}
a{color:var(--verde)}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 136px}

header.top{position:sticky;top:0;z-index:30;background:var(--carta);border-bottom:1px solid var(--linea);padding:10px 16px 8px}
.top-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:6px}
.marchio{font-family:Newsreader,serif;font-size:1.25rem;font-weight:600;letter-spacing:-.015em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marchio span{color:var(--verde)}
.menu-btn{background:var(--superficie);border:1px solid var(--linea);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.88rem;font-weight:500}
.menu-pan{position:absolute;right:16px;top:52px;z-index:40;width:min(300px,calc(100vw - 32px));
  background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.16);
  overflow-y:auto;max-height:calc(100vh - 72px);padding:10px}
.menu-box{border-radius:12px;padding:9px 10px 8px;margin:0 0 8px}
.menu-box:last-child{margin-bottom:0}
.menu-box .sez{padding:2px 2px 7px;font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:0;color:inherit;opacity:1}
.menu-box button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.16);color:inherit;
  border:0;border-radius:8px;border-bottom:0;padding:11px 11px;margin:0 0 6px;font-size:.98rem;font-weight:700;cursor:pointer}
.menu-box button:last-child{margin-bottom:0}
.menu-box button:hover{background:rgba(255,255,255,.27)}
.menu-box button[disabled]{opacity:.5;cursor:default}
.menu-box button.rischio{color:#fff;font-weight:700}
.menu-box.mb-teal{background:#157159;color:#fff}
.menu-box.mb-blu{background:#1768A9;color:#fff}
.menu-box.mb-oro{background:#8F5200;color:#fff}  /* ambra scuro: testo bianco leggibile */
.menu-box.mb-oro button{background:rgba(255,255,255,.12)}
.menu-box.mb-oro button:hover{background:rgba(255,255,255,.2)}
.menu-box.mb-bordeaux{background:#8B3A52;color:#fff}
.menu-box.mb-senape{background:#6D3FA0;color:#fff}
:root[data-scuro] .menu-box.mb-teal{background:#16725B}
:root[data-scuro] .menu-box.mb-blu{background:#1C69A2}
:root[data-scuro] .menu-box.mb-oro{background:#8F5200}
:root[data-scuro] .menu-box.mb-bordeaux{background:#9E4A62}
:root[data-scuro] .menu-box.mb-senape{background:#7E50B5}

.rail{display:flex;gap:4px;max-width:620px;margin:8px auto 0}
.rail div{flex:1;text-align:center;font-size:.66rem;color:var(--inchiostro-soft);line-height:1.25;cursor:pointer}
.rail i{display:block;height:3px;border-radius:2px;background:var(--linea);margin-bottom:5px}
.rail div.fatto i{background:var(--verde);opacity:.45}
.rail div.ora i{background:var(--verde)}
.rail div.ora{color:var(--verde);font-weight:700}

.card{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--ombra)}
.intro{margin:18px 0 6px}
.intro p{color:var(--inchiostro-soft);font-size:.95rem;max-width:54ch}
label.campo{display:block;margin:12px 0 0}
label.campo > span{display:block;font-size:.83rem;color:var(--inchiostro-soft);margin-bottom:5px}
input[type=text],.campo input[type=date],select{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--carta);color:var(--inchiostro);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--verde);outline-offset:1px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--carta);color:var(--inchiostro);border:1px solid var(--linea);border-radius:999px;padding:7px 13px;font-size:.87rem;cursor:pointer;user-select:none}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:700}
.chip.appena{animation:appena 2.2s ease-out}
@keyframes appena{0%,40%{box-shadow:0 0 0 4px #FFD45C;transform:scale(1.08)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
.chip.on::before{content:"\2713 ";font-weight:700}
.pcella[class*="c-"] .chip.on{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.chip.rossa.on{background:var(--mattone);border-color:var(--mattone);color:#fff}
.pcella[class*="c-"] .chip.rossa.on{box-shadow:0 0 0 2px rgba(255,255,255,.85)}

.tile{display:block;width:100%;text-align:left;background:var(--superficie2);border:2px solid transparent;
  border-left:4px solid var(--linea);border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}
.tile.on{border-color:var(--verde);border-left-color:var(--verde);background:var(--verde-chiaro)}
.tile b{display:block;font-size:1.02rem;margin-bottom:2px}
.tile small{color:var(--inchiostro-soft);font-size:.85rem;line-height:1.35;display:block}

.riga{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.riga:last-child{border-bottom:0}
.mini{font-size:.82rem;color:var(--inchiostro-soft)}
.btn{background:var(--verde);color:var(--carta);border:0;border-radius:11px;padding:13px 18px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--inchiostro);border:1px solid var(--linea)}
.btn.small{padding:8px 12px;font-size:.87rem;font-weight:500;border-radius:9px}
.btn.btn-web{background:#0F6E78;color:#fff}   /* stesso peso del tasto accanto, nel colore del riquadro del link */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:var(--carta);
  border-top:1px solid var(--linea);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.barra-in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.barra .btn{flex:1}
.barra .btn.ghost{flex:0 0 auto}

.gruppo{border:1px solid var(--linea);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--superficie)}
.gruppo > summary{padding:13px 14px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}
.gruppo > summary::-webkit-details-marker{display:none}
.gruppo > summary em{font-style:normal;font-weight:400;color:var(--inchiostro-soft);font-size:.83rem}
.gruppo .corpo{padding:0 14px 14px}

.ric{border:1px solid var(--linea);border-radius:var(--r);background:var(--superficie);margin:12px 0;overflow:hidden}
.ric > summary{padding:14px;cursor:pointer;list-style:none}
.ric > summary::-webkit-details-marker{display:none}
.ric-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ric-nome{font-family:Newsreader,serif;font-size:1.18rem;font-weight:600;line-height:1.2}
.pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;white-space:nowrap}
.btn-nutri{background:none;border:none;padding:0 2px;cursor:pointer;font-size:1rem;line-height:1;vertical-align:middle}
.meta{font-size:.78rem;color:var(--inchiostro-soft);margin-top:3px}
.tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--superficie2);margin:6px 5px 0 0}
.tag.zona{background:var(--verde-chiaro);color:var(--verde);font-weight:700}
.tag.stag{background:color-mix(in srgb,var(--senape) 16%,transparent);color:var(--senape);font-weight:700}
.ing-stag{font-size:.82em;opacity:.9}
.ing-stag-no{opacity:.28;filter:grayscale(1)}
.fatt{height:6px;border-radius:3px;background:var(--superficie2);margin:10px 0 8px;overflow:hidden;display:flex}
.fatt i{display:block;height:100%}
.fatt i.pieno{background:var(--verde)}
.fatt i.sost{background:var(--senape)}
.v-alta .pct{color:var(--verde)}
.v-media .pct{color:var(--senape)}
.v-bassa .pct{color:var(--mattone)}
.manca{font-size:.87rem}
.manca b{color:var(--mattone);font-weight:700}
.ric .dett{padding:14px;border-top:1px solid var(--linea)}
.ing-l{list-style:none;margin:0;padding:0}
.ing-l li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--linea);font-size:.92rem}
.ing-l li:last-child{border-bottom:0}
.ing-l li.no{color:var(--mattone)}
.ing-l li.sub{color:var(--senape)}
.ing-l li em{font-style:normal;color:var(--inchiostro-soft);font-size:.82rem;white-space:nowrap}
.passi{margin:14px 0 0;padding-left:1.15em}
.passi li{margin-bottom:8px;font-size:.93rem}
.nota{border-left:3px solid var(--senape);background:color-mix(in srgb,var(--senape) 9%,transparent);
  padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem;margin:12px 0 0}
.avviso{border-left:3px solid var(--mattone);background:color-mix(in srgb,var(--mattone) 9%,transparent);
  padding:9px 12px;border-radius:0 8px 8px 0;font-size:.86rem;margin:10px 0 0}
.bevanda{border-left:3px solid var(--verde);background:color-mix(in srgb,var(--verde) 8%,transparent);
  padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem;margin:12px 0 0}
.bevanda .cerca-web{margin-top:8px}
.cant-bere{margin:8px 0 6px;padding:8px 10px;border-radius:10px;background:#6E1E35;color:#fff}
.cant-bere ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.cant-bere-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font:inherit;cursor:pointer}
.cant-bere li.cb-3 .cant-bere-btn{background:#2E6B3F;border-color:#fff}
.cant-bere li.cb-2 .cant-bere-btn{background:rgba(46,107,63,.55)}
.cb-ic{font-size:1.5em;line-height:1}
.cb-tx{flex:1;display:flex;flex-direction:column;gap:2px}
.cb-tx .mini{opacity:.85}
.cb-giu{font-size:.8em;font-weight:700;white-space:nowrap}
.cant-bere-no{margin:6px 0;opacity:.85}
.attrezzi{border-left:3px solid var(--senape);background:color-mix(in srgb,var(--senape) 8%,transparent);
  padding:10px 12px;border-radius:0 8px 8px 0;font-size:.88rem;margin:12px 0 0}
.attrezzi-l{list-style:none;margin:8px 0 0;padding:0}
.attrezzi-l li{margin:0 0 8px}
.attrezzi-l li:last-child{margin-bottom:0}
.attrezzi-l li b{display:block}
.attrezzi-l li .mini{display:block;margin-top:1px}
.vuoto{text-align:center;padding:34px 12px;color:var(--inchiostro-soft)}
.riep{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.riep span{font-size:.75rem;background:var(--superficie2);border-radius:999px;padding:4px 10px}
hr.sep{border:0;border-top:1px solid var(--linea);margin:20px 0}
.cerca-web{display:inline-block;margin-top:10px;font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.fatt i{transition:width .4s ease}}

/* casella "Ho in mente un piatto": ben visibile, nel colore della sua card */

  box-shadow:0 0 0 3px #FFD45C, 0 6px 22px rgba(109,63,160,.45);animation:ideaLuce 2.4s ease-in-out infinite}

.idea-riga input:focus{border-color:#fff;box-shadow:0 0 0 3px #FFD45C}
.idea-riga button{border:0;border-radius:11px;padding:0 16px;font-weight:700;font-size:1rem;background:#FFD45C;color:#3A1F5C;cursor:pointer}

/* tasto ✕ dentro le caselle di ricerca */
.cx{position:relative;display:block;flex:1;min-width:0}
.cx > input{width:100%;box-sizing:border-box;padding-right:44px!important}
.cx-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;

.idea-riga .cx-x{background:#E9E2F3;color:#3A1F5C}
/* casella del link nella "Ricetta dal web": stessa evidenza, colore petrolio */

.cw-box .idea-riga button{color:#5A2A0A;white-space:nowrap}
.cw-lista{list-style:none;margin:6px 0 12px;padding:0;display:grid;gap:8px}
.cw-voce{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--linea);border-radius:12px;background:var(--superficie);color:var(--inchiostro);padding:8px;cursor:pointer;font:inherit}
.cw-voce img,.cw-voce .cw-ic{width:56px;height:56px;border-radius:9px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--linea)}
.cw-tx{flex:1;min-width:0}.cw-tx b{display:block;font-size:1rem;line-height:1.25}.cw-tx small{opacity:.75}
.cw-vai{font-size:1.2rem}.cw-voce.cw-scelta{border-color:var(--verde);box-shadow:0 0 0 2px var(--verde)}
.cw-attesa{animation:ideaLuce 1.6s ease-in-out infinite}
.cw-link summary{cursor:pointer}
.gia-box{background:var(--superficie);color:var(--inchiostro);border:2px solid #FFD45C;border-radius:14px;padding:12px;margin:6px 0 12px}
.gia-box > b{display:block;font-size:1.02rem;margin-bottom:4px}
.gia-grid{margin:8px 0 10px}
.gia-tit{font-size:1rem;margin:12px 0 6px}
.prom-elenco{margin:8px 0 4px}.prom-elenco summary{cursor:pointer;font-weight:700}
.prom-elenco ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.prom-elenco li{display:flex;gap:8px;align-items:center}.prom-elenco li > span:nth-child(2){flex:1;min-width:0}.prom-elenco small{opacity:.75}
.gia-nuova{margin:6px 0 4px}
.link-box{background:#0F6E78;box-shadow:0 0 0 3px #FFD45C,0 6px 22px rgba(15,110,120,.45)}
.link-box .idea-riga button{color:#0B3F45;white-space:nowrap}
.link-box .link-vai{display:block;width:100%;margin-top:10px;border:0;border-radius:11px;padding:13px;font-weight:700;font-size:1.02rem;
  background:#fff;color:#0B3F45;cursor:pointer}
.link-box .idea-riga .cx-x{background:#D7EEF0;color:#0B3F45}
#impTesto{width:100%;box-sizing:border-box;font-size:1rem;border-radius:10px;padding:10px}
.cx-x.vuota{opacity:.4}
input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
/* elenchi lunghi con ricerca (al posto della tendina) */
.cb{margin:2px 0 4px}
.cb-riga{display:flex;gap:6px}
.cb-in{flex:1;min-width:0;box-sizing:border-box;padding:11px 12px;font-size:1rem;border-radius:10px;
  border:2px solid var(--verde);background:var(--superficie);color:var(--inchiostro)}
.cb-x{border:0;border-radius:10px;padding:0 13px;font-size:1rem;background:var(--linea);color:var(--inchiostro);cursor:pointer}
.cb-scelta{font-size:.85rem;margin:6px 2px 0;opacity:.9}
.cb-lista{display:none;margin-top:6px;border-radius:10px;overflow:hidden;border:1.5px solid var(--linea);background:var(--superficie)}
.cb-lista.aperta{display:block}
.cb-voce{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linea);background:transparent;
  color:var(--inchiostro);padding:12px;font-size:1rem;cursor:pointer}
.cb-voce:active{background:var(--verde);color:#fff}
.cb-fissa{font-style:italic;opacity:.8}
.cb-vuoto{padding:12px;font-size:.9rem;opacity:.75}

.spiega-disp summary::-webkit-details-marker{display:none}
.spiega-disp .freccia-sp{display:inline-block;transition:transform .2s}
.spiega-disp[open] .freccia-sp{transform:rotate(180deg)}

#splash .carica-splash{width:min(72vw,280px);margin-top:6px;opacity:0;animation:sp-nome .4s ease .3s forwards}
#splash .carica-bar{height:8px;border-radius:99px;background:rgba(240,223,184,.22);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
#splash .carica-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8FD694,#F0DFB8,#F2B25C,#7FC8E8);background-size:280px 100%;transition:width .18s linear}
#splash .carica-testo{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font:600 .78rem/1.2 Inter,system-ui,sans-serif;color:#F0DFB8;opacity:.9}
#splash .carica-testo b{font-variant-numeric:tabular-nums}

.all-ico{margin-right:4px}
.all-tag{display:inline-flex;align-items:center;margin:2px 6px 2px 0;white-space:nowrap}

.chiudi-tutto-riga{position:sticky;top:calc(var(--alt-testata,90px) + 6px);z-index:5;display:flex;justify-content:flex-end;margin:6px 0 2px;pointer-events:none}
.chiudi-tutto{pointer-events:auto;border:0;border-radius:99px;padding:9px 15px;font:700 .85rem/1 Inter,system-ui,sans-serif;background:#2E6B3F;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.22);cursor:pointer}

.all-chiusi > .chip:not(.on){display:none}
.all-box .all-apri{border:1.5px dashed currentColor;background:transparent;color:inherit;border-radius:99px;padding:7px 12px;font:700 .8rem/1 Inter,system-ui,sans-serif;cursor:pointer;opacity:.95}
.all-box .se-aperto{display:none}.all-box:not(.all-chiusi) .se-aperto{display:inline}.all-box:not(.all-chiusi) .se-chiuso{display:none}
.all-chiusi:not(:has(.chip.on))::before{content:"Nessun allergene da escludere";align-self:center;font:600 .85rem/1.2 Inter,system-ui,sans-serif;opacity:.85;margin-right:4px}
html[lang="en"] .all-chiusi:not(:has(.chip.on))::before{content:"No allergens to exclude"}
</style>

/* nomi inglesi -> chiave italiana, per cercare e scrivere in inglese */
const EN_INV = {};
const _normEn = x => String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
for(const k in EN){ const v = _normEn(EN[k]); if(v && !(v in EN_INV)) EN_INV[v] = k; }

function chiaveDaInglese(nome){
  const n = _normEn(nome);
  if(EN_ALIAS[n]) return EN_ALIAS[n];
  if(EN_INV[n]) return EN_INV[n];
  /* plurale/singolare inglese semplice */
  const alt = n.endsWith("es") ? [n.slice(0,-2), n.slice(0,-1)] : n.endsWith("s") ? [n.slice(0,-1)] : [n + "s", n + "es"];
  for(const a of alt) if(EN_INV[a]) return EN_INV[a];
  return "";
}

const _cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const _low = s => s.charAt(0).toLowerCase() + s.slice(1);

/* unita' di misura nelle quantita' */
const EN_UNITA = {
  "gr":"g","g":"g","kg":"kg","ml":"ml","cl":"cl","l":"l",
  "cucchiaio":"tbsp","cucchiai":"tbsp","cucchiaino":"tsp","cucchiaini":"tsp",

  "bicchiere":"glass","bicchieri":"glasses","tazza":"cup","tazze":"cups",
  "fetta":"slice","fette":"slices","rametto":"sprig","rametti":"sprigs",
  "manciata":"handful","manciate":"handfuls","costa":"stalk","coste":"stalks",
  "filetto":"fillet","filetti":"fillets","rotolo":"sheet","rotoli":"sheets",
  "bacca":"pod","bacche":"berries","mazzetto":"bunch","mazzo":"bunch",
  "pagnotta":"loaf","pezzo":"piece","stecca":"stick","testa":"head","teste":"heads",
  "cespo":"head","cespi":"heads","bustina":"sachet","bustine":"sachets",
  "foglio":"sheet","fogli":"sheets","tuorlo":"yolk","tuorli":"yolks",
  "panino":"roll","panini":"rolls","arance":"oranges","medie":"medium","maturi":"ripe",
  "bottiglia piccola":"small bottle","bottiglia":"bottle","noce":"knob","scatola":"tin","barattolo":"jar","vasetto":"pot"
};
function trQuantita(q){
  const t = String(q).trim();
  if(EN[t]) return EN[t];
  const m = t.match(/^(\d+\s*\/\s*\d+|\d*½|\d+(?:[.,]\d+)?)\s*(.*)$/);
  if(!m) return null;
  const num = m[1].replace(",", ".");
  let resto = m[2].trim(), virgola = "";
  const v = resto.match(/^(.*?)(,\s*.+)$/);
  if(v){ resto = v[1].trim(); virgola = v[2]; }
  if(!resto) return num + (virgola ? trVirgola(virgola) : "");
  const u = resto.toLowerCase();
  let unit = EN_UNITA[u];
  if(!unit){
    const p = u.split(" ");
    if(EN_UNITA[p[0]]){ unit = EN_UNITA[p[0]] + " " + (trSemplice(p.slice(1).join(" ")) || p.slice(1).join(" ")); }
    else unit = trSemplice(resto);
  }
  if(!unit) return null;   /* "14/10/2026", "3 settimane"...: non e' una quantita' che conosco */
  if(num === "1") unit = unit.replace(/^(\S+)/, w=>({cloves:"clove",leaves:"leaf",sheets:"sheet",berries:"berry",sprigs:"sprig",stalks:"stalk",
    fillets:"fillet",slices:"slice",heads:"head",bunches:"bunch",rolls:"roll",yolks:"yolk",glasses:"glass",cups:"cup",pinches:"pinch",sachets:"sachet",handfuls:"handful"}[w] || w));
  return num + " " + unit + (virgola ? trVirgola(virgola) : "");
}
function trVirgola(v){
  const s = v.replace(/^,\s*/, "");
  const x = {"a fette sottili":"thinly sliced"}[s];
  return ", " + (x || trSemplice(s) || s);
}

/* traduzione esatta (con le varianti maiuscola/minuscola) */
function trSemplice(s){
  if(!s) return null;
  if(EN[s] !== undefined) return EN[s];
  const c = _cap(s), l = _low(s);
  if(s !== c && EN[c] !== undefined) return _low(EN[c]);
  if(s !== l && EN[l] !== undefined) return _cap(EN[l]);
  return null;
}
/* traduce, o lascia com'e' (per i pezzi dentro le frasi composte) */
const trOCopia = s => trTesto(s) ?? s;
/* elenchi "a, b, c": tradotti solo se ogni voce e' conosciuta */
function trElenco(s, sep){
  const parti = s.split(sep).map(p=>p.trim());
  if(parti.length < 2) return null;
  /* solo elenchi di voci brevi (nomi), non frasi con virgole */
  if(parti.some(p=>p.length > 45 || p.split(" ").length > 6)) return null;
  const t = parti.map(p=>trSemplice(p) ?? trQuantita(p));
  const note = t.filter(x=>x != null).length;
  if(note * 2 < parti.length) return null;
  return t.map((x,i)=>x ?? parti[i]).join(sep);
}

  [/^niente (.+)$/, m=>`no ${trOCopia(m[1])}`],
  [/^no (.+)$/, m=>`no ${m[1].split("/").map(trOCopia).join("/")}`],
  /* "(uso dell'attrezzo)," dentro "Utile ma non indispensabile" */
  [/^\((.+)\)(,?)$/, m=>{ const t = trSemplice(m[1]); return t ? `(${t})${m[2]}` : null; }],
  /* "nome — sostituto / da comprare / quantita'": anche senza nome davanti */
  [/^(.*?)\s*— (.+)$/, m=>{
    const dx = m[2].trim();
    let t = trSemplice(dx);
    if(t == null){ const pu = dx.match(/^puoi usare (.+)$/); if(pu) t = "you can use " + trOCopia(pu[1]); }
    if(t == null) t = trQuantita(dx);
    if(t == null) return null;
    const sx = m[1].trim();
    return (sx ? (trSemplice(sx) ?? sx) + " " : "") + "— " + t;
  }]
];
function trMotivo(x){
  const t = trSemplice(x); if(t) return t;
  let m = x.match(/^contiene (.+), da escludere per qualcuno a tavola$/);
  if(m) return `it contains ${trOCopia(m[1])}, which someone at the table must avoid`;
  m = x.match(/^contiene (.+), che non ti piace$/);
  if(m) return `it contains ${trOCopia(m[1])}, which you don't like`;
  m = x.match(/^non è (.+)$/);
  if(m) return `it isn't ${trOCopia(m[1])}`;
  return x;
}

/* traduzione di un testo intero: esatta, poi schemi, poi pezzi separati da " · " e da ", " */
const _cacheTr = new Map();
function trTesto(s){
  if(s == null) return null;
  const t = String(s).replace(/\s+/g, " ").trim();
  if(!t || !/[A-Za-zÀ-ú]/.test(t)) return null;
  if(_cacheTr.has(t)) return _cacheTr.get(t);
  let r = trSemplice(t);
  if(r == null){
    for(const [re, f] of EN_SCHEMI){ const m = t.match(re); if(m){ r = f(m); if(r != null) break; } }
  }
  if(r == null && t.includes(" · ")){
    const parti = t.split(" · ");
    const tr = parti.map(p=>p === "" ? "" : (trTesto(p) ?? p));
    if(tr.some((x,i)=>x !== parti[i])) r = tr.join(" · ");
  }
  if(r == null && / ·$/.test(t)){ const x = trTesto(t.replace(/ ·$/, "")); if(x != null) r = x + " ·"; }
  if(r == null && /^[\d½]/.test(t)) r = trQuantita(t);
  if(r == null && t.includes(", ")) r = trElenco(t, ", ");
  if(r == null) r = trQuantita(t);
  /* "🇪🇸 Spagnolo": simboli davanti, parola conosciuta dopo */
  if(r == null){ const m = t.match(/^([^A-Za-zÀ-ú\d]+)\s(.+)$/); if(m){ const x = trSemplice(m[2]); if(x != null) r = m[1] + " " + x; } }
  _cacheTr.set(t, r);
  return r;
}

/* il traduttore a schermo */
const EN_ATTR = ["placeholder", "title", "aria-label"];
function _saltare(el){
  return !el || el.closest("script,style,textarea,[data-no-tr]") || el.isContentEditable;
}
function traduciNodoTesto(n){
  const v = n.nodeValue;
  if(!v || !/[A-Za-zÀ-ú]/.test(v)) return;
  if(_saltare(n.parentElement)) return;
  const r = trTesto(v);
  if(r == null || r === v.trim()) return;
  const pre = v.match(/^\s*/)[0], post = v.match(/\s*$/)[0];
  /* <option> senza value: il value resta l'originale italiano, che il codice legge */
  const p = n.parentElement;
  if(p && p.tagName === "OPTION" && !p.hasAttribute("value")) p.setAttribute("value", p.textContent);
  n.nodeValue = pre + r + post;
}
function traduciElemento(el){
  if(!el || !el.closest || el.closest("script,style,[data-no-tr]")) return;
  EN_ATTR.forEach(a=>{
    const v = el.getAttribute && el.getAttribute(a);
    if(v){ const r = trTesto(v); if(r != null && r !== v) el.setAttribute(a, r); }
  });
  /* i suggerimenti della ricerca in dispensa: valori in inglese */
  if(el.tagName === "OPTION" && el.parentElement && el.parentElement.tagName === "DATALIST"){
    const v = el.getAttribute("value"); const r = v && trSemplice(v);
    if(r){ el.setAttribute("data-it", v); el.setAttribute("value", r); }
  }
}
function traduciSotto(root){
  if(!root) return;
  if(root.nodeType === 3){ traduciNodoTesto(root); return; }
  if(root.nodeType !== 1) return;
  traduciElemento(root);
  root.querySelectorAll("*").forEach(traduciElemento);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())) traduciNodoTesto(n);
}
if(IN_INGLESE){
  const avvia = ()=>{
    traduciSotto(document.body);
    new MutationObserver(lista=>{
      for(const m of lista){
        if(m.type === "characterData") traduciNodoTesto(m.target);
        else if(m.type === "attributes") traduciElemento(m.target);
        else m.addedNodes.forEach(traduciSotto);
      }
    }).observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:EN_ATTR});
  };
  document.body ? avvia() : document.addEventListener("DOMContentLoaded", avvia);
  const _alert = window.alert.bind(window), _confirm = window.confirm.bind(window);
  window.alert = m => _alert(trTesto(m) ?? m);
  window.confirm = m => _confirm(trTesto(m) ?? m);
  document.title = "What\u2019s cooking?";
  /* il nome dell'app in inglese: logo, schermata d'avvio, titoli */
  const nomeEn = ()=>{
    const m = document.getElementById("logoHome"); if(m) m.innerHTML = "What\u2019s cooking<span>?</span>";
    document.querySelectorAll("#splash .nome").forEach(e=>e.textContent = "What\u2019s cooking?");
    document.querySelectorAll("#splash .autore-splash").forEach(e=>e.textContent = "by Benedetto Daniele Sgroi");

    const ap = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(ap) ap.content = "What\u2019s cooking?";
  };
  document.body ? nomeEn() : document.addEventListener("DOMContentLoaded", nomeEn);
}

function scattaFoto(cb){

  i.onchange = ()=>{ const f = i.files && i.files[0]; if(f) cb(f); }; i.click();

function statoScad(t){ const p = document.getElementById("scStato") || document.getElementById("pdStato"); if(p) p.innerHTML = t; }
const MESI_BREVI = {gen:1,feb:2,mar:3,apr:4,mag:5,giu:6,lug:7,ago:8,set:9,ott:10,nov:11,dic:12,jan:1,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,dec:12};
/* tutte le date plausibili scritte in un testo: 12/05/2027, 12.05.27, 05/2027 (fine mese), 12 MAG 2027 */
function dateNelTesto(t){
  const x = String(t).toUpperCase().replace(/[Oo](?=\d)|(?<=\d)[Oo]/g, "0").replace(/(?<=\d)[Il|](?=\d)|(?<=[\/.\-])[Il|]/g, "1");
  const out = [], oggi = new Date(); oggi.setHours(0,0,0,0);
  const prova = (g, m, a)=>{
    a = +a; if(a < 100) a += 2000; m = +m; g = +g;
    if(m < 1 || m > 12 || a < oggi.getFullYear() - 1 || a > oggi.getFullYear() + 6) return;
    if(!g) g = new Date(a, m, 0).getDate();
    if(g < 1 || g > 31) return;
    const d = new Date(a, m - 1, g); if(d.getMonth() !== m - 1) return;
    out.push(isoData(d));
  };
  let m; const re1 = /(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})/g;
  while((m = re1.exec(x))) prova(m[1], m[2], m[3]);
  const re2 = /(\d{1,2})\s+(GEN|FEB|MAR|APR|MAG|GIU|LUG|AGO|SET|OTT|NOV|DIC|JAN|MAY|JUN|JUL|AUG|SEP|OCT|DEC)[A-Z]*\.?\s+(\d{2,4})/g;
  while((m = re2.exec(x))) prova(m[1], MESI_BREVI[m[2].toLowerCase()], m[3]);
  const re3 = /(?<![\d\/.\-])(\d{1,2})\s*[\/.\-]\s*(20\d{2})(?![\/.\-]?\d)/g;
  while((m = re3.exec(x))) prova(0, m[1], m[2]);
  return out;
}
async function dataDaFoto(file, fatto){
  try{
    statoScad("⏳ " + L("Preparo la lettura del testo (la prima volta scarica circa 4 MB)…","Getting the text reader ready (about 4 MB the first time)…"));
    ocrLog = m=>{ if(m.status === "recognizing text") statoScad("\u{1F50D} " + L("Cerco la data… ","Looking for the date… ") + Math.round((m.progress || 0) * 100) + "%"); };
    const w = await lettoreTesto();
    await w.setParameters({tessedit_pageseg_mode: "11"});
    let testo = (await w.recognize(await immagineRidotta(file, 1600))).data.text || "";
    let date = dateNelTesto(testo);
    if(!date.length){ testo += "\n" + ((await w.recognize(await immagineRidotta(file, 900))).data.text || ""); date = dateNelTesto(testo); }
    if(!date.length){
      statoScad("⚠️ " + L("Non trovo una data nella foto. Fotografa solo la scritta della scadenza, da vicino e ben illuminata, oppure scegli la data a mano.","I can’t find a date in the photo. Photograph just the use-by text, close up and well lit, or pick the date by hand.")
        + (testo.trim() ? `<details class="cant-testo"><summary>${L("Testo letto","Text read")}</summary><pre>${esc(testo.trim())}</pre></details>` : ""));
      return;
    }
    /* la data di scadenza e' la piu' lontana (la data di produzione, se c'e', viene prima) */
    fatto(date.sort().pop());
  }catch(e){ statoScad("⚠️ " + L("Non sono riuscito a leggere la foto: serve la connessione la prima volta.","I couldn’t read the photo: a connection is needed the first time.")); }
  finally{ ocrLog = ()=>{}; }
}
/* codice a barre: EAN/UPC per riconoscere il prodotto; i codici GS1 (DataMatrix o QR) possono contenere anche la scadenza (17AAMMGG) */
async function codiceDaFoto(file){
  const formati = ["ean_13","ean_8","upc_a","upc_e","data_matrix","qr_code"];
  let det = null;
  try{ if("BarcodeDetector" in window){ const sup = await BarcodeDetector.getSupportedFormats(); if(sup.includes("ean_13")) det = new BarcodeDetector({formats: formati.filter(f=>sup.includes(f))}); } }catch(e){}
  if(!det){ await caricaScript(CDN_BARRE); det = new BarcodeDetectionAPI.BarcodeDetector({formats: formati}); }
  const t = await det.detect(await immagineRidotta(file, 2000));
  return t.map(x=>x.rawValue).filter(Boolean);
}
function scadenzaGS1(v){
  const x = String(v).replace(/[\x1d\u001d]/g, "|");
  let m = x.match(/\(17\)\s*(\d{6})/) || x.match(/\/17\/(\d{6})/) || x.match(/[?&]17=(\d{6})/);
  if(!m && /^\]?[a-z0-9]{0,2}01\d{14}/i.test(x)){ const r = x.replace(/^\][a-z0-9]{2}/i, "").slice(16); const m2 = r.match(/^(?:\|?(?:1[01]\d{6}|1[035]\d{6}))*\|?17(\d{6})/); if(m2) m = m2; }
  if(!m) return "";
  const a = 2000 + +m[1].slice(0, 2), mm = +m[1].slice(2, 4); let g = +m[1].slice(4, 6);
  if(mm < 1 || mm > 12) return "";
  if(!g) g = new Date(a, mm, 0).getDate();
  return isoData(new Date(a, mm - 1, g));
}
function gtinDi(v){ const m = String(v).match(/^\d{8,14}$/) ? [0, v] : (String(v).match(/\(01\)\s*(\d{14})/) || String(v).match(/\/01\/(\d{14})/) || String(v).match(/^\]?[a-z0-9]{0,2}01(\d{14})/i)); return m ? String(m[1]).replace(/^0+(?=\d{8,13}$)/, "") : ""; }
/* dal nome del prodotto all'ingrediente della dispensa: la voce piu' lunga che compare nel nome */
function ingredienteDaProdotto(testi){
  const voci = TUTTI_ING.slice().sort((a, b)=>b.length - a.length);
  const pulisci = t=>" " + normTesto(t || "").replace(/[^a-z0-9à-ú ]/g, " ").replace(/\s+/g, " ") + " ";
  const nomeCorto = v=>normTesto(v).replace(/^formaggio\s+(?!fresco$)/, "");
  /* prima la voce scritta per intero nel nome, poi (solo se niente) una parola con la stessa radice */
  for(const t of testi){ const n = pulisci(t);
    const k = voci.find(v=>n.includes(" " + normTesto(v) + " ") || n.includes(" " + nomeCorto(v) + " ")); if(k) return k; }
  for(const t of testi){ const parole = pulisci(t).trim().split(" ").filter(w=>w.length > 3);
    const k = voci.find(v=>!/\s/.test(nomeCorto(v)) && parole.some(w=>radiceIng(w) === radiceIng(nomeCorto(v)))); if(k) return k; }
  return "";
}

   non fanno le veci del fresco in ogni ricetta (le sarde a beccafico vogliono sarde fresche).
   Per queste la ricetta le propone come sostituzione, ben visibile, e non le conta come l'ingrediente vero. */

  for(const [dispensa, fresco] of Object.entries(m||{})){

    if(m === D.conserve && dispensa === "sardine in scatola") continue;

      D.sost_k = D.sost_k || {};

/* GialloZafferano (e altri) scrivono nei passaggi i numeri delle foto, es. "(1)", "(2-3)", "(4, 5)", "[6]":
   nell'app le foto non ci sono, quindi li tolgo. Tocco solo parentesi con soli numeri piccoli. */
const RE_RIMANDI_FOTO = /\s*[\(\[]\s*\d{1,2}(?:\s*(?:[-–,;\/]|e|ed|and)\s*\d{1,2})*\s*[\)\]]/g;
function senzaRimandiFoto(t){ return String(t || "").replace(RE_RIMANDI_FOTO, "").replace(/\s+([.,;:!?])/g, "$1").replace(/\s{2,}/g, " ").trim(); }
/* numeri delle foto senza parentesi (stile GialloZafferano): "…acqua fredda 1. Portate…", "…cucchiaio 2, poi…".
   Li riconosco perche' formano una sequenza 1, 2, 3… attraverso tutto il procedimento, sempre subito dopo una parola. */
const RE_NUM_FOTO = /([A-Za-zÀ-ÖØ-öø-ÿ'’»")\]])(\s+)(\d{1,2})(?:(\s*[-–]\s*|\s+e\s+)(\d{1,2}))?(?=\s*[.,;:!?)]|\s*$|\s+[a-zà-ÿ])/g;
function senzaNumeriFoto(proc){
  if(!Array.isArray(proc) || !proc.length) return proc;
  /* 1) trovo i candidati che seguono la sequenza */
  let atteso = 1; const tieni = [];
  proc.forEach((t, i)=>{
    String(t).replace(RE_NUM_FOTO, (m, prima, sp, a, sep, b, pos)=>{
      const n1 = +a, n2 = b ? +b : n1;
      if((n1 === atteso || n1 === atteso + 1) && n2 >= n1 && n2 - n1 <= 3){ tieni.push({i, pos, len: m.length, prima}); atteso = n2 + 1; }
      return m;
    });
  });
  if(tieni.length < 2) return proc;       /* un numero solo non basta a dire che e' una sequenza di foto */
  /* 2) li tolgo, dall'ultimo al primo per non spostare le posizioni */
  const out = proc.map(String);
  tieni.slice().reverse().forEach(({i, pos, len, prima})=>{ out[i] = out[i].slice(0, pos) + prima + out[i].slice(pos + len); });
  return out.map(t=>t.replace(/\s+([.,;:!?])/g, "$1").replace(/\s{2,}/g, " ").trim()).filter(Boolean);
}
function pulisciProc(proc){ return Array.isArray(proc) ? senzaNumeriFoto(proc.map(senzaRimandiFoto).filter(Boolean)) : proc; }

   "cipolle rosse" = "cipolla rossa". Confronto le parole senza la vocale finale
   (e senza la i di -cia/-gia e la h di -chi/-ghi). Poche parole fanno eccezione
   perche' singolare e plurale sono cose diverse. */
const NON_ACCORPARE = new Set(["palombo","palomba"]);

  if(_radici[k] !== undefined) return _radici[k];
  const n = normTesto(k);
  return _radici[k] = NON_ACCORPARE.has(n) ? n : n.split(" ").map(p=>{
    if(p.length <= 3) return p;

/* ordina un elenco gia' filtrato secondo ordinaPer/ordinaDir; le "cucinate di recente" restano sempre in fondo,
   e la vecchia catena di spareggio (fattibilita', stagionalita', zona, tempo) resta come ripiego a parita' di valore */
function ordinaLista(out){
  const c = criterioAttivo();
  const dir = ordinaDir || c.def;
  const segno = dir === "asc" ? 1 : -1;
  out.sort((a,b)=> (a.fatta?1:0)-(b.fatta?1:0)
                 || (a.fuoriClima?1:0)-(b.fuoriClima?1:0)
                 || (a.pesanteCena?1:0)-(b.pesanteCena?1:0)
                 || segno*(c.cmp ? c.cmp(a,b) : c.val(a)-c.val(b))
                 || b.pct-a.pct || (b.stag.in-a.stag.in) || (b.zona?1:0)-(a.zona?1:0)
                 || a.r.tempo-b.r.tempo);
  return out;
}

/* regole religiose: valgono per chi siede a tavola, come gli allergeni (si riconoscono dagli ingredienti) */
const RELIGIONI = {
  halal:     {e:"☪️", it:"halal (islam)", en:"halal (Islam)", nota:["Niente maiale né alcol. La carne andrebbe da macellazione halal: controlla la provenienza.","No pork or alcohol. Meat should come from halal slaughter: check where it's from."]},
  kosher:    {e:"✡️", it:"kosher (ebraismo)", en:"kosher (Judaism)", nota:["Niente maiale, coniglio, cavallo, molluschi e crostacei; mai carne e latticini insieme. La carne andrebbe kosher: controlla la provenienza.","No pork, rabbit, horse or shellfish; never meat and dairy together. Meat should be kosher: check where it's from."]}
};
const RE_MAIALE = /maial|guancial|pancett|prosciutt|salsicc|salam|lard|mortadell|speck|nduja|cotechin|zampon|\bcoppa|capocollo|strutto|cotenn|porchett|soppressat|ciccioli|wurstel|chorizo|bacon|culatell|finocchiona|\blonza|cinghial|gelatina/;
const RE_ALCOL = /\bvino\b|birra|marsala|\brum\b|liquor|brandy|grappa|vermout|cognac|limoncell|alchermes|whisk|vodka|\bsake\b|mirin|spumante|champagne|prosecco|sherry|passito|maraschin|kirsch|cointreau|calvados/;
const RE_NON_ALCOL = /lievito|vino cotto|aceto|mosto/;
const RE_MANZO = /manzo|vitell|bovin|\bbue\b|chianina|bistecc|lampredott|trippa|ossobuc|carne macinata|bresaola|fiorentina/;
const RE_INVERTEBRATI = /vongol|cozz|gamber|calamar|polp|seppi|aragost|scamp|ricci di mare|astice|granch|totan|ostric|cannolicch|moscardin|canoc|mazzancoll|frutti di mare|lumach|tellin/;
const RE_NON_KOSHER = /anguill|capitone|pesce spada|storione|squal|palombo|\brazza\b|caviale|conigl|lepre|cavall|cinghial/;
const RE_RADICI = /cipoll|aglio|patat|carot|\brap[ae]\b|ravanell|\bporr|scalogn|barbabietol|zenzero|topinamb|sedano rapa|rafano|pastinac|daikon|manioca|batat/;
const RE_FUNGHI = /fungh|porcin|champign|tartuf|chiodin|finferl|galletti|pleurot/;
const RE_UOVA = /\buov[oa]|tuorl|album/;
const RE_CARNE_EXTRA = /brodo di (carne|pecora|manzo|pollo|gallina|cappone)|dado di carne|estratto di carne/;
function violaRegola(r, rel){
  const ing = r.ing.map(i=>({k:normTesto(i.k), n:normTesto(i.n), raw:i.k}));
  const c = x=> x.k + " " + x.n;
  const carne = ing.filter(x=>CARNE.has(x.raw) || RE_CARNE_EXTRA.test(c(x)));
  const pesce = ing.filter(x=>PESCE.has(x.raw));
  const latt  = ing.filter(x=>LATT.has(x.raw) && !RE_UOVA.test(c(x)));
  const uova  = ing.filter(x=>RE_UOVA.test(c(x)));
  const nomi = l=> [...new Set(l.map(x=>x.raw))].slice(0,3).join(", ");
  const trova = re=> ing.filter(x=>re.test(c(x)));
  const alcol = ing.filter(x=>RE_ALCOL.test(c(x)) && !RE_NON_ALCOL.test(c(x)));
  if(rel === "halal"){
    const m = trova(RE_MAIALE); if(m.length) return L("contiene maiale o derivati ("+nomi(m)+")","contains pork ("+nomi(m)+")");
    if(alcol.length) return L("contiene alcol ("+nomi(alcol)+")","contains alcohol ("+nomi(alcol)+")");
  }
  if(rel === "kosher"){
    const m = trova(RE_MAIALE).concat(trova(RE_NON_KOSHER)), inv = trova(RE_INVERTEBRATI);
    if(m.length || inv.length) return L("contiene "+nomi(m.concat(inv)),"contains "+nomi(m.concat(inv)));
    if(carne.length && latt.length) return L("unisce carne e latticini","mixes meat and dairy");
  }
  if(rel === "induista"){ const m = trova(RE_MANZO); if(m.length) return L("contiene manzo o vitello ("+nomi(m)+")","contains beef or veal ("+nomi(m)+")"); }
  if(rel === "giainista"){
    if(carne.length || pesce.length) return L("contiene carne o pesce","contains meat or fish");
    if(uova.length) return L("contiene uova","contains eggs");
    if(ing.some(x=>/miele/.test(c(x)))) return L("contiene miele","contains honey");
    const m = trova(RE_RADICI).filter(x=>!/cime di rapa/.test(c(x))).concat(trova(RE_FUNGHI));
    if(m.length) return L("contiene radici, bulbi o funghi ("+nomi(m)+")","contains roots, bulbs or mushrooms ("+nomi(m)+")");
  }
  if(rel === "magro"){ if(carne.length) return L("contiene carne ("+nomi(carne)+")","contains meat ("+nomi(carne)+")"); }
  if(rel === "ortodosso"){
    if(carne.length) return L("contiene carne","contains meat");
    const pv = pesce.filter(x=>!RE_INVERTEBRATI.test(c(x))); if(pv.length) return L("contiene pesce ("+nomi(pv)+")","contains fish ("+nomi(pv)+")");
    if(latt.length || uova.length) return L("contiene latticini o uova","contains dairy or eggs");
  }
  return "";
}

function violaTavolo(r){ for(const rel of regoleTavolo()){ const v = violaRegola(r, rel); if(v) return {rel, v}; } return null; }

let _radDisp = {chiave:null, set:null};
function radiciDispensa(){
